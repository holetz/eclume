      type: object
      required: [recording_id, recording_title, detected, detected_type_name, fallback, confidence, title, tags, summary_md]
      properties:
        recording_id:
          type: string
          format: uuid
        recording_title:
          type: string
        detected:
          description: A detecção escolheu o rascunho.
          type: boolean
        detected_type_name:
          description: O tipo que a gravação teria (o rascunho, um dos salvos ou o tipo padrão).
          type: string
        fallback:
          description: >-
            Nenhum tipo serviu, ou a confiança ficou abaixo de 0,6: a gravação teria o tipo padrão.
          type: boolean
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        title:
          description: O título que o rascunho aplicaria.
          type: string
        tags:
          description: As tags da gravação com as tags padrão do rascunho.
          type: array
          items:
            type: string
        summary_md:
          description: O resumo com as instruções do rascunho.
          type: string

