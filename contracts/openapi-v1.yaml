          description: Os anexos ainda não enviados com uma pergunta.
          type: array
          items:
            $ref: "#/components/schemas/AgentFile"

    AgentFile:
      type: object
      required: [id, session_id, message_id, direction, name, media_type, size_bytes, text_chars, created_at]
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        message_id:
          description: A pergunta que levou o anexo ou a resposta que gerou o arquivo; nulo no anexo não enviado.
