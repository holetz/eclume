      summary: Correct the text or the speaker of a segment
      description: Correcting the text discards the segment's `words`. Bumps the `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentPatch"
            examples:
              corrigir:
                $ref: "#/components/examples/SegmentPatchRequest"
      responses:
        "200":
          description: Segment updated.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Segment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/summaries:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [summaries]
      operationId: listSummaries
      summary: Summaries of the transcript
      description: From the highest `version` to the lowest; the numbers may skip (see `Summary`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Summaries, from the newest version to the oldest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryPage"
              examples:
                resumos:
                  $ref: "#/components/examples/SummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [summaries]
      operationId: createSummary
      summary: Generate a summary with an agenda type
      description: |
        Each generation is a new `version` of the summary of that agenda type, with its summary
        instructions. Without `agenda_type_id`, the recording's type applies; with neither, 422. Without
        `provider_id` and with no default provider enabled on the platform, also 422.

        Since 2.15.0, the request counts against the quota of Agent requests in 24 h (exceeded, 403
        `quota_exceeded`), and the account has at most 3 summaries queued or running (beyond that, 429
        `rate_limited`).
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryCreate"
            examples:
              ata:
                $ref: "#/components/examples/SummaryCreateRequest"
      responses:
        "202":
          description: Summary queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
              examples:
                naFila:
                  $ref: "#/components/examples/SummaryQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/summaries/{summary_id}:
    parameters:
