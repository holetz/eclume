        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
    patch:
      tags: [transcripts]
      operationId: updateSpeaker
      summary: Renomear o locutor ou ligá-lo a uma pessoa
      description: |
        `person_id` liga o locutor a uma pessoa (confirmando, se for o caso, uma sugestão por
        voz); `null` desfaz o vínculo. Ligar uma pessoa sem mandar `label` passa o `label` para
        o nome da pessoa. Sobe a `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerPatch"
            examples:
              ligarPessoa:
                $ref: "#/components/examples/SpeakerPatchRequest"
      responses:
        "200":
          description: Locutor atualizado.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                ligado:
                  $ref: "#/components/examples/SpeakerLinked"
