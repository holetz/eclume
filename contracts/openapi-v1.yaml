                diretorio:
                  $ref: "#/components/examples/PersonPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [people]
      operationId: createPerson
      summary: Register a person
      security:
