            schema:
              $ref: "#/components/schemas/FieldCreate"
      responses:
        "201":
          description: Campo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/fields/preview:
    post:
      tags: [fields]
      operationId: previewField
      summary: Testar a regra de um campo
      description: |
        Roda a regra de um campo em rascunho em até 3 gravações transcritas (as indicadas, ou as 3
        mais recentes) com o provider de `fields`, sem gravar nada. Desde a 2.15.0, o pedido
        conta na cota de pedidos ao agente em 24 h (estourada, 403 `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldPreviewRequest"
            examples:
              pedido:
                $ref: "#/components/examples/FieldPreviewRequest"
      responses:
        "202":
          description: Pré-visualização na fila; consulte `GET /api/v1/previews/{preview_id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/fields/{field_id}:
    parameters:
      - $ref: "#/components/parameters/FieldId"
    get:
      tags: [fields]
      operationId: getField
      summary: Um campo
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Campo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [fields]
      operationId: updateField
      summary: Editar um campo
      description: |
        Mudar o `kind` descarta os valores já preenchidos; um embutido não muda de `kind` (422).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
