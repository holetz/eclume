    get:
      tags: [transcripts]
      operationId: exportTranscript
      summary: Exportar a transcrição
      description: |
        `md`: frontmatter YAML (`id`, `title`, `recorded_at`, `language`, `duration_ms`,
        `source`, `revision`, `speakers`) e uma linha por segmento, `**Nome** [HH:MM:SS]: texto`,
        separadas por linha em branco. O nome é o da pessoa ligada ou, sem pessoa, o `label`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: format
          in: query
          required: true
          description: Formato do export. Formatos novos entram de forma aditiva.
          schema:
            type: string
            enum: [md]
      responses:
        "200":
          description: Arquivo exportado.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="alinhamento-do-programa-de-liderancas.md"']
          content:
            text/markdown:
              schema:
                type: string
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakersMarkdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

