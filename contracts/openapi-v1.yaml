      operationId: getPreview
      summary: One preview
      description: |
        Lives 1 h. One from another account, an expired one and a nonexistent one are 404.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: The state and, once ready, the results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
              examples:
                campo:
                  $ref: "#/components/examples/PreviewFieldRule"
                tipo:
                  $ref: "#/components/examples/PreviewAgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/base-chat:
    post:
      tags: [base-chat]
      operationId: askBaseChat
      summary: Ask about the recordings base
      deprecated: true
      description: |
        Stores the question and queues it; the client polls `GET /api/v1/base-chat/{chat_id}` until
        `done` or `failed`. The backend's `chat` agent favours the summaries and only reads the transcript
        when the summary is not enough; `history` is the last messages of the conversation (up to 10), which the
        client keeps. Each account has at most 2 open questions; beyond that, 429. Since
        2.14.0, a PAT without `transcripts:read` neither searches nor reads transcripts: the agent answers only
        from the summaries (a session and a device credential read both). Since 2.15.0, the question
        counts toward the 24 h quota of Agent requests (exceeded, 403 `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseChatRequest"
            examples:
              pergunta:
                $ref: "#/components/examples/BaseChatRequest"
      responses:
        "202":
          description: Question queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseChat"
              examples:
                fila:
                  $ref: "#/components/examples/BaseChatQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/base-chat/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/BaseChatId"
    get:
      tags: [base-chat]
      operationId: getBaseChat
      summary: One question and its answer
      deprecated: true
      description: |
        Lives 1 h. One from another account, an expired one and a nonexistent one are 404. `sources` are the recordings
        the agent actually consulted and on which the answer rests.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The state and, once ready, the answer with its sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseChat"
              examples:
                pronta:
                  $ref: "#/components/examples/BaseChatDone"
                falha:
                  $ref: "#/components/examples/BaseChatFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent/sessions:
    get:
      tags: [agent]
      operationId: listAgentSessions
      summary: The Agent conversations
      description: From the latest activity (`updated_at`) backwards, paginated by cursor.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSession"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [agent]
      operationId: createAgentSession
      summary: Open a conversation
      description: Without a title, the first question gives the title (its beginning, up to 120 characters).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionCreate"
      responses:
        "201":
          description: The created conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
              examples:
                nova:
                  $ref: "#/components/examples/AgentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/agent/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    get:
      tags: [agent]
      operationId: getAgentSession
      summary: One conversation with its messages and files
      description: |
        The messages in order, each with its files (the question's attachments, those generated
        by the answer), and the attachments not yet sent (`pending_files`). An answer left open for
        more than 15 minutes becomes `failed` with `agent_expired`.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionDetail"
              examples:
                conversa:
                  $ref: "#/components/examples/AgentSessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [agent]
      operationId: renameAgentSession
      summary: Rename the conversation
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionUpdate"
      responses:
        "200":
          description: The renamed conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [agent]
      operationId: deleteAgentSession
      summary: Delete the conversation
      description: Takes the messages and the files with it; the bucket is cleaned by the deletion queue.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent/sessions/{session_id}/files:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      tags: [agent]
      operationId: attachAgentFile
      summary: Attach a file to the conversation
      description: |
        Accepts .txt, .md, .csv, .pdf and .docx up to 10 MB; the type comes from the extension and is checked against the
        content (415 `unsupported_media_type` otherwise). The server keeps the original and extracts the
        text (up to 200 thousand characters), which the agent reads. The attachment goes with the next question that
        cites it in `attachments`; the conversation has up to 20 attachments (409 `too_many_files`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        "201":
          description: The attachment, not yet tied to a question (`message_id` null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentFile"
              examples:
                anexo:
                  $ref: "#/components/examples/AgentFileInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /api/v1/agent/sessions/{session_id}/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
      - $ref: "#/components/parameters/AgentFileId"
    delete:
      tags: [agent]
      operationId: deleteAgentFile
      summary: Remove an attachment not yet sent
      description: An attachment already sent with a question stays in the history (409).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agent/sessions/{session_id}/messages:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
    post:
      tags: [agent]
      operationId: askAgent
      summary: Ask the Agent
      description: |
        Stores the question with its attachments and the answer as `queued`, and queues the answer; the client
        polls `GET .../messages/{message_id}` until `done` or `failed`. The history is the conversation's,
        kept on the server. The agent consults the base (summaries first; transcripts only with a
        session, a device credential or a PAT with `transcripts:read`), reads the attachments and may generate
        files (.md, .txt, .csv, .docx). One open answer per conversation (409), two per account
        (429); each question counts toward the 24 h quota of Agent requests (403 `quota_exceeded`).
        Since 2.24.0, `skill` or `/name` at the start of the message picks a skill (422 if
        nonexistent or disabled; the prefix is removed from the stored text), and the answer may carry
        action proposals in `actions`, which only run after `POST /agent/actions/{id}/confirm`.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentMessageCreate"
      responses:
        "202":
          description: The question stored and the answer queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTurn"
              examples:
                fila:
                  $ref: "#/components/examples/AgentTurn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/agent/sessions/{session_id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/AgentSessionId"
      - $ref: "#/components/parameters/AgentMessageId"
    get:
      tags: [agent]
      operationId: getAgentMessage
      summary: One message of the conversation
      description: The answer until `done` or `failed`, with the sources and the generated files.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessage"
              examples:
                pronta:
                  $ref: "#/components/examples/AgentMessageDone"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/AgentFileId"
    get:
      tags: [agent]
      operationId: downloadAgentFile
      summary: Download an attachment or a generated file
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The file, as an attachment.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ["attachment; filename=\"prazos.csv\"; filename*=UTF-8''prazos.csv"]
          content:
            text/plain:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                contentMediaType: application/pdf
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent/tools:
    get:
      tags: [agent]
      operationId: listAgentTools
      summary: The Agent's tool catalogue
      description: |
        Since 2.24.0. Each tool with its nature (`read` consults, `produce` generates a file,
        `action` proposes a change the person confirms) and a short description; it is the list from which
        a skill picks its allowed tools.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentTool"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/agent/skills:
    get:
      tags: [agent]
      operationId: listAgentSkills
      summary: The account's skills
      description: Since 2.24.0. All of them (up to 50), by name.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The skills.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [agent]
      operationId: createAgentSkill
      summary: Register a skill
      description: |
        Since 2.24.0. The name (the leading slash is ignored) has 2 to 40 lowercase letters, digits
        and hyphens; a duplicate in the account is 409 `skill_exists`. A tool outside the catalogue or more than 50
        skills in the account: 422.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSkillCreate"
      responses:
        "201":
          description: The registered skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/agent/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/AgentSkillId"
    get:
      tags: [agent]
      operationId: getAgentSkill
      summary: One skill
      description: Since 2.24.0.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [agent]
      operationId: updateAgentSkill
      summary: Edit the skill
      description: Since 2.24.0. The fields sent change; a null `allowed_tools` allows every tool.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSkillPatch"
      responses:
        "200":
          description: The edited skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSkill"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [agent]
      operationId: deleteAgentSkill
      summary: Delete the skill
      description: Since 2.24.0. The questions that used it keep its name.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent/actions:
    get:
      tags: [agent]
      operationId: listAgentActions
      summary: The log of the Agent's actions
      description: |
        Since 2.24.0. The audit trail: each proposal, with who confirmed it, when, and the result per
        target, newest first. It remains even after the conversation is deleted.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of actions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentAction"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/agent/actions/{action_id}:
    parameters:
      - $ref: "#/components/parameters/AgentActionId"
    get:
      tags: [agent]
      operationId: getAgentAction
      summary: One Agent action
      description: Since 2.24.0. Polled until `done` or `failed`; a proposal older than 24 h becomes `expired`.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: The action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAction"
              examples:
                proposta:
                  $ref: "#/components/examples/AgentActionProposed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agent/actions/{action_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/AgentActionId"
    post:
      tags: [agent]
      operationId: confirmAgentAction
      summary: Confirm the proposal
      description: |
        Since 2.24.0. Moves the proposal to `queued` and enqueues the execution, target by target,
        through the same operations as the MCP server. Idempotent: confirming again returns the
        current state without executing again. Expired or dismissed: 409 (`action_expired`,
        `action_cancelled`). Requires the tool's write scope: `summaries:write` for
        `regenerate_summaries`, `recordings:write` for the others (a PAT without it: 403).
      security:
        - sessionCookie: []
        - pat: ["summaries:read", "summaries:write"]
        - pat: ["summaries:read", "recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: The queued action (or the current state, if already confirmed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/agent/actions/{action_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/AgentActionId"
    post:
      tags: [agent]
      operationId: cancelAgentAction
      summary: Dismiss the proposal
      description: Since 2.24.0. Only from `proposed` (dismissing again returns the state); otherwise 409 `action_not_proposed`.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The dismissed proposal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/people:
    get:
      tags: [people]
      operationId: listPeople
      summary: The user's people directory
      security:
        - sessionCookie: []
        - pat: ["people:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
