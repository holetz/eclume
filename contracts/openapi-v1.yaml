        - type: string
        - type: array
          items:
            type: string
        - type: "null"

    FieldValueOrigin:
      description: |
        `auto`: o agente preencheu; `edited`: o usuário escreveu; `accepted`: o usuário aceitou o
        automático. `edited` e `accepted` nunca são sobrescritos por um preenchimento automático.
      type: string
      enum: [auto, edited, accepted]

