          format: date-time
        updated_at:
          type: string
          format: date-time

    SummaryTemplateCreate:
      type: object
      required: [name, instructions]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        instructions:
          type: string
          minLength: 1
        is_default:
          description: O template do resumo automático do usuário.
          type: boolean

    SummaryTemplatePatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        instructions:
          type: string
          minLength: 1
        is_default:
          type: boolean

    SummaryTemplatePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
