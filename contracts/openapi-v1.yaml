                  $ref: "#/components/examples/PreviewAgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/base-chat:
    post:
      tags: [base-chat]
      operationId: askBaseChat
      summary: Perguntar sobre a base de gravações
      description: |
        Guarda a pergunta e a enfileira; o cliente consulta `GET /api/v1/base-chat/{chat_id}` até
        `done` ou `failed`. O agente do `chat` do backend prioriza os resumos e só lê a transcrição
        quando o resumo não basta; `history` são as últimas mensagens da conversa (até 10), que o
        cliente guarda. Cada conta tem no máximo 2 perguntas em aberto; além disso, 429. Desde a
        2.14.0, um PAT sem `transcripts:read` não busca nem lê transcrições: o agente responde só
        pelos resumos (sessão e credencial de aparelho leem as duas). Desde a 2.15.0, a pergunta
        conta na cota de pedidos ao agente em 24 h (estourada, 403 `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseChatRequest"
            examples:
              pergunta:
                $ref: "#/components/examples/BaseChatRequest"
      responses:
        "202":
          description: Pergunta na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseChat"
              examples:
                fila:
                  $ref: "#/components/examples/BaseChatQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/base-chat/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/BaseChatId"
    get:
      tags: [base-chat]
      operationId: getBaseChat
      summary: Uma pergunta e a resposta
      description: |
        Vive 1 h. A de outra conta, a expirada e a inexistente são 404. `sources` são as gravações
        que o agente de fato consultou e em que a resposta se apoia.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: O estado e, pronta, a resposta com as fontes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BaseChat"
              examples:
                pronta:
                  $ref: "#/components/examples/BaseChatDone"
                falha:
                  $ref: "#/components/examples/BaseChatFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

