      summary: Busca full-text sobre segmentos
      description: |
        Busca em português (`tsvector` pt) nos segmentos das transcrições visíveis ao usuário.
        Pede `q` ou `person`; com só `person`, lista as falas da pessoa em ordem cronológica.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: q
          in: query
          description: Termos de busca (sintaxe `websearch_to_tsquery`, aceita "frase exata" e -exclusão).
          schema:
            type: string
        - $ref: "#/components/parameters/PersonFilter"
        - name: from
          in: query
          description: "`recorded_at >= from`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "`recorded_at < to`."
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/CollectionFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Trechos encontrados, por relevância.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
              examples:
                turmas:
                  $ref: "#/components/examples/SearchPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

