      type: object
      additionalProperties: false
      required: [agenda_type, recording_id]
      properties:
        agenda_type:
          $ref: "#/components/schemas/AgendaTypeDraft"
        recording_id:
          description: Uma gravação transcrita do usuário.
          type: string
          format: uuid
        agenda_type_id:
          description: >-
            O tipo salvo que o rascunho edita, que sai da concorrência no lugar dele; sem ele, sai o de
            mesmo nome. Rascunho do tipo padrão não concorre: fica quando nenhum outro serve.
          type: [string, "null"]
          format: uuid

    FieldPreviewItem:
      type: object
      required: [recording_id, recording_title, value]
      properties:
        recording_id:
          type: string
          format: uuid
        recording_title:
          type: string
        value:
          $ref: "#/components/schemas/FieldValue"

    AgendaTypePreviewItem:
      type: object
      required: [recording_id, recording_title, detected, detected_type_name, fallback, confidence, title, tags, summary_md]
      properties:
        recording_id:
          type: string
          format: uuid
        recording_title:
          type: string
        detected:
          description: A detecção escolheu o rascunho.
          type: boolean
        detected_type_name:
          description: O tipo que a gravação teria (o rascunho, um dos salvos ou o tipo padrão).
          type: string
        fallback:
          description: >-
            Nenhum tipo serviu, ou a confiança ficou abaixo de 0,6: a gravação teria o tipo padrão.
          type: boolean
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        title:
          description: O título que o rascunho aplicaria.
          type: string
        tags:
          description: As tags da gravação com as tags padrão do rascunho.
          type: array
          items:
            type: string
        summary_md:
          description: O resumo com as instruções do rascunho.
          type: string

    Preview:
      type: object
      required: [id, kind, status, items, error]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [field_rule, agenda_type]
        status:
          type: string
          enum: [queued, running, done, failed]
        items:
          description: "Com `status: done`: um item por gravação testada."
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/FieldPreviewItem"
              - $ref: "#/components/schemas/AgendaTypePreviewItem"
        error:
          description: "Com `status: failed`; `no_provider` quando a finalidade não tem provider."
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"

    BaseChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          description: As últimas mensagens da conversa, em ordem; o server não guarda o histórico.
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/BaseChatTurn"

    BaseChatTurn:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000

    BaseChatSource:
      type: object
      required: [recording_id, title]
      properties:
        recording_id:
          type: string
          format: uuid
        title:
          type: string

    BaseChat:
      type: object
      required: [id, status, answer, sources, queries, model, error]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, done, failed]
        answer:
          description: "Com `status: done`: a resposta em Markdown."
          type: [string, "null"]
        sources:
          description: As gravações consultadas em que a resposta se apoia.
          type: array
          items:
            $ref: "#/components/schemas/BaseChatSource"
        queries:
          description: Quantas consultas à base o agente fez.
          type: integer
          minimum: 0
        model:
          type: [string, "null"]
        error:
          description: "Com `status: failed`; `no_provider` quando a finalidade `chat` não tem provider."
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"

    AgentProviderKind:
      type: string
      enum: [ollama, openai-compatible, anthropic, claude-cli]

    AgentPurpose:
      description: |
        Para que o provider serve: `summaries` (resumos), `fields` (preenchimento de campos),
        `chat` (ajuste do resumo) e `agenda_detection` (detecção do tipo de agenda). Cada
        finalidade tem no máximo um provider: declará-la num provider a tira dos outros.
      type: string
      enum: [summaries, fields, chat, agenda_detection]

    AgentProviderRef:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentProviderKind"

    SummaryOrigin:
      description: |
        Como a versão nasceu: `generated` (o agente pelas instruções do tipo de agenda), `manual`
        (edição à mão, ou voltar à gerada) ou `chat` (ajuste pelo agente no chat).
      type: string
      enum: [generated, manual, chat]

    Summary:
      description: |
        Uma versão do resumo da transcrição. A atual é a de maior `version` com `status: done`.
        Uma geração que termina depois de uma edição ou de um ajuste toma o próximo número e vira a
        atual; por isso os números podem pular.
      type: object
      required: [id, transcript_id, transcript_revision, agenda_type, version, origin, status, trigger, provider, model, content_md, error, restored_from_id, chat_message_id, created_by, created_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
        transcript_revision:
          description: Revisão da transcrição que o resumo leu.
          type: integer
          minimum: 1
        agenda_type:
          description: |
            Instantâneo do tipo de agenda cujas instruções o resumo seguiu (numa versão `manual` ou
            `chat`, o da versão de que ela partiu): o resumo continua quando o tipo é renomeado ou
            excluído. `null` numa edição sem versão anterior.
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            - type: "null"
        version:
          description: |
            Versão do resumo da transcrição, a partir de 1; toda geração, edição, volta à gerada
            ou ajuste por chat sobe a versão.
          type: integer
          minimum: 1
        origin:
          $ref: "#/components/schemas/SummaryOrigin"
        status:
          type: string
          enum: [queued, running, done, failed]
        trigger:
          type: string
          enum: [manual, automatic]
        provider:
          description: O agente que escreveu a versão; `null` numa versão `manual`.
          oneOf:
            - $ref: "#/components/schemas/AgentProviderRef"
            - type: "null"
        model:
          type: [string, "null"]
        content_md:
          description: "Resumo em Markdown, com `status: done`."
          type: [string, "null"]
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
        restored_from_id:
          description: Na volta à gerada, a versão gerada cujo conteúdo foi restaurado.
          type: [string, "null"]
          format: uuid
        chat_message_id:
          description: Numa versão `chat`, a resposta do agente que a produziu.
          type: [string, "null"]
          format: uuid
        created_by:
          description: "Obsoleto desde a 2.11.0: sempre o id do próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    SummaryCreate:
      type: object
      properties:
        agenda_type_id:
          description: Sem valor, o tipo de agenda da gravação.
          type: string
          format: uuid
        provider_id:
          description: Sem valor, o provider padrão da plataforma.
          type: string
          format: uuid

    SummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Summary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SummaryState:
      description: O resumo da gravação como a tela o mostra.
      type: object
      required: [current, generated, pending, version_count]
      properties:
        current:
          description: A versão atual (maior `version` concluída).
          oneOf:
            - $ref: "#/components/schemas/Summary"
            - type: "null"
        generated:
          description: A gerada de referência (a `generated` concluída mais recente), para comparar e voltar.
          oneOf:
            - $ref: "#/components/schemas/Summary"
            - type: "null"
        pending:
          description: A geração em `queued` ou `running`, se houver.
          oneOf:
            - $ref: "#/components/schemas/Summary"
            - type: "null"
        version_count:
          description: Versões guardadas, de todas as origens.
          type: integer
          minimum: 0

    SummaryEdit:
      type: object
      required: [content_md, base_version]
      properties:
        content_md:
          type: string
          minLength: 1
          maxLength: 200000
        base_version:
          description: A versão que a pessoa abriu para editar; 0 sem resumo concluído.
          type: integer
          minimum: 0

    SummaryChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000

    ChatRead:
      description: |
        Uma consulta do agente à transcrição: `read_transcript` (o trecho `from_ms`–`to_ms`,
        `clipped` se passou do teto e foi cortado) ou `search_transcript` (`query` e os `hits`).
      type: object
      required: [tool]
      properties:
        tool:
          type: string
          enum: [read_transcript, search_transcript]
        from_ms:
          type: integer
          minimum: 0
        to_ms:
          type: integer
          minimum: 0
        clipped:
          type: boolean
        query:
          type: string
        hits:
          type: integer
          minimum: 0

    SummaryChatMessage:
      type: object
      required: [id, recording_id, role, content, status, reply_to, base_summary_id, summary_id, reads, provider, model, error, created_by, created_at, completed_at]
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          description: O pedido, ou a resposta do agente (`null` até `done`).
          type: [string, "null"]
        status:
          description: A mensagem do usuário nasce `done`; a do agente vai de `queued` a `done` ou `failed`.
          type: string
          enum: [queued, running, done, failed]
        reply_to:
          description: Na resposta do agente, o pedido que ela responde.
          type: [string, "null"]
          format: uuid
        base_summary_id:
          description: A versão atual quando o pedido chegou.
          type: [string, "null"]
          format: uuid
        summary_id:
          description: A versão `chat` que a resposta criou, se mudou o resumo.
          type: [string, "null"]
          format: uuid
        reads:
          description: As consultas do agente à transcrição, em ordem.
          type: array
          items:
            $ref: "#/components/schemas/ChatRead"
        provider:
          oneOf:
            - $ref: "#/components/schemas/AgentProviderRef"
            - type: "null"
        model:
          type: [string, "null"]
        error:
          description: |
            Com `failed` (`provider_bad_output`, `chat_tool_limit`, `provider_timeout`...), ou com
            `done` e `summary_changed` quando o resumo mudou durante o ajuste: a resposta fica, sem
            versão nova.
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
        created_by:
          description: "Obsoleto desde a 2.11.0: sempre o id do próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time

    SummaryChatExchange:
      type: object
      required: [message, reply]
      properties:
        message:
          $ref: "#/components/schemas/SummaryChatMessage"
        reply:
          $ref: "#/components/schemas/SummaryChatMessage"

    SummaryChatPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SummaryChatMessage"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    MarkerInput:
      type: object
      required: [client_id, at_ms]
      properties:
        client_id:
          description: Id gerado pelo app; reenviar o mesmo não duplica.
          type: string
          format: uuid
        at_ms:
          description: Instante desde o início da gravação.
          type: integer
          minimum: 0
        note:
          type: [string, "null"]
          maxLength: 500

    MarkerBatch:
      type: object
      required: [markers]
      properties:
        markers:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MarkerInput"
        device_name:
          description: Quem marcou ("iPhone 15 · Jane").
          type: [string, "null"]
          maxLength: 200

    MarkerPatch:
      type: object
      required: [note]
      properties:
        note:
          type: [string, "null"]
          maxLength: 500

    Marker:
      type: object
      required: [id, recording_id, client_id, at_ms, note, device_name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        at_ms:
          description: Instante desde o início; pode passar da duração, que só se conhece depois.
          type: integer
          minimum: 0
        note:
          type: [string, "null"]
        device_name:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MarkerPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Marker"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AsrSettings:
      type: object
      required: [engine, model, compute_type, batch_size, default_language, fallback_model, endpoint_url]
      properties:
        engine:
          type: string
          enum: [whisperx-local, openai-compatible, cpu]
        model:
          type: string
        compute_type:
          type: string
        batch_size:
          description: "`null` = adaptativo à VRAM livre."
          type: [integer, "null"]
          minimum: 1
        default_language:
          description: |
            Idioma das gravações sem idioma próprio (`pt`, `en`…), ou `auto`: a engine detecta o
            idioma de cada gravação e o alinhador segue o detectado.
          type: [string, "null"]
        fallback_model:
          description: Modelo usado depois de um OOM.
          type: [string, "null"]
        endpoint_url:
          description: "Base do servidor remoto, com `engine: openai-compatible`."
          type: [string, "null"]
          format: uri

    DiarizationSettings:
      type: object
      required: [enabled, model, min_speakers, max_speakers]
      properties:
        enabled:
          type: boolean
        model:
          type: string
        min_speakers:
          type: [integer, "null"]
          minimum: 1
        max_speakers:
          type: [integer, "null"]
          minimum: 1

    PreprocessingSettings:
      description: |
        Tratamento do áudio antes da transcrição, pelo worker GPU, em ordem fixa: separar canais,
        reduzir ruído, normalizar o loudness e cortar o silêncio do início e do fim. A conversão
        para 16 kHz mono é sempre feita e não tem chave. As marcas de tempo continuam as do áudio
        original.
      type: object
      required: [denoise, loudnorm, trim_silence, split_channels]
      properties:
        denoise:
          type: object
          required: [enabled, method, strength]
          properties:
            enabled:
              type: boolean
            method:
              description: "`rnnoise` (rede neural, 48 kHz) ou `afftdn` (FFT do ffmpeg)."
              type: string
              enum: [rnnoise, afftdn]
            strength:
              description: Quanto do sinal tratado entra na mistura.
              type: number
              minimum: 0
              maximum: 1
        loudnorm:
          type: object
          required: [enabled, target_lufs, true_peak_db, lra]
          properties:
            enabled:
              type: boolean
            target_lufs:
              description: Loudness integrado alvo (EBU R128).
              type: number
              minimum: -30
              maximum: -10
            true_peak_db:
              type: number
              minimum: -9
              maximum: 0
            lra:
              description: Faixa de loudness.
              type: number
              minimum: 1
              maximum: 20
        trim_silence:
          type: object
          required: [enabled, min_silence_s, threshold_db]
          properties:
            enabled:
              type: boolean
            min_silence_s:
              description: Silêncio mínimo, no início ou no fim, para cortar.
              type: number
              minimum: 1
              maximum: 30
            threshold_db:
              description: Abaixo deste nível, é silêncio.
              type: number
              minimum: -80
              maximum: -20
        split_channels:
          description: Um canal por pessoa (gravação estéreo de duas fontes); mono duplicado é pulado.
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean

    VoiceIdentificationSettings:
      type: object
      required: [enabled, suggestion_threshold]
      properties:
        enabled:
          description: >-
            Liga a identificação por voz na plataforma; exige a separação de locutores ligada (422 em
            `voice_identification.enabled`). Desligado, nenhuma impressão é comparada nem
            criada; desligar apaga as existentes. O aceite do aviso no cadastro cobre o consentimento.
          type: boolean
        suggestion_threshold:
          description: Similaridade mínima (cosseno) para sugerir uma pessoa; o padrão sai da calibração.
          type: number
          minimum: 0
          maximum: 1

    AdminSettings:
      type: object
      required: [asr, diarization, voice_identification, preprocessing, quotas, updated_at, updated_by]
      properties:
        asr:
          $ref: "#/components/schemas/AsrSettings"
        diarization:
          $ref: "#/components/schemas/DiarizationSettings"
        voice_identification:
          $ref: "#/components/schemas/VoiceIdentificationSettings"
        preprocessing:
          $ref: "#/components/schemas/PreprocessingSettings"
        quotas:
          description: Cotas padrão de toda conta (desde a 2.15.0); o admin as sobrepõe por conta.
          $ref: "#/components/schemas/Quotas"
        updated_at:
          type: string
          format: date-time
        updated_by:
          description: Conta de admin que mudou por último.
          oneOf:
            - $ref: "#/components/schemas/AdminRef"
            - type: "null"

    AdminSettingsPatch:
      description: Cada bloco é mesclado campo a campo; campos ausentes ficam como estão.
      type: object
      minProperties: 1
      properties:
        asr:
          type: object
          properties:
            engine:
              type: string
              enum: [whisperx-local, openai-compatible, cpu]
            model:
              type: string
            compute_type:
              type: string
            batch_size:
              type: [integer, "null"]
              minimum: 1
            default_language:
              description: Código do idioma ou `auto`.
              type: [string, "null"]
              pattern: "^(auto|[a-z]{2,3}(-[A-Za-z0-9]{2,8})*)$"
            fallback_model:
              type: [string, "null"]
            endpoint_url:
              type: [string, "null"]
              format: uri
        diarization:
          type: object
          properties:
            enabled:
              type: boolean
            model:
              type: string
            min_speakers:
              type: [integer, "null"]
              minimum: 1
            max_speakers:
              type: [integer, "null"]
              minimum: 1
        voice_identification:
          type: object
          properties:
            enabled:
              type: boolean
            suggestion_threshold:
              type: number
              minimum: 0
              maximum: 1
        preprocessing:
          description: Cada etapa é mesclada campo a campo.
          type: object
          additionalProperties: false
          properties:
            denoise:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                method:
                  description: "`rnnoise` (rede neural, 48 kHz) ou `afftdn` (FFT do ffmpeg)."
                  type: string
                  enum: [rnnoise, afftdn]
                strength:
                  description: Quanto do sinal tratado entra na mistura.
                  type: number
                  minimum: 0
                  maximum: 1
            loudnorm:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                target_lufs:
                  description: Loudness integrado alvo (EBU R128).
                  type: number
                  minimum: -30
                  maximum: -10
                true_peak_db:
                  type: number
                  minimum: -9
                  maximum: 0
                lra:
                  description: Faixa de loudness.
                  type: number
                  minimum: 1
                  maximum: 20
            trim_silence:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                min_silence_s:
                  description: Silêncio mínimo, no início ou no fim, para cortar.
                  type: number
                  minimum: 1
                  maximum: 30
                threshold_db:
                  description: Abaixo deste nível, é silêncio.
                  type: number
                  minimum: -80
                  maximum: -20
            split_channels:
              description: Um canal por pessoa (gravação estéreo de duas fontes); mono duplicado é pulado.
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
        quotas:
          description: Cotas padrão (desde a 2.15.0), mescladas campo a campo; `null` é sem limite.
          $ref: "#/components/schemas/QuotasOverride"

    AgentProvider:
      type: object
      required: [id, name, kind, base_url, model, api_key_set, enabled, options, used_for, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentProviderKind"
        base_url:
          description: Base da API (Ollama, OpenAI-compatível). `null` para `anthropic` e `claude-cli`.
          type: [string, "null"]
          format: uri
        model:
          type: string
        api_key_set:
          type: boolean
        enabled:
          type: boolean
        options:
          description: Parâmetros do provider (`max_tokens`, `temperature`, `context_window`).
          type: object
          additionalProperties:
            type: [string, number, boolean]
        used_for:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AgentPurpose"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentProviderCreate:
      type: object
      required: [name, kind, model]
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/AgentProviderKind"
        base_url:
          type: [string, "null"]
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          minLength: 1
          writeOnly: true
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties:
            type: [string, number, boolean]
        used_for:
          description: Sem valor, um provider habilitado assume as finalidades que nenhum outro declara.
          type: array
          items:
            $ref: "#/components/schemas/AgentPurpose"

    AgentProviderPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        base_url:
          type: [string, "null"]
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: [string, "null"]
          writeOnly: true
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties:
            type: [string, number, boolean]
        used_for:
          description: Substitui a lista; as finalidades declaradas saem dos outros providers.
          type: array
          items:
            $ref: "#/components/schemas/AgentPurpose"

    AgentProviderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentProvider"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, is_set, updated_at]
            properties:
              name:
                type: string
              is_set:
                type: boolean
              updated_at:
                type: [string, "null"]
                format: date-time

    SecretPut:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          writeOnly: true

    AdminJobRetried:
      description: O job criado por `POST /api/v1/admin/jobs/{job_id}/retry`.
      type: object
      required: [job_id, recording_id, revision, state, queued_at]
      properties:
        job_id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [queued]
        queued_at:
          type: string
          format: date-time
    AdminHealth:
      type: object
      required: [queue, gpu, models_loaded, recent_failures, checked_at, steps, services]
      properties:
        queue:
          type: object
          required: [queued, running, failed_last_24h]
          properties:
            queued:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            failed_last_24h:
              type: integer
              minimum: 0
        gpu:
          description: "`null` quando o worker não reporta GPU (engine CPU ou remota)."
          oneOf:
            - type: object
              required: [name, vram_total_mb, vram_used_mb, utilization_pct]
              properties:
                name:
                  type: string
                vram_total_mb:
                  type: integer
                  minimum: 0
                vram_used_mb:
                  type: integer
                  minimum: 0
                utilization_pct:
                  type: number
                  minimum: 0
                  maximum: 100
            - type: "null"
        models_loaded:
          type: array
          items:
            type: object
            required: [name, kind, loaded_at, vram_mb]
            properties:
              name:
                type: string
              kind:
                type: string
                enum: [asr, alignment, diarization, embeddings, summarization]
              loaded_at:
                type: string
                format: date-time
              vram_mb:
                type: [integer, "null"]
                minimum: 0
        recent_failures:
          description: |
            As etapas do pipeline que falharam nas últimas 24 h, da mais recente para a mais antiga,
            sem o conteúdo das gravações.
          type: array
          items:
            type: object
            required: [job_id, recording_id, stage, code, message, failed_at]
            properties:
              job_id:
                description: O job de transcrição (que o admin retenta); `null` nas etapas por agente.
                type: [string, "null"]
                format: uuid
              step:
                description: A etapa do pipeline que falhou (holetz/eclume#33).
                type: string
                enum: [received, preprocessing, transcription, agenda_type, fields, summary]
              recording_id:
                type: string
                format: uuid
              stage:
                type: [string, "null"]
              code:
                type: string
              message:
                type: string
              failed_at:
                type: string
                format: date-time
              retryable:
                description: Falha passageira que `POST /api/v1/admin/jobs/{job_id}/retry` pode resolver (1.4.0).
                type: boolean
        checked_at:
          type: string
          format: date-time
        steps:
          description: |
            Cada etapa do pipeline (fora o recebido) nas últimas 24 h: execuções concluídas (feitas ou
            falhas), a mediana da duração das feitas e as falhas. Zeradas quando não rodaram.
          type: array
          items:
            type: object
            required: [step, runs, median_ms, failures]
            properties:
              step:
                type: string
                enum: [preprocessing, transcription, fields, agenda_type, summary]
              runs:
                type: integer
                minimum: 0
              median_ms:
                type: [integer, "null"]
                minimum: 0
              failures:
                type: integer
                minimum: 0
        services:
          description: |
            Uma sonda por serviço, em paralelo, com teto de 2 s cada: `healthy`, `degraded` (lento),
            `down` ou `absent` (ainda não existe na plataforma).
          type: array
          items:
            type: object
            required: [name, status, detail, latency_ms]
            properties:
              name:
                type: string
                enum: [api, postgres, redis, storage, gpu_worker, cpu_worker, mcp]
              status:
                type: string
                enum: [healthy, degraded, down, absent]
              detail:
                type: [string, "null"]
              latency_ms:
                type: [integer, "null"]
                minimum: 0
        worker:
          description: >-
            Heartbeat do worker GPU (`eclume:gpu:health`, a cada 15 s, TTL 45 s); `null` quando
            nenhum worker publicou nos últimos 45 s.
          oneOf:
            - type: object
              required: [online, last_seen_at, version, engine, busy]
              properties:
                online:
                  type: boolean
                last_seen_at:
                  type: string
                  format: date-time
                version:
                  type: [string, "null"]
                engine:
                  type: [string, "null"]
                device:
                  type: [string, "null"]
                busy:
                  description: Há um job de transcrição rodando no worker.
                  type: boolean
            - type: "null"
        queues:
          description: Profundidade de cada fila arq da instância (só números, sem ids).
          type: array
          items:
            type: object
            required: [name, queued, running]
            properties:
              name:
                type: string
              queued:
                type: integer
                minimum: 0
              running:
                type: integer
                minimum: 0
        held_jobs:
          description: >-
            Desde a 2.15.0: jobs de transcrição retidos no banco, fora da fila da GPU — os que
            aguardam a vez da conta (ela já tem um na GPU) e os que aguardam a janela de minutos de
            24 h. Só números.
          type: object
          required: [account_turn, gpu_minutes]
          properties:
            account_turn:
              type: integer
              minimum: 0
            gpu_minutes:
              type: integer
              minimum: 0
        running_jobs:
          description: >-
            Jobs de transcrição da plataforma já despachados à GPU e ainda não concluídos, com o
            progresso (desde a 2.15.0, sem os retidos, contados em `held_jobs`).
          type: array
          items:
            type: object
            required: [job_id, recording_id, recording_title, state, stage, progress, queued_at, started_at, updated_at]
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              recording_title:
                type: string
              state:
                type: string
                enum: [queued, running]
              stage:
                type: [string, "null"]
              progress:
                type: [number, "null"]
                minimum: 0
                maximum: 1
              queued_at:
                type: string
                format: date-time
              started_at:
                type: [string, "null"]
                format: date-time
              updated_at:
                description: Última escrita do worker no progresso; parado há muito tempo indica worker morto.
                type: [string, "null"]
                format: date-time

