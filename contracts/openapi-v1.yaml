      required: [id, recording_id, title, language, recorded_at, duration_ms, source, content_hash, revision, created_at, updated_at, owner, speakers]
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        title:
          type: string
        language:
          type: string
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/Source"
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner:
          $ref: "./transcript.schema.json#/$defs/UserRef"
        speakers:
          type: array
          items:
            $ref: "./transcript.schema.json#/$defs/Speaker"
        tags:
          type: array
          items:
            type: string

    TranscriptPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SpeakerPatch:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        person_id:
          description: Pessoa a ligar, ou `null` para desfazer.
          type: [string, "null"]
          format: uuid

    SpeakerMerge:
      type: object
      required: [source_speaker_ids, target_speaker_id]
