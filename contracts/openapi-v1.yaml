          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/agenda-types:
    get:
      tags: [agenda-types]
      operationId: listAgendaTypes
      summary: Tipos de agenda do usuário
      description: |
        Na ordem da lista (`position`). A conta nasce com os tipos padrão da plataforma. Desde a
        2.4.0, basta ao PAT `summaries:read` ou `recordings:read`: a credencial de dispositivo lê a
        lista para escolher o tipo ao parar a gravação (o resto de `/agenda-types` segue pedindo
        `summaries:*`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
        - pat: ["recordings:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tipos de agenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaTypePage"
              examples:
                padrao:
                  $ref: "#/components/examples/AgendaTypePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [agenda-types]
      operationId: createAgendaType
      summary: Criar um tipo de agenda
      description: Sem `position`, o tipo vai para o fim da lista. Nome repetido entre os tipos do usuário é 409.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaTypeCreate"
            examples:
              mentoria:
                $ref: "#/components/examples/AgendaTypeCreateRequest"
      responses:
        "201":
          description: Tipo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/agenda-types/preview:
    post:
      tags: [agenda-types]
      operationId: previewAgendaType
      summary: Pré-visualizar um tipo de agenda numa gravação
      description: |
        Roda, numa gravação transcrita, a detecção com o rascunho no lugar do tipo salvo de mesmo nome,
        o título e as tags que ele aplicaria e o resumo com as instruções dele, sem gravar nada.
        Desde a 2.15.0, o pedido conta na cota de pedidos ao agente em 24 h (estourada, 403
        `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaTypePreviewRequest"
            examples:
              pedido:
                $ref: "#/components/examples/AgendaTypePreviewRequest"
      responses:
        "202":
          description: Pré-visualização na fila; consulte `GET /api/v1/previews/{preview_id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/agenda-types/{agenda_type_id}:
    parameters:
      - $ref: "#/components/parameters/AgendaTypeId"
    get:
      tags: [agenda-types]
      operationId: getAgendaType
      summary: Um tipo de agenda
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: Tipo de agenda.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [agenda-types]
      operationId: updateAgendaType
      summary: Editar um tipo de agenda
      description: |
        Vale para as próximas detecções e resumos; os resumos já gerados guardam as instruções do
        momento. Nome repetido é 422 em `name`.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaTypePatch"
      responses:
        "200":
          description: Tipo atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [agenda-types]
      operationId: deleteAgendaType
      summary: Excluir um tipo de agenda
      description: |
        As gravações que o usavam passam para o tipo padrão da conta (origem `auto`); os resumos
        ficam. O tipo padrão (`fallback`) não sai: 409 `fallback_agenda_type`.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/fields:
    get:
      tags: [fields]
      operationId: listFields
      summary: Campos do usuário
      description: |
        Título e tags vêm embutidos em toda conta; os demais são do usuário.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
