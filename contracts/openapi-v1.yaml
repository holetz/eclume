        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionCreate"
      responses:
        "201":
          description: Coleção criada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/collections/{collection_id}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    patch:
      tags: [organize]
      operationId: updateCollection
      summary: Renomear ou descrever uma coleção
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionPatch"
      responses:
        "200":
          description: Coleção atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [organize]
      operationId: deleteCollection
      summary: Excluir uma coleção
      description: As gravações ficam; só saem da coleção.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Excluída.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/collections/{collection_id}/merge:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    post:
      tags: [organize]
      operationId: mergeCollection
      summary: Mesclar uma coleção em outra
      description: |
        As gravações da coleção passam para `into`, sem repetição, e a coleção é excluída; `into`
        fica com o nome, a descrição e a regra dela. `into` igual à coleção, ou inexistente, é 422.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionMerge"
      responses:
        "200":
          description: A coleção que recebeu as gravações.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tags:
    get:
      tags: [organize]
      operationId: listTags
      summary: O cadastro de tags do usuário
      description: |
        As tags cadastradas, em ordem alfabética, com quantas gravações usam cada uma. As tags são
        fixas por padrão: o agente só escolhe entre elas (ver `GET /me/tag-assignment`). Toda tag
        que o usuário escreve numa gravação, num envio ou nas tags padrão de um tipo entra no
        cadastro sozinha, e a gravação fica com a grafia do cadastro (sem acento e sem caixa).
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Tags com contagem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
              examples:
                tags:
                  $ref: "#/components/examples/TagList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [organize]
      operationId: createTag
      summary: Cadastrar uma tag
      description: O mesmo nome, sem acento e sem caixa, é 409 `tag_exists`.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagCreate"
      responses:
        "201":
          description: Tag cadastrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tags/{tag_id}:
    parameters:
      - $ref: "#/components/parameters/TagId"
    patch:
      tags: [organize]
      operationId: updateTag
      summary: Renomear ou descrever uma tag
      description: |
        Renomear troca o nome também nas gravações e nas tags padrão dos tipos; um nome já
        cadastrado é 409 `tag_exists` (para juntar as duas, mescle).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagPatch"
      responses:
        "200":
          description: Tag atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [organize]
      operationId: deleteTag
      summary: Excluir uma tag
      description: A tag sai do cadastro, das gravações e das tags padrão dos tipos.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Excluída.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/tags/{tag_id}/merge:
    parameters:
      - $ref: "#/components/parameters/TagId"
    post:
      tags: [organize]
      operationId: mergeTag
      summary: Mesclar uma tag em outra
      description: |
        Onde havia a tag, fica `into` (sem repetir), nas gravações e nas tags padrão dos tipos; a
        tag sai do cadastro. `into` igual à tag, ou inexistente, é 422.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagMerge"
      responses:
        "200":
          description: A tag que ficou.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Abrir a sessão de admin
      description: |
        Conta de admin, separada das contas de usuário (o mesmo e-mail pode existir nas duas).
        Define os cookies `eclume_admin_session` (HttpOnly, Secure, SameSite=Strict,
        `Path=/api/v1/admin`) e `eclume_admin_csrf` (legível pelo JavaScript). Toda requisição
        mutável em `/api/v1/admin/*` ecoa `eclume_admin_csrf` no header `X-CSRF-Token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credenciais:
                $ref: "#/components/examples/LoginRequest"
      responses:
        "204":
          description: Sessão de admin aberta.
          headers:
            Set-Cookie:
              description: "`eclume_admin_session` e `eclume_admin_csrf`."
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/admin/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      security:
        - adminSessionCookie: []
      summary: Encerrar a sessão de admin
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sessão encerrada e cookies removidos.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      security:
        - adminSessionCookie: []
      summary: Conta de admin corrente
      responses:
        "200":
          description: Conta de admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
              examples:
                admin:
                  $ref: "#/components/examples/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      security:
        - adminSessionCookie: []
      summary: Configuração em runtime da plataforma
      responses:
        "200":
          description: Configuração.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
              examples:
                padrao:
                  $ref: "#/components/examples/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [admin]
      operationId: updateAdminSettings
      security:
        - adminSessionCookie: []
      summary: Alterar a configuração
      description: >-
        Merge por bloco; só os campos enviados mudam. Vale para os próximos jobs. Desligar
        `voice_identification.enabled` apaga as impressões de voz e as sugestões pendentes de toda
        a plataforma.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
            examples:
              trocarModelo:
                $ref: "#/components/examples/AdminSettingsPatchRequest"
      responses:
        "200":
          description: Configuração resultante.
          content:
