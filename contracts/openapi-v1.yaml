  /api/v1/agenda-types:
    get:
      tags: [agenda-types]
      operationId: listAgendaTypes
      summary: The user's agenda types
      description: |
        In list order (`position`). The account starts with the platform's default types. Since
        2.4.0, a PAT with `summaries:read` or `recordings:read` is enough: the device credential reads the
        list to choose the type when stopping the recording (the rest of `/agenda-types` still requires
        `summaries:*`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
        - pat: ["recordings:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Agenda types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaTypePage"
              examples:
                padrao:
                  $ref: "#/components/examples/AgendaTypePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [agenda-types]
      operationId: createAgendaType
      summary: Create an agenda type
      description: Without `position`, the type goes to the end of the list. A name repeated among the user's types is 409.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaTypeCreate"
            examples:
              mentoria:
                $ref: "#/components/examples/AgendaTypeCreateRequest"
      responses:
        "201":
          description: Type created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/agenda-types/preview:
    post:
      tags: [agenda-types]
      operationId: previewAgendaType
      summary: Preview an agenda type on a recording
      description: |
        Runs, on a transcribed recording, the detection with the draft in place of the saved type of the same name,
        the title and the tags it would apply, and the summary with its instructions, without saving anything.
        Since 2.15.0, the request counts against the quota of Agent requests in 24 h (exceeded, 403
        `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaTypePreviewRequest"
            examples:
              pedido:
                $ref: "#/components/examples/AgendaTypePreviewRequest"
      responses:
        "202":
          description: Preview queued; poll `GET /api/v1/previews/{preview_id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/agenda-types/{agenda_type_id}:
    parameters:
      - $ref: "#/components/parameters/AgendaTypeId"
    get:
      tags: [agenda-types]
      operationId: getAgendaType
      summary: One agenda type
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: Agenda type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [agenda-types]
      operationId: updateAgendaType
      summary: Edit an agenda type
      description: |
        Applies to the next detections and summaries; summaries already generated keep the instructions of
        that moment. A repeated name is 422 on `name`.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgendaTypePatch"
      responses:
        "200":
          description: Type updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendaType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [agenda-types]
      operationId: deleteAgendaType
      summary: Delete an agenda type
      description: |
        The recordings that used it move to the account's default type (origin `auto`); the summaries
        stay. The default type (`fallback`) cannot be removed: 409 `fallback_agenda_type`.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/fields:
    get:
      tags: [fields]
      operationId: listFields
      summary: The user's fields
      description: |
        Title and tags come built into every account; the others are the user's.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Fields, in list order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldPage"
              examples:
                campos:
                  $ref: "#/components/examples/FieldPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [fields]
      operationId: createField
      summary: Create a field
      description: |
        The key (`key`) comes from the name and does not change afterwards. A choice field requires `options`; the other types have none.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldCreate"
      responses:
        "201":
          description: Field created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/fields/preview:
    post:
      tags: [fields]
      operationId: previewField
      summary: Test a field's rule
      description: |
        Runs a draft field's rule on up to 3 transcribed recordings (the given ones, or the 3
        most recent) with the `fields` provider, without saving anything. Since 2.15.0, the request
        counts toward the 24 h quota of Agent requests (exceeded, 403 `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldPreviewRequest"
            examples:
              pedido:
                $ref: "#/components/examples/FieldPreviewRequest"
      responses:
        "202":
          description: Preview queued; poll `GET /api/v1/previews/{preview_id}`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/fields/{field_id}:
    parameters:
      - $ref: "#/components/parameters/FieldId"
    get:
      tags: [fields]
      operationId: getField
      summary: One field
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [fields]
      operationId: updateField
      summary: Edit a field
      description: |
        Changing the `kind` discards the values already filled in; a built-in field does not change `kind` (422).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldPatch"
      responses:
        "200":
          description: Field updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Field"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [fields]
      operationId: deleteField
