          minimum: 0
          maximum: 1

    AdminSettings:
      type: object
      required: [asr, diarization, summarization, voice_identification, updated_at, updated_by]
      properties:
        asr:
          $ref: "#/components/schemas/AsrSettings"
        diarization:
          $ref: "#/components/schemas/DiarizationSettings"
        summarization:
          $ref: "#/components/schemas/SummarizationSettings"
        voice_identification:
          $ref: "#/components/schemas/VoiceIdentificationSettings"
        updated_at:
          type: string
          format: date-time
        updated_by:
          description: Conta de admin que mudou por último.
          oneOf:
            - $ref: "#/components/schemas/AdminRef"
            - type: "null"

    AdminSettingsPatch:
      description: Cada bloco é mesclado campo a campo; campos ausentes ficam como estão.
      type: object
      minProperties: 1
      properties:
        asr:
          type: object
          properties:
            engine:
              type: string
              enum: [whisperx-local, openai-compatible, cpu]
            model:
              type: string
            compute_type:
              type: string
            batch_size:
              type: [integer, "null"]
              minimum: 1
            default_language:
              type: [string, "null"]
            fallback_model:
              type: [string, "null"]
            endpoint_url:
              type: [string, "null"]
              format: uri
        diarization:
          type: object
          properties:
            enabled:
              type: boolean
            model:
              type: string
            min_speakers:
              type: [integer, "null"]
              minimum: 1
            max_speakers:
              type: [integer, "null"]
              minimum: 1
        summarization:
          type: object
          properties:
            default_provider_id:
              type: [string, "null"]
              format: uuid
            auto_summarize:
              type: boolean
        voice_identification:
          type: object
          properties:
            enabled:
              type: boolean
            suggestion_threshold:
              type: number
              minimum: 0
              maximum: 1

    AgentProvider:
      type: object
      required: [id, name, kind, base_url, model, api_key_set, enabled, options, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AgentProviderKind"
        base_url:
          description: Base da API (Ollama, OpenAI-compatível). `null` para `anthropic` e `claude-cli`.
          type: [string, "null"]
          format: uri
        model:
          type: string
        api_key_set:
          type: boolean
        enabled:
          type: boolean
        options:
          description: Parâmetros do provider (`max_tokens`, `temperature`, `context_window`).
          type: object
          additionalProperties:
            type: [string, number, boolean]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentProviderCreate:
      type: object
      required: [name, kind, model]
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/AgentProviderKind"
        base_url:
          type: [string, "null"]
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          minLength: 1
          writeOnly: true
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties:
            type: [string, number, boolean]

    AgentProviderPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        base_url:
          type: [string, "null"]
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: [string, "null"]
          writeOnly: true
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties:
            type: [string, number, boolean]

    AgentProviderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentProvider"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [name, is_set, updated_at]
            properties:
              name:
                type: string
              is_set:
                type: boolean
              updated_at:
                type: [string, "null"]
                format: date-time

    SecretPut:
      type: object
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          writeOnly: true

    AdminJobRetried:
      description: O job criado por `POST /api/v1/admin/jobs/{job_id}/retry`.
      type: object
      required: [job_id, recording_id, revision, state, queued_at]
      properties:
        job_id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum: [queued]
        queued_at:
          type: string
          format: date-time
    AdminHealth:
      type: object
      required: [queue, gpu, models_loaded, recent_failures, checked_at]
      properties:
        queue:
          type: object
          required: [queued, running, failed_last_24h]
          properties:
            queued:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            failed_last_24h:
              type: integer
              minimum: 0
        gpu:
          description: "`null` quando o worker não reporta GPU (engine CPU ou remota)."
          oneOf:
            - type: object
              required: [name, vram_total_mb, vram_used_mb, utilization_pct]
              properties:
                name:
                  type: string
                vram_total_mb:
                  type: integer
                  minimum: 0
                vram_used_mb:
                  type: integer
                  minimum: 0
                utilization_pct:
                  type: number
                  minimum: 0
                  maximum: 100
            - type: "null"
        models_loaded:
          type: array
          items:
            type: object
            required: [name, kind, loaded_at, vram_mb]
            properties:
              name:
                type: string
              kind:
                type: string
                enum: [asr, alignment, diarization, embeddings, summarization]
              loaded_at:
                type: string
                format: date-time
              vram_mb:
                type: [integer, "null"]
                minimum: 0
        recent_failures:
          type: array
          items:
            type: object
            required: [job_id, recording_id, stage, code, message, failed_at]
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              stage:
                type: [string, "null"]
              code:
                type: string
              message:
                type: string
              failed_at:
                type: string
                format: date-time
              retryable:
                description: Falha passageira que `POST /api/v1/admin/jobs/{job_id}/retry` pode resolver (1.4.0).
                type: boolean
        checked_at:
          type: string
          format: date-time
        worker:
          description: >-
            Heartbeat do worker GPU (`eclume:gpu:health`, a cada 15 s, TTL 45 s); `null` quando
            nenhum worker publicou nos últimos 45 s.
          oneOf:
            - type: object
              required: [online, last_seen_at, version, engine, busy]
              properties:
                online:
                  type: boolean
                last_seen_at:
                  type: string
                  format: date-time
                version:
                  type: [string, "null"]
                engine:
                  type: [string, "null"]
                device:
                  type: [string, "null"]
                busy:
                  description: Há um job de transcrição rodando no worker.
                  type: boolean
            - type: "null"
        queues:
          description: Profundidade de cada fila arq da instância (só números, sem ids).
          type: array
          items:
            type: object
            required: [name, queued, running]
            properties:
              name:
                type: string
              queued:
                type: integer
                minimum: 0
              running:
                type: integer
                minimum: 0
        running_jobs:
          description: Jobs de transcrição da plataforma ainda não concluídos, com o progresso.
          type: array
          items:
            type: object
            required: [job_id, recording_id, recording_title, state, stage, progress, queued_at, started_at, updated_at]
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              recording_title:
                type: string
              state:
                type: string
                enum: [queued, running]
              stage:
                type: [string, "null"]
              progress:
                type: [number, "null"]
                minimum: 0
                maximum: 1
              queued_at:
                type: string
                format: date-time
              started_at:
                type: [string, "null"]
                format: date-time
              updated_at:
                description: Última escrita do worker no progresso; parado há muito tempo indica worker morto.
                type: [string, "null"]
                format: date-time

