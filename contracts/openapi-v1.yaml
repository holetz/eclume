  /api/v1/people/{person_id}/transcripts:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [people]
      operationId: listPersonTranscripts
      summary: Transcrições em que a pessoa fala
      description: Exige `people:read` e `transcripts:read` num PAT. As falas da pessoa saem de `GET /api/v1/search?person=`.
      security:
        - sessionCookie: []
        - pat: ["people:read", "transcripts:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Transcrições, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
