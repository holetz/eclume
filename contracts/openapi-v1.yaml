        model:
          type: string
        compute_type:
          type: string
        batch_size:
          description: "`null` = adaptativo à VRAM livre."
          type: [integer, "null"]
          minimum: 1
        default_language:
          type: [string, "null"]
        fallback_model:
          description: Modelo usado depois de um OOM.
          type: [string, "null"]
        endpoint_url:
          description: "Base do servidor remoto, com `engine: openai-compatible`."
          type: [string, "null"]
          format: uri

    DiarizationSettings:
      type: object
      required: [enabled, model, min_speakers, max_speakers]
