      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          description: |
            `text`/`choice` → até 300 caracteres; `list` → até 50 itens de até 300 caracteres (64
            nas tags); `null` limpa (menos o título).
          oneOf:
            - type: string
              maxLength: 300
            - type: array
              maxItems: 50
              items:
                type: string
                maxLength: 300
            - type: "null"

