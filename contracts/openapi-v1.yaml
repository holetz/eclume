                  $ref: "#/components/examples/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [people]
      operationId: updatePerson
      summary: Editar uma pessoa
      security:
        - sessionCookie: []
        - pat: ["people:write"]
