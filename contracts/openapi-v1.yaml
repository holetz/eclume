        created_at:
          type: string
          format: date-time

    Voiceprint:
      type: object
      required: [person_id, enabled, sample_count, samples]
      properties:
        person_id:
          type: string
          format: uuid
        enabled:
          description: Identificação por voz ligada na plataforma. Desligada, nada é comparado nem vira amostra.
          type: boolean
        sample_count:
          type: integer
          minimum: 0
        samples:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSample"

    Person:
      type: object
      required: [id, name, email, notes, transcript_count, last_seen_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
        notes:
          type: [string, "null"]
        transcript_count:
          description: Transcrições do usuário em que a pessoa fala.
          type: integer
          minimum: 0
        last_seen_at:
          description: "`recorded_at` da transcrição mais recente em que a pessoa fala."
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: [string, "null"]
          format: email
        notes:
          type: [string, "null"]

    PersonPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: [string, "null"]
          format: email
        notes:
          type: [string, "null"]

    PersonPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        next_cursor:
