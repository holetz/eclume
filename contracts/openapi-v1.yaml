      summary: Remover uma amostra da impressão de voz
      description: |
        Tira da impressão só aquela amostra; o locutor segue ligado à pessoa. As sugestões que a
        impressão já fez não mudam.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removida.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Busca full-text sobre segmentos
      description: |
        Busca em português (`tsvector` pt) nos segmentos das transcrições do usuário.
        Pede `q` ou `person`; com só `person`, lista as falas da pessoa em ordem cronológica.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: q
          in: query
          description: Termos de busca (sintaxe `websearch_to_tsquery`, aceita "frase exata" e -exclusão).
          schema:
            type: string
        - $ref: "#/components/parameters/PersonFilter"
        - name: from
          in: query
          description: "`recorded_at >= from`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "`recorded_at < to`."
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/CollectionFilter"
        - name: field
          in: query
          description: >-
            Valor de um campo do usuário, `<field_id>:<valor>`; repetível, como em
            `GET /api/v1/recordings`: valores do mesmo campo combinam por OU, campos diferentes por E.
            Num campo de lista, basta o valor ser um dos itens; título e tags valem como os embutidos.
          schema:
            type: array
            items:
              type: string
              pattern: "^[0-9a-fA-F-]{36}:.+$"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Trechos encontrados, por relevância.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
              examples:
                turmas:
                  $ref: "#/components/examples/SearchPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/collections:
    get:
      tags: [organize]
      operationId: listCollections
      summary: Coleções do usuário
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Coleções.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionPage"
              examples:
                colecoes:
                  $ref: "#/components/examples/CollectionPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [organize]
      operationId: createCollection
      summary: Criar uma coleção
