openapi: 3.1.0
info:
  title: eclume API
  version: 1.3.0
  summary: Contrato v1 da API do eclume, o serviço de transcrição institucional.
  description: |
    Fonte da verdade entre o servidor do eclume e os seus clientes: o frontend web, o app
    desktop e integrações por PAT, como o importador do lumea.

    **Convenções** (detalhe em `docs/standards/api/contrato-v1.md`):

    - Tudo sob `/api/v1`. Datas em RFC 3339 (UTC), durações em milissegundos, ids em UUID.
    - Listagens paginam por cursor opaco: `?cursor=&limit=`, resposta `{items, next_cursor}`;
      `next_cursor: null` é a última página.
    - Erros em `application/problem+json` (RFC 9457) com o campo estável `code`.
    - **Evolução só aditiva.** O cliente ignora propriedades que não conhece e tolera valores
      de enum novos em respostas. Mudança incompatível vira `/api/v2`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://192.168.15.199:8443
    description: Produção no host GPU (Caddy com `tls internal`).
  - url: http://127.0.0.1:4010
    description: Mock server (Prism) de `deploy/docker-compose.mock.yml`.
security:
  - sessionCookie: []
tags:
  - name: meta
    description: Saúde e versão do contrato.
  - name: auth
    description: Sessão do navegador, usuário corrente e convites.
  - name: tokens
    description: PATs pessoais. Só com sessão.
  - name: uploads
    description: Upload resumível em partes (multipart S3) com deduplicação por hash.
  - name: recordings
    description: Gravações, estado do job e compartilhamento.
  - name: transcripts
    description: Transcrições, export e edição de locutores e segmentos.
  - name: people
    description: Diretório de pessoas da organização.
  - name: voice
    description: >-
      Identificação por voz (LGPD): consentimento, impressão de voz, recusa de sugestão e
      auditoria. Só sessão: um PAT nunca lê nem apaga dado biométrico.
  - name: search
    description: Busca full-text sobre segmentos.
  - name: organize
    description: Coleções e tags.
  - name: groups
    description: Grupos da organização.
  - name: summaries
    description: Templates por usuário e resumos gerados por agente.
  - name: admin
    description: Configuração em runtime, usuários e saúde. Só sessão de `admin`.

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Saúde do serviço e versão do contrato
      security: []
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  $ref: "#/components/examples/Health"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Abrir sessão com e-mail e senha
      description: |
        Define os cookies `eclume_session` (HttpOnly, Secure, SameSite=Lax) e `eclume_csrf`
        (legível pelo JavaScript). Toda requisição mutável autenticada por sessão ecoa o valor
        de `eclume_csrf` no header `X-CSRF-Token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credenciais:
                $ref: "#/components/examples/LoginRequest"
      responses:
        "204":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              description: "`eclume_session` e `eclume_csrf`."
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Encerrar a sessão
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sessão encerrada e cookies removidos.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/invitations/{invitation_token}/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      summary: Aceitar um convite e criar a conta
      security: []
      parameters:
        - name: invitation_token
          in: path
          required: true
          description: Token do link de convite.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "204":
          description: Conta criada e sessão aberta.
          headers:
            Set-Cookie:
              description: "`eclume_session` e `eclume_csrf`."
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário e credencial correntes
      description: Aceita qualquer credencial válida, sem escopo. O lumea usa para mostrar a conta conectada e os escopos do PAT.
      security:
        - sessionCookie: []
        - pat: []
      responses:
        "200":
          description: Usuário corrente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                viaPat:
                  $ref: "#/components/examples/MeViaPat"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: Listar os PATs do usuário
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: PATs, inclusive revogados, do mais novo para o mais antigo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPage"
              examples:
                tokens:
                  $ref: "#/components/examples/TokenPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [tokens]
      operationId: createToken
      summary: Criar um PAT
      description: O segredo (`eclp_...`) volta só nesta resposta; o servidor guarda apenas o hash.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
            examples:
              lumea:
                $ref: "#/components/examples/TokenCreateRequest"
      responses:
        "201":
          description: PAT criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
              examples:
                lumea:
                  $ref: "#/components/examples/TokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revogar um PAT
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Revogado. Usos seguintes recebem 401.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Iniciar um upload (ou deduplicar)
      description: |
        O cliente calcula o `sha256` do arquivo antes de subir. Se o usuário já tem uma gravação
        com o mesmo hash, a resposta é **200** com `status: deduplicated` e o `recording_id`
        existente, e nada é transferido. Caso contrário, **201** com o upload, o `part_size`
        fixado pelo servidor e as URLs das primeiras partes.

        Partes: todas com `part_size` bytes, exceto a última; no máximo 10 000. Cada parte vai
        por `PUT` na `url` da parte, com os `headers` indicados; o `ETag` da resposta é guardado
        para o `complete`. A URL é opaca (MinIO pré-assinado ou o próprio
        `PUT /api/v1/uploads/{upload_id}/parts/{part_number}`) e expira em `expires_at`.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
            examples:
              desktop:
                $ref: "#/components/examples/UploadCreateRequest"
      responses:
        "200":
          description: Deduplicado. Já existe gravação com este hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                deduplicado:
                  $ref: "#/components/examples/UploadDeduplicated"
        "201":
          description: Upload criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                criado:
                  $ref: "#/components/examples/UploadCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Estado do upload, para retomar
      description: "`parts_received` lista as partes que o armazenamento já confirmou; o cliente sobe só as que faltam."
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      responses:
        "200":
          description: Upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                emAndamento:
                  $ref: "#/components/examples/UploadInProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abortar o upload e descartar as partes
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Abortado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads/{upload_id}/part-urls:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: createPartUrls
      summary: Pedir URLs para partes
      description: URLs novas para as partes indicadas, inclusive para substituir URLs expiradas numa retomada.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartUrlsRequest"
            examples:
              faltantes:
                $ref: "#/components/examples/PartUrlsRequest"
      responses:
        "200":
          description: URLs das partes pedidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartUrls"
              examples:
                faltantes:
                  $ref: "#/components/examples/PartUrls"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/uploads/{upload_id}/parts/{part_number}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - name: part_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    put:
      tags: [uploads]
      operationId: putUploadPart
      summary: Enviar uma parte pela API
      description: |
        Variante da URL de parte servida pela própria API, com a mesma semântica do `PUT` num
        URL pré-assinado do S3. O cliente não monta este caminho: usa a `url` que recebeu.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Parte gravada.
          headers:
            ETag:
              description: Identificador da parte, a devolver no `complete`.
              required: true
              schema:
                type: string
                examples: ['"5d41402abc4b2a76b9719d911017c592"']
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Concluir o upload e enfileirar a transcrição
      description: |
        Monta o objeto a partir das partes, cria a gravação e enfileira o job. O servidor confere
        o `sha256` declarado; divergência vira falha do job com `error.code: hash_mismatch`.
        Repetir o `complete` de um upload já concluído devolve a mesma gravação.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadComplete"
            examples:
              partes:
                $ref: "#/components/examples/UploadCompleteRequest"
      responses:
        "201":
          description: Gravação criada, job na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                naFila:
                  $ref: "#/components/examples/RecordingQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      summary: Listar gravações visíveis ao usuário
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Since"
        - name: status
          in: query
          description: Filtra por estado.
          schema:
            $ref: "#/components/schemas/RecordingStatus"
        - name: owner
          in: query
          description: "`me` (padrão): as minhas; `shared`: compartilhadas comigo; `all`: ambas."
          schema:
            type: string
            enum: [me, shared, all]
            default: me
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/CollectionFilter"
      responses:
        "200":
          description: Gravações, da mais recente para a mais antiga.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPage"
              examples:
                biblioteca:
                  $ref: "#/components/examples/RecordingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/recordings/{recording_id}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: getRecording
      summary: Gravação e estado do job
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Gravação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                transcrita:
                  $ref: "#/components/examples/RecordingTranscribed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [recordings]
      operationId: updateRecording
      summary: Editar metadados da gravação
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingPatch"
            examples:
              organizar:
                $ref: "#/components/examples/RecordingPatchRequest"
      responses:
        "200":
          description: Gravação atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [recordings]
      operationId: deleteRecording
      summary: Excluir a gravação, o áudio e a transcrição
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Excluída.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/audio:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: getRecordingAudio
      summary: Áudio da gravação (redirecionamento)
      description: Redireciona para uma URL temporária do áudio, que aceita `Range` para o player.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "302":
          description: Redirecionamento para o áudio.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/retranscribe:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: retranscribeRecording
      summary: Transcrever de novo com a configuração atual
      description: A transcrição mantém o id e sobe de `revision`; os vínculos de locutor a pessoa são refeitos pela nova diarização.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetranscribeRequest"
      responses:
        "202":
          description: Job na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/shares:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: listShares
      summary: Compartilhamentos da gravação
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Compartilhamentos. Vazio = gravação privada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharePage"
              examples:
                comGrupo:
                  $ref: "#/components/examples/SharePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [recordings]
      operationId: createShare
      summary: Compartilhar com um grupo ou com a organização
      description: Só o dono compartilha. O compartilhamento dá leitura da gravação, da transcrição e dos resumos.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareCreate"
            examples:
              grupo:
                $ref: "#/components/examples/ShareCreateRequest"
      responses:
        "201":
          description: Compartilhado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/shares/{share_id}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
      - $ref: "#/components/parameters/ShareId"
    delete:
      tags: [recordings]
      operationId: deleteShare
      summary: Desfazer um compartilhamento
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Desfeito.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts:
    get:
      tags: [transcripts]
      operationId: listTranscripts
      summary: Listar transcrições (incremental)
      description: |
        Transcrições concluídas visíveis ao usuário, em ordem crescente de `(updated_at, id)`.
        `since` é inclusivo (`updated_at >= since`): o cliente guarda o maior `updated_at` que
        viu e deduplica por `id` + `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/PersonFilter"
        - name: recording_id
          in: query
          description: Transcrição de uma gravação específica.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transcrições.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPage"
              examples:
                incremental:
                  $ref: "#/components/examples/TranscriptPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [transcripts]
      operationId: getTranscript
      summary: Transcrição completa
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: include
          in: query
          description: "`words` inclui as palavras com tempo em cada segmento."
          schema:
            type: string
            enum: [words]
      responses:
        "200":
          description: Transcrição, no schema de `contracts/transcript.schema.json`.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json"
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/export:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [transcripts]
      operationId: exportTranscript
      summary: Exportar a transcrição
      description: |
        `md`: frontmatter YAML (`id`, `title`, `recorded_at`, `language`, `duration_ms`,
        `source`, `revision`, `speakers`) e uma linha por segmento, `**Nome** [HH:MM:SS]: texto`,
        separadas por linha em branco. O nome é o da pessoa ligada ou, sem pessoa, o `label`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: format
          in: query
          required: true
          description: Formato do export. Formatos novos entram de forma aditiva.
          schema:
            type: string
            enum: [md]
      responses:
        "200":
          description: Arquivo exportado.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="alinhamento-do-programa-de-liderancas.md"']
          content:
            text/markdown:
              schema:
                type: string
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakersMarkdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/speakers/{speaker_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: speaker_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
    patch:
      tags: [transcripts]
      operationId: updateSpeaker
      summary: Renomear o locutor ou ligá-lo a uma pessoa
      description: |
        `person_id` liga o locutor a uma pessoa (confirmando, se for o caso, uma sugestão por
        voz); `null` desfaz o vínculo. Ligar uma pessoa sem mandar `label` passa o `label` para
        o nome da pessoa. Sobe a `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerPatch"
            examples:
              ligarPessoa:
                $ref: "#/components/examples/SpeakerPatchRequest"
      responses:
        "200":
          description: Locutor atualizado.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                ligado:
                  $ref: "#/components/examples/SpeakerLinked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/speakers/{speaker_id}/suggestions/{person_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: speaker_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
      - $ref: "#/components/parameters/PersonId"
    delete:
      tags: [voice]
      operationId: rejectSpeakerSuggestion
      summary: Recusar uma sugestão por voz
      description: |
        A pessoa deixa de ser sugerida para este locutor e nunca volta a ser, nem numa
        comparação futura da mesma transcrição. Só o dono da gravação. Sobe a `revision`.
        Aceitar é o `PATCH` do locutor com `person_id`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Locutor sem a sugestão recusada.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                recusada:
                  $ref: "#/components/examples/SpeakerSuggestionRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

