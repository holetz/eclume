components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: |
        Sessão do navegador, aberta por `POST /api/v1/auth/login`. Tem todas as permissões do
        usuário. Métodos mutáveis exigem `X-CSRF-Token` igual ao cookie `eclume_csrf`
        (double-submit). Gestão de PATs, escrita de grupos e `/api/v1/admin/*` aceitam **só**
        sessão; `/api/v1/admin/*` exige ainda o papel `admin`.
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<segredo>
      description: |
        PAT pessoal: `Authorization: Bearer eclp_<segredo>`. Age como o usuário dono, limitado
        aos escopos concedidos. Os escopos exigidos por operação estão no requisito de segurança
        (`pat: [escopo, ...]`, todos obrigatórios). Nenhum escopo implica outro. Faltando
        escopo, a resposta é 403 com `code: insufficient_scope` e `required_scopes`.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Obrigatório com sessão (valor do cookie `eclume_csrf`); ignorado com PAT.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: Só itens com `updated_at >= since` (inclusivo).
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Id de pessoa; só transcrições (ou trechos) em que um locutor está ligado a ela.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Só gravações com esta tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Só gravações desta coleção.
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShareId:
      name: share_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: group_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Sem credencial, ou credencial inválida, expirada ou revogada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ['Bearer realm="eclume"']
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semCredencial:
              $ref: "#/components/examples/ProblemUnauthorized"
    Forbidden:
      description: Credencial válida sem permissão (escopo, papel ou dono).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semEscopo:
              $ref: "#/components/examples/ProblemInsufficientScope"
    NotFound:
      description: Não existe ou não é visível ao usuário (o eclume não distingue os dois).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            naoEncontrado:
              $ref: "#/components/examples/ProblemNotFound"
    ValidationFailed:
      description: Corpo ou parâmetros inválidos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalido:
              $ref: "#/components/examples/ProblemValidation"
    Conflict:
      description: O estado atual impede a operação (upload já concluído, nome duplicado, job em andamento).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: Erro RFC 9457. O cliente decide por `code`, nunca por `title`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: |
            Código estável. Valores v1: `unauthorized`, `insufficient_scope`, `forbidden`,
            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,
            `rate_limited`. Códigos novos entram de forma aditiva.
          type: string
        required_scopes:
          description: Com `insufficient_scope`, os escopos que faltaram.
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        errors:
          description: Com `validation_failed`, um item por campo inválido.
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                description: Caminho do campo (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string

    Scope:
      description: Escopo de PAT.
      type: string
      enum:
        - recordings:read
        - recordings:write
        - transcripts:read
        - transcripts:write
        - people:read
        - people:write
        - summaries:read
        - summaries:write

    Health:
      type: object
      required: [status, version, contract_version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa (`info.version`).
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true

    InvitationAccept:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 12
          writeOnly: true

    Organization:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    User:
      type: object
      required: [id, email, name, role, active, created_at, last_login_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, member]
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    UserPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
          enum: [admin, member]
        active:
          type: boolean

    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Me:
      type: object
      required: [user, organization, groups, auth]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupRef"
        auth:
          type: object
          required: [method, scopes, token_id]
          properties:
            method:
              type: string
              enum: [session, pat]
            scopes:
              description: Com sessão, todos os escopos.
              type: array
              items:
                $ref: "#/components/schemas/Scope"
            token_id:
              description: Id do PAT em uso, ou `null` com sessão.
              type: [string, "null"]
              format: uuid

    NextCursor:
      description: Cursor da próxima página, ou `null` na última.
      type: [string, "null"]

    Token:
      type: object
      required: [id, name, scopes, prefix, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        prefix:
          description: Começo do segredo, para reconhecer o token (`eclp_7Hq2`).
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          description: Sem valor, o PAT não expira.
          type: [string, "null"]
          format: date-time

    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          description: O PAT completo. Não é mostrado de novo.
          type: string
          pattern: "^eclp_[A-Za-z0-9]{32,}$"

    TokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Source:
      description: Origem do áudio.
      type: string
      enum: [desktop, upload, api]

    Capture:
      description: Contexto da captura, preenchido pelo app desktop.
      type: object
      properties:
        meeting_app:
          description: App de reunião detectado.
          type: [string, "null"]
          enum: [teams, meet, zoom, other, null]
        device_name:
          type: [string, "null"]
        client_version:
          description: Versão do app que gravou (`eclume-desktop/0.3.0`).
          type: [string, "null"]

    RecordingMetadata:
      description: Metadados livres de organização (tipo de reunião, cliente, projeto).
      type: object
      additionalProperties:
        type: string

    UploadCreate:
      type: object
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: "Tipo do arquivo, com parâmetros opcionais (`audio/ogg; codecs=opus`, a saída do navegador; `audio/webm`; `video/mp4`)."
          type: string
          pattern: "^(audio|video)/[A-Za-z0-9.+-]+(\\s*;.*)?$"
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          description: SHA-256 do arquivo inteiro, em hex minúsculo.
          type: string
          pattern: "^[0-9a-f]{64}$"
        title:
          description: Sem valor, deriva do nome do arquivo.
          type: string
          minLength: 1
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        language:
          description: Idioma esperado (BCP 47). Sem valor, vale o padrão da organização ou a detecção.
          type: string
          pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"
        source:
          $ref: "#/components/schemas/Source"
        capture:
          $ref: "#/components/schemas/Capture"
        tags:
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"

    UploadStatus:
      type: string
      enum: [in_progress, completed, aborted, expired, deduplicated]

    PartUrl:
      type: object
      required: [part_number, method, url, headers, expires_at]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum: [PUT]
        url:
          description: URL opaca da parte.
          type: string
          format: uri
        headers:
          description: Headers que o `PUT` deve levar.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    ReceivedPart:
      type: object
      required: [part_number, etag, size_bytes]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
        size_bytes:
          type: integer
          minimum: 1

    Upload:
      type: object
      required: [id, status, filename, content_type, size_bytes, sha256, part_size, part_count, parts_received, parts, recording_id, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadStatus"
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        part_size:
          description: Tamanho de toda parte menos a última, em bytes (mínimo 5 MiB).
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        parts_received:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedPart"
        parts:
          description: URLs já emitidas para partes pendentes; pode vir parcial ou vazio.
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"
        recording_id:
          description: Gravação criada pelo `complete`, ou a existente num `deduplicated`.
          type: [string, "null"]
          format: uuid
        expires_at:
          description: Depois disso o upload inacabado é descartado (`upload_expired`).
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PartUrlsRequest:
      type: object
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PartUrls:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"

    UploadComplete:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string

    RecordingStatus:
      description: "`uploading` → `queued` → `processing` → `transcribed` | `failed`."
      type: string
      enum: [uploading, queued, processing, transcribed, failed]

    Job:
      description: Job de transcrição mais recente da gravação.
      type: object
      required: [id, state, stage, progress, attempts, error, queued_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        stage:
          description: Etapa em curso, ou `null` fora de execução.
          type: [string, "null"]
          enum: [asr, alignment, diarization, embeddings, finalizing, null]
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  description: "`hash_mismatch`, `unsupported_media`, `gpu_oom`, `engine_error`..."
                  type: string
                message:
                  type: string
            - type: "null"
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    Recording:
      type: object
      required: [id, title, status, source, recorded_at, duration_ms, language, size_bytes, content_type, content_hash, owner, visibility, tags, collection_ids, metadata, capture, job, transcript_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatus"
        source:
          $ref: "#/components/schemas/Source"
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          description: "`null` até o áudio ser lido."
          type: [integer, "null"]
          minimum: 0
        language:
          description: Idioma pedido ou detectado.
          type: [string, "null"]
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          $ref: "./transcript.schema.json#/$defs/UserRef"
        visibility:
          description: "`private` sem compartilhamento; `shared` com pelo menos um."
          type: string
          enum: [private, shared]
        tags:
          type: array
          items:
            type: string
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"
        capture:
          oneOf:
            - $ref: "#/components/schemas/Capture"
            - type: "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        transcript_id:
          description: Transcrição, depois do primeiro job concluído.
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecordingPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        recorded_at:
          type: string
          format: date-time
        language:
          type: string
          pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"
        tags:
          description: Substitui a lista inteira.
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          description: Substitui a lista inteira.
          type: array
          items:
            type: string
            format: uuid
        metadata:
          description: Substitui o objeto inteiro.
          $ref: "#/components/schemas/RecordingMetadata"

    RecordingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    RetranscribeRequest:
      type: object
      properties:
        language:
          type: string
          pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"

    Share:
      type: object
      required: [id, target, permission, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        target:
          type: object
          required: [type, id, name]
          properties:
            type:
              type: string
              enum: [group, organization]
            id:
              type: string
              format: uuid
            name:
              type: string
        permission:
          type: string
          enum: [read]
        created_by:
          $ref: "./transcript.schema.json#/$defs/UserRef"
        created_at:
          type: string
          format: date-time

    ShareCreate:
      type: object
      required: [target_type]
      properties:
        target_type:
          type: string
          enum: [group, organization]
        target_id:
          description: Id do grupo; ignorado para `organization`.
          type: string
          format: uuid

    SharePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Share"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    TranscriptSummary:
      description: Resumo de listagem de uma transcrição (sem segmentos).
      type: object
      required: [id, recording_id, title, language, recorded_at, duration_ms, source, content_hash, revision, created_at, updated_at, owner, speakers]
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        title:
          type: string
        language:
          type: string
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/Source"
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner:
          $ref: "./transcript.schema.json#/$defs/UserRef"
        speakers:
          type: array
          items:
            $ref: "./transcript.schema.json#/$defs/Speaker"
        tags:
          type: array
          items:
            type: string

    TranscriptPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SpeakerPatch:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        person_id:
          description: Pessoa a ligar, ou `null` para desfazer.
          type: [string, "null"]
          format: uuid

    SpeakerMerge:
      type: object
      required: [source_speaker_ids, target_speaker_id]
      properties:
        source_speaker_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^S[0-9]+$"
        target_speaker_id:
          type: string
          pattern: "^S[0-9]+$"

    SegmentPatch:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
        speaker_id:
          type: string
          pattern: "^S[0-9]+$"

    VoiceConsent:
      description: Consentimento LGPD da pessoa para a impressão de voz. Sem `granted`, nada é comparado.
      type: object
      required: [status, updated_at]
      properties:
        status:
          type: string
          enum: [none, granted, revoked]
        updated_at:
          type: [string, "null"]
          format: date-time
        term_version:
          description: Versão do termo de consentimento vigente quando o estado foi registrado.
          type: [string, "null"]
        recorded_by:
          description: Quem registrou o estado atual.
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        sample_count:
          description: Amostras (locutores confirmados) na impressão de voz da pessoa.
          type: integer
          minimum: 0

    VoiceConsentPut:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [granted, revoked]
        notes:
          description: Como o consentimento foi colhido (documento assinado, e-mail, ata).
          type: [string, "null"]
          maxLength: 2000

    VoiceConsentRecord:
      description: Um registro do histórico de consentimento, com o termo exato em vigor.
      type: object
      required: [status, term_version, term_text, notes, recorded_by, recorded_at]
      properties:
        status:
          type: string
          enum: [granted, revoked]
        term_version:
          type: string
        term_text:
          type: string
        notes:
          type: [string, "null"]
        recorded_by:
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        recorded_at:
          type: string
          format: date-time

    VoiceSample:
      description: Uma amostra da impressão de voz — um locutor confirmado como a pessoa.
      type: object
      required: [transcript_id, recording_title, speaker_id, model, talk_ms, created_by, created_at]
      properties:
        transcript_id:
          type: string
          format: uuid
        recording_title:
          description: Título da gravação, ou `null` se quem pergunta não a vê.
          type: [string, "null"]
        speaker_id:
          type: string
          pattern: "^S[0-9]+$"
        model:
          description: Modelo de embedding da amostra.
          type: string
        talk_ms:
          type: integer
          minimum: 0
        created_by:
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        created_at:
          type: string
          format: date-time

    VoiceSampleExport:
      description: Amostra com o vetor, só na exportação.
      type: object
      required: [transcript_id, recording_title, speaker_id, model, talk_ms, created_by, created_at, embedding]
      properties:
        transcript_id:
          type: string
          format: uuid
        recording_title:
          type: [string, "null"]
        speaker_id:
          type: string
        model:
          type: string
        talk_ms:
          type: integer
          minimum: 0
        created_by:
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        created_at:
          type: string
          format: date-time
        embedding:
          type: array
          items:
            type: number

    Voiceprint:
      type: object
      required: [person_id, consent, opt_in, term, sample_count, samples]
      properties:
        person_id:
          type: string
          format: uuid
        opt_in:
          description: Opt-in de identificação por voz da organização. Desligado, nada é comparado nem vira amostra.
          type: boolean
        term:
          description: Termo de consentimento em vigor na organização, o que a pessoa aceita ao consentir.
          type: object
          required: [version, text]
          properties:
            version:
              type: string
            text:
              type: string
        consent:
          $ref: "#/components/schemas/VoiceConsent"
        sample_count:
          type: integer
          minimum: 0
        samples:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSample"

    VoiceAuditEvent:
      type: object
      required: [id, event, person, actor, transcript_id, speaker_id, score, details, created_at]
      properties:
        id:
          type: string
          format: uuid
        event:
          description: Tipo do evento; o cliente mostra cru um valor que não conhece.
          type: string
          enum:
            - comparison
            - suggested
            - accepted
            - rejected
            - sample_added
            - sample_removed
            - link_restored
            - link_dropped
            - consent_granted
            - consent_revoked
            - voiceprint_deleted
            - exported
            - org_opt_in_changed
            - org_purged
        person:
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/PersonRef"
            - type: "null"
        actor:
          description: Quem agiu; `null` numa ação do sistema (a comparação da ingestão).
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        transcript_id:
          type: [string, "null"]
          format: uuid
        speaker_id:
          type: [string, "null"]
        score:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        details:
          description: Dados do evento (contagens, limiar, modelo); nunca vetores.
          type: object
        created_at:
          type: string
          format: date-time

    VoiceAuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VoiceAuditEvent"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    VoiceprintExport:
      type: object
      required: [exported_at, exported_by, person, consents, samples, audit]
      properties:
        exported_at:
          type: string
          format: date-time
        exported_by:
          $ref: "./transcript.schema.json#/$defs/UserRef"
