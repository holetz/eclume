      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/search:
    get:
      tags: [search]
      operationId: search
      summary: Full-text search over segments
      description: |
        Portuguese search (`tsvector` pt) over the segments of the user's transcripts.
        Takes `q` or `person`; with only `person`, it lists the person's utterances in chronological order.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: q
          in: query
          description: Search terms (`websearch_to_tsquery` syntax, accepts "exact phrase" and -exclusion).
          schema:
            type: string
        - $ref: "#/components/parameters/PersonFilter"
        - name: from
          in: query
          description: "`recorded_at >= from`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "`recorded_at < to`."
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/CollectionFilter"
        - name: field
          in: query
          description: >-
            Value of a user field, `<field_id>:<value>`; repeatable, as in
            `GET /api/v1/recordings`: values of the same field combine with OR, different fields with AND.
            On a list field, the value need only be one of the items; title and tags work like the built-in ones.
          schema:
            type: array
            items:
              type: string
              pattern: "^[0-9a-fA-F-]{36}:.+$"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Passages found, by relevance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
              examples:
                turmas:
                  $ref: "#/components/examples/SearchPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

