openapi: 3.1.0
info:
  title: eclume API
  version: 2.29.0
  summary: Contract v1 of the eclume API, the institutional transcription service.
  description: |
    Source of truth between the eclume server and its clients: the web frontend, the desktop
    app and PAT integrations, such as the lumea importer.

    **Conventions** (detail in `docs/standards/api/contrato-v1.md`):

    - Everything under `/api/v1`. Dates in RFC 3339 (UTC), durations in milliseconds, ids in UUID.
    - Listings paginate by opaque cursor: `?cursor=&limit=`, response `{items, next_cursor}`;
      `next_cursor: null` is the last page.
    - Errors in `application/problem+json` (RFC 9457) with the stable `code` field. Since 2.14.0,
      any operation may answer 500 `internal_error` (unexpected failure; the detail stays in the
      server log) and any operation with a body, 413 `payload_too_large` (body above the route's
      ceiling: 64 KiB on the public credential routes `/auth/*`, `/admin/auth/*` and `/devices/*`,
      the part's bytes on the part `PUT`, 1 MiB everywhere else and on `/mcp`), also without
      `Content-Length`.
    - **Per-account quotas** (since 2.15.0): storage, size per file, open uploads, audio
      minutes and agent requests in 24 h (`GET /me/usage`). Once a quota is exceeded, 403
      `quota_exceeded` with `quota`, `limit` and `used`; audio minutes never refuse: the
      recording waits in the queue until the window opens.
    - **Required speaker naming** (since 2.22.0): with `GET`/`PATCH /me/speaker-naming` on,
      the `speakers` step stays `waiting` while some speaker has no person, and the chain (type,
      fields, collections, summary) waits; `Recording.awaiting` and the `awaiting=speakers`
      filter show those recordings.
    - **Agent** (since 2.23.0): conversations stored in `/agent/sessions`, with input
      attachments and generated files to download; the chat over the base (`/base-chat`) is
      deprecated.
    - **Queue wait** (since 2.16.0): while the job is `queued`, `Job.queue` says why it waits
      (processor queue, the account's own turn or minutes window), the position, a forecast
      labelled as an estimate and whether the processor is up.
    - Each user has their own isolated account; there is no organization. The admin panel uses
      its own account and session (`adminSessionCookie`), which only reach `/api/v1/admin/*`.
    - **Additive-only evolution.** The client ignores properties it does not know and tolerates
      new enum values in responses. 2.0.0 is the only break under `/api/v1` (end of the
      organization); the next incompatible change becomes `/api/v2`.
    - **MCP server at `/mcp`** (outside `/api/v1`, outside this document): stateless streamable
      HTTP Model Context Protocol, with JSON responses. It accepts only
      `Authorization: Bearer eclp_…` (personal or device PAT); each tool requires the scopes of
      the equivalent operation of this API, and a scope refusal comes back as a tool error that
      names the scope. Without a valid credential, 401 `unauthorized`. Detail in
      `docs/standards/code/server-mcp-e-dispositivos.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://192.168.15.199:8443
    description: Production on the GPU host (Caddy with `tls internal`).
  - url: http://127.0.0.1:4010
    description: Mock server (Prism) of `deploy/docker-compose.mock.yml`.
security:
  - sessionCookie: []
tags:
  - name: meta
    description: Health and contract version.
  - name: auth
    description: Browser session, sign-up with the consent notice and current user.
  - name: tokens
    description: Personal PATs and device credentials. Session only.
  - name: devices
    description: >-
      Linking the desktop and the phone: login by e-mail and password or by pairing code,
      which issue a device credential (a `kind: device` token).
  - name: uploads
    description: Resumable multipart upload (S3 multipart) with hash deduplication.
  - name: recordings
    description: Recordings and job state.
  - name: transcripts
    description: Transcripts, export and editing of speakers and segments.
  - name: people
    description: The user's people directory.
  - name: voice
    description: >-
      Voice identification (LGPD): voiceprint, suggestion refusal and automatic speaker assignment. Session only: a PAT
      never reads nor deletes biometric data.
  - name: search
    description: Full-text search over segments.
  - name: organize
    description: Collections and tags.
  - name: agenda-types
    description: >-
      The user's agenda types: how to recognize the recording, the title and tags it gets and
      the summary instructions.
  - name: fields
    description: >-
      The user's fields (built-in title and tags, plus their own) and the rules the agent fills
      them with.
  - name: previews
    description: Result of testing the rule of a field or an agenda type in draft.
  - name: summaries
    description: Summaries generated by an agent with the instructions of an agenda type.
  - name: base-chat
    description: >-
      Natural-language questions about the whole set of the user's recordings. Deprecated since
      2.23.0: the Agent (`agent`) does the same with stored conversations and files.
  - name: agent
    description: >-
      The Agent: per-user stored conversations, input attachments (extracted text) and files the
      agent generates to download. Since 2.24.0, the person's skills (reusable instructions)
      and the actions on the environment, which the agent only proposes and the person confirms.
  - name: admin
    description: >-
      Admin account, platform settings and secrets, users and health. Admin session only
      (`adminSessionCookie`); no user credential reaches these routes.

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Service health and contract version
      security: []
      responses:
        "200":
          description: Service up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  $ref: "#/components/examples/Health"

  /api/v1/health/ready:
    get:
      tags: [meta]
      operationId: getHealthReady
      summary: Readiness — Postgres, Redis and MinIO answer
      description: |
        Since 2.13.0. Runs the Postgres, Redis and storage probes in parallel, with a ceiling of
        2 s each. Public: returns only the name and `ok`/`down` of each, with no latency nor error
        message. `/api/v1/health` stays static, as a liveness signal.
      security: []
      responses:
        "200":
          description: All dependencies answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
              examples:
                pronto:
                  $ref: "#/components/examples/HealthReady"
        "503":
          description: Some dependency did not answer within 2 s; `checks` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Open a session with e-mail and password
      description: |
        Sets the `eclume_session` (HttpOnly, Secure, SameSite=Lax) and `eclume_csrf` cookies
        (readable by JavaScript). Every mutating request authenticated by session echoes the value
        of `eclume_csrf` in the `X-CSRF-Token` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credenciais:
                $ref: "#/components/examples/LoginRequest"
      responses:
        "204":
          description: Session opened.
          headers:
            Set-Cookie:
              description: "`eclume_session` and `eclume_csrf`."
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Close the session
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session closed and cookies removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/signup:
    get:
      tags: [auth]
      operationId: getSignupInfo
      summary: Sign-up state and the notice in force
      description: Says whether sign-up is open and returns the text and version of the notice the new account accepts.
      security: []
      responses:
        "200":
          description: Sign-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupInfo"
              examples:
                aberto:
                  $ref: "#/components/examples/SignupInfo"
    post:
      tags: [auth]
      operationId: signup
      summary: Create an account and open the session
      description: |
        Open sign-up, with no invitation and no e-mail confirmation. Requires accepting the notice
        in force (`notice_version` equal to the version of `GET /api/v1/auth/signup`). The account
        is born with the default agenda types, and the response sets the session cookies, like
        login. With sign-up closed (`ECLUME_SIGNUP_OPEN=false`), 403 `signup_closed`; e-mail
        already registered, 409 `email_taken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              conta:
                $ref: "#/components/examples/SignupRequest"
      responses:
        "204":
          description: Account created and session opened.
          headers:
            Set-Cookie:
              description: "`eclume_session` and `eclume_csrf`."
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user and credential
      description: Accepts any valid credential, with no scope. lumea uses it to show the connected account and the PAT's scopes.
      security:
        - sessionCookie: []
        - pat: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                viaPat:
                  $ref: "#/components/examples/MeViaPat"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/usage:
    get:
      tags: [auth]
      operationId: getMyUsage
      summary: Account usage and quotas
      description: |
        Since 2.15.0. The account's current usage and the effective quota (the admin's per-account
        override over the platform default; `null` is unlimited). Audio minutes and agent
        requests count in a rolling 24 h window. Accepts any valid credential, with no scope.
      security:
        - sessionCookie: []
        - pat: []
      responses:
        "200":
          description: Usage and quotas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
              examples:
                conta:
                  $ref: "#/components/examples/MeUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change one's own password
      description: |
        Checks the current password (wrong: 422 on `current_password`) and stores the new one, which
        follows the sign-up rule (too short: 422 on `new_password`). The account's other sessions
        end and this one continues. With `revoke_tokens: true` (since 2.14.0), the account's device
        credentials and PATs are also revoked; absent or `false`, they stay valid. Only through the
        user's session, with the credentials' attempt limit.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Password changed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me/delete:
    post:
      tags: [auth]
      operationId: deleteAccount
      summary: Delete one's own account
      description: |
        Checks the password (wrong: 422 on `password`) and deletes the account with everything it
        owns: recordings and audio, transcripts, summaries, people and voiceprints, collections,
        tags, fields, agenda types, tokens and devices. It cannot be undone. The response clears
        the session cookies. Only through the user's session, with the credentials' attempt limit.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletion"
      responses:
        "204":
          description: Account deleted; the session ended.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me/notice:
    post:
      tags: [auth]
      operationId: acceptNotice
      summary: Accept the consent notice in force
      description: >-
        Records the current account's acceptance of the notice, which clears `notice_required` in
        `GET /api/v1/me`. A version other than the one in force is 422. Session only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeAccept"
            examples:
              aceite:
                $ref: "#/components/examples/NoticeAcceptRequest"
      responses:
        "204":
          description: Acceptance recorded.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/voice-assignment:
    get:
      tags: [voice]
      operationId: getVoiceAssignment
      summary: Read the account's automatic speaker assignment
      description: >-
        The account's preference: link the speaker to the person by voice on its own, and the
        minimum score for that. `platform_enabled` is the platform's on/off switch
        (`voice_identification.enabled`): when off, the preference has no effect. Session only.
      responses:
        "200":
          description: Current preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAssignment"
              examples:
                padrao:
                  $ref: "#/components/examples/VoiceAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [voice]
      operationId: updateVoiceAssignment
      summary: Change the account's automatic speaker assignment
      description: >-
        The fields sent change and the others stay. It applies to the next transcriptions: the
        links that already exist do not change. Session only. `threshold` outside 0.50 to 0.99 is
        422; the default is 0.75. Since 2.19.0, `keep_samples: false` immediately deletes the
        account's samples, per-recording vectors and pending suggestions.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceAssignmentPatch"
            examples:
              limiar:
                $ref: "#/components/examples/VoiceAssignmentPatchRequest"
      responses:
        "200":
          description: Resulting preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAssignment"
              examples:
                padrao:
                  $ref: "#/components/examples/VoiceAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/transcription:
    get:
      tags: [recordings]
      operationId: getTranscriptionPreference
      summary: Read the account's preferred transcription language
      description: >-
        Since 2.20.0. The account's preferred language (`null` is the server default) and the
        server default (`platform_default`), so clients can name the actual language. A job's
        language comes, in this order, from: the file, the account, the server, `pt`. Session or
        PAT with `recordings:read`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Current preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPreference"
              examples:
                conta:
                  $ref: "#/components/examples/TranscriptionPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [recordings]
      operationId: updateTranscriptionPreference
      summary: Change the account's preferred transcription language
      description: >-
        Since 2.20.0. `language` is a language, `auto` (the engine detects) or `null` (back to the
        server default). It applies to the next jobs; the ones already queued do not change.
        Session only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionPreferencePatch"
            examples:
              ingles:
                $ref: "#/components/examples/TranscriptionPreferencePatchRequest"
      responses:
        "200":
          description: Resulting preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPreference"
              examples:
                conta:
                  $ref: "#/components/examples/TranscriptionPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/audio-retention:
    get:
      tags: [recordings]
      operationId: getAudioRetention
      summary: Read the account's audio retention
      description: >-
        Since 2.29.0. `days` is how long the audio of the account's recordings stays on the server
        (`null` is off, the default); `max_days` is the ceiling set by the admin (`null` is none);
        `effective_days` is the window in force (`days` capped by `max_days`, `null` when `days`
        is off). Session or PAT with `recordings:read`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Current retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioRetention"
              examples:
                conta:
                  $ref: "#/components/examples/AudioRetention"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [recordings]
      operationId: updateAudioRetention
      summary: Set the account's audio retention
      description: >-
        Since 2.29.0. `days` from 1 to 3650, or `null` to turn retention off. A daily job deletes
        the audio of every recording of the account older than the effective window; the
        transcript, summary and chat stay. Deleting is irreversible, and backups age out through
        the restic rotation. A value above the ceiling is stored as sent and capped on read.
        Session only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioRetentionPatch"
            examples:
              trinta:
                $ref: "#/components/examples/AudioRetentionPatchRequest"
      responses:
        "200":
          description: Resulting retention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioRetention"
              examples:
                conta:
                  $ref: "#/components/examples/AudioRetention"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/speaker-naming:
    get:
      tags: [recordings]
      operationId: getSpeakerNaming
      summary: Read whether the account requires naming the speakers
      description: >-
        Since 2.22.0. `required` says whether the agent chain waits for every speaker (with at
        least 10 s of speech) to have a person; `waiting_count` counts the recordings stopped
        waiting for that. Session or PAT with `recordings:read`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Current preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerNamingPreference"
              examples:
                ligada:
                  $ref: "#/components/examples/SpeakerNamingPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [recordings]
      operationId: updateSpeakerNaming
      summary: Turn required speaker naming on or off
      description: >-
        Since 2.22.0. Turning it on applies to the next transcriptions. Turning it off releases
        every stopped recording of the account (`speakers` step `skipped` with `reason`
        `naming_not_required`) and the chain goes on. Session only.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerNamingPatch"
            examples:
              ligar:
                $ref: "#/components/examples/SpeakerNamingPatchRequest"
      responses:
        "200":
          description: Resulting preference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerNamingPreference"
              examples:
                ligada:
                  $ref: "#/components/examples/SpeakerNamingPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/tag-assignment:
    get:
      tags: [organize]
      operationId: getTagAssignment
      summary: How the agent assigns tags
      description: |
        The automatic switch and the rule of the built-in Tags field, the mode (`fixed`: only the
        registered tags; `auto`: the agent may create up to `new_limit` new tags per recording,
        always preferring to reuse, while the catalog has fewer than `catalog_limit`) and the
        catalog size. Only through the user's session.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAssignment"
              examples:
                fixas:
                  $ref: "#/components/examples/TagAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [organize]
      operationId: updateTagAssignment
      summary: Change how the agent assigns tags
      description: The fields sent change, the others stay; it applies to the next transcriptions.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagAssignmentPatch"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List the user's tokens
      description: >-
        Personal PATs and device credentials. `?kind=device` is the list of "App móvel" and
        "App desktop"; `?kind=personal`, the one of "Tokens de acesso".
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          description: Only the tokens of this kind.
          schema:
            $ref: "#/components/schemas/TokenKind"
      responses:
        "200":
          description: Tokens, revoked ones included, from newest to oldest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPage"
              examples:
                tokens:
                  $ref: "#/components/examples/TokenPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a PAT
      description: >-
        The secret (`eclp_...`) comes back only in this response; the server keeps only the hash.
        It always creates `kind: personal`: a device credential is only born from
        `POST /devices/login` or `POST /devices/pair`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
            examples:
              lumea:
                $ref: "#/components/examples/TokenCreateRequest"
      responses:
        "201":
          description: PAT created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
              examples:
                lumea:
                  $ref: "#/components/examples/TokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke a token
      description: Applies to a PAT and to a device credential ("Desvincular" turns the device off).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Revoked. Later uses get 401.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/server:
    get:
      tags: [meta]
      operationId: getServerInfo
      summary: Public server descriptor
      description: |
        Name, address, MCP address, root CA fingerprint and versions. It is the source of the mDNS
        announcement, the QR link, pairing and the address embedded in the installer: the app
        confirms here what it received and pins the CA by its fingerprint (`ca_sha256`).
      security: []
      responses:
        "200":
          description: Descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
              examples:
                producao:
                  $ref: "#/components/examples/ServerInfo"

  /api/v1/privacy:
    get:
      tags: [meta]
      operationId: getPrivacyInfo
      summary: Where each piece of data goes, per the settings in force
      description: |
        Since 2.19.0. Says, for transcription and for each agent purpose, whether the data is
        processed on this server, on the local network or outside it, with the name of who
        processes it when it leaves. Public like `GET /server`, because whoever signs up needs to
        know before accepting the notice; it never returns the address, model, key nor the name
        the admin gave the provider. The settings change at runtime: the client does not keep the
        response indefinitely. The audio and the transcript are always stored on this server.
      security: []
      responses:
        "200":
          description: Destinations in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyInfo"
              examples:
                agente_externo:
                  $ref: "#/components/examples/PrivacyInfo"

  /api/v1/auth/password-reset/check:
    post:
      tags: [auth]
      operationId: checkPasswordReset
      summary: Check a password reset link
      description: |
        Since 2.18.0. The `/redefinir-senha` page reads the secret from the URL fragment and sends
        it in the body; the response gives the account's e-mail and until when the link is valid,
        without consuming the link. A link that does not exist, expired, was already used, was
        superseded by a newer one or belongs to a deactivated account, 401 `invalid_reset_link`;
        too many attempts from the same IP, 429 `rate_limited` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCheck"
      responses:
        "200":
          description: Valid link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetInfo"
              examples:
                valido:
                  $ref: "#/components/examples/PasswordResetInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Reset the password through a link generated by the admin
      description: |
        Since 2.18.0. Changes the password of the link's account (at least 12 characters, as at
        sign-up), marks the link as used and closes every session of the account, without opening
        another: the person logs in again with the new password. Device credentials and PATs stay
        valid. Invalid link, 401 `invalid_reset_link`, as in `POST /auth/password-reset/check`;
        short password, 422 `validation_failed` without consuming the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "204":
          description: Password reset and the account's sessions closed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/devices/login:
    post:
      tags: [devices]
      operationId: deviceLogin
      summary: Log in on a device with e-mail and password
      description: |
        Checks the password like the browser login and issues a device credential: a
        `kind: device` token with `recordings:read`, `recordings:write`, since 2.6.0
        `summaries:read` (the app's summary-ready notice, with "Copiar") and, since 2.8.0,
        `transcripts:read` (the desktop synced folder reads transcripts), with no expiry and
        revocable at `DELETE /api/v1/tokens/{token_id}`. The secret comes back only in this
        response. Wrong password or inactive account, 401 with the same message as login; an
        account that has not yet accepted the notice in force, 403 `notice_required` (accept it on
        the web and log in again); too many attempts from the same IP or for the same account (the
        account window is shared with `POST /auth/login`), 429 `rate_limited` with `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLogin"
            examples:
              notebook:
                $ref: "#/components/examples/DeviceLoginRequest"
      responses:
        "201":
          description: Device credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredential"
              examples:
                notebook:
                  $ref: "#/components/examples/DeviceCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/devices/pairing-codes:
    post:
      tags: [devices]
      operationId: createPairingCode
      summary: Generate a pairing code
      description: |
        A 6-character code (`K7Q-4MX`), valid for 10 minutes and single use, that the app exchanges
        for a device credential at `POST /api/v1/devices/pair`. `pair_url` is the content of the
        QR the phone reads. A new code expires the earlier ones not yet used. Session only.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Code generated; `code`, `display` and `pair_url` only come back here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
              examples:
                novo:
                  $ref: "#/components/examples/PairingCodeCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/devices/pairing-codes/{pairing_code_id}:
    parameters:
      - $ref: "#/components/parameters/PairingCodeId"
    get:
      tags: [devices]
      operationId: getPairingCode
      summary: State of a pairing code
      description: The web polls it to replace the QR with "Pareado" and show the device (`token_id`). Session only.
      responses:
        "200":
          description: State of the code, without the code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
              examples:
                usado:
                  $ref: "#/components/examples/PairingCodeUsed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/pair:
    post:
      tags: [devices]
      operationId: pairDevice
      summary: Exchange a pairing code for a device credential
      description: |
        The code accepts upper or lower case, with or without the hyphen. Issues the device
        credential of the code's owner, like `POST /api/v1/devices/login`. A code that does not
        exist, expired or was already used, 401 `invalid_pairing_code`; too many attempts from the
        same IP (or, adding up all IPs, six times that limit), 429 `rate_limited` with
        `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePair"
            examples:
              celular:
                $ref: "#/components/examples/DevicePairRequest"
      responses:
        "201":
          description: Device credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Start an upload (or deduplicate)
      description: |
        The client computes the file's `sha256` before uploading. If the user already has a
        recording with the same hash, the response is **200** with `status: deduplicated` and the
        existing `recording_id`, and nothing is transferred. Otherwise, **201** with the upload,
        the `part_size` fixed by the server and the URLs of the first parts.

        Since 2.15.0, a new upload that exceeds the account's quotas (size per file, total storage
        or open uploads) answers **403** `quota_exceeded`, with `quota`, `limit` and `used`,
        before any byte is uploaded. Deduplicating and resuming do not go through the quota.

        Parts: all of `part_size` bytes, except the last; at most 10,000. Each part goes by `PUT`
        to the part's `url`, with the given `headers`; the response's `ETag` is kept for the
        `complete`. The URL is opaque (MinIO presigned or the API's own
        `PUT /api/v1/uploads/{upload_id}/parts/{part_number}`) and expires at `expires_at`.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
            examples:
              desktop:
                $ref: "#/components/examples/UploadCreateRequest"
              celular:
                $ref: "#/components/examples/UploadCreateMobile"
      responses:
        "200":
          description: Deduplicated. A recording with this hash already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                deduplicado:
                  $ref: "#/components/examples/UploadDeduplicated"
        "201":
          description: Upload created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                criado:
                  $ref: "#/components/examples/UploadCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Upload state, to resume
      description: "`parts_received` lists the parts the storage has already confirmed; the client uploads only the missing ones."
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      responses:
        "200":
          description: Upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                emAndamento:
                  $ref: "#/components/examples/UploadInProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abort the upload and discard the parts
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Aborted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads/{upload_id}/part-urls:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: createPartUrls
      summary: Request URLs for parts
      description: New URLs for the given parts, including to replace expired URLs on a resume.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartUrlsRequest"
            examples:
              faltantes:
                $ref: "#/components/examples/PartUrlsRequest"
      responses:
        "200":
          description: URLs of the requested parts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartUrls"
              examples:
                faltantes:
                  $ref: "#/components/examples/PartUrls"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/uploads/{upload_id}/parts/{part_number}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - name: part_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    put:
      tags: [uploads]
      operationId: putUploadPart
      summary: Upload a part through the API
      description: |
        Variant of the part URL served by the API itself, with the same semantics as the `PUT` to
        an S3 presigned URL. The client does not build this path: it uses the `url` it received.
        A `Content-Length` other than the part size is 409; without the header, the body is read
        in chunks and going past the part size is 413 `payload_too_large` (since 2.14.0).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Part stored.
          headers:
            ETag:
              description: Identifier of the part, to return in the `complete`.
              required: true
              schema:
                type: string
                examples: ['"5d41402abc4b2a76b9719d911017c592"']
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Complete the upload and queue the transcription
      description: |
        Assembles the object from the parts, creates the recording and queues the job. The server
        checks the declared `sha256`; a mismatch becomes a job failure with
        `error.code: hash_mismatch`. Repeating the `complete` of an already completed upload
        returns the same recording. Since 2.14.0, another `complete` of the same upload while one
        is in progress (the server assembling the object and checking the hash) answers 409
        `upload_completing` with `Retry-After`: it is transient, try again.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadComplete"
            examples:
              partes:
                $ref: "#/components/examples/UploadCompleteRequest"
      responses:
        "201":
          description: Recording created, job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                naFila:
                  $ref: "#/components/examples/RecordingQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The upload expired (`code: upload_expired`), is no longer open (`code: conflict`) or
            another `complete` of it is in progress (`code: upload_completing`, since 2.14.0, with
            `Retry-After`).
          headers:
            Retry-After:
              description: With `upload_completing`, seconds until trying again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      summary: List the user's recordings
      description: |
        The library: by `recorded_at` range (week, month) and with filters. Filters are
        repeatable: repeated values of the same filter combine with OR, and different filters with AND
        (`?tag=a&tag=b&kind=note` = a note with the tag `a` or `b`).
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Since"
        - name: from
          in: query
          description: "`recorded_at >= from`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "`recorded_at < to`."
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: >-
            `created_desc` (default, the most recently uploaded first), `recorded_asc` or
            `recorded_desc` (by the recording start). The cursor is valid only for the same order.
          schema:
            type: string
            enum: [created_desc, recorded_asc, recorded_desc]
            default: created_desc
        - name: kind
          in: query
          description: Nature of the recording; repeatable.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordingKind"
        - name: status
          in: query
          description: State of the recording; repeatable.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordingStatus"
        - name: tag
          in: query
          description: Tag; repeatable.
          schema:
            type: array
            items:
              type: string
        - name: collection
          in: query
          description: Collection; repeatable.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: person
          in: query
          description: Person linked to a speaker of the transcript; repeatable.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: field
          in: query
          description: >-
            Value of a user field, `<field_id>:<value>`; repeatable. Each field is a filter:
            values of the same field combine with OR, different fields with AND. In a list field,
            it is enough for the value to be one of the items; title and tags count as the
            built-in ones.
          schema:
            type: array
            items:
              type: string
              pattern: "^[0-9a-fA-F-]{36}:.+$"
        - name: person_company
          in: query
          description: >-
            Company of a participant (a person linked to a speaker), ignoring accents and case;
            repeatable. The `person_*` attributes apply to one and the same person: with
            `person_company` and `person_tag`, someone from the company and with the tag spoke in
            the recording.
          schema:
            type: array
            items:
              type: string
        - name: person_department
          in: query
          description: Department of a participant, ignoring accents and case; repeatable (see `person_company`).
          schema:
            type: array
            items:
              type: string
        - name: person_tag
          in: query
          description: Person tag of a participant, ignoring case; repeatable (see `person_company`).
          schema:
            type: array
            items:
              type: string
        - name: awaiting
          in: query
          description: >-
            Since 2.22.0. `speakers`: only the recordings whose current revision is stopped waiting
            for the speakers to be named (`Recording.awaiting`).
          schema:
            type: array
            items:
              type: string
              enum: [speakers]
      responses:
        "200":
          description: Recordings, in the `sort` order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPage"
              examples:
                semana:
                  $ref: "#/components/examples/RecordingWeekPage"
                biblioteca:
                  $ref: "#/components/examples/RecordingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/recordings/{recording_id}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: getRecording
      summary: Recording and job state
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Recording.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                transcrita:
                  $ref: "#/components/examples/RecordingTranscribed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [recordings]
      operationId: updateRecording
      summary: Edit the recording metadata
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingPatch"
            examples:
              organizar:
                $ref: "#/components/examples/RecordingPatchRequest"
      responses:
        "200":
          description: Recording updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [recordings]
      operationId: deleteRecording
      summary: Delete the recording, the audio and the transcript
      description: >-
        With a PAT, it requires `recordings:delete` since 2.3.0 (before, `recordings:write`); the
        migration granted `recordings:delete` to every token that had `recordings:write`.
      security:
        - sessionCookie: []
        - pat: ["recordings:delete"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/audio:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: getRecordingAudio
      summary: Recording audio (redirect)
      description: >-
        Redirects to a temporary URL of the audio, which accepts `Range` for the player. Since
        2.29.0, 410 (`code: audio_deleted`) when retention has already erased the audio; the
        signed address answers the same.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "302":
          description: Redirect to the audio.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"

  /api/v1/recordings/{recording_id}/retranscribe:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: retranscribeRecording
      summary: Transcribe again with the current configuration
      description: >-
        The transcript keeps its id and goes up a `revision`; the speaker-to-person links are
        redone by the new diarization. Since 2.29.0, 409 with `code: audio_deleted` when retention
        has already erased the audio.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetranscribeRequest"
      responses:
        "202":
          description: Job queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: cancelRecordingTranscription
      summary: Cancel the running or queued transcription
      description: |
        Since 2.10.0. The recording's `queued`/`running` job ends `cancelled`, the recording becomes
        `failed` with `Job.error.code` `cancelled` (recoverable) and the running step becomes `skipped`
        with `reason` `cancelled`. The GPU worker stops at the next checkpoint and frees the GPU;
        "Transcrever de novo" (`/retranscribe`) is the way back. With no open job, 409.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Transcription cancelled; the recording with the job `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                cancelled:
                  $ref: "#/components/examples/RecordingCancelled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/continue:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: continueRecordingWithoutNames
      summary: Continue without naming the speakers
      description: |
        Since 2.22.0. Releases the recording stopped waiting for the names: the `speakers` step
        becomes `skipped` with `reason` `continued_by_user` and the chain goes on through the agenda
        type. Outside the wait, 409.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The recording, with the `speakers` step released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/summary:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [summaries]
      operationId: getRecordingSummary
      summary: Summary state of the recording
      description: |
        The current version (the completed one with the highest `version`), the generated reference
        (the most recent completed generated one, to compare and go back to) and the generation in
        progress. With no transcript, 409 `transcript_missing`.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: Summary state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryState"
              examples:
                editado:
                  $ref: "#/components/examples/SummaryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [summaries]
      operationId: editRecordingSummary
      summary: Edit the summary by hand
      description: |
        Stores the Markdown as a `manual` version, which becomes the current one. `base_version` is
        the version the person opened (0 with no completed summary); if another version came in
        meanwhile, 409 `summary_changed` and nothing is overwritten.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryEdit"
            examples:
              editar:
                $ref: "#/components/examples/SummaryEditRequest"
      responses:
        "200":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [summaries]
      operationId: deleteRecordingSummary
      summary: Delete the whole summary
      description: Erases every version and the adjustment chat of the recording.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/summary/revert:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [summaries]
      operationId: revertRecordingSummary
      summary: Go back to the generated version
      description: |
        Creates a `manual` version with the content of the generated reference and `restored_from_id`
        pointing at it: nothing is lost. With no generated version, 409 `summary_missing`.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/summary/chat:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [summaries]
      operationId: listSummaryChat
      summary: Messages of the adjustment chat
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages, in chronological order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryChatPage"
              examples:
                conversa:
                  $ref: "#/components/examples/SummaryChatPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [summaries]
      operationId: sendSummaryChat
      summary: Ask the agent for a summary adjustment
      description: |
        Stores the request and the agent's reply in `queued`; the client polls
        `GET /api/v1/summary-chat-messages/{message_id}` of the reply until `done` or `failed`. The
        agent works on the current summary and reads the transcript only when the request needs it;
        each read lands in `reads`. A reply that changes the summary creates a `chat` version. With a
        request still open on the recording, 409 `chat_busy`; with no transcript, 409
        `transcript_missing`. Since 2.15.0, the request counts toward the quota of agent requests in
        24 h (exceeded, 403 `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryChatRequest"
            examples:
              encurtar:
                $ref: "#/components/examples/SummaryChatRequest"
      responses:
        "202":
          description: Request and reply queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryChatExchange"
              examples:
                na_fila:
                  $ref: "#/components/examples/SummaryChatExchangeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/markers:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: listMarkers
      summary: Markers of the recording
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Markers in `at_ms` order (single page).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerPage"
              examples:
                marcadores:
                  $ref: "#/components/examples/MarkerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [recordings]
      operationId: upsertMarkers
      summary: Send markers in a batch
      description: |
        Idempotent by `client_id`: resending the same marker updates the note and does not duplicate
        it; a resend with no note keeps the existing one. `device_name` is the body's (without it,
        null).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkerBatch"
            examples:
              doCelular:
                $ref: "#/components/examples/MarkerBatchRequest"
      responses:
        "200":
          description: All the markers of the recording, in `at_ms` order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/export:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: exportRecording
      summary: Export the recording
      description: |
        - `txt`: title, date (America/Sao_Paulo time), duration, participants and one
          `[HH:MM:SS] Name: text` line per segment.
        - `srt`: one subtitle per segment, `HH:MM:SS,mmm --> HH:MM:SS,mmm` and `Name: text`.
        - `md`: `# Title`, one line with the date and the agenda type, and the current summary. With
          no summary, 409 `summary_missing`.
        - `docx`: title, date, duration and participants, the summary (Markdown headings and lists
          become Word styles) and the transcript; with no summary, only the transcript.

        Requires `transcripts:read` on a PAT, and also `summaries:read` for `md` and `docx`. With no
        transcript, 409 `transcript_missing`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: format
          in: query
          required: true
          description: Export format. New formats are added additively.
          schema:
            type: string
            enum: [txt, srt, md, docx]
      responses:
        "200":
          description: Exported file, named with the slug of the title.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="alinhamento-do-programa-de-liderancas.docx"']
          content:
            text/plain:
              schema:
                type: string
            application/x-subrip:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/fields:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [fields]
      operationId: listRecordingFields
      summary: Fields of the recording
      description: |
        Every user field, in list order; those with no value come out with null `value` and `origin`.
        Title and tags come from `Recording.title`/`tags`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: The fields of the recording with value and origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
              examples:
                valores:
                  $ref: "#/components/examples/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/fields/accept:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [fields]
      operationId: acceptRecordingFields
      summary: Accept all the automatic values
      description: |
        Every `auto` value of the recording becomes `accepted`, which automatic filling does not overwrite.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The fields of the recording with value and origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/fields/{field_id}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
      - $ref: "#/components/parameters/FieldId"
    put:
      tags: [fields]
      operationId: putRecordingField
      summary: Write the value of a field
      description: |
        Origin `edited`. The value follows the field's `kind`: a string (text, one of the choice's
        options, up to 300 characters) or a list of strings; `null` clears it (the title never
        becomes empty).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldValuePut"
      responses:
        "200":
          description: The fields of the recording with value and origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/fields/{field_id}/accept:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
      - $ref: "#/components/parameters/FieldId"
    post:
      tags: [fields]
      operationId: acceptRecordingField
      summary: Accept the automatic value of a field
      description: |
        `auto` becomes `accepted`; a value that is not `auto` gives 409 `not_auto`.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The fields of the recording with value and origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/transcripts:
    get:
      tags: [transcripts]
      operationId: listTranscripts
      summary: List transcripts (incremental)
      description: |
        The user's completed transcripts, in ascending `(updated_at, id)` order.
        `since` is inclusive (`updated_at >= since`): the client keeps the largest `updated_at` it
        has seen and deduplicates by `id` + `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/PersonFilter"
        - name: recording_id
          in: query
          description: The transcript of one specific recording.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transcripts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPage"
              examples:
                incremental:
                  $ref: "#/components/examples/TranscriptPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [transcripts]
      operationId: getTranscript
      summary: Full transcript
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: include
          in: query
          description: "`words` includes the timed words in each segment."
          schema:
            type: string
            enum: [words]
      responses:
        "200":
          description: Transcript, in the schema of `contracts/transcript.schema.json`.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json"
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/export:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [transcripts]
      operationId: exportTranscript
      summary: Export the transcript
      description: |
        `md`: YAML frontmatter (`id`, `title`, `recorded_at`, `language`, `duration_ms`,
        `source`, `revision`, `speakers`) and one line per segment, `**Name** [HH:MM:SS]: text`,
        separated by a blank line. The name is that of the linked person or, with no person, the `label`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: format
          in: query
          required: true
          description: Export format. New formats are added additively.
          schema:
            type: string
            enum: [md]
      responses:
        "200":
          description: Exported file.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="alinhamento-do-programa-de-liderancas.md"']
          content:
            text/markdown:
              schema:
                type: string
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakersMarkdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/speakers/{speaker_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: speaker_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
    patch:
      tags: [transcripts]
      operationId: updateSpeaker
      summary: Rename the speaker or link it to a person
      description: |
        `person_id` links the speaker to a person (confirming, where it applies, a voice
        suggestion); `null` undoes the link. Linking a person without sending `label` sets the `label` to
        the person's name. Bumps the `revision`. Since 2.22.0, linking the last missing person to
        a recording stopped waiting for the names (stage `speakers` `waiting`) releases it, and the chain
        goes on by itself.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerPatch"
            examples:
              ligarPessoa:
                $ref: "#/components/examples/SpeakerPatchRequest"
      responses:
        "200":
          description: Speaker updated.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                ligado:
                  $ref: "#/components/examples/SpeakerLinked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/speakers/{speaker_id}/suggestions/{person_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: speaker_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
      - $ref: "#/components/parameters/PersonId"
    delete:
      tags: [voice]
      operationId: rejectSpeakerSuggestion
      summary: Reject a voice suggestion
      description: |
        The person stops being suggested for this speaker and never is again, not even in a
        future comparison of the same transcript. Recording owner only. Bumps the `revision`.
        Accepting is the speaker's `PATCH` with `person_id`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Speaker without the rejected suggestion.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                recusada:
                  $ref: "#/components/examples/SpeakerSuggestionRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/speakers/merge:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    post:
      tags: [transcripts]
      operationId: mergeSpeakers
      summary: Merge speakers
      description: >-
        The segments of the source speakers move to the target speaker, and the source ones disappear.
        Bumps the `revision`. Since 2.22.0, if no speaker is left without a person, releases the recording
        stopped waiting for the names, like `updateSpeaker`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerMerge"
            examples:
              mesclar:
                $ref: "#/components/examples/SpeakerMergeRequest"
      responses:
        "200":
          description: Transcript after the merge.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/segments/{segment_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
