              pessoa:
                $ref: "#/components/examples/PersonCreateRequest"
      responses:
        "201":
          description: Person registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/people/facets:
    get:
      tags: [people]
      operationId: listPersonFacets
      summary: Companies, areas and person tags in use
      description: |
        The values of the registration attributes of the user's people, with how many people use
        each one. Company and area are grouped accent- and case-insensitively, and the value returned
        is the most used spelling; person tags are grouped case-insensitively. They feed the
        registration suggestions and the library's Participants filter.
      security:
        - sessionCookie: []
        - pat: ["people:read"]
      responses:
        "200":
          description: Values in use, in alphabetical order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonFacets"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/people/{person_id}:
    parameters:
      - $ref: "#/components/parameters/PersonId"
    get:
      tags: [people]
      operationId: getPerson
      summary: One person
      security:
        - sessionCookie: []
        - pat: ["people:read"]
      responses:
        "200":
