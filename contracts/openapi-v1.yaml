          description: Tags com contagem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagList"
              examples:
                tags:
                  $ref: "#/components/examples/TagList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/auth/login:
    post:
      tags: [admin]
      operationId: adminLogin
      summary: Abrir a sessão de admin
      description: |
        Conta de admin, separada das contas de usuário (o mesmo e-mail pode existir nas duas).
        Define os cookies `eclume_admin_session` (HttpOnly, Secure, SameSite=Strict,
        `Path=/api/v1/admin`) e `eclume_admin_csrf` (legível pelo JavaScript). Toda requisição
        mutável em `/api/v1/admin/*` ecoa `eclume_admin_csrf` no header `X-CSRF-Token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credenciais:
                $ref: "#/components/examples/LoginRequest"
      responses:
        "204":
          description: Sessão de admin aberta.
          headers:
            Set-Cookie:
              description: "`eclume_admin_session` e `eclume_admin_csrf`."
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/auth/logout:
    post:
      tags: [admin]
      operationId: adminLogout
      security:
        - adminSessionCookie: []
      summary: Encerrar a sessão de admin
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sessão encerrada e cookies removidos.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/me:
    get:
      tags: [admin]
      operationId: getAdminMe
      security:
        - adminSessionCookie: []
      summary: Conta de admin corrente
      responses:
        "200":
          description: Conta de admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
              examples:
                admin:
                  $ref: "#/components/examples/AdminMe"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      security:
        - adminSessionCookie: []
      summary: Configuração em runtime da plataforma
      responses:
        "200":
          description: Configuração.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
              examples:
                padrao:
                  $ref: "#/components/examples/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [admin]
      operationId: updateAdminSettings
      security:
        - adminSessionCookie: []
      summary: Alterar a configuração
      description: >-
        Merge por bloco; só os campos enviados mudam. Vale para os próximos jobs. Desligar
        `voice_identification.enabled` apaga as impressões de voz e as sugestões pendentes de toda
        a plataforma.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
            examples:
              trocarModelo:
                $ref: "#/components/examples/AdminSettingsPatchRequest"
      responses:
        "200":
          description: Configuração resultante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/agent-providers:
    get:
      tags: [admin]
      operationId: listAgentProviders
      security:
        - adminSessionCookie: []
      summary: Providers de agente de sumarização
      responses:
        "200":
          description: Providers. A chave de API nunca volta; só `api_key_set`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProviderPage"
              examples:
                providers:
                  $ref: "#/components/examples/AgentProviderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: createAgentProvider
      security:
        - adminSessionCookie: []
      summary: Cadastrar um provider
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProviderCreate"
            examples:
              deepseek:
                $ref: "#/components/examples/AgentProviderCreateRequest"
      responses:
        "201":
          description: Provider cadastrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/agent-providers/{provider_id}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    patch:
      tags: [admin]
      operationId: updateAgentProvider
      security:
        - adminSessionCookie: []
      summary: Editar um provider
      description: "`api_key: null` apaga a chave guardada; ausente, mantém."
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentProviderPatch"
      responses:
        "200":
          description: Provider atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentProvider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [admin]
      operationId: deleteAgentProvider
      security:
        - adminSessionCookie: []
      summary: Remover um provider
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Removido.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/secrets:
    get:
      tags: [admin]
      operationId: listSecrets
      security:
        - adminSessionCookie: []
      summary: Segredos da plataforma (sem valor)
      responses:
        "200":
          description: Nomes e estado; o valor nunca volta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretList"
              examples:
                segredos:
                  $ref: "#/components/examples/SecretList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/secrets/{secret_name}:
    parameters:
      - name: secret_name
        in: path
        required: true
        description: "Nome do segredo: `hf_token` (diarização no worker GPU) ou `anthropic_api_key` (provider `anthropic` sem chave própria). Outro nome → 422."
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,63}$"
    put:
      tags: [admin]
      operationId: putSecret
      security:
        - adminSessionCookie: []
      summary: Gravar um segredo (cifrado)
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretPut"
      responses:
        "204":
          description: Gravado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [admin]
      operationId: deleteSecret
      security:
        - adminSessionCookie: []
      summary: Apagar um segredo
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Apagado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      security:
        - adminSessionCookie: []
      summary: Contas de usuário
      description: Dados da conta e a contagem de gravações; nunca o conteúdo do usuário.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Usuários.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
              examples:
                usuarios:
                  $ref: "#/components/examples/AdminUserPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [admin]
      operationId: updateUser
      security:
        - adminSessionCookie: []
      summary: Desativar ou reativar um usuário
      description: Desativar encerra as sessões e revoga os PATs do usuário.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/admin/jobs/{job_id}/retry:
    post:
      tags: [admin]
      operationId: retryTranscriptionJob
      security:
        - adminSessionCookie: []
      summary: Retentar um job de transcrição que falhou
      description: >-
        Cria o job da revisão seguinte da gravação, com a configuração atual da plataforma, e o
        enfileira. Vale para a gravação de qualquer usuário, mas só para o job mais recente da
        gravação e em estado `failed`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Novo job na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobRetried"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/health:
    get:
      tags: [admin]
      operationId: getAdminHealth
      security:
        - adminSessionCookie: []
      summary: Saúde da fila, da GPU e dos modelos
      responses:
        "200":
          description: Estado atual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
              examples:
                gpu:
                  $ref: "#/components/examples/AdminHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: |
        Sessão do navegador, aberta por `POST /api/v1/auth/login` ou pelo cadastro. Tem todas as
        permissões do usuário sobre a própria conta. Métodos mutáveis exigem `X-CSRF-Token` igual
        ao cookie `eclume_csrf` (double-submit). Gestão de PATs, o aceite do aviso e as rotas de
        voz aceitam **só** sessão. Não alcança `/api/v1/admin/*`.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: eclume_admin_session
      description: |
        Sessão da conta de admin, aberta por `POST /api/v1/admin/auth/login` (HttpOnly, Secure,
        SameSite=Strict, `Path=/api/v1/admin`, 12 h). É a única credencial aceita em
        `/api/v1/admin/*`, e é ignorada em qualquer outra rota. Métodos mutáveis exigem
        `X-CSRF-Token` igual ao cookie `eclume_admin_csrf` (double-submit).
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<segredo>
      description: |
        PAT pessoal: `Authorization: Bearer eclp_<segredo>`. Age como o usuário dono, limitado
        aos escopos concedidos. Os escopos exigidos por operação estão no requisito de segurança
        (`pat: [escopo, ...]`, todos obrigatórios). Nenhum escopo implica outro. Faltando
        escopo, a resposta é 403 com `code: insufficient_scope` e `required_scopes`.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Obrigatório com sessão: o valor do cookie `eclume_csrf`, ou de `eclume_admin_csrf` em
        `/api/v1/admin/*`. Ignorado com PAT.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: Só itens com `updated_at >= since` (inclusivo).
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Id de pessoa; só transcrições (ou trechos) em que um locutor está ligado a ela.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Só gravações com esta tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Só gravações desta coleção.
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Sem credencial, ou credencial inválida, expirada ou revogada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ['Bearer realm="eclume"']
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semCredencial:
              $ref: "#/components/examples/ProblemUnauthorized"
    Forbidden:
      description: >-
        Credencial válida sem permissão (escopo ou dono), PAT numa operação que aceita só sessão
        (`code: session_required`), ou cadastro fechado (`code: signup_closed`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semEscopo:
              $ref: "#/components/examples/ProblemInsufficientScope"
    NotFound:
      description: Não existe ou não é do usuário (o eclume não distingue os dois).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            naoEncontrado:
              $ref: "#/components/examples/ProblemNotFound"
    ValidationFailed:
      description: Corpo ou parâmetros inválidos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalido:
              $ref: "#/components/examples/ProblemValidation"
    Conflict:
      description: O estado atual impede a operação (upload já concluído, nome duplicado, job em andamento).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: Erro RFC 9457. O cliente decide por `code`, nunca por `title`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: |
            Código estável. Valores v1: `unauthorized`, `insufficient_scope`, `forbidden`,
            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,
            `rate_limited`; desde a 1.4.0, `session_required` (PAT numa operação só de sessão);
            desde a 2.0.0, `email_taken` (cadastro com e-mail existente) e `signup_closed`.
            Códigos novos entram de forma aditiva.
          type: string
        required_scopes:
          description: Com `insufficient_scope`, os escopos que faltaram.
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        errors:
          description: Com `validation_failed`, um item por campo inválido.
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                description: Caminho do campo (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string

    Scope:
      description: Escopo de PAT.
      type: string
      enum:
        - recordings:read
        - recordings:write
        - transcripts:read
        - transcripts:write
        - people:read
        - people:write
        - summaries:read
        - summaries:write

    Health:
      type: object
      required: [status, version, contract_version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa (`info.version`).
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true

    Notice:
      description: Aviso que a conta aceita ao nascer ("Sou responsável por pedir o consentimento das pessoas que gravo").
      type: object
      required: [version, text]
      properties:
        version:
          type: string
        text:
          type: string

    SignupInfo:
      type: object
      required: [open, notice]
      properties:
        open:
          description: "`false` com `ECLUME_SIGNUP_OPEN=false`: o cadastro responde 403 `signup_closed`."
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"

    SignupRequest:
      type: object
      required: [name, email, password, notice_version]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          writeOnly: true
        notice_version:
          description: Versão do aviso aceito; tem de ser a em vigor.
          type: string
          minLength: 1

    NoticeAccept:
      type: object
      required: [notice_version]
      properties:
        notice_version:
          type: string
          minLength: 1

    User:
      type: object
      required: [id, email, name, active, created_at, last_login_at, notice_version, notice_accepted_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        notice_version:
          description: Versão do aviso aceito, ou `null` numa conta que ainda não aceitou.
          type: [string, "null"]
        notice_accepted_at:
          type: [string, "null"]
          format: date-time

    AdminUser:
      description: Conta de usuário vista pelo admin (o `User` mais a contagem de gravações).
      type: object
      required: [id, email, name, active, created_at, last_login_at, notice_version, notice_accepted_at, recording_count]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        notice_version:
          type: [string, "null"]
        notice_accepted_at:
          type: [string, "null"]
          format: date-time
        recording_count:
          type: integer
          minimum: 0

    UserPatch:
      type: object
      required: [active]
      properties:
        active:
          description: "`false` desativa a conta, encerra as sessões e revoga os PATs."
          type: boolean

    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AdminAccount:
      description: Conta de admin, separada das contas de usuário.
      type: object
      required: [id, email, name, created_at, last_login_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    AdminRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Me:
      type: object
      required: [user, auth, notice_required]
      properties:
        user:
          $ref: "#/components/schemas/User"
        notice_required:
          description: A conta ainda não aceitou o aviso em vigor (`POST /api/v1/me/notice`).
          type: boolean
        auth:
          type: object
          required: [method, scopes, token_id]
          properties:
            method:
              type: string
              enum: [session, pat]
            scopes:
              description: Com sessão, todos os escopos.
              type: array
              items:
                $ref: "#/components/schemas/Scope"
            token_id:
              description: Id do PAT em uso, ou `null` com sessão.
              type: [string, "null"]
              format: uuid

    NextCursor:
      description: Cursor da próxima página, ou `null` na última.
      type: [string, "null"]

    Token:
      type: object
      required: [id, name, scopes, prefix, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        prefix:
          description: Começo do segredo, para reconhecer o token (`eclp_7Hq2`).
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          description: Sem valor, o PAT não expira.
          type: [string, "null"]
          format: date-time

    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          description: O PAT completo. Não é mostrado de novo.
          type: string
          pattern: "^eclp_[A-Za-z0-9]{32,}$"

    TokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Source:
      description: Origem do áudio.
      type: string
      enum: [desktop, upload, api]

    Capture:
      description: Contexto da captura, preenchido pelo app desktop.
      type: object
      properties:
        meeting_app:
          description: App de reunião detectado.
          type: [string, "null"]
          enum: [teams, meet, zoom, other, null]
        device_name:
          type: [string, "null"]
        client_version:
          description: Versão do app que gravou (`eclume-desktop/0.3.0`).
          type: [string, "null"]

    RecordingMetadata:
      description: Metadados livres de organização (tipo de reunião, cliente, projeto).
      type: object
      additionalProperties:
        type: string

    UploadCreate:
      type: object
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: "Tipo do arquivo, com parâmetros opcionais (`audio/ogg; codecs=opus`, a saída do navegador; `audio/webm`; `video/mp4`)."
          type: string
          pattern: "^(audio|video)/[A-Za-z0-9.+-]+(\\s*;.*)?$"
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          description: SHA-256 do arquivo inteiro, em hex minúsculo.
          type: string
          pattern: "^[0-9a-f]{64}$"
        title:
          description: Sem valor, deriva do nome do arquivo.
          type: string
          minLength: 1
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        language:
          description: Idioma esperado (BCP 47). Sem valor, vale o padrão da plataforma ou a detecção.
          type: string
          pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"
        source:
          $ref: "#/components/schemas/Source"
        capture:
          $ref: "#/components/schemas/Capture"
        tags:
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"

    UploadStatus:
      type: string
      enum: [in_progress, completed, aborted, expired, deduplicated]

    PartUrl:
      type: object
      required: [part_number, method, url, headers, expires_at]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum: [PUT]
        url:
          description: URL opaca da parte.
          type: string
          format: uri
        headers:
          description: Headers que o `PUT` deve levar.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    ReceivedPart:
      type: object
      required: [part_number, etag, size_bytes]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
        size_bytes:
          type: integer
          minimum: 1

    Upload:
      type: object
      required: [id, status, filename, content_type, size_bytes, sha256, part_size, part_count, parts_received, parts, recording_id, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadStatus"
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        part_size:
          description: Tamanho de toda parte menos a última, em bytes (mínimo 5 MiB).
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        parts_received:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedPart"
        parts:
          description: URLs já emitidas para partes pendentes; pode vir parcial ou vazio.
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"
        recording_id:
          description: Gravação criada pelo `complete`, ou a existente num `deduplicated`.
          type: [string, "null"]
          format: uuid
        expires_at:
          description: Depois disso o upload inacabado é descartado (`upload_expired`).
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PartUrlsRequest:
      type: object
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PartUrls:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"

    UploadComplete:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string

    RecordingStatus:
      description: "`uploading` → `queued` → `processing` → `transcribed` | `failed`."
      type: string
      enum: [uploading, queued, processing, transcribed, failed]

    Job:
      description: Job de transcrição mais recente da gravação.
      type: object
      required: [id, state, stage, progress, attempts, error, queued_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        stage:
          description: Etapa em curso, ou `null` fora de execução.
          type: [string, "null"]
          enum: [asr, alignment, diarization, embeddings, finalizing, null]
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  description: >-
                    `hash_mismatch`, `unsupported_media`, `gpu_oom`, `engine_error`... e, desde a
                    1.4.0, `worker_lost` (o worker GPU parou no meio do job), `job_lost` (o job
                    sumiu da fila sem resposta) e `job_stalled` (progresso parado além do teto),
                    detectados pelo server.
                  type: string
                message:
                  type: string
                retryable:
                  description: >-
                    A falha é passageira (worker perdido, job sumido ou parado, falta de VRAM):
                    retranscrever ou `POST /api/v1/admin/jobs/{job_id}/retry` tende a resolver.
                    Ausente em servidores anteriores à 1.4.0.
                  type: boolean
            - type: "null"
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    Recording:
      type: object
      required: [id, title, status, source, recorded_at, duration_ms, language, size_bytes, content_type, content_hash, owner, tags, collection_ids, metadata, capture, job, transcript_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatus"
        source:
          $ref: "#/components/schemas/Source"
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          description: "`null` até o áudio ser lido."
          type: [integer, "null"]
          minimum: 0
        language:
          description: Idioma pedido ou detectado.
          type: [string, "null"]
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          $ref: "./transcript.schema.json#/$defs/UserRef"
        tags:
          type: array
          items:
            type: string
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"
        capture:
          oneOf:
            - $ref: "#/components/schemas/Capture"
            - type: "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        transcript_id:
          description: Transcrição, depois do primeiro job concluído.
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecordingPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        recorded_at:
          type: string
          format: date-time
        language:
          type: string
          pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"
        tags:
          description: Substitui a lista inteira.
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          description: Substitui a lista inteira.
          type: array
          items:
            type: string
            format: uuid
        metadata:
          description: Substitui o objeto inteiro.
          $ref: "#/components/schemas/RecordingMetadata"

    RecordingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    RetranscribeRequest:
      type: object
      properties:
        language:
          type: string
          pattern: "^[a-z]{2,3}(-[A-Z]{2})?$"

    TranscriptSummary:
      description: Resumo de listagem de uma transcrição (sem segmentos).
