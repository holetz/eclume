openapi: 3.1.0
info:
  title: eclume API
  version: 2.22.0
  summary: Contrato v1 da API do eclume, o serviço de transcrição institucional.
  description: |
    Fonte da verdade entre o servidor do eclume e os seus clientes: o frontend web, o app
    desktop e integrações por PAT, como o importador do lumea.

    **Convenções** (detalhe em `docs/standards/api/contrato-v1.md`):

    - Tudo sob `/api/v1`. Datas em RFC 3339 (UTC), durações em milissegundos, ids em UUID.
    - Listagens paginam por cursor opaco: `?cursor=&limit=`, resposta `{items, next_cursor}`;
      `next_cursor: null` é a última página.
    - Erros em `application/problem+json` (RFC 9457) com o campo estável `code`. Desde a 2.14.0,
      qualquer operação pode responder 500 `internal_error` (falha inesperada; o detalhe fica no
      log do servidor) e qualquer operação com corpo, 413 `payload_too_large` (corpo acima do teto
      da rota: 64 KiB nas rotas públicas de credencial `/auth/*`, `/admin/auth/*` e `/devices/*`,
      os bytes da parte no `PUT` de parte, 1 MiB no resto e no `/mcp`), também sem
      `Content-Length`.
    - **Cotas por conta** (desde a 2.15.0): armazenamento, tamanho por arquivo, uploads abertos,
      minutos de áudio e pedidos ao agente em 24 h (`GET /me/usage`). Estourada a cota, 403
      `quota_exceeded` com `quota`, `limit` e `used`; os minutos de áudio nunca recusam: a
      gravação espera na fila até a janela abrir.
    - **Marcação obrigatória dos locutores** (desde a 2.22.0): com `GET`/`PATCH
      /me/speaker-naming` ligada, a etapa `speakers` fica `waiting` quando algum locutor está sem
      pessoa, e a cadeia (tipo, campos, coleções, resumo) espera; `Recording.awaiting` e o filtro
      `awaiting=speakers` mostram essas gravações.
    - **Espera na fila** (desde a 2.16.0): enquanto o job está `queued`, `Job.queue` diz por que
      espera (fila do processador, vez da própria conta ou janela de minutos), a posição, uma
      previsão rotulada como estimativa e se o processador está no ar.
    - Cada usuário tem a própria conta, isolada; não há organização. O painel admin usa uma
      conta e uma sessão próprias (`adminSessionCookie`), que só alcançam `/api/v1/admin/*`.
    - **Evolução só aditiva.** O cliente ignora propriedades que não conhece e tolera valores
      de enum novos em respostas. A 2.0.0 é a única quebra sob `/api/v1` (fim da organização);
      a próxima mudança incompatível vira `/api/v2`.
    - **Servidor MCP em `/mcp`** (fora de `/api/v1`, fora deste documento): Model Context
      Protocol em HTTP streamable sem estado, com respostas JSON. Aceita só
      `Authorization: Bearer eclp_…` (PAT pessoal ou de dispositivo); cada ferramenta exige os
      escopos da operação equivalente desta API, e a recusa por escopo volta como erro de
      ferramenta que nomeia o escopo. Sem credencial válida, 401 `unauthorized`. Detalhe em
      `docs/standards/code/server-mcp-e-dispositivos.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://192.168.15.199:8443
    description: Produção no host GPU (Caddy com `tls internal`).
  - url: http://127.0.0.1:4010
    description: Mock server (Prism) de `deploy/docker-compose.mock.yml`.
security:
  - sessionCookie: []
tags:
  - name: meta
    description: Saúde e versão do contrato.
  - name: auth
    description: Sessão do navegador, cadastro com o aviso de consentimento e usuário corrente.
  - name: tokens
    description: PATs pessoais e credenciais de dispositivo. Só com sessão.
  - name: devices
    description: >-
      Ligação do desktop e do celular: login por e-mail e senha ou por código de pareamento,
      que emitem uma credencial de dispositivo (um token `kind: device`).
  - name: uploads
    description: Upload resumível em partes (multipart S3) com deduplicação por hash.
  - name: recordings
    description: Gravações e estado do job.
  - name: transcripts
    description: Transcrições, export e edição de locutores e segmentos.
  - name: people
    description: Diretório de pessoas do usuário.
  - name: voice
    description: >-
      Identificação por voz (LGPD): impressão de voz, recusa de sugestão e atribuição automática de locutores. Só sessão: um PAT
      nunca lê nem apaga dado biométrico.
  - name: search
    description: Busca full-text sobre segmentos.
  - name: organize
    description: Coleções e tags.
  - name: agenda-types
    description: >-
      Tipos de agenda do usuário: como reconhecer a gravação, o título e as tags que ela ganha e
      as instruções do resumo.
  - name: fields
    description: >-
      Campos do usuário (título e tags embutidos, mais os próprios) e as regras com que o agente
      os preenche.
  - name: previews
    description: Resultado de testar a regra de um campo ou um tipo de agenda em rascunho.
  - name: summaries
    description: Resumos gerados por agente com as instruções de um tipo de agenda.
  - name: base-chat
    description: Perguntas em linguagem natural sobre o conjunto das gravações do usuário.
  - name: admin
    description: >-
      Conta de admin, configuração e segredos da plataforma, usuários e saúde. Só a sessão de
      admin (`adminSessionCookie`); nenhuma credencial de usuário alcança estas rotas.

paths:
  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Saúde do serviço e versão do contrato
      security: []
      responses:
        "200":
          description: Serviço no ar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  $ref: "#/components/examples/Health"

  /api/v1/health/ready:
    get:
      tags: [meta]
      operationId: getHealthReady
      summary: Prontidão — Postgres, Redis e MinIO respondem
      description: |
        Desde a 2.13.0. Roda as sondas de Postgres, Redis e armazenamento em paralelo, com teto de
        2 s cada. Pública: devolve só o nome e `ok`/`down` de cada uma, sem latência nem mensagem
        de erro. `/api/v1/health` segue estático, como sinal de vida.
      security: []
      responses:
        "200":
          description: Todas as dependências respondem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"
              examples:
                pronto:
                  $ref: "#/components/examples/HealthReady"
        "503":
          description: Alguma dependência não respondeu em 2 s; `checks` diz qual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReady"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Abrir sessão com e-mail e senha
      description: |
        Define os cookies `eclume_session` (HttpOnly, Secure, SameSite=Lax) e `eclume_csrf`
        (legível pelo JavaScript). Toda requisição mutável autenticada por sessão ecoa o valor
        de `eclume_csrf` no header `X-CSRF-Token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              credenciais:
                $ref: "#/components/examples/LoginRequest"
      responses:
        "204":
          description: Sessão aberta.
          headers:
            Set-Cookie:
              description: "`eclume_session` e `eclume_csrf`."
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Encerrar a sessão
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Sessão encerrada e cookies removidos.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/auth/signup:
    get:
      tags: [auth]
      operationId: getSignupInfo
      summary: Estado do cadastro e o aviso em vigor
      description: Diz se o cadastro está aberto e devolve o texto e a versão do aviso que a conta nova aceita.
      security: []
      responses:
        "200":
          description: Cadastro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupInfo"
              examples:
                aberto:
                  $ref: "#/components/examples/SignupInfo"
    post:
      tags: [auth]
      operationId: signup
      summary: Criar uma conta e abrir a sessão
      description: |
        Cadastro aberto, sem convite e sem confirmação de e-mail. Exige o aceite do aviso em vigor
        (`notice_version` igual à versão de `GET /api/v1/auth/signup`). A conta nasce com os
        tipos de agenda padrão, e a resposta define os cookies de sessão, como o login.
        Com o cadastro fechado (`ECLUME_SIGNUP_OPEN=false`), 403 `signup_closed`; e-mail já
        cadastrado, 409 `email_taken`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              conta:
                $ref: "#/components/examples/SignupRequest"
      responses:
        "204":
          description: Conta criada e sessão aberta.
          headers:
            Set-Cookie:
              description: "`eclume_session` e `eclume_csrf`."
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Usuário e credencial correntes
      description: Aceita qualquer credencial válida, sem escopo. O lumea usa para mostrar a conta conectada e os escopos do PAT.
      security:
        - sessionCookie: []
        - pat: []
      responses:
        "200":
          description: Usuário corrente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                viaPat:
                  $ref: "#/components/examples/MeViaPat"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/usage:
    get:
      tags: [auth]
      operationId: getMyUsage
      summary: Uso e cotas da conta
      description: |
        Desde a 2.15.0. O uso corrente da conta e a cota efetiva (a sobreposição da conta pelo
        admin sobre o padrão da plataforma; `null` é sem limite). Minutos de áudio e pedidos ao
        agente contam numa janela móvel de 24 h. Aceita qualquer credencial válida, sem escopo.
      security:
        - sessionCookie: []
        - pat: []
      responses:
        "200":
          description: Uso e cotas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
              examples:
                conta:
                  $ref: "#/components/examples/MeUsage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Trocar a própria senha
      description: |
        Confere a senha atual (errada: 422 em `current_password`) e grava a nova, que segue a regra
        do cadastro (curta: 422 em `new_password`). As outras sessões da conta acabam e esta
        continua. Com `revoke_tokens: true` (desde a 2.14.0), as credenciais de aparelho e os PATs
        da conta também são revogados; ausente ou `false`, continuam valendo. Só pela sessão do
        usuário, com o limite de tentativas das credenciais.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChange"
      responses:
        "204":
          description: Senha trocada.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me/delete:
    post:
      tags: [auth]
      operationId: deleteAccount
      summary: Excluir a própria conta
      description: |
        Confere a senha (errada: 422 em `password`) e apaga a conta com tudo o que é dela:
        gravações e áudios, transcrições, resumos, pessoas e impressões de voz, coleções, tags,
        campos, tipos de agenda, tokens e aparelhos. Não há como desfazer. A resposta apaga os
        cookies da sessão. Só pela sessão do usuário, com o limite de tentativas das credenciais.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletion"
      responses:
        "204":
          description: Conta excluída; a sessão acabou.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me/notice:
    post:
      tags: [auth]
      operationId: acceptNotice
      summary: Aceitar o aviso de consentimento em vigor
      description: >-
        Registra o aceite do aviso pela conta corrente, o que zera `notice_required` em
        `GET /api/v1/me`. Uma versão diferente da em vigor é 422. Só sessão.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeAccept"
            examples:
              aceite:
                $ref: "#/components/examples/NoticeAcceptRequest"
      responses:
        "204":
          description: Aceite registrado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/voice-assignment:
    get:
      tags: [voice]
      operationId: getVoiceAssignment
      summary: Ler a atribuição automática de locutores da conta
      description: >-
        Preferência da conta: ligar sozinho o locutor à pessoa pela voz, e a pontuação mínima para
        isso. `platform_enabled` é o liga-desliga da plataforma (`voice_identification.enabled`):
        desligado, a preferência não tem efeito. Só sessão.
      responses:
        "200":
          description: Preferência corrente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAssignment"
              examples:
                padrao:
                  $ref: "#/components/examples/VoiceAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [voice]
      operationId: updateVoiceAssignment
      summary: Mudar a atribuição automática de locutores da conta
      description: >-
        Os campos enviados mudam e os demais ficam. Vale para as próximas transcrições: os
        vínculos que já existem não mudam. Só sessão. `threshold` fora de 0,50 a 0,99 é 422; o
        padrão é 0,75. Desde a 2.19.0, `keep_samples: false` apaga na hora as amostras, os vetores
        por gravação e as sugestões pendentes da conta.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceAssignmentPatch"
            examples:
              limiar:
                $ref: "#/components/examples/VoiceAssignmentPatchRequest"
      responses:
        "200":
          description: Preferência resultante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceAssignment"
              examples:
                padrao:
                  $ref: "#/components/examples/VoiceAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/transcription:
    get:
      tags: [recordings]
      operationId: getTranscriptionPreference
      summary: Ler o idioma de transcrição preferido da conta
      description: >-
        Desde a 2.20.0. O idioma preferido da conta (`null` é o padrão do servidor) e o padrão do
        servidor (`platform_default`), para os clientes nomearem o idioma real. O idioma de um job
        sai, nesta ordem: o do arquivo, o da conta, o do servidor, `pt`. Sessão ou PAT com
        `recordings:read`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Preferência corrente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPreference"
              examples:
                conta:
                  $ref: "#/components/examples/TranscriptionPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [recordings]
      operationId: updateTranscriptionPreference
      summary: Mudar o idioma de transcrição preferido da conta
      description: >-
        Desde a 2.20.0. `language` é um idioma, `auto` (a engine detecta) ou `null` (volta ao padrão
        do servidor). Vale para os próximos jobs; os que já estão na fila não mudam. Só sessão.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionPreferencePatch"
            examples:
              ingles:
                $ref: "#/components/examples/TranscriptionPreferencePatchRequest"
      responses:
        "200":
          description: Preferência resultante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionPreference"
              examples:
                conta:
                  $ref: "#/components/examples/TranscriptionPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/speaker-naming:
    get:
      tags: [recordings]
      operationId: getSpeakerNaming
      summary: Ler se a conta exige nomear os locutores
      description: >-
        Desde a 2.22.0. `required` diz se a cadeia por agente espera todo locutor (com pelo menos
        10 s de fala) ter pessoa; `waiting_count` conta as gravações paradas à espera disso. Sessão
        ou PAT com `recordings:read`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Preferência corrente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerNamingPreference"
              examples:
                ligada:
                  $ref: "#/components/examples/SpeakerNamingPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [recordings]
      operationId: updateSpeakerNaming
      summary: Ligar ou desligar a marcação obrigatória dos locutores
      description: >-
        Desde a 2.22.0. Ligar vale para as próximas transcrições. Desligar solta toda gravação
        parada da conta (etapa `speakers` `skipped` com `reason` `naming_not_required`) e a cadeia
        segue. Só sessão.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerNamingPatch"
            examples:
              ligar:
                $ref: "#/components/examples/SpeakerNamingPatchRequest"
      responses:
        "200":
          description: Preferência resultante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeakerNamingPreference"
              examples:
                ligada:
                  $ref: "#/components/examples/SpeakerNamingPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/tag-assignment:
    get:
      tags: [organize]
      operationId: getTagAssignment
      summary: Como o agente atribui as tags
      description: |
        O automático e a regra do campo embutido Tags, o modo (`fixed`: só as tags cadastradas;
        `auto`: o agente pode criar até `new_limit` tags novas por gravação, sempre preferindo
        reusar, enquanto o cadastro tiver menos que `catalog_limit`) e o tamanho do cadastro. Só
        pela sessão do usuário.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: A configuração da conta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAssignment"
              examples:
                fixas:
                  $ref: "#/components/examples/TagAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [organize]
      operationId: updateTagAssignment
      summary: Mudar como o agente atribui as tags
      description: Os campos enviados mudam, os demais ficam; vale para as próximas transcrições.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagAssignmentPatch"
      responses:
        "200":
          description: A configuração atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: Listar os tokens do usuário
      description: >-
        PATs pessoais e credenciais de dispositivo. `?kind=device` é a lista de "App móvel" e
        "App desktop"; `?kind=personal`, a de "Tokens de acesso".
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: kind
          in: query
          description: Só os tokens deste tipo.
          schema:
            $ref: "#/components/schemas/TokenKind"
      responses:
        "200":
          description: Tokens, inclusive revogados, do mais novo para o mais antigo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPage"
              examples:
                tokens:
                  $ref: "#/components/examples/TokenPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [tokens]
      operationId: createToken
      summary: Criar um PAT
      description: >-
        O segredo (`eclp_...`) volta só nesta resposta; o servidor guarda apenas o hash. Cria
        sempre `kind: personal`: a credencial de dispositivo só nasce de `POST /devices/login` ou
        `POST /devices/pair`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
            examples:
              lumea:
                $ref: "#/components/examples/TokenCreateRequest"
      responses:
        "201":
          description: PAT criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
              examples:
                lumea:
                  $ref: "#/components/examples/TokenCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/tokens/{token_id}:
    parameters:
      - $ref: "#/components/parameters/TokenId"
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revogar um token
      description: Vale para PAT e credencial de dispositivo ("Desvincular" desliga o aparelho).
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Revogado. Usos seguintes recebem 401.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/server:
    get:
      tags: [meta]
      operationId: getServerInfo
      summary: Descritor público do servidor
      description: |
        Nome, endereço, endereço MCP, impressão digital da CA raiz e versões. É a fonte do anúncio
        mDNS, do link do QR, do pareamento e do endereço embutido no instalador: o app confirma
        aqui o que recebeu e fixa a CA pela impressão digital (`ca_sha256`).
      security: []
      responses:
        "200":
          description: Descritor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
              examples:
                producao:
                  $ref: "#/components/examples/ServerInfo"

  /api/v1/privacy:
    get:
      tags: [meta]
      operationId: getPrivacyInfo
      summary: Para onde vai cada dado, conforme a configuração em vigor
      description: |
        Desde a 2.19.0. Diz, para a transcrição e para cada finalidade de agente, se o dado é
        processado neste servidor, na rede local ou fora dele, com o nome de quem processa quando
        sai. Pública como `GET /server`, porque quem se cadastra precisa saber antes de aceitar o
        aviso; nunca devolve endereço, modelo, chave nem o nome que o admin deu ao provider. A
        configuração muda em runtime: o cliente não guarda a resposta por tempo indeterminado.
        O áudio e a transcrição ficam sempre guardados neste servidor.
      security: []
      responses:
        "200":
          description: Destinos em vigor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyInfo"
              examples:
                agente_externo:
                  $ref: "#/components/examples/PrivacyInfo"

  /api/v1/auth/password-reset/check:
    post:
      tags: [auth]
      operationId: checkPasswordReset
      summary: Conferir um link de redefinição de senha
      description: |
        Desde a 2.18.0. A página `/redefinir-senha` lê o segredo do fragmento da URL e o manda no
        corpo; a resposta diz o e-mail da conta e até quando o link vale, sem consumir o link.
        Link inexistente, vencido, já usado, vencido por um mais novo ou de conta desativada,
        401 `invalid_reset_link`; tentativas demais do mesmo IP, 429 `rate_limited` com
        `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCheck"
      responses:
        "200":
          description: Link válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetInfo"
              examples:
                valido:
                  $ref: "#/components/examples/PasswordResetInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Redefinir a senha por um link gerado pelo admin
      description: |
        Desde a 2.18.0. Troca a senha da conta do link (ao menos 12 caracteres, como no cadastro),
        marca o link como usado e encerra todas as sessões da conta, sem abrir outra: a pessoa
        entra de novo com a senha nova. Credenciais de aparelho e PATs seguem valendo. Link
        inválido, 401 `invalid_reset_link`, como em `POST /auth/password-reset/check`; senha
        curta, 422 `validation_failed` sem consumir o link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "204":
          description: Senha redefinida e sessões da conta encerradas.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/devices/login:
    post:
      tags: [devices]
      operationId: deviceLogin
      summary: Entrar num aparelho com e-mail e senha
      description: |
        Confere a senha como o login do navegador e emite uma credencial de dispositivo: um token
        `kind: device` com `recordings:read`, `recordings:write`, desde a 2.6.0 `summaries:read`
        (o aviso de resumo pronto do app, com "Copiar") e, desde a 2.8.0, `transcripts:read` (a
        pasta sincronizada do desktop lê transcrições), sem validade e revogável
        em `DELETE /api/v1/tokens/{token_id}`. O segredo volta só nesta resposta. Senha errada ou
        conta inativa, 401 com a mesma mensagem do login; conta que ainda não aceitou o aviso em
        vigor, 403 `notice_required` (aceite na web e entre de novo); tentativas demais do mesmo
        IP ou para a mesma conta (a janela da conta é comum com `POST /auth/login`), 429
        `rate_limited` com `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLogin"
            examples:
              notebook:
                $ref: "#/components/examples/DeviceLoginRequest"
      responses:
        "201":
          description: Credencial de dispositivo emitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredential"
              examples:
                notebook:
                  $ref: "#/components/examples/DeviceCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/devices/pairing-codes:
    post:
      tags: [devices]
      operationId: createPairingCode
      summary: Gerar um código de pareamento
      description: |
        Código de 6 caracteres (`K7Q-4MX`), válido por 10 minutos e de uso único, que o app troca
        por uma credencial de dispositivo em `POST /api/v1/devices/pair`. `pair_url` é o conteúdo
        do QR que o celular lê. Um código novo vence os anteriores ainda não usados. Só sessão.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Código gerado; `code`, `display` e `pair_url` só voltam aqui.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
              examples:
                novo:
                  $ref: "#/components/examples/PairingCodeCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/devices/pairing-codes/{pairing_code_id}:
    parameters:
      - $ref: "#/components/parameters/PairingCodeId"
    get:
      tags: [devices]
      operationId: getPairingCode
      summary: Estado de um código de pareamento
      description: A web consulta para trocar o QR por "Pareado" e mostrar o aparelho (`token_id`). Só sessão.
      responses:
        "200":
          description: Estado do código, sem o código.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCode"
              examples:
                usado:
                  $ref: "#/components/examples/PairingCodeUsed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/devices/pair:
    post:
      tags: [devices]
      operationId: pairDevice
      summary: Trocar um código de pareamento por uma credencial de dispositivo
      description: |
        O código aceita maiúsculas ou minúsculas, com ou sem hífen. Emite a credencial de
        dispositivo do dono do código, como `POST /api/v1/devices/login`. Código inexistente,
        vencido ou já usado, 401 `invalid_pairing_code`; tentativas demais do mesmo IP (ou,
        somando todos os IPs, seis vezes esse limite), 429 `rate_limited` com `Retry-After`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePair"
            examples:
              celular:
                $ref: "#/components/examples/DevicePairRequest"
      responses:
        "201":
          description: Credencial de dispositivo emitida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Iniciar um upload (ou deduplicar)
      description: |
        O cliente calcula o `sha256` do arquivo antes de subir. Se o usuário já tem uma gravação
        com o mesmo hash, a resposta é **200** com `status: deduplicated` e o `recording_id`
        existente, e nada é transferido. Caso contrário, **201** com o upload, o `part_size`
        fixado pelo servidor e as URLs das primeiras partes.

        Desde a 2.15.0, um upload novo que passa das cotas da conta (tamanho por arquivo,
        armazenamento total ou uploads abertos) responde **403** `quota_exceeded`, com `quota`,
        `limit` e `used`, antes de qualquer byte subir. Deduplicar e retomar não passam pela cota.

        Partes: todas com `part_size` bytes, exceto a última; no máximo 10 000. Cada parte vai
        por `PUT` na `url` da parte, com os `headers` indicados; o `ETag` da resposta é guardado
        para o `complete`. A URL é opaca (MinIO pré-assinado ou o próprio
        `PUT /api/v1/uploads/{upload_id}/parts/{part_number}`) e expira em `expires_at`.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreate"
            examples:
              desktop:
                $ref: "#/components/examples/UploadCreateRequest"
              celular:
                $ref: "#/components/examples/UploadCreateMobile"
      responses:
        "200":
          description: Deduplicado. Já existe gravação com este hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                deduplicado:
                  $ref: "#/components/examples/UploadDeduplicated"
        "201":
          description: Upload criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                criado:
                  $ref: "#/components/examples/UploadCreated"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/uploads/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [uploads]
      operationId: getUpload
      summary: Estado do upload, para retomar
      description: "`parts_received` lista as partes que o armazenamento já confirmou; o cliente sobe só as que faltam."
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      responses:
        "200":
          description: Upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
              examples:
                emAndamento:
                  $ref: "#/components/examples/UploadInProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [uploads]
      operationId: abortUpload
      summary: Abortar o upload e descartar as partes
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Abortado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/uploads/{upload_id}/part-urls:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: createPartUrls
      summary: Pedir URLs para partes
      description: URLs novas para as partes indicadas, inclusive para substituir URLs expiradas numa retomada.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartUrlsRequest"
            examples:
              faltantes:
                $ref: "#/components/examples/PartUrlsRequest"
      responses:
        "200":
          description: URLs das partes pedidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartUrls"
              examples:
                faltantes:
                  $ref: "#/components/examples/PartUrls"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/uploads/{upload_id}/parts/{part_number}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
      - name: part_number
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 10000
    put:
      tags: [uploads]
      operationId: putUploadPart
      summary: Enviar uma parte pela API
      description: |
        Variante da URL de parte servida pela própria API, com a mesma semântica do `PUT` num
        URL pré-assinado do S3. O cliente não monta este caminho: usa a `url` que recebeu.
        `Content-Length` diferente do tamanho da parte é 409; sem o cabeçalho, o corpo é lido em
        pedaços e passar do tamanho da parte é 413 `payload_too_large` (desde a 2.14.0).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        "200":
          description: Parte gravada.
          headers:
            ETag:
              description: Identificador da parte, a devolver no `complete`.
              required: true
              schema:
                type: string
                examples: ['"5d41402abc4b2a76b9719d911017c592"']
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"

  /api/v1/uploads/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: Concluir o upload e enfileirar a transcrição
      description: |
        Monta o objeto a partir das partes, cria a gravação e enfileira o job. O servidor confere
        o `sha256` declarado; divergência vira falha do job com `error.code: hash_mismatch`.
        Repetir o `complete` de um upload já concluído devolve a mesma gravação. Desde a 2.14.0,
        outro `complete` do mesmo upload em andamento (o servidor montando o objeto e conferindo o
        hash) responde 409 `upload_completing` com `Retry-After`: é passageiro, tente de novo.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadComplete"
            examples:
              partes:
                $ref: "#/components/examples/UploadCompleteRequest"
      responses:
        "201":
          description: Gravação criada, job na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                naFila:
                  $ref: "#/components/examples/RecordingQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            O upload expirou (`code: upload_expired`), não está mais aberto (`code: conflict`) ou
            outro `complete` dele está em andamento (`code: upload_completing`, desde a 2.14.0, com
            `Retry-After`).
          headers:
            Retry-After:
              description: Com `upload_completing`, segundos até tentar de novo.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings:
    get:
      tags: [recordings]
      operationId: listRecordings
      summary: Listar as gravações do usuário
      description: |
        A biblioteca: por intervalo de `recorded_at` (semana, mês) e com filtros. Os filtros são
        repetíveis: valores repetidos do mesmo filtro combinam por OU, e filtros diferentes, por E
        (`?tag=a&tag=b&kind=note` = nota com a tag `a` ou `b`).
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Since"
        - name: from
          in: query
          description: "`recorded_at >= from`."
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: "`recorded_at < to`."
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: >-
            `created_desc` (padrão, a mais recente enviada primeiro), `recorded_asc` ou
            `recorded_desc` (pelo início da gravação). O cursor vale só para a mesma ordenação.
          schema:
            type: string
            enum: [created_desc, recorded_asc, recorded_desc]
            default: created_desc
        - name: kind
          in: query
          description: Natureza da gravação; repetível.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordingKind"
        - name: status
          in: query
          description: Estado da gravação; repetível.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RecordingStatus"
        - name: tag
          in: query
          description: Tag; repetível.
          schema:
            type: array
            items:
              type: string
        - name: collection
          in: query
          description: Coleção; repetível.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: person
          in: query
          description: Pessoa ligada a um locutor da transcrição; repetível.
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: field
          in: query
          description: >-
            Valor de um campo do usuário, `<field_id>:<valor>`; repetível. Cada campo é um filtro:
            valores do mesmo campo combinam por OU, campos diferentes por E. Num campo de lista,
            basta o valor ser um dos itens; título e tags valem como os embutidos.
          schema:
            type: array
            items:
              type: string
              pattern: "^[0-9a-fA-F-]{36}:.+$"
        - name: person_company
          in: query
          description: >-
            Empresa de um participante (pessoa ligada a um locutor), sem acento nem caixa;
            repetível. Os atributos `person_*` valem para uma mesma pessoa: com
            `person_company` e `person_tag`, alguém da empresa e com a tag falou na gravação.
          schema:
            type: array
            items:
              type: string
        - name: person_department
          in: query
          description: Área de um participante, sem acento nem caixa; repetível (ver `person_company`).
          schema:
            type: array
            items:
              type: string
        - name: person_tag
          in: query
          description: Tag de pessoa de um participante, sem caixa; repetível (ver `person_company`).
          schema:
            type: array
            items:
              type: string
        - name: awaiting
          in: query
          description: >-
            Desde a 2.22.0. `speakers`: só as gravações cuja revisão atual está parada à espera de
            nomear os locutores (`Recording.awaiting`).
          schema:
            type: array
            items:
              type: string
              enum: [speakers]
      responses:
        "200":
          description: Gravações, na ordem de `sort`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPage"
              examples:
                semana:
                  $ref: "#/components/examples/RecordingWeekPage"
                biblioteca:
                  $ref: "#/components/examples/RecordingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/recordings/{recording_id}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: getRecording
      summary: Gravação e estado do job
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Gravação.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                transcrita:
                  $ref: "#/components/examples/RecordingTranscribed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [recordings]
      operationId: updateRecording
      summary: Editar metadados da gravação
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordingPatch"
            examples:
              organizar:
                $ref: "#/components/examples/RecordingPatchRequest"
      responses:
        "200":
          description: Gravação atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [recordings]
      operationId: deleteRecording
      summary: Excluir a gravação, o áudio e a transcrição
      description: >-
        Com PAT, exige `recordings:delete` desde a 2.3.0 (antes, `recordings:write`); a migração
        concedeu `recordings:delete` a todo token que tinha `recordings:write`.
      security:
        - sessionCookie: []
        - pat: ["recordings:delete"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Excluída.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/audio:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: getRecordingAudio
      summary: Áudio da gravação (redirecionamento)
      description: Redireciona para uma URL temporária do áudio, que aceita `Range` para o player.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "302":
          description: Redirecionamento para o áudio.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/retranscribe:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: retranscribeRecording
      summary: Transcrever de novo com a configuração atual
      description: A transcrição mantém o id e sobe de `revision`; os vínculos de locutor a pessoa são refeitos pela nova diarização.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetranscribeRequest"
      responses:
        "202":
          description: Job na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: cancelRecordingTranscription
      summary: Cancelar a transcrição em curso ou na fila
      description: |
        Desde a 2.10.0. O job `queued`/`running` da gravação termina `cancelled`, a gravação fica
        `failed` com `Job.error.code` `cancelled` (recuperável) e a etapa em curso fica `skipped`
        com `reason` `cancelled`. O worker GPU para no próximo ponto de checagem e libera a GPU;
        "Transcrever de novo" (`/retranscribe`) é a volta. Sem job em aberto, 409.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Transcrição cancelada; a gravação com o job `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
              examples:
                cancelled:
                  $ref: "#/components/examples/RecordingCancelled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/continue:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [recordings]
      operationId: continueRecordingWithoutNames
      summary: Seguir sem nomear os locutores
      description: |
        Desde a 2.22.0. Solta a gravação parada à espera dos nomes: a etapa `speakers` fica
        `skipped` com `reason` `continued_by_user` e a cadeia segue pelo tipo de agenda. Fora da
        espera, 409.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: A gravação, com a etapa `speakers` solta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recording"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/summary:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [summaries]
      operationId: getRecordingSummary
      summary: Estado do resumo da gravação
      description: |
        A versão atual (a de maior `version` concluída), a gerada de referência (a gerada mais
        recente concluída, para comparar e voltar) e a geração em andamento. Sem transcrição, 409
        `transcript_missing`.
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: Estado do resumo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryState"
              examples:
                editado:
                  $ref: "#/components/examples/SummaryState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags: [summaries]
      operationId: editRecordingSummary
      summary: Editar o resumo à mão
      description: |
        Grava o Markdown como uma versão `manual`, que vira a atual. `base_version` é a versão que
        a pessoa abriu (0 sem resumo concluído); se outra versão entrou nesse meio-tempo, 409
        `summary_changed` e nada é sobrescrito.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryEdit"
            examples:
              editar:
                $ref: "#/components/examples/SummaryEditRequest"
      responses:
        "200":
          description: A versão nova.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [summaries]
      operationId: deleteRecordingSummary
      summary: Excluir o resumo inteiro
      description: Apaga todas as versões e o chat de ajuste da gravação.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Excluído.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/summary/revert:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [summaries]
      operationId: revertRecordingSummary
      summary: Voltar à versão gerada
      description: |
        Cria uma versão `manual` com o conteúdo da gerada de referência e `restored_from_id`
        apontando para ela: nada se perde. Sem versão gerada, 409 `summary_missing`.
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: A versão nova.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/recordings/{recording_id}/summary/chat:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [summaries]
      operationId: listSummaryChat
      summary: Mensagens do chat de ajuste
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Mensagens, em ordem cronológica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryChatPage"
              examples:
                conversa:
                  $ref: "#/components/examples/SummaryChatPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [summaries]
      operationId: sendSummaryChat
      summary: Pedir um ajuste do resumo ao agente
      description: |
        Grava o pedido e a resposta do agente em `queued`; o cliente consulta
        `GET /api/v1/summary-chat-messages/{message_id}` da resposta até `done` ou `failed`. O
        agente trabalha sobre o resumo atual e só lê a transcrição quando o pedido precisa; cada
        leitura fica em `reads`. Uma resposta que muda o resumo cria uma versão `chat`. Com um
        pedido ainda em aberto na gravação, 409 `chat_busy`; sem transcrição, 409
        `transcript_missing`. Desde a 2.15.0, o pedido conta na cota de pedidos ao agente em 24 h
        (estourada, 403 `quota_exceeded`).
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryChatRequest"
            examples:
              encurtar:
                $ref: "#/components/examples/SummaryChatRequest"
      responses:
        "202":
          description: Pedido e resposta na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryChatExchange"
              examples:
                na_fila:
                  $ref: "#/components/examples/SummaryChatExchangeQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/markers:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: listMarkers
      summary: Marcadores da gravação
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Marcadores em ordem de `at_ms` (página única).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerPage"
              examples:
                marcadores:
                  $ref: "#/components/examples/MarkerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [recordings]
      operationId: upsertMarkers
      summary: Enviar marcadores em lote
      description: |
        Idempotente por `client_id`: reenviar o mesmo marcador atualiza a nota e não duplica; um
        reenvio sem nota mantém a que já existe. `device_name` é o do corpo (sem ele, nulo).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkerBatch"
            examples:
              doCelular:
                $ref: "#/components/examples/MarkerBatchRequest"
      responses:
        "200":
          description: Todos os marcadores da gravação, em ordem de `at_ms`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkerPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/export:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [recordings]
      operationId: exportRecording
      summary: Exportar a gravação
      description: |
        - `txt`: título, data (horário de Brasília), duração, participantes e uma linha
          `[HH:MM:SS] Nome: texto` por segmento.
        - `srt`: uma legenda por segmento, `HH:MM:SS,mmm --> HH:MM:SS,mmm` e `Nome: texto`.
        - `md`: `# Título`, uma linha com a data e o tipo de agenda, e o resumo atual. Sem resumo,
          409 `summary_missing`.
        - `docx`: título, data, duração e participantes, o resumo (títulos e listas do Markdown
          viram estilos do Word) e a transcrição; sem resumo, só a transcrição.

        Exige `transcripts:read` num PAT, e também `summaries:read` para `md` e `docx`. Sem
        transcrição, 409 `transcript_missing`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: format
          in: query
          required: true
          description: Formato do export. Formatos novos entram de forma aditiva.
          schema:
            type: string
            enum: [txt, srt, md, docx]
      responses:
        "200":
          description: Arquivo exportado, com o nome em slug do título.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="alinhamento-do-programa-de-liderancas.docx"']
          content:
            text/plain:
              schema:
                type: string
            application/x-subrip:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/fields:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    get:
      tags: [fields]
      operationId: listRecordingFields
      summary: Campos da gravação
      description: |
        Todo campo do usuário, na ordem da lista; os sem valor saem com `value` e `origin` nulos.
        Título e tags vêm de `Recording.title`/`tags`.
      security:
        - sessionCookie: []
        - pat: ["recordings:read"]
      responses:
        "200":
          description: Os campos da gravação com valor e origem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
              examples:
                valores:
                  $ref: "#/components/examples/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/fields/accept:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
    post:
      tags: [fields]
      operationId: acceptRecordingFields
      summary: Aceitar todos os valores automáticos
      description: |
        Todo valor `auto` da gravação vira `accepted`, que o preenchimento automático não sobrescreve.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Os campos da gravação com valor e origem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/recordings/{recording_id}/fields/{field_id}:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
      - $ref: "#/components/parameters/FieldId"
    put:
      tags: [fields]
      operationId: putRecordingField
      summary: Escrever o valor de um campo
      description: |
        Origem `edited`. O valor segue o `kind` do campo: string (texto, uma das opções da escolha,
        até 300 caracteres) ou lista de strings; `null` limpa (o título não fica vazio).
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldValuePut"
      responses:
        "200":
          description: Os campos da gravação com valor e origem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/recordings/{recording_id}/fields/{field_id}/accept:
    parameters:
      - $ref: "#/components/parameters/RecordingId"
      - $ref: "#/components/parameters/FieldId"
    post:
      tags: [fields]
      operationId: acceptRecordingField
      summary: Aceitar o valor automático de um campo
      description: |
        `auto` vira `accepted`; um valor que não é `auto` dá 409 `not_auto`.
      security:
        - sessionCookie: []
        - pat: ["recordings:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Os campos da gravação com valor e origem.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingFieldValues"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/transcripts:
    get:
      tags: [transcripts]
      operationId: listTranscripts
      summary: Listar transcrições (incremental)
      description: |
        Transcrições concluídas do usuário, em ordem crescente de `(updated_at, id)`.
        `since` é inclusivo (`updated_at >= since`): o cliente guarda o maior `updated_at` que
        viu e deduplica por `id` + `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/PersonFilter"
        - name: recording_id
          in: query
          description: Transcrição de uma gravação específica.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Transcrições.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptPage"
              examples:
                incremental:
                  $ref: "#/components/examples/TranscriptPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [transcripts]
      operationId: getTranscript
      summary: Transcrição completa
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: include
          in: query
          description: "`words` inclui as palavras com tempo em cada segmento."
          schema:
            type: string
            enum: [words]
      responses:
        "200":
          description: Transcrição, no schema de `contracts/transcript.schema.json`.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json"
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakers"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/export:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [transcripts]
      operationId: exportTranscript
      summary: Exportar a transcrição
      description: |
        `md`: frontmatter YAML (`id`, `title`, `recorded_at`, `language`, `duration_ms`,
        `source`, `revision`, `speakers`) e uma linha por segmento, `**Nome** [HH:MM:SS]: texto`,
        separadas por linha em branco. O nome é o da pessoa ligada ou, sem pessoa, o `label`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:read"]
      parameters:
        - name: format
          in: query
          required: true
          description: Formato do export. Formatos novos entram de forma aditiva.
          schema:
            type: string
            enum: [md]
      responses:
        "200":
          description: Arquivo exportado.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples: ['attachment; filename="alinhamento-do-programa-de-liderancas.md"']
          content:
            text/markdown:
              schema:
                type: string
              examples:
                tresLocutores:
                  $ref: "#/components/examples/TranscriptThreeSpeakersMarkdown"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/speakers/{speaker_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: speaker_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
    patch:
      tags: [transcripts]
      operationId: updateSpeaker
      summary: Renomear o locutor ou ligá-lo a uma pessoa
      description: |
        `person_id` liga o locutor a uma pessoa (confirmando, se for o caso, uma sugestão por
        voz); `null` desfaz o vínculo. Ligar uma pessoa sem mandar `label` passa o `label` para
        o nome da pessoa. Sobe a `revision`. Desde a 2.22.0, ligar a última pessoa que faltava a
        uma gravação parada à espera dos nomes (etapa `speakers` `waiting`) a solta, e a cadeia
        segue sozinha.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerPatch"
            examples:
              ligarPessoa:
                $ref: "#/components/examples/SpeakerPatchRequest"
      responses:
        "200":
          description: Locutor atualizado.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                ligado:
                  $ref: "#/components/examples/SpeakerLinked"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/speakers/{speaker_id}/suggestions/{person_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: speaker_id
        in: path
        required: true
        schema:
          type: string
          pattern: "^S[0-9]+$"
      - $ref: "#/components/parameters/PersonId"
    delete:
      tags: [voice]
      operationId: rejectSpeakerSuggestion
      summary: Recusar uma sugestão por voz
      description: |
        A pessoa deixa de ser sugerida para este locutor e nunca volta a ser, nem numa
        comparação futura da mesma transcrição. Só o dono da gravação. Sobe a `revision`.
        Aceitar é o `PATCH` do locutor com `person_id`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Locutor sem a sugestão recusada.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Speaker"
              examples:
                recusada:
                  $ref: "#/components/examples/SpeakerSuggestionRejected"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/transcripts/{transcript_id}/speakers/merge:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    post:
      tags: [transcripts]
      operationId: mergeSpeakers
      summary: Mesclar locutores
      description: >-
        Os segmentos dos locutores de origem passam ao locutor de destino, e os de origem somem.
        Sobe a `revision`. Desde a 2.22.0, se nenhum locutor ficou sem pessoa, solta a gravação
        parada à espera dos nomes, como `updateSpeaker`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeakerMerge"
            examples:
              mesclar:
                $ref: "#/components/examples/SpeakerMergeRequest"
      responses:
        "200":
          description: Transcrição depois da mesclagem.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/segments/{segment_id}:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [transcripts]
      operationId: updateSegment
      summary: Corrigir o texto ou o locutor de um segmento
      description: Corrigir o texto descarta as `words` do segmento. Sobe a `revision`.
      security:
        - sessionCookie: []
        - pat: ["transcripts:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentPatch"
            examples:
              corrigir:
                $ref: "#/components/examples/SegmentPatchRequest"
      responses:
        "200":
          description: Segmento atualizado.
          content:
            application/json:
              schema:
                $ref: "./transcript.schema.json#/$defs/Segment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/transcripts/{transcript_id}/summaries:
    parameters:
      - $ref: "#/components/parameters/TranscriptId"
    get:
      tags: [summaries]
      operationId: listSummaries
      summary: Resumos da transcrição
      description: Da maior `version` para a menor; os números podem pular (ver `Summary`).
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Resumos, da versão mais nova para a mais antiga.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryPage"
              examples:
                resumos:
                  $ref: "#/components/examples/SummaryPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      tags: [summaries]
      operationId: createSummary
      summary: Gerar um resumo com um tipo de agenda
      description: |
        Cada geração é uma nova `version` do resumo daquele tipo de agenda, com as instruções de
        resumo dele. Sem `agenda_type_id`, vale o tipo da gravação; sem nenhum dos dois, 422. Sem
        `provider_id` e sem provider padrão habilitado na plataforma, também 422.

        Desde a 2.15.0, o pedido conta na cota de pedidos ao agente em 24 h (estourada, 403
        `quota_exceeded`), e a conta tem no máximo 3 resumos na fila ou rodando (além disso, 429
        `rate_limited`).
      security:
        - sessionCookie: []
        - pat: ["summaries:write"]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SummaryCreate"
            examples:
              ata:
                $ref: "#/components/examples/SummaryCreateRequest"
      responses:
        "202":
          description: Resumo na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
              examples:
                naFila:
                  $ref: "#/components/examples/SummaryQueued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/summaries/{summary_id}:
    parameters:
      - $ref: "#/components/parameters/SummaryId"
    get:
      tags: [summaries]
      operationId: getSummary
      summary: Um resumo
      security:
        - sessionCookie: []
        - pat: ["summaries:read"]
      responses:
        "200":
          description: Resumo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
              examples:
                pronto:
                  $ref: "#/components/examples/SummaryDone"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [summaries]
      operationId: deleteSummary
