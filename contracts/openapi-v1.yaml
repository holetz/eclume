      security:
        - adminSessionCookie: []
      summary: Generate a password reset link for a user
      description: >-
        Since 2.18.0. Single-use link, valid for 24 hours, that the admin hands over out of band to
        whoever asked: `<public url>/redefinir-senha#<secret>`, with the secret in the fragment (it
        reaches neither logs nor the `Referer`). The server stores only the hash, and `url` comes
        back only here. A new link expires the account's earlier unused ones; deactivating the
        account voids the pending link. Deactivated account, 409 `conflict`. The admin never sees
        nor sets the password.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Link generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetLink"
              examples:
                novo:
                  $ref: "#/components/examples/PasswordResetLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/jobs/{job_id}/retry:
    post:
      tags: [admin]
      operationId: retryTranscriptionJob
      security:
        - adminSessionCookie: []
      summary: Retry a transcription job that failed
      description: >-
        Creates the job of the recording's next revision, with the platform's current
        configuration, and enqueues it. Applies to any user's recording, but only to the
        recording's most recent job and in state `failed`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: New job in the queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobRetried"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/health:
    get:
      tags: [admin]
      operationId: getAdminHealth
      security:
        - adminSessionCookie: []
      summary: Health of the queue, the GPU and the models
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
              examples:
                gpu:
                  $ref: "#/components/examples/AdminHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: |
        Browser session, opened by `POST /api/v1/auth/login` or by signup. It has all of the
        user's permissions over their own account. Mutating methods require an `X-CSRF-Token` equal
        to the `eclume_csrf` cookie (double-submit). PAT management, the notice acceptance and the
        voice routes accept **only** a session. It does not reach `/api/v1/admin/*`.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: eclume_admin_session
      description: |
        Session of the admin account, opened by `POST /api/v1/admin/auth/login` (HttpOnly, Secure,
        SameSite=Strict, `Path=/api/v1/admin`, 12 h). It is the only credential accepted on
        `/api/v1/admin/*`, and it is ignored on any other route. Mutating methods require an
        `X-CSRF-Token` equal to the `eclume_admin_csrf` cookie (double-submit).
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<secret>
      description: |
        Personal PAT: `Authorization: Bearer eclp_<secret>`. It acts as the owning user, limited
        to the granted scopes. The scopes each operation requires are in its security requirement
        (`pat: [scope, ...]`, all mandatory; several `pat` requirements are alternatives, and
        one is enough). No scope implies another. With a scope missing, the response is 403 with
        `code: insufficient_scope` and `required_scopes`.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Required with a session: the value of the `eclume_csrf` cookie, or of `eclume_admin_csrf` on
        `/api/v1/admin/*`. Ignored with a PAT.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned in `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: |
        Only items with `updated_at >= since` (inclusive). Since 2.8.0, a summary that finishes or is
        edited also moves the `updated_at` of the recording and of the transcript it belongs to. Since
        2.17.0, a `summary` stage that ends `failed` or `skipped` moves the `updated_at` of the
        recording only, so that clients report the end of processing (holetz/eclume#118).
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Person id; only transcripts (or excerpts) in which a speaker is linked to that person.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Only recordings with this tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Only recordings in this collection.
      schema:
        type: string
        format: uuid
    PairingCodeId:
      name: pairing_code_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgendaTypeId:
      name: agenda_type_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldId:
      name: field_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentFileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentActionId:
      name: action_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BaseChatId:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: No credential, or an invalid, expired or revoked credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ['Bearer realm="eclume"']
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semCredencial:
              $ref: "#/components/examples/ProblemUnauthorized"
    Forbidden:
      description: >-
        Valid credential without permission (scope or owner), a PAT on an operation that accepts only a session
        (`code: session_required`), signup closed (`code: signup_closed`) or a session of an account that
        has not yet accepted the notice in force (`code: notice_required`; before acceptance, only `GET /me`,
        `POST /me/notice` and `/auth/*` respond, and `POST /devices/login` issues no credential).
        Since 2.15.0, the account's quota exceeded (`code: quota_exceeded`, with `quota`, `limit` and
        `used`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semEscopo:
              $ref: "#/components/examples/ProblemInsufficientScope"
    NotFound:
      description: Does not exist or does not belong to the user (eclume does not tell the two apart).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            naoEncontrado:
              $ref: "#/components/examples/ProblemNotFound"
    ValidationFailed:
      description: Invalid body or parameters.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalido:
              $ref: "#/components/examples/ProblemValidation"
    Conflict:
      description: >-
        The current state prevents the operation (upload already completed, duplicate name, job in progress,
        summary changed since the opened version, chat with a request open).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: >-
        Since 2.29.0. The audio of the recording was deleted by the retention policy
        (`code: audio_deleted`); the transcript and the summary stay.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: >-
        The file is not of a type the route accepts (`code: unsupported_media_type`, since
        2.23.0), or the content does not match the extension.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: >-
        Body above the route's ceiling (`code: payload_too_large`, since 2.14.0); `limit` gives the
        ceiling in bytes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            corpoGrande:
              $ref: "#/components/examples/ProblemPayloadTooLarge"
    InternalError:
      description: >-
        Unexpected server failure (`code: internal_error`, since 2.14.0); the detail stays in the
        server log, with the response's `X-Request-ID`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        Limit reached (`code: rate_limited`): open requests, such as the 3 previews in
        progress per account (try again when one finishes), or attempts per minute on the
        credential routes (login, signup, admin login and `/devices/*`, per IP), with
        `Retry-After`. On password logins, since 2.14.0, only failures count: per (account,
        IP) pair, plus an account ceiling that does not block an IP that has already signed in to it successfully; success resets the
        pair.
      headers:
        Retry-After:
          description: Seconds until the attempts window reopens.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: RFC 9457 error. The client decides by `code`, never by `title`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: |
            Stable code. v1 values: `unauthorized`, `insufficient_scope`, `forbidden`,
            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,
            `rate_limited`; since 1.4.0, `session_required` (a PAT on a session-only operation);
            since 2.0.0, `email_taken` (signup with an existing e-mail) and `signup_closed`;
            since 2.2.0, `summary_changed` (the summary changed since the opened version),
            `summary_missing`, `transcript_missing` and `chat_busy` (an adjustment request is already
            open); since 2.3.0, `invalid_pairing_code` (pairing code nonexistent,
            expired or used) and `notice_required` (session of an account that has not yet accepted the notice in
            force); since 2.14.0, `payload_too_large`, `upload_completing` and `internal_error`;
            since 2.15.0, `quota_exceeded` (the account's quota exceeded); since 2.18.0,
            `invalid_reset_link` (password reset link nonexistent, expired or used).
            New codes are added additively.
          type: string
        limit:
          description: >-
            With `payload_too_large`, the route's body ceiling in bytes (since 2.14.0); with
            `quota_exceeded`, the quota's limit (since 2.15.0).
          type: integer
        quota:
          description: With `quota_exceeded`, the exceeded quota (since 2.15.0).
          type: string
          enum: [storage_bytes, file_bytes, open_uploads, agent_requests_24h]
        used:
          description: >-
            With `quota_exceeded`, the usage the request would lead to (bytes, open uploads or requests
            in 24 h; for `file_bytes`, the file size) (since 2.15.0).
          type: integer
        required_scopes:
          description: |
            With `insufficient_scope`, the missing scopes; on an operation with alternative `pat`
            requirements, the alternatives (one of them is enough).
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        errors:
          description: With `validation_failed`, one item per invalid field.
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                description: Field path (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string

    Scope:
      description: >-
        PAT scope. `recordings:delete` (2.3.0) deletes recordings. The "Conexão MCP" screen groups the
        scopes into "Buscar e ler gravações" (`recordings:read`, `transcripts:read`), "Ler e editar
        resumos" (`summaries:read`, `summaries:write`), "Editar campos e tags" (`recordings:write`)
        and "Excluir gravações" (`recordings:delete`).
      type: string
      enum:
        - recordings:read
        - recordings:write
        - recordings:delete
        - transcripts:read
        - transcripts:write
        - people:read
        - people:write
        - summaries:read
        - summaries:write

    Health:
      type: object
      required: [status, version, contract_version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          description: Server version.
          type: string
        contract_version:
          description: Version of this contract that the server implements (`info.version`).
          type: string
        commit:
          description: >-
            Since 2.12.0: the git SHA the server image was built from (the deploy
            writes it). Absent outside a production image.
          type: string
          pattern: "^[0-9a-f]{7,40}$"

    HealthReady:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, down]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            additionalProperties: false
            properties:
              name:
                type: string
                enum: [postgres, redis, storage]
              status:
                type: string
                enum: [ok, down]

    PasswordResetCheck:
      type: object
      required: [token]
      properties:
        token:
          description: The link's secret, read from the fragment of `/redefinir-senha#<token>`.
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    PasswordReset:
      type: object
      required: [token, new_password]
      properties:
        token:
          description: The link's secret, as in `PasswordResetCheck`.
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          description: At least 12 characters, as at signup.
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true

    PasswordResetInfo:
      description: Since 2.18.0. What the reset page shows of a valid link.
      type: object
      required: [email, expires_at]
      properties:
        email:
          type: string
          format: email
        expires_at:
          type: string
          format: date-time

    PasswordResetLink:
      description: Since 2.18.0. The freshly generated reset link; `url` is returned only on creation.
      type: object
      required: [url, expires_at]
      properties:
        url:
          description: "`<public url>/redefinir-senha#<secret>`."
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true

    Notice:
      description: Notice the account accepts at creation ("I am responsible for asking the people I record for their consent").
      type: object
      required: [version, text]
      properties:
        version:
          type: string
        text:
          type: string

    SignupInfo:
      type: object
      required: [open, notice]
      properties:
        open:
          description: "`false` with `ECLUME_SIGNUP_OPEN=false`: signup responds 403 `signup_closed`."
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"

    SignupRequest:
      type: object
      required: [name, email, password, notice_version]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        notice_version:
          description: Version of the accepted notice; it must be the one in force.
          type: string
          minLength: 1

    NoticeAccept:
      type: object
      required: [notice_version]
      properties:
        notice_version:
          type: string
          minLength: 1

    User:
      type: object
      required: [id, email, name, active, created_at, last_login_at, notice_version, notice_accepted_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        notice_version:
          description: Version of the accepted notice, or `null` on an account that has not yet accepted it.
          type: [string, "null"]
        notice_accepted_at:
          type: [string, "null"]
          format: date-time

    AdminUser:
      description: >-
        User account as seen by the admin (the `User` plus the recording count and, since 2.15.0,
        the usage and the quota override).
      type: object
      required:
        - id
        - email
        - name
        - active
        - created_at
        - last_login_at
        - notice_version
        - notice_accepted_at
        - recording_count
        - quotas
        - usage
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        notice_version:
          type: [string, "null"]
        notice_accepted_at:
          type: [string, "null"]
          format: date-time
        recording_count:
          type: integer
          minimum: 0
        quotas:
          description: >-
            Only the fields this account overrides from the platform default (`null` in a field means no
            limit); `null` when the account follows the whole default.
          oneOf:
            - $ref: "#/components/schemas/QuotasOverride"
            - type: "null"
        usage:
          $ref: "#/components/schemas/UsageNow"

    QuotasOverride:
      description: >-
        Partial quotas (since 2.15.0): only the fields present apply; `null` in a field means no
        limit.
      type: object
      additionalProperties: false
      properties:
        storage_bytes:
          type: [integer, "null"]
          minimum: 0
        file_bytes:
          type: [integer, "null"]
          minimum: 0
        open_uploads:
          type: [integer, "null"]
          minimum: 0
        gpu_minutes_24h:
          type: [integer, "null"]
          minimum: 0
        agent_requests_24h:
          type: [integer, "null"]
          minimum: 0

    UserPatch:
      description: At least one field; since 2.15.0, `active` is optional and `quotas` is added.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        active:
          description: "`false` deactivates the account, ends its sessions and revokes its PATs."
          type: boolean
        quotas:
          description: >-
            Replaces the account's whole quota override with the fields sent (`null` in a field
            means no limit); `quotas: null` returns the account to the platform default.
          oneOf:
            - $ref: "#/components/schemas/QuotasOverride"
            - type: "null"

    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AdminAccount:
      description: Admin account, separate from the user accounts.
      type: object
      required: [id, email, name, created_at, last_login_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    AdminRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Quotas:
      description: >-
        Quotas of an account (since 2.15.0); `null` means no limit. Transcribed audio minutes and
        agent requests count over a rolling 24 h window.
      type: object
      required: [storage_bytes, file_bytes, open_uploads, gpu_minutes_24h, agent_requests_24h]
      properties:
        storage_bytes:
          description: Total storage (recording audio plus open uploads), in bytes.
          type: [integer, "null"]
          minimum: 0
        file_bytes:
          description: Maximum size of one file, in bytes.
          type: [integer, "null"]
          minimum: 0
        open_uploads:
          description: Uploads open at the same time.
          type: [integer, "null"]
          minimum: 0
        gpu_minutes_24h:
          description: >-
            Audio minutes sent to transcription in 24 h. Past the limit nothing is refused: the
            recording waits in the queue until the window opens.
          type: [integer, "null"]
          minimum: 0
        agent_requests_24h:
          description: The person's requests to the agent (summaries, chats, previews) in 24 h.
          type: [integer, "null"]
          minimum: 0

    UsageNow:
      description: Current usage of an account (since 2.15.0).
      type: object
      required: [storage_bytes, open_uploads, gpu_minutes_24h, agent_requests_24h]
      properties:
        storage_bytes:
          type: integer
          minimum: 0
        open_uploads:
          type: integer
          minimum: 0
        gpu_minutes_24h:
          type: integer
          minimum: 0
        agent_requests_24h:
          type: integer
          minimum: 0

    Usage:
      description: Usage and effective quota of the account (since 2.15.0).
      type: object
      required: [usage, quotas]
      properties:
        usage:
          $ref: "#/components/schemas/UsageNow"
        quotas:
          $ref: "#/components/schemas/Quotas"

    Me:
      type: object
      required: [user, auth, notice_required]
      properties:
        user:
          $ref: "#/components/schemas/User"
        notice_required:
          description: The account has not yet accepted the notice in force (`POST /api/v1/me/notice`).
          type: boolean
        auth:
          type: object
          required: [method, scopes, token_id]
          properties:
            method:
              type: string
              enum: [session, pat]
            scopes:
              description: With a session, every scope.
              type: array
              items:
                $ref: "#/components/schemas/Scope"
            token_id:
              description: Id of the PAT in use, or `null` with a session.
              type: [string, "null"]
              format: uuid

    VoiceAssignment:
      description: >-
        The account's automatic speaker assignment: with it on and voice identification on
        on the platform, the speaker whose voice passes the threshold is linked to the person at ingestion, before the
        summary, and comes out with `auto_score` on the `Speaker`.
      type: object
      required: [enabled, threshold, platform_enabled, keep_samples, sample_count, voiceprint_people]
      properties:
        enabled:
          type: boolean
        threshold:
          description: Minimum score (normalized cosine) to link on its own, from 0.50 to 0.99.
          type: number
          minimum: 0.5
          maximum: 0.99
        platform_enabled:
          description: Voice identification is on on the platform; when off, nothing is assigned.
          type: boolean
        keep_samples:
          description: >-
            Since 2.19.0. The account keeps voice samples and voiceprints (default `true`). When off,
            nothing of the account's voice is computed, compared or stored; turning it off immediately deletes the
            account's samples, per-recording vectors and pending suggestions.
          type: boolean
        sample_count:
          description: Since 2.19.0. How many voice samples the account keeps.
          type: integer
          minimum: 0
        voiceprint_people:
          description: Since 2.19.0. How many people of the account have a voiceprint (at least one sample).
          type: integer
          minimum: 0

    SpeakerNamingPreference:
      description: >-
        Since 2.22.0. Whether the account requires naming the speakers before the agent chain, and how many
        recordings are waiting for it.
      type: object
      required: [required, waiting_count]
      properties:
        required:
          type: boolean
        waiting_count:
          description: Recordings whose current revision has the `speakers` stage in `waiting`.
          type: integer
          minimum: 0

    SpeakerNamingPatch:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required:
          type: boolean

    TranscriptionPreference:
      description: >-
        Since 2.20.0. The account's preferred transcription language and the server default that applies
        when the account does not choose one.
      type: object
      required: [language, platform_default]
      properties:
        language:
          description: Language (BCP 47), `auto` (detect) or `null` (server default).
          type: [string, "null"]
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        platform_default:
          description: The platform's `asr.default_language` (`pt` when unconfigured); it may be `auto`.
          type: string

    TranscriptionPreferencePatch:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language:
          description: Language (BCP 47), `auto` or `null` to return to the server default.
          type: [string, "null"]
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"

    AudioRetention:
      description: >-
        Since 2.29.0. How long the audio of the account's recordings stays on the server, the
        platform ceiling and the window in force.
      type: object
      required: [days, max_days, effective_days]
      properties:
        days:
          description: The account's choice in days; `null` is off (the default).
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
        max_days:
          description: The admin's ceiling (`retention.audio_max_days`); `null` is none.
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
        effective_days:
          description: "`days` capped by `max_days`; `null` when `days` is off, whatever the ceiling."
          type: [integer, "null"]
          minimum: 1
          maximum: 3650

    AudioRetentionPatch:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          description: Days from 1 to 3650, or `null` to turn retention off.
          type: [integer, "null"]
          minimum: 1
          maximum: 3650

    VoiceAssignmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        threshold:
          type: number
          minimum: 0.5
          maximum: 0.99
        keep_samples:
          description: >-
            Since 2.19.0. `false` immediately deletes the account's samples, per-recording vectors and
            pending suggestions; the voice files in storage go shortly after.
            `true` resumes keeping from the next transcriptions on, without recovering what was removed.
          type: boolean

    NextCursor:
      description: Cursor of the next page, or `null` on the last one.
      type: [string, "null"]

    Token:
      type: object
      required: [id, name, kind, platform, scopes, prefix, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          description: "With `kind: device`, the device name."
          type: string
        kind:
          $ref: "#/components/schemas/TokenKind"
        platform:
          description: "With `kind: device`, the device platform; `null` on a personal PAT."
          oneOf:
            - $ref: "#/components/schemas/DevicePlatform"
            - type: "null"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        prefix:
          description: Start of the secret, to recognize the token (`eclp_7Hq2`).
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    TokenKind:
      description: >-
        `personal`, the PAT created in "Tokens de acesso" or "Conexão MCP"; `device`, the credential
        of a device, issued by login or by pairing.
      type: string
      enum: [personal, device]

    DevicePlatform:
      type: string
      enum: [windows, macos, linux, ios, android]

    ServerInfo:
      type: object
      required: [name, url, mcp_url, ca_sha256, version, contract_version]
      properties:
        name:
          description: Server name (`ECLUME_SERVER_NAME`), also the instance on mDNS.
          type: string
        url:
          description: Public address (`ECLUME_PUBLIC_URL`).
          type: string
          format: uri
        mcp_url:
          description: Address of the MCP server, which the assistant receives.
          type: string
          format: uri
        ca_sha256:
          description: >-
            SHA-256, in lowercase hex, of the DER of the root certificate served at
            `/downloads/eclume-root.crt`; `null` while the root has not been published.
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        ca_next_sha256:
          description: >-
            Since 2.21.0. SHA-256, in lowercase hex, of the DER of the next root during rotation,
            served at `/downloads/eclume-root-proxima.crt`; absent or `null` outside it. The app
            with the current root pinned downloads the next one over that same connection, checks its fingerprint and
            keeps it, to switch on its own when the server starts serving it.
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        version:
          description: Server version.
          type: string
        contract_version:
          description: Version of this contract that the server implements.
          type: string

    PrivacyInfo:
      description: Since 2.19.0. Where each piece of data goes, under the configuration in force.
      type: object
      required: [destinations]
      properties:
        destinations:
          description: One item per purpose, in the order of `DataPurpose`.
          type: array
          items:
            $ref: "#/components/schemas/DataDestination"

    DataPurpose:
      description: >-
        `transcription` é o áudio virando texto; as demais são as finalidades de agente (resumos,
        campos, chat e detecção do tipo de agenda).
      type: string
      enum: [transcription, summaries, fields, chat, agenda_detection]

    DataDestination:
      type: object
      required: [purpose, location, processor]
      properties:
        purpose:
          $ref: "#/components/schemas/DataPurpose"
        location:
          description: >-
            `server`: neste servidor; `local_network`: em outra máquina da rede local; `external`:
            fora do servidor e da rede; `disabled`: nenhum provider habilitado para a finalidade, e
            nada é enviado. Na dúvida, o servidor responde `external`.
          type: string
          enum: [server, local_network, external, disabled]
        processor:
          description: >-
            Com `external`, quem processa: o fornecedor (por exemplo `Anthropic`) ou só o host do
            endereço (por exemplo `api.deepseek.com`); `null` nos demais.
          type: [string, "null"]

    DeviceLogin:
      type: object
      required: [email, password, device_name, platform]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        device_name:
          description: Nome do aparelho, que vira o nome do token ("iPhone da Mariana").
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: "#/components/schemas/DevicePlatform"

    DevicePair:
      type: object
      required: [code, device_name, platform]
      properties:
        code:
          description: O código de pareamento (`K7Q-4MX` ou `k7q4mx`).
          type: string
          minLength: 1
          maxLength: 32
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: "#/components/schemas/DevicePlatform"

    DeviceCredential:
      type: object
      required: [token, secret, server]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          description: O token completo, que o app guarda. Não é mostrado de novo.
          type: string
          pattern: "^eclp_[A-Za-z0-9]{32,}$"
        server:
          $ref: "#/components/schemas/ServerInfo"

    PairingCode:
      type: object
      required: [id, status, expires_at, token_id]
      properties:
        id:
          type: string
          format: uuid
        status:
          description: "`expired` vale também para o código vencido por um código mais novo."
          type: string
          enum: [pending, used, expired]
        expires_at:
          type: string
          format: date-time
        token_id:
          description: Com `used`, a credencial de dispositivo que o código emitiu.
          type: [string, "null"]
          format: uuid
        code:
          description: Só na criação. 6 caracteres de `23456789ABCDEFGHJKMNPQRSTVWXYZ`.
          type: string
          pattern: "^[2-9A-HJKMNP-TV-Z]{6}$"
        display:
          description: Só na criação. O código como a tela mostra (`K7Q-4MX`).
          type: string
        pair_url:
          description: >-
            Só na criação. Conteúdo do QR: `<url>/parear?codigo=<code>&ca=<ca_sha256>` (sem `ca`
            enquanto a raiz não foi publicada).
          type: string
          format: uri

    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          description: Sem valor, o PAT não expira.
          type: [string, "null"]
          format: date-time

    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          description: O PAT completo. Não é mostrado de novo.
          type: string
          pattern: "^eclp_[A-Za-z0-9]{32,}$"

    TokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Source:
      description: Origem do áudio. `desktop` e `mobile` são os apps que gravam.
      type: string
      enum: [desktop, mobile, upload, api]

    Capture:
      description: Contexto da captura, preenchido pelo app que gravou (desktop ou celular).
      type: object
      properties:
        meeting_app:
          description: App de reunião detectado.
          type: [string, "null"]
          enum: [teams, meet, zoom, other, null]
        device_name:
          type: [string, "null"]
        client_version:
          description: Versão do app que gravou (`eclume-desktop/0.3.0`, `eclume-android/0.1.0`).
          type: [string, "null"]

    RecordingMetadata:
      description: Metadados livres de organização (tipo de reunião, cliente, projeto).
      type: object
      additionalProperties:
        type: string

    UploadCreate:
      type: object
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: "Tipo do arquivo, com parâmetros opcionais (`audio/ogg; codecs=opus`, a saída do navegador; `audio/webm`; `video/mp4`)."
          type: string
          pattern: "^(audio|video)/[A-Za-z0-9.+-]+(\\s*;.*)?$"
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          description: SHA-256 do arquivo inteiro, em hex minúsculo.
          type: string
          pattern: "^[0-9a-f]{64}$"
        title:
          description: Sem valor, deriva do nome do arquivo.
          type: string
          minLength: 1
        recorded_at:
          description: Início da gravação. Sem valor, vale a hora do envio (`recorded_at_source` `upload`).
          type: string
          format: date-time
        recorded_at_source:
          description: |
            De onde veio `recorded_at`. Sem valor, o servidor decide: com `recorded_at` e
            `source` `desktop` ou `mobile`, `capture`; com `recorded_at` e outra origem, `user`;
            sem `recorded_at`, `upload`.
          $ref: "#/components/schemas/RecordedAtSource"
        kind:
          $ref: "#/components/schemas/RecordingKind"
        agenda_type_id:
          description: |
            Tipo de agenda escolhido ao parar a gravação no celular: vira o tipo escolhido pelo
            usuário (origem `edited`) e dispensa a detecção.
          type: string
          format: uuid
        markers:
          description: |
            Marcadores feitos durante a gravação, com o `device_name` da captura. Idempotentes por
            `client_id`: num upload deduplicado, entram na gravação existente.
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MarkerInput"
        duration_ms:
          type: integer
          minimum: 0
        language:
          description: >-
            Idioma esperado (BCP 47) ou, desde a 2.20.0, `auto` (a engine detecta e a gravação guarda
            o detectado). Sem valor, vale o idioma preferido da conta, depois o padrão do servidor.
          type: string
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        source:
          $ref: "#/components/schemas/Source"
        capture:
          $ref: "#/components/schemas/Capture"
        tags:
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"

    UploadStatus:
      type: string
      enum: [in_progress, completed, aborted, expired, deduplicated]

    PartUrl:
      type: object
      required: [part_number, method, url, headers, expires_at]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum: [PUT]
        url:
          description: URL opaca da parte.
          type: string
          format: uri
        headers:
          description: Headers que o `PUT` deve levar.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    ReceivedPart:
      type: object
      required: [part_number, etag, size_bytes]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
        size_bytes:
          type: integer
          minimum: 1

    Upload:
      type: object
      required: [id, status, filename, content_type, size_bytes, sha256, part_size, part_count, parts_received, parts, recording_id, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadStatus"
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        part_size:
          description: Tamanho de toda parte menos a última, em bytes (mínimo 5 MiB).
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        parts_received:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedPart"
        parts:
          description: URLs já emitidas para partes pendentes; pode vir parcial ou vazio.
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"
        recording_id:
          description: Gravação criada pelo `complete`, ou a existente num `deduplicated`.
          type: [string, "null"]
          format: uuid
        expires_at:
          description: Depois disso o upload inacabado é descartado (`upload_expired`).
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PartUrlsRequest:
      type: object
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PartUrls:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"

    UploadComplete:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string

    RecordingStatus:
      description: "`uploading` → `queued` → `processing` → `transcribed` | `failed`."
      type: string
      enum: [uploading, queued, processing, transcribed, failed]

    Job:
      description: Job de transcrição mais recente da gravação.
      type: object
      required: [id, state, stage, progress, attempts, error, queued_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        stage:
          description: |
            Etapa em curso, ou `null` fora de execução. `preprocessing` é o tratamento do áudio
            antes do ASR (holetz/eclume#33).
          type: [string, "null"]
          enum: [preprocessing, asr, alignment, diarization, embeddings, finalizing, null]
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  description: >-
                    `hash_mismatch`, `unsupported_media`, `gpu_oom`, `engine_error`... e, desde a
                    1.4.0, `worker_lost` (o worker GPU parou no meio do job), `job_lost` (o job
                    sumiu da fila sem resposta) e `job_stalled` (progresso parado além do teto),
                    detectados pelo server. Desde a 2.5.0, `ingest_failed`: a transcrição ficou
                    pronta no worker GPU, mas o server não conseguiu gravá-la (a ingestão falhou ou
                    nunca chegou); recuperável. Desde a 2.10.0, `cancelled`: o dono cancelou a
                    transcrição (ou excluiu a gravação); recuperável, com `state` `cancelled`.
                  type: string
                message:
                  type: string
                retryable:
                  description: >-
                    A falha é passageira (worker perdido, job sumido ou parado, ingestão falha,
                    falta de VRAM): retranscrever ou `POST /api/v1/admin/jobs/{job_id}/retry`
                    tende a resolver.
                    Ausente em servidores anteriores à 1.4.0.
                  type: boolean
            - type: "null"
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        queue:
          description: |
            Por que o job espera, enquanto `state` é `queued`; `null` em qualquer outro estado.
            Ausente em servidores anteriores à 2.16.0 (holetz/eclume#117).
          oneOf:
            - $ref: "#/components/schemas/JobQueue"
            - type: "null"

    JobQueue:
      description: |
        A espera de um job `queued`, calculada na leitura. Só contagens e horários: nada de outra
        conta. Esperar nunca vira falha; o job segue `queued`.
      type: object
      required: [reason, ahead, account_ahead, estimated_start_at, resumes_at, processor]
      properties:
        reason:
          description: |
            `processor_queue` (na fila do processador de transcrição), `account_turn` (atrás de
            outras gravações da própria conta, pela fila justa) ou `quota_window` (a conta passou
            dos minutos de transcrição de 24 h). Enum aberto: clientes toleram valor novo.
          type: string
          enum: [processor_queue, account_turn, quota_window]
        ahead:
          description: |
            Em `processor_queue`, quantos jobs começam antes deste, contando o que está rodando;
            `null` nos outros motivos ou se o job não está na fila do processador.
          type: [integer, "null"]
          minimum: 0
        account_ahead:
          description: Em `account_turn`, quantas gravações da própria conta vêm antes; `null` nos outros.
          type: [integer, "null"]
          minimum: 0
        estimated_start_at:
          description: |
            Previsão de início, pela duração real das últimas transcrições; é estimativa, e os
            clientes a rotulam assim. `null` sem histórico suficiente, com o processador fora do
            ar ou fora de `processor_queue`.
          type: [string, "null"]
          format: date-time
        resumes_at:
          description: Em `quota_window`, quando a janela de 24 h volta a ter minutos; `null` nos outros.
          type: [string, "null"]
          format: date-time
        processor:
          $ref: "#/components/schemas/ProcessorStatus"

    ProcessorStatus:
      description: Se o processador de transcrição está no ar, pelo heartbeat do worker GPU.
      type: object
      required: [online, offline_since]
      properties:
        online:
          type: boolean
        offline_since:
          description: |
            Fora do ar, o último heartbeat visto (precisão de 1 min); `null` no ar ou se nunca
            houve heartbeat.
          type: [string, "null"]
          format: date-time

    RecordingKind:
      description: "`meeting` (reunião, o padrão) ou `note` (nota por voz)."
      type: string
      enum: [meeting, note]

    RecordedAtSource:
      description: |
        Origem de `recorded_at`: `capture` (relógio do app que gravou), `file_metadata` (lida do
        arquivo e confirmada na importação), `user` (digitada ou corrigida) ou `upload` (sem data;
        vale a hora do envio).
      type: string
      enum: [capture, file_metadata, user, upload]

    Recording:
      type: object
      required: [id, title, status, kind, source, recorded_at, recorded_at_source, duration_ms, language, size_bytes, content_type, content_hash, owner, tags, collection_ids, collections_origin, metadata, capture, agenda_type, job, pipeline, awaiting, transcript_id, marker_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatus"
        kind:
          $ref: "#/components/schemas/RecordingKind"
        source:
          $ref: "#/components/schemas/Source"
        recorded_at:
          description: Início da gravação; o fim é `recorded_at + duration_ms`.
          type: string
          format: date-time
        recorded_at_source:
          $ref: "#/components/schemas/RecordedAtSource"
        duration_ms:
          description: "`null` até o áudio ser lido."
          type: [integer, "null"]
          minimum: 0
        language:
          description: Idioma pedido ou detectado; `auto` só enquanto a detecção não roda.
          type: [string, "null"]
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          description: "Obsoleto desde a 2.11.0: sempre o próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          $ref: "./transcript.schema.json#/$defs/UserRef"
        tags:
          type: array
          items:
            type: string
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        collections_origin:
          description: |
            De quem é a lista de coleções: `auto` (o agente, pelas coleções automáticas), `edited` (o
            usuário mudou; o agente não mexe mais) ou `null` (vinda do envio, ou ainda sem escolha: o
            agente só soma).
          type: [string, "null"]
          enum: [auto, edited, null]
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"
        capture:
          oneOf:
            - $ref: "#/components/schemas/Capture"
            - type: "null"
        agenda_type:
          description: |
            Tipo de agenda da gravação: detectado pelo agente (`auto`) ou escolhido pelo usuário
            (`edited`), que a detecção nunca troca.
          oneOf:
            - type: object
              required: [id, name, origin]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                origin:
                  type: string
                  enum: [auto, edited]
            - type: "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        pipeline:
          description: |
            As sete etapas do processamento da revisão atual, em ordem; a que ainda não rodou sai
            `pending`. Enquanto o worker GPU reporta progresso, o pré-processamento ou a transcrição
            sai `active`. A etapa `speakers` entrou na 2.22.0 (eram seis).
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/PipelineStep"
        awaiting:
          description: |
            Desde a 2.22.0. O que a gravação espera do dono para seguir: `speakers` quando a etapa
            `speakers` está `waiting` (a conta exige nomear os locutores e falta alguém); `null`
            nas outras.
          type: [string, "null"]
          enum: [speakers, null]
        transcript_id:
          description: Transcrição, depois do primeiro job concluído.
          type: [string, "null"]
          format: uuid
        marker_count:
          description: Marcadores da gravação.
          type: integer
          minimum: 0
        audio_deleted_at:
          description: >-
            Since 2.29.0. When the retention policy deleted the audio; `null` while it exists. The
            server always sends it. A recording without audio refuses playback (410) and
            retranscription (409), both with `code: audio_deleted`.
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PipelineStep:
      type: object
      required: [step, state, started_at, finished_at, duration_ms, error, reason]
      properties:
        step:
          type: string
          description: >-
            Na ordem da cadeia; o tipo de agenda vem antes dos campos. `speakers` (desde a 2.22.0)
            fica entre a transcrição e o tipo de agenda.
          enum: [received, preprocessing, transcription, speakers, agenda_type, fields, summary]
        state:
          type: string
          description: >-
            `waiting` (desde a 2.22.0) é só da etapa `speakers`: parada à espera de o dono nomear
            os locutores, com `reason` `unnamed_speakers`.
          enum: [pending, active, done, failed, skipped, waiting]
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: [integer, "null"]
          minimum: 0
        error:
          description: Com `state` `failed`.
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
        reason:
          description: |
            Por que a etapa foi pulada: `no_provider`, `no_auto_fields`, `no_types`, `set_by_user`,
            `no_agenda_type`, `before_pipeline` (gravação anterior ao pipeline), `cancelled` (a
            transcrição foi cancelada nesta etapa, desde a 2.10.0), entre outros. Desde a 2.22.0,
            na etapa `speakers`: `unnamed_speakers` (em `waiting`), `continued_by_user` e
            `naming_not_required` (soltas sem os nomes).
          type: [string, "null"]

    RecordingPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        recorded_at:
          description: Corrigir a data passa `recorded_at_source` a `user`.
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/RecordingKind"
        language:
          description: Idioma (BCP 47) ou, desde a 2.20.0, `auto` (a engine detecta).
          type: string
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        tags:
          description: Substitui a lista inteira.
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        collection_ids:
          description: Substitui a lista inteira.
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        metadata:
          description: Substitui o objeto inteiro (até 50 entradas).
          type: object
          maxProperties: 50
          propertyNames:
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 1000
        agenda_type_id:
          description: |
            Tipo de agenda escolhido pelo usuário (origem `edited`, que a detecção não troca);
            `null` tira o tipo e devolve a escolha à detecção.
          type: [string, "null"]
          format: uuid

    RecordingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    RetranscribeRequest:
      type: object
      properties:
        language:
          description: Idioma (BCP 47) ou, desde a 2.20.0, `auto` (a engine detecta).
          type: string
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        min_speakers:
          description: |
            Desde a 2.25.0. Mínimo de locutores a esperar nesta revisão; vence os limites do admin
            e a regra da nota de voz (um locutor). Não persiste: vale só para a revisão pedida.
          type: integer
          minimum: 1
          maximum: 30
        max_speakers:
          description: |
            Desde a 2.25.0. Máximo de locutores a esperar nesta revisão (422 se menor que
            `min_speakers`). Uma nota de voz (`kind: note`) sem este campo usa 1 locutor.
          type: integer
          minimum: 1
          maximum: 30

    TranscriptSummary:
      description: Resumo de listagem de uma transcrição (sem segmentos).
      type: object
      required: [id, recording_id, title, language, recorded_at, duration_ms, source, content_hash, revision, created_at, updated_at, owner, speakers]
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        title:
          type: string
        language:
          type: string
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/Source"
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner:
          description: "Obsoleto desde a 2.11.0: sempre o próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          $ref: "./transcript.schema.json#/$defs/UserRef"
        speakers:
          type: array
          items:
            $ref: "./transcript.schema.json#/$defs/Speaker"
        tags:
          type: array
          items:
            type: string
        kind:
          $ref: "#/components/schemas/RecordingKind"
        recorded_at_source:
          $ref: "#/components/schemas/RecordedAtSource"

    TranscriptPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SpeakerPatch:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        person_id:
          description: Pessoa a ligar, ou `null` para desfazer.
          type: [string, "null"]
          format: uuid

    SpeakerMerge:
      type: object
      required: [source_speaker_ids, target_speaker_id]
      properties:
        source_speaker_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^S[0-9]+$"
        target_speaker_id:
          type: string
          pattern: "^S[0-9]+$"

    SegmentPatch:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
          maxLength: 20000
        speaker_id:
          type: string
          pattern: "^S[0-9]+$"

    VoiceSample:
      description: Uma amostra da impressão de voz — um locutor confirmado como a pessoa.
      type: object
      required: [transcript_id, recording_id, recording_title, speaker_id, model, talk_ms, excerpt, created_by, created_at]
      properties:
        transcript_id:
          type: string
          format: uuid
        recording_id:
          description: Gravação da amostra, ou `null` se ela não existe mais.
          type: [string, "null"]
          format: uuid
        recording_title:
          description: Título da gravação, ou `null` se ela não existe mais.
          type: [string, "null"]
        speaker_id:
          type: string
          pattern: "^S[0-9]+$"
        model:
          description: Modelo de embedding da amostra.
          type: string
        talk_ms:
          type: integer
          minimum: 0
        excerpt:
          description: |
            A fala mais longa do locutor, para ouvir a amostra no áudio da gravação
            (`GET /api/v1/recordings/{recording_id}/audio`); `null` sem gravação ou sem fala.
          oneOf:
            - type: object
              required: [start_ms, end_ms]
              properties:
                start_ms:
                  type: integer
                  minimum: 0
                end_ms:
                  type: integer
                  minimum: 0
            - type: "null"
        created_by:
          description: "Obsoleto desde a 2.11.0: sempre o próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        created_at:
          type: string
          format: date-time

    Voiceprint:
      type: object
      required: [person_id, enabled, sample_count, samples]
      properties:
        person_id:
          type: string
          format: uuid
        enabled:
          description: Identificação por voz ligada na plataforma. Desligada, nada é comparado nem vira amostra.
          type: boolean
        sample_count:
          type: integer
          minimum: 0
        samples:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSample"

    Person:
      type: object
      required: [id, name, email, notes, company, department, job_title, phone, tags, transcript_count, last_seen_at, voice_sample_count, speaking_time_ms, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
        notes:
          type: [string, "null"]
        company:
          description: Empresa (empresa, cooperativa, órgão) da pessoa.
          type: [string, "null"]
        department:
          description: Área ou departamento da pessoa na empresa.
          type: [string, "null"]
        job_title:
          description: Cargo ou função.
          type: [string, "null"]
        phone:
          type: [string, "null"]
        tags:
          description: Tags de pessoa, rótulos livres da pessoa (separados das tags das gravações).
          type: array
          items:
            type: string
        transcript_count:
          description: Transcrições do usuário em que a pessoa fala.
          type: integer
          minimum: 0
        last_seen_at:
          description: "`recorded_at` da transcrição mais recente em que a pessoa fala."
          type: [string, "null"]
          format: date-time
        voice_sample_count:
          description: Amostras da impressão de voz da pessoa.
          type: integer
          minimum: 0
        speaking_time_ms:
          description: Soma das falas dos locutores ligados à pessoa, em todas as transcrições.
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        notes:
          type: [string, "null"]
          maxLength: 4000
        company:
          type: [string, "null"]
          maxLength: 120
        department:
          type: [string, "null"]
          maxLength: 120
        job_title:
          type: [string, "null"]
          maxLength: 120
        phone:
          type: [string, "null"]
          maxLength: 40
        tags:
          description: Sem repetição (ignorando a caixa); vazias e espaços nas pontas saem.
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64

    PersonPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: [string, "null"]
          format: email
          maxLength: 254
        notes:
          type: [string, "null"]
          maxLength: 4000
        company:
          type: [string, "null"]
          maxLength: 120
        department:
          type: [string, "null"]
          maxLength: 120
        job_title:
          type: [string, "null"]
          maxLength: 120
        phone:
          type: [string, "null"]
          maxLength: 40
        tags:
          description: Substitui a lista inteira; sem repetição (ignorando a caixa); vazias e espaços nas pontas saem.
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64

    PersonFacetValue:
      type: object
      required: [value, count]
      properties:
        value:
          type: string
        count:
          description: Pessoas com esse valor.
          type: integer
          minimum: 1

    PersonFacets:
      type: object
      required: [companies, departments, tags]
      properties:
        companies:
          type: array
          items:
            $ref: "#/components/schemas/PersonFacetValue"
        departments:
          type: array
          items:
            $ref: "#/components/schemas/PersonFacetValue"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/PersonFacetValue"

    PersonPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SearchHit:
      type: object
      required: [transcript, speaker, segment, highlight, rank]
      properties:
        transcript:
          type: object
          required: [id, recording_id, title, recorded_at]
          properties:
            id:
              type: string
              format: uuid
            recording_id:
              type: string
              format: uuid
            title:
              type: string
            recorded_at:
              type: string
              format: date-time
        speaker:
          $ref: "./transcript.schema.json#/$defs/Speaker"
        segment:
          $ref: "./transcript.schema.json#/$defs/Segment"
        highlight:
          description: Texto do segmento com os termos entre `<mark>` e `</mark>`; nenhum outro HTML.
          type: string
        rank:
          type: number

    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Collection:
      type: object
      required: [id, name, description, instructions, auto_assign, recording_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        instructions:
          description: |
            "Quando incluir": a regra que o agente segue para pôr a gravação na coleção. Pode falar
            do assunto, do tipo de agenda e dos participantes (empresa, área, cargo, tags de pessoa).
          type: string
          maxLength: 4000
        auto_assign:
          description: Com regra, o agente inclui as gravações depois da transcrição.
          type: boolean
        recording_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 2000
        instructions:
          type: string
          maxLength: 4000
        auto_assign:
          type: boolean

    CollectionPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: [string, "null"]
          maxLength: 2000
        instructions:
          type: string
          maxLength: 4000
        auto_assign:
          type: boolean

    CollectionMerge:
      type: object
      required: [into]
      properties:
        into:
          description: A coleção que recebe as gravações; outra que não a mesclada.
          type: string
          format: uuid

    CollectionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Collection"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Tag:
      type: object
      required: [id, name, description, origin, count, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          description: '"Quando usar": vai ao agente junto com o nome.'
          type: string
          maxLength: 4000
        origin:
          description: "`user` (cadastrada pelo usuário) ou `auto` (criada pelo agente no modo autogerenciado)."
          type: string
          enum: [user, auto]
        count:
          description: Gravações com a tag.
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time

    TagList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    TagCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 4000

    TagPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 4000

    TagMerge:
      type: object
      additionalProperties: false
      required: [into]
      properties:
        into:
          description: A tag que fica; outra que não a mesclada.
          type: string
          format: uuid

    TagAssignment:
      type: object
      required: [auto_fill, instructions, mode, new_limit, catalog_count, catalog_limit]
      properties:
        auto_fill:
          description: O agente atribui tags depois da transcrição.
          type: boolean
        instructions:
          description: A regra geral das tags (a do campo embutido Tags).
          type: string
          maxLength: 4000
        mode:
          description: "`fixed`: só as tags cadastradas; `auto`: o agente pode criar tags novas."
          type: string
          enum: [fixed, auto]
        new_limit:
          description: No modo `auto`, quantas tags novas o agente pode criar por gravação.
          type: integer
          minimum: 1
          maximum: 5
        catalog_count:
          description: Tags no cadastro.
          type: integer
          minimum: 0
        catalog_limit:
          description: Acima deste tamanho do cadastro, o agente não cria mais tags.
          type: integer
          minimum: 1

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 1
          format: password
        new_password:
          description: Ao menos 12 caracteres, como no cadastro.
          type: string
          minLength: 1
          format: password
        revoke_tokens:
          description: |
            Desde a 2.14.0. `true` revoga também as credenciais de aparelho e os PATs da conta (os
            aparelhos pedem login de novo); ausente vale `false`.
          type: boolean
          default: false

    AccountDeletion:
      type: object
      required: [password]
      properties:
        password:
          description: A senha da conta, que confirma a exclusão.
          type: string
          minLength: 1
          format: password

    TagAssignmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        auto_fill:
          type: boolean
        instructions:
          type: string
          maxLength: 4000
        mode:
          type: string
          enum: [fixed, auto]
        new_limit:
          type: integer
          minimum: 1
          maximum: 5

    AgendaType:
      type: object
      required: [id, name, title_pattern, identify, default_tags, summary_instructions, position, title_instructions, fallback]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        title_pattern:
          description: |
            Padrão do título da gravação, com os marcadores `{assunto}` (o título automático),
            `{data}` (`dd/mm/aaaa` da gravação), `{tipo}` e `{<chave do campo>}`. Sem padrão, o
            título automático fica como está.
          type: [string, "null"]
          maxLength: 300
        title_instructions:
          description: |
            Como escrever o `{assunto}` do título (a regra que o agente segue). Vazia, vale a do tipo
            padrão da conta.
          type: string
          maxLength: 4000
        identify:
          description: Como reconhecer uma gravação deste tipo; o agente de detecção lê este texto.
          type: string
        default_tags:
          description: Tags somadas às automáticas quando o tipo é aplicado.
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        summary_instructions:
          description: Instruções do resumo, em Markdown; a transcrição é anexada pelo servidor.
          type: string
          minLength: 1
        position:
          description: Ordem na lista do usuário.
          type: integer
          minimum: 0
        fallback:
          description: |
            O tipo padrão da conta: aplicado quando nenhum outro tipo se encaixa com confiança, sem
            outros tipos, sem agente de detecção ou com a detecção falha. Não pode ser excluído.
          type: boolean

    AgendaTypeDraft:
      description: O conteúdo de um tipo de agenda, salvo ou em rascunho.
      type: object
      additionalProperties: false
      required: [name, summary_instructions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        title_pattern:
          description: |
            Padrão do título da gravação, com os marcadores `{assunto}` (o título automático),
            `{data}` (`dd/mm/aaaa` da gravação), `{tipo}` e `{<chave do campo>}`. Sem padrão, o
            título automático fica como está.
          type: [string, "null"]
