    AdminHealth:
      type: object
      required: [queue, gpu, models_loaded, recent_failures, checked_at]
      properties:
        queue:
          type: object
          required: [queued, running, failed_last_24h]
          properties:
            queued:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            failed_last_24h:
              type: integer
              minimum: 0
        gpu:
          description: "`null` quando o worker não reporta GPU (engine CPU ou remota)."
          oneOf:
            - type: object
              required: [name, vram_total_mb, vram_used_mb, utilization_pct]
              properties:
                name:
                  type: string
                vram_total_mb:
                  type: integer
                  minimum: 0
                vram_used_mb:
                  type: integer
                  minimum: 0
                utilization_pct:
                  type: number
                  minimum: 0
                  maximum: 100
            - type: "null"
        models_loaded:
          type: array
          items:
            type: object
            required: [name, kind, loaded_at, vram_mb]
            properties:
              name:
                type: string
              kind:
                type: string
                enum: [asr, alignment, diarization, embeddings, summarization]
              loaded_at:
                type: string
                format: date-time
              vram_mb:
                type: [integer, "null"]
                minimum: 0
        recent_failures:
          type: array
          items:
            type: object
            required: [job_id, recording_id, stage, code, message, failed_at]
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              stage:
                type: [string, "null"]
              code:
                type: string
              message:
                type: string
              failed_at:
                type: string
                format: date-time
        checked_at:
          type: string
          format: date-time
        worker:
          description: >-
            Heartbeat do worker GPU (`eclume:gpu:health`, a cada 15 s, TTL 45 s); `null` quando
            nenhum worker publicou nos últimos 45 s.
          oneOf:
            - type: object
              required: [online, last_seen_at, version, engine, busy]
              properties:
                online:
                  type: boolean
                last_seen_at:
                  type: string
                  format: date-time
                version:
                  type: [string, "null"]
                engine:
                  type: [string, "null"]
                device:
                  type: [string, "null"]
                busy:
                  description: Há um job de transcrição rodando no worker.
                  type: boolean
            - type: "null"
        queues:
          description: Profundidade de cada fila arq da instância (só números, sem ids).
          type: array
          items:
            type: object
            required: [name, queued, running]
            properties:
              name:
                type: string
              queued:
                type: integer
                minimum: 0
              running:
                type: integer
                minimum: 0
        running_jobs:
          description: Jobs de transcrição da organização ainda não concluídos, com o progresso.
          type: array
          items:
            type: object
            required: [job_id, recording_id, recording_title, state, stage, progress, queued_at, started_at, updated_at]
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              recording_title:
                type: string
              state:
                type: string
                enum: [queued, running]
              stage:
                type: [string, "null"]
              progress:
                type: [number, "null"]
                minimum: 0
                maximum: 1
              queued_at:
                type: string
                format: date-time
              started_at:
                type: [string, "null"]
                format: date-time
              updated_at:
                description: Última escrita do worker no progresso; parado há muito tempo indica worker morto.
                type: [string, "null"]
                format: date-time

