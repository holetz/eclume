  /api/v1/admin/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [admin]
      operationId: updateUser
      security:
        - adminSessionCookie: []
      summary: Desativar ou reativar um usuário, ou sobrepor as cotas dele
      description: >-
        Desativar encerra as sessões e revoga os PATs do usuário (desde a 2.18.0, também vence o
        link de redefinição de senha pendente). Desde a 2.15.0, `quotas` troca a sobreposição das
        cotas da conta.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    delete:
      tags: [admin]
      operationId: deleteUser
      security:
        - adminSessionCookie: []
      summary: Excluir um usuário e todos os dados dele
      description: >-
        Desde a 2.15.0. Exclui a conta como a exclusão pela própria pessoa (`POST /me/delete`), sem
        a senha: gravações, transcrições, resumos e tudo o mais saem do banco, os objetos saem do
        armazenamento pela fila de exclusão, a transcrição em curso é cancelada e o e-mail fica
        livre para um cadastro novo.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Conta excluída.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/users/{user_id}/password-reset:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [admin]
      operationId: createPasswordReset
      security:
        - adminSessionCookie: []
      summary: Gerar um link de redefinição de senha para um usuário
      description: >-
        Desde a 2.18.0. Link único, válido por 24 horas, que o admin entrega por fora a quem pediu:
        `<url pública>/redefinir-senha#<segredo>`, com o segredo no fragmento (não chega a logs nem
        ao `Referer`). O servidor guarda só o hash, e `url` só volta aqui. Um link novo vence os
        anteriores ainda não usados da conta; desativar a conta anula o link pendente. Conta
        desativada, 409 `conflict`. O admin nunca vê nem define a senha.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "201":
          description: Link gerado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetLink"
              examples:
                novo:
                  $ref: "#/components/examples/PasswordResetLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/jobs/{job_id}/retry:
    post:
      tags: [admin]
      operationId: retryTranscriptionJob
      security:
        - adminSessionCookie: []
      summary: Retentar um job de transcrição que falhou
      description: >-
        Cria o job da revisão seguinte da gravação, com a configuração atual da plataforma, e o
        enfileira. Vale para a gravação de qualquer usuário, mas só para o job mais recente da
        gravação e em estado `failed`.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Novo job na fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobRetried"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/admin/health:
    get:
      tags: [admin]
      operationId: getAdminHealth
      security:
        - adminSessionCookie: []
      summary: Saúde da fila, da GPU e dos modelos
      responses:
        "200":
          description: Estado atual.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminHealth"
              examples:
                gpu:
                  $ref: "#/components/examples/AdminHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: |
        Sessão do navegador, aberta por `POST /api/v1/auth/login` ou pelo cadastro. Tem todas as
        permissões do usuário sobre a própria conta. Métodos mutáveis exigem `X-CSRF-Token` igual
        ao cookie `eclume_csrf` (double-submit). Gestão de PATs, o aceite do aviso e as rotas de
        voz aceitam **só** sessão. Não alcança `/api/v1/admin/*`.
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: eclume_admin_session
      description: |
        Sessão da conta de admin, aberta por `POST /api/v1/admin/auth/login` (HttpOnly, Secure,
        SameSite=Strict, `Path=/api/v1/admin`, 12 h). É a única credencial aceita em
        `/api/v1/admin/*`, e é ignorada em qualquer outra rota. Métodos mutáveis exigem
        `X-CSRF-Token` igual ao cookie `eclume_admin_csrf` (double-submit).
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<segredo>
      description: |
        PAT pessoal: `Authorization: Bearer eclp_<segredo>`. Age como o usuário dono, limitado
        aos escopos concedidos. Os escopos exigidos por operação estão no requisito de segurança
        (`pat: [escopo, ...]`, todos obrigatórios; vários requisitos `pat` são alternativas, e
        basta um). Nenhum escopo implica outro. Faltando escopo, a resposta é 403 com
        `code: insufficient_scope` e `required_scopes`.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: >-
        Obrigatório com sessão: o valor do cookie `eclume_csrf`, ou de `eclume_admin_csrf` em
        `/api/v1/admin/*`. Ignorado com PAT.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: |
        Só itens com `updated_at >= since` (inclusivo). Desde a 2.8.0, um resumo que termina ou é
        editado também move o `updated_at` da gravação e da transcrição a que pertence. Desde a
        2.17.0, a etapa `summary` que termina `failed` ou `skipped` move o `updated_at` só da
        gravação, para os clientes avisarem o fim do processamento (holetz/eclume#118).
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Id de pessoa; só transcrições (ou trechos) em que um locutor está ligado a ela.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Só gravações com esta tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Só gravações desta coleção.
      schema:
        type: string
        format: uuid
    PairingCodeId:
      name: pairing_code_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgendaTypeId:
      name: agenda_type_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldId:
      name: field_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BaseChatId:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Sem credencial, ou credencial inválida, expirada ou revogada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples: ['Bearer realm="eclume"']
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semCredencial:
              $ref: "#/components/examples/ProblemUnauthorized"
    Forbidden:
      description: >-
        Credencial válida sem permissão (escopo ou dono), PAT numa operação que aceita só sessão
        (`code: session_required`), cadastro fechado (`code: signup_closed`) ou sessão de conta que
        ainda não aceitou o aviso em vigor (`code: notice_required`; antes do aceite, só `GET /me`,
        `POST /me/notice` e `/auth/*` respondem, e `POST /devices/login` não emite credencial).
        Desde a 2.15.0, cota da conta estourada (`code: quota_exceeded`, com `quota`, `limit` e
        `used`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            semEscopo:
              $ref: "#/components/examples/ProblemInsufficientScope"
    NotFound:
      description: Não existe ou não é do usuário (o eclume não distingue os dois).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            naoEncontrado:
              $ref: "#/components/examples/ProblemNotFound"
    ValidationFailed:
      description: Corpo ou parâmetros inválidos.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalido:
              $ref: "#/components/examples/ProblemValidation"
    Conflict:
      description: >-
        O estado atual impede a operação (upload já concluído, nome duplicado, job em andamento,
        resumo mudado desde a versão aberta, chat com pedido em aberto).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: >-
        Corpo acima do teto da rota (`code: payload_too_large`, desde a 2.14.0); `limit` diz o
        teto em bytes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            corpoGrande:
              $ref: "#/components/examples/ProblemPayloadTooLarge"
    InternalError:
      description: >-
        Falha inesperada do servidor (`code: internal_error`, desde a 2.14.0); o detalhe fica no
        log do servidor, com o `X-Request-ID` da resposta.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >-
        Limite atingido (`code: rate_limited`): pedidos em aberto, como as 3 pré-visualizações em
        andamento por conta (tente de novo quando algum terminar), ou tentativas por minuto nas
        rotas de credencial (login, cadastro, login de admin e `/devices/*`, por IP), com
        `Retry-After`. Nos logins por senha, desde a 2.14.0, contam só as falhas: por par (conta,
        IP), e um teto da conta que não barra IP que já entrou nela com sucesso; o sucesso zera o
        par.
      headers:
        Retry-After:
          description: Segundos até a janela de tentativas reabrir.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      description: Erro RFC 9457. O cliente decide por `code`, nunca por `title`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: |
            Código estável. Valores v1: `unauthorized`, `insufficient_scope`, `forbidden`,
            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,
            `rate_limited`; desde a 1.4.0, `session_required` (PAT numa operação só de sessão);
            desde a 2.0.0, `email_taken` (cadastro com e-mail existente) e `signup_closed`;
            desde a 2.2.0, `summary_changed` (o resumo mudou desde a versão aberta),
            `summary_missing`, `transcript_missing` e `chat_busy` (já há um pedido de ajuste em
            aberto); desde a 2.3.0, `invalid_pairing_code` (código de pareamento inexistente,
            vencido ou usado) e `notice_required` (sessão de conta que ainda não aceitou o aviso em
            vigor); desde a 2.14.0, `payload_too_large`, `upload_completing` e `internal_error`;
            desde a 2.15.0, `quota_exceeded` (cota da conta estourada); desde a 2.18.0,
            `invalid_reset_link` (link de redefinição de senha inexistente, vencido ou usado).
            Códigos novos entram de forma aditiva.
          type: string
        limit:
          description: >-
            Com `payload_too_large`, o teto do corpo da rota em bytes (desde a 2.14.0); com
            `quota_exceeded`, o limite da cota (desde a 2.15.0).
          type: integer
        quota:
          description: Com `quota_exceeded`, a cota estourada (desde a 2.15.0).
          type: string
          enum: [storage_bytes, file_bytes, open_uploads, agent_requests_24h]
        used:
          description: >-
            Com `quota_exceeded`, o uso a que o pedido levaria (bytes, uploads abertos ou pedidos
            em 24 h; em `file_bytes`, o tamanho do arquivo) (desde a 2.15.0).
          type: integer
        required_scopes:
          description: |
            Com `insufficient_scope`, os escopos que faltaram; numa operação com requisitos `pat`
            alternativos, as alternativas (basta um deles).
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        errors:
          description: Com `validation_failed`, um item por campo inválido.
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                description: Caminho do campo (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string

    Scope:
      description: >-
        Escopo de PAT. `recordings:delete` (2.3.0) exclui gravações. A tela "Conexão MCP" agrupa os
        escopos em "Buscar e ler gravações" (`recordings:read`, `transcripts:read`), "Ler e editar
        resumos" (`summaries:read`, `summaries:write`), "Editar campos e tags" (`recordings:write`)
        e "Excluir gravações" (`recordings:delete`).
      type: string
      enum:
        - recordings:read
        - recordings:write
        - recordings:delete
        - transcripts:read
        - transcripts:write
        - people:read
        - people:write
        - summaries:read
        - summaries:write

    Health:
      type: object
      required: [status, version, contract_version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa (`info.version`).
          type: string
        commit:
          description: >-
            Desde a 2.12.0: o SHA do git de que a imagem do servidor foi construída (o deploy o
            grava). Ausente fora de uma imagem de produção.
          type: string
          pattern: "^[0-9a-f]{7,40}$"

    HealthReady:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, down]
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            additionalProperties: false
            properties:
              name:
                type: string
                enum: [postgres, redis, storage]
              status:
                type: string
                enum: [ok, down]

    PasswordResetCheck:
      type: object
      required: [token]
      properties:
        token:
          description: O segredo do link, lido do fragmento de `/redefinir-senha#<token>`.
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    PasswordReset:
      type: object
      required: [token, new_password]
      properties:
        token:
          description: O segredo do link, como em `PasswordResetCheck`.
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          description: Ao menos 12 caracteres, como no cadastro.
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true

    PasswordResetInfo:
      description: Desde a 2.18.0. O que a página de redefinição mostra de um link válido.
      type: object
      required: [email, expires_at]
      properties:
        email:
          type: string
          format: email
        expires_at:
          type: string
          format: date-time

    PasswordResetLink:
      description: Desde a 2.18.0. O link de redefinição recém-gerado; `url` só volta na criação.
      type: object
      required: [url, expires_at]
      properties:
        url:
          description: "`<url pública>/redefinir-senha#<segredo>`."
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true

    Notice:
      description: Aviso que a conta aceita ao nascer ("Sou responsável por pedir o consentimento das pessoas que gravo").
      type: object
      required: [version, text]
      properties:
        version:
          type: string
        text:
          type: string

    SignupInfo:
      type: object
      required: [open, notice]
      properties:
        open:
          description: "`false` com `ECLUME_SIGNUP_OPEN=false`: o cadastro responde 403 `signup_closed`."
          type: boolean
        notice:
          $ref: "#/components/schemas/Notice"

    SignupRequest:
      type: object
      required: [name, email, password, notice_version]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        notice_version:
          description: Versão do aviso aceito; tem de ser a em vigor.
          type: string
          minLength: 1

    NoticeAccept:
      type: object
      required: [notice_version]
      properties:
        notice_version:
          type: string
          minLength: 1

    User:
      type: object
      required: [id, email, name, active, created_at, last_login_at, notice_version, notice_accepted_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        notice_version:
          description: Versão do aviso aceito, ou `null` numa conta que ainda não aceitou.
          type: [string, "null"]
        notice_accepted_at:
          type: [string, "null"]
          format: date-time

    AdminUser:
      description: >-
        Conta de usuário vista pelo admin (o `User` mais a contagem de gravações e, desde a 2.15.0,
        o uso e a sobreposição das cotas).
      type: object
      required:
        - id
        - email
        - name
        - active
        - created_at
        - last_login_at
        - notice_version
        - notice_accepted_at
        - recording_count
        - quotas
        - usage
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time
        notice_version:
          type: [string, "null"]
        notice_accepted_at:
          type: [string, "null"]
          format: date-time
        recording_count:
          type: integer
          minimum: 0
        quotas:
          description: >-
            Só os campos que esta conta sobrepõe ao padrão da plataforma (`null` num campo é sem
            limite); `null` quando a conta segue o padrão inteiro.
          oneOf:
            - $ref: "#/components/schemas/QuotasOverride"
            - type: "null"
        usage:
          $ref: "#/components/schemas/UsageNow"

    QuotasOverride:
      description: >-
        Cotas parciais (desde a 2.15.0): só os campos presentes valem; `null` num campo é sem
        limite.
      type: object
      additionalProperties: false
      properties:
        storage_bytes:
          type: [integer, "null"]
          minimum: 0
        file_bytes:
          type: [integer, "null"]
          minimum: 0
        open_uploads:
          type: [integer, "null"]
          minimum: 0
        gpu_minutes_24h:
          type: [integer, "null"]
          minimum: 0
        agent_requests_24h:
          type: [integer, "null"]
          minimum: 0

    UserPatch:
      description: Ao menos um campo; desde a 2.15.0, `active` é opcional e entra `quotas`.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        active:
          description: "`false` desativa a conta, encerra as sessões e revoga os PATs."
          type: boolean
        quotas:
          description: >-
            Troca a sobreposição inteira das cotas da conta pelos campos enviados (`null` num campo
            é sem limite); `quotas: null` volta a conta ao padrão da plataforma.
          oneOf:
            - $ref: "#/components/schemas/QuotasOverride"
            - type: "null"

    AdminUserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AdminAccount:
      description: Conta de admin, separada das contas de usuário.
      type: object
      required: [id, email, name, created_at, last_login_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: [string, "null"]
          format: date-time

    AdminRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    Quotas:
      description: >-
        Cotas de uma conta (desde a 2.15.0); `null` é sem limite. Minutos de áudio transcritos e
        pedidos ao agente contam numa janela móvel de 24 h.
      type: object
      required: [storage_bytes, file_bytes, open_uploads, gpu_minutes_24h, agent_requests_24h]
      properties:
        storage_bytes:
          description: Armazenamento total (áudio das gravações mais uploads abertos), em bytes.
          type: [integer, "null"]
          minimum: 0
        file_bytes:
          description: Tamanho máximo de um arquivo, em bytes.
          type: [integer, "null"]
          minimum: 0
        open_uploads:
          description: Uploads abertos ao mesmo tempo.
          type: [integer, "null"]
          minimum: 0
        gpu_minutes_24h:
          description: >-
            Minutos de áudio enviados à transcrição em 24 h. Passado o limite nada é recusado: a
            gravação espera na fila até a janela abrir.
          type: [integer, "null"]
          minimum: 0
        agent_requests_24h:
          description: Pedidos da pessoa ao agente (resumos, chats, pré-visualizações) em 24 h.
          type: [integer, "null"]
          minimum: 0

    UsageNow:
      description: Uso corrente de uma conta (desde a 2.15.0).
      type: object
      required: [storage_bytes, open_uploads, gpu_minutes_24h, agent_requests_24h]
      properties:
        storage_bytes:
          type: integer
          minimum: 0
        open_uploads:
          type: integer
          minimum: 0
        gpu_minutes_24h:
          type: integer
          minimum: 0
        agent_requests_24h:
          type: integer
          minimum: 0

    Usage:
      description: Uso e cota efetiva da conta (desde a 2.15.0).
      type: object
      required: [usage, quotas]
      properties:
        usage:
          $ref: "#/components/schemas/UsageNow"
        quotas:
          $ref: "#/components/schemas/Quotas"

    Me:
      type: object
      required: [user, auth, notice_required]
      properties:
        user:
          $ref: "#/components/schemas/User"
        notice_required:
          description: A conta ainda não aceitou o aviso em vigor (`POST /api/v1/me/notice`).
          type: boolean
        auth:
          type: object
          required: [method, scopes, token_id]
          properties:
            method:
              type: string
              enum: [session, pat]
            scopes:
              description: Com sessão, todos os escopos.
              type: array
              items:
                $ref: "#/components/schemas/Scope"
            token_id:
              description: Id do PAT em uso, ou `null` com sessão.
              type: [string, "null"]
              format: uuid

    VoiceAssignment:
      description: >-
        Atribuição automática de locutores da conta: com ela ligada e a identificação por voz ligada
        na plataforma, o locutor cuja voz passa do limiar é ligado à pessoa na ingestão, antes do
        resumo, e sai com `auto_score` no `Speaker`.
      type: object
      required: [enabled, threshold, platform_enabled, keep_samples, sample_count, voiceprint_people]
      properties:
        enabled:
          type: boolean
        threshold:
          description: Pontuação mínima (cosseno normalizado) para ligar sozinho, de 0,50 a 0,99.
          type: number
          minimum: 0.5
          maximum: 0.99
        platform_enabled:
          description: A identificação por voz está ligada na plataforma; desligada, nada é atribuído.
          type: boolean
        keep_samples:
          description: >-
            Desde a 2.19.0. A conta guarda amostras e impressões de voz (padrão `true`). Desligada,
            nada de voz da conta é calculado, comparado ou guardado; o desligamento apaga na hora as
            amostras, os vetores por gravação e as sugestões pendentes da conta.
          type: boolean
        sample_count:
          description: Desde a 2.19.0. Quantas amostras de voz a conta guarda.
          type: integer
          minimum: 0
        voiceprint_people:
          description: Desde a 2.19.0. Quantas pessoas da conta têm impressão de voz (ao menos uma amostra).
          type: integer
          minimum: 0

    SpeakerNamingPreference:
      description: >-
        Desde a 2.22.0. Se a conta exige nomear os locutores antes da cadeia por agente e quantas
        gravações esperam por isso.
      type: object
      required: [required, waiting_count]
      properties:
        required:
          type: boolean
        waiting_count:
          description: Gravações cuja revisão atual está com a etapa `speakers` em `waiting`.
          type: integer
          minimum: 0

    SpeakerNamingPatch:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required:
          type: boolean

    TranscriptionPreference:
      description: >-
        Desde a 2.20.0. Idioma de transcrição preferido da conta e o padrão do servidor que vale
        quando a conta não escolhe.
      type: object
      required: [language, platform_default]
      properties:
        language:
          description: Idioma (BCP 47), `auto` (detectar) ou `null` (padrão do servidor).
          type: [string, "null"]
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        platform_default:
          description: O `asr.default_language` da plataforma (`pt` sem configuração); pode ser `auto`.
          type: string

    TranscriptionPreferencePatch:
      type: object
      additionalProperties: false
      required: [language]
      properties:
        language:
          description: Idioma (BCP 47), `auto` ou `null` para voltar ao padrão do servidor.
          type: [string, "null"]
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"

    VoiceAssignmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        threshold:
          type: number
          minimum: 0.5
          maximum: 0.99
        keep_samples:
          description: >-
            Desde a 2.19.0. `false` apaga na hora as amostras, os vetores por gravação e as
            sugestões pendentes da conta; os arquivos de voz do armazenamento saem logo depois.
            `true` volta a guardar a partir das próximas transcrições, sem recuperar o que saiu.
          type: boolean

    NextCursor:
      description: Cursor da próxima página, ou `null` na última.
      type: [string, "null"]

    Token:
      type: object
      required: [id, name, kind, platform, scopes, prefix, created_at, last_used_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          description: "Com `kind: device`, o nome do aparelho."
          type: string
        kind:
          $ref: "#/components/schemas/TokenKind"
        platform:
          description: "Com `kind: device`, a plataforma do aparelho; `null` num PAT pessoal."
          oneOf:
            - $ref: "#/components/schemas/DevicePlatform"
            - type: "null"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        prefix:
          description: Começo do segredo, para reconhecer o token (`eclp_7Hq2`).
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    TokenKind:
      description: >-
        `personal`, o PAT criado em "Tokens de acesso" ou "Conexão MCP"; `device`, a credencial
        de um aparelho, emitida pelo login ou pelo pareamento.
      type: string
      enum: [personal, device]

    DevicePlatform:
      type: string
      enum: [windows, macos, linux, ios, android]

    ServerInfo:
      type: object
      required: [name, url, mcp_url, ca_sha256, version, contract_version]
      properties:
        name:
          description: Nome do servidor (`ECLUME_SERVER_NAME`), também a instância no mDNS.
          type: string
        url:
          description: Endereço público (`ECLUME_PUBLIC_URL`).
          type: string
          format: uri
        mcp_url:
          description: Endereço do servidor MCP, que o assistente recebe.
          type: string
          format: uri
        ca_sha256:
          description: >-
            SHA-256, em hex minúsculo, do DER do certificado raiz servido em
            `/downloads/eclume-root.crt`; `null` enquanto a raiz não foi publicada.
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        ca_next_sha256:
          description: >-
            Desde a 2.21.0. SHA-256, em hex minúsculo, do DER da próxima raiz durante a rotação,
            servida em `/downloads/eclume-root-proxima.crt`; ausente ou `null` fora dela. O app
            com a raiz atual fixada baixa a próxima por essa mesma conexão, confere a impressão e a
            guarda para trocar sozinho quando o servidor passar a servi-la.
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa.
          type: string

    PrivacyInfo:
      description: Desde a 2.19.0. Para onde vai cada dado, conforme a configuração em vigor.
      type: object
      required: [destinations]
      properties:
        destinations:
          description: Um item por finalidade, na ordem de `DataPurpose`.
          type: array
          items:
            $ref: "#/components/schemas/DataDestination"

    DataPurpose:
      description: >-
        `transcription` é o áudio virando texto; as demais são as finalidades de agente (resumos,
        campos, chat e detecção do tipo de agenda).
      type: string
      enum: [transcription, summaries, fields, chat, agenda_detection]

    DataDestination:
      type: object
      required: [purpose, location, processor]
      properties:
        purpose:
          $ref: "#/components/schemas/DataPurpose"
        location:
          description: >-
            `server`: neste servidor; `local_network`: em outra máquina da rede local; `external`:
            fora do servidor e da rede; `disabled`: nenhum provider habilitado para a finalidade, e
            nada é enviado. Na dúvida, o servidor responde `external`.
          type: string
          enum: [server, local_network, external, disabled]
        processor:
          description: >-
            Com `external`, quem processa: o fornecedor (por exemplo `Anthropic`) ou só o host do
            endereço (por exemplo `api.deepseek.com`); `null` nos demais.
          type: [string, "null"]

    DeviceLogin:
      type: object
      required: [email, password, device_name, platform]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        device_name:
          description: Nome do aparelho, que vira o nome do token ("iPhone da Mariana").
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: "#/components/schemas/DevicePlatform"

    DevicePair:
      type: object
      required: [code, device_name, platform]
      properties:
        code:
          description: O código de pareamento (`K7Q-4MX` ou `k7q4mx`).
          type: string
          minLength: 1
          maxLength: 32
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: "#/components/schemas/DevicePlatform"

    DeviceCredential:
      type: object
      required: [token, secret, server]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          description: O token completo, que o app guarda. Não é mostrado de novo.
          type: string
          pattern: "^eclp_[A-Za-z0-9]{32,}$"
        server:
          $ref: "#/components/schemas/ServerInfo"

    PairingCode:
      type: object
      required: [id, status, expires_at, token_id]
      properties:
        id:
          type: string
          format: uuid
        status:
          description: "`expired` vale também para o código vencido por um código mais novo."
          type: string
          enum: [pending, used, expired]
        expires_at:
          type: string
          format: date-time
        token_id:
          description: Com `used`, a credencial de dispositivo que o código emitiu.
          type: [string, "null"]
          format: uuid
        code:
          description: Só na criação. 6 caracteres de `23456789ABCDEFGHJKMNPQRSTVWXYZ`.
          type: string
          pattern: "^[2-9A-HJKMNP-TV-Z]{6}$"
        display:
          description: Só na criação. O código como a tela mostra (`K7Q-4MX`).
          type: string
        pair_url:
          description: >-
            Só na criação. Conteúdo do QR: `<url>/parear?codigo=<code>&ca=<ca_sha256>` (sem `ca`
            enquanto a raiz não foi publicada).
          type: string
          format: uri

    TokenCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Scope"
        expires_at:
          description: Sem valor, o PAT não expira.
          type: [string, "null"]
          format: date-time

    TokenCreated:
      type: object
      required: [token, secret]
      properties:
        token:
          $ref: "#/components/schemas/Token"
        secret:
          description: O PAT completo. Não é mostrado de novo.
          type: string
          pattern: "^eclp_[A-Za-z0-9]{32,}$"

    TokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Token"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    Source:
      description: Origem do áudio. `desktop` e `mobile` são os apps que gravam.
      type: string
      enum: [desktop, mobile, upload, api]

    Capture:
      description: Contexto da captura, preenchido pelo app que gravou (desktop ou celular).
      type: object
      properties:
        meeting_app:
          description: App de reunião detectado.
          type: [string, "null"]
          enum: [teams, meet, zoom, other, null]
        device_name:
          type: [string, "null"]
        client_version:
          description: Versão do app que gravou (`eclume-desktop/0.3.0`, `eclume-android/0.1.0`).
          type: [string, "null"]

    RecordingMetadata:
      description: Metadados livres de organização (tipo de reunião, cliente, projeto).
      type: object
      additionalProperties:
        type: string

    UploadCreate:
      type: object
      required: [filename, content_type, size_bytes, sha256]
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: "Tipo do arquivo, com parâmetros opcionais (`audio/ogg; codecs=opus`, a saída do navegador; `audio/webm`; `video/mp4`)."
          type: string
          pattern: "^(audio|video)/[A-Za-z0-9.+-]+(\\s*;.*)?$"
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          description: SHA-256 do arquivo inteiro, em hex minúsculo.
          type: string
          pattern: "^[0-9a-f]{64}$"
        title:
          description: Sem valor, deriva do nome do arquivo.
          type: string
          minLength: 1
        recorded_at:
          description: Início da gravação. Sem valor, vale a hora do envio (`recorded_at_source` `upload`).
          type: string
          format: date-time
        recorded_at_source:
          description: |
            De onde veio `recorded_at`. Sem valor, o servidor decide: com `recorded_at` e
            `source` `desktop` ou `mobile`, `capture`; com `recorded_at` e outra origem, `user`;
            sem `recorded_at`, `upload`.
          $ref: "#/components/schemas/RecordedAtSource"
        kind:
          $ref: "#/components/schemas/RecordingKind"
        agenda_type_id:
          description: |
            Tipo de agenda escolhido ao parar a gravação no celular: vira o tipo escolhido pelo
            usuário (origem `edited`) e dispensa a detecção.
          type: string
          format: uuid
        markers:
          description: |
            Marcadores feitos durante a gravação, com o `device_name` da captura. Idempotentes por
            `client_id`: num upload deduplicado, entram na gravação existente.
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/MarkerInput"
        duration_ms:
          type: integer
          minimum: 0
        language:
          description: >-
            Idioma esperado (BCP 47) ou, desde a 2.20.0, `auto` (a engine detecta e a gravação guarda
            o detectado). Sem valor, vale o idioma preferido da conta, depois o padrão do servidor.
          type: string
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        source:
          $ref: "#/components/schemas/Source"
        capture:
          $ref: "#/components/schemas/Capture"
        tags:
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"

    UploadStatus:
      type: string
      enum: [in_progress, completed, aborted, expired, deduplicated]

    PartUrl:
      type: object
      required: [part_number, method, url, headers, expires_at]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum: [PUT]
        url:
          description: URL opaca da parte.
          type: string
          format: uri
        headers:
          description: Headers que o `PUT` deve levar.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time

    ReceivedPart:
      type: object
      required: [part_number, etag, size_bytes]
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
        size_bytes:
          type: integer
          minimum: 1

    Upload:
      type: object
      required: [id, status, filename, content_type, size_bytes, sha256, part_size, part_count, parts_received, parts, recording_id, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/UploadStatus"
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        part_size:
          description: Tamanho de toda parte menos a última, em bytes (mínimo 5 MiB).
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        parts_received:
          type: array
          items:
            $ref: "#/components/schemas/ReceivedPart"
        parts:
          description: URLs já emitidas para partes pendentes; pode vir parcial ou vazio.
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"
        recording_id:
          description: Gravação criada pelo `complete`, ou a existente num `deduplicated`.
          type: [string, "null"]
          format: uuid
        expires_at:
          description: Depois disso o upload inacabado é descartado (`upload_expired`).
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    PartUrlsRequest:
      type: object
      required: [part_numbers]
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000

    PartUrls:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartUrl"

    UploadComplete:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [part_number, etag]
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string

    RecordingStatus:
      description: "`uploading` → `queued` → `processing` → `transcribed` | `failed`."
      type: string
      enum: [uploading, queued, processing, transcribed, failed]

    Job:
      description: Job de transcrição mais recente da gravação.
      type: object
      required: [id, state, stage, progress, attempts, error, queued_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        stage:
          description: |
            Etapa em curso, ou `null` fora de execução. `preprocessing` é o tratamento do áudio
            antes do ASR (holetz/eclume#33).
          type: [string, "null"]
          enum: [preprocessing, asr, alignment, diarization, embeddings, finalizing, null]
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        error:
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  description: >-
                    `hash_mismatch`, `unsupported_media`, `gpu_oom`, `engine_error`... e, desde a
                    1.4.0, `worker_lost` (o worker GPU parou no meio do job), `job_lost` (o job
                    sumiu da fila sem resposta) e `job_stalled` (progresso parado além do teto),
                    detectados pelo server. Desde a 2.5.0, `ingest_failed`: a transcrição ficou
                    pronta no worker GPU, mas o server não conseguiu gravá-la (a ingestão falhou ou
                    nunca chegou); recuperável. Desde a 2.10.0, `cancelled`: o dono cancelou a
                    transcrição (ou excluiu a gravação); recuperável, com `state` `cancelled`.
                  type: string
                message:
                  type: string
                retryable:
                  description: >-
                    A falha é passageira (worker perdido, job sumido ou parado, ingestão falha,
                    falta de VRAM): retranscrever ou `POST /api/v1/admin/jobs/{job_id}/retry`
                    tende a resolver.
                    Ausente em servidores anteriores à 1.4.0.
                  type: boolean
            - type: "null"
        queued_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        queue:
          description: |
            Por que o job espera, enquanto `state` é `queued`; `null` em qualquer outro estado.
            Ausente em servidores anteriores à 2.16.0 (holetz/eclume#117).
          oneOf:
            - $ref: "#/components/schemas/JobQueue"
            - type: "null"

    JobQueue:
      description: |
        A espera de um job `queued`, calculada na leitura. Só contagens e horários: nada de outra
        conta. Esperar nunca vira falha; o job segue `queued`.
      type: object
      required: [reason, ahead, account_ahead, estimated_start_at, resumes_at, processor]
      properties:
        reason:
          description: |
            `processor_queue` (na fila do processador de transcrição), `account_turn` (atrás de
            outras gravações da própria conta, pela fila justa) ou `quota_window` (a conta passou
            dos minutos de transcrição de 24 h). Enum aberto: clientes toleram valor novo.
          type: string
          enum: [processor_queue, account_turn, quota_window]
        ahead:
          description: |
            Em `processor_queue`, quantos jobs começam antes deste, contando o que está rodando;
            `null` nos outros motivos ou se o job não está na fila do processador.
          type: [integer, "null"]
          minimum: 0
        account_ahead:
          description: Em `account_turn`, quantas gravações da própria conta vêm antes; `null` nos outros.
          type: [integer, "null"]
          minimum: 0
        estimated_start_at:
          description: |
            Previsão de início, pela duração real das últimas transcrições; é estimativa, e os
            clientes a rotulam assim. `null` sem histórico suficiente, com o processador fora do
            ar ou fora de `processor_queue`.
          type: [string, "null"]
          format: date-time
        resumes_at:
          description: Em `quota_window`, quando a janela de 24 h volta a ter minutos; `null` nos outros.
          type: [string, "null"]
          format: date-time
        processor:
          $ref: "#/components/schemas/ProcessorStatus"

    ProcessorStatus:
      description: Se o processador de transcrição está no ar, pelo heartbeat do worker GPU.
      type: object
      required: [online, offline_since]
      properties:
        online:
          type: boolean
        offline_since:
          description: |
            Fora do ar, o último heartbeat visto (precisão de 1 min); `null` no ar ou se nunca
            houve heartbeat.
          type: [string, "null"]
          format: date-time

    RecordingKind:
      description: "`meeting` (reunião, o padrão) ou `note` (nota por voz)."
      type: string
      enum: [meeting, note]

    RecordedAtSource:
      description: |
        Origem de `recorded_at`: `capture` (relógio do app que gravou), `file_metadata` (lida do
        arquivo e confirmada na importação), `user` (digitada ou corrigida) ou `upload` (sem data;
        vale a hora do envio).
      type: string
      enum: [capture, file_metadata, user, upload]

    Recording:
      type: object
      required: [id, title, status, kind, source, recorded_at, recorded_at_source, duration_ms, language, size_bytes, content_type, content_hash, owner, tags, collection_ids, collections_origin, metadata, capture, agenda_type, job, pipeline, awaiting, transcript_id, marker_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/RecordingStatus"
        kind:
          $ref: "#/components/schemas/RecordingKind"
        source:
          $ref: "#/components/schemas/Source"
        recorded_at:
          description: Início da gravação; o fim é `recorded_at + duration_ms`.
          type: string
          format: date-time
        recorded_at_source:
          $ref: "#/components/schemas/RecordedAtSource"
        duration_ms:
          description: "`null` até o áudio ser lido."
          type: [integer, "null"]
          minimum: 0
        language:
          description: Idioma pedido ou detectado; `auto` só enquanto a detecção não roda.
          type: [string, "null"]
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        owner:
          description: "Obsoleto desde a 2.11.0: sempre o próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          $ref: "./transcript.schema.json#/$defs/UserRef"
        tags:
          type: array
          items:
            type: string
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        collections_origin:
          description: |
            De quem é a lista de coleções: `auto` (o agente, pelas coleções automáticas), `edited` (o
            usuário mudou; o agente não mexe mais) ou `null` (vinda do envio, ou ainda sem escolha: o
            agente só soma).
          type: [string, "null"]
          enum: [auto, edited, null]
        metadata:
          $ref: "#/components/schemas/RecordingMetadata"
        capture:
          oneOf:
            - $ref: "#/components/schemas/Capture"
            - type: "null"
        agenda_type:
          description: |
            Tipo de agenda da gravação: detectado pelo agente (`auto`) ou escolhido pelo usuário
            (`edited`), que a detecção nunca troca.
          oneOf:
            - type: object
              required: [id, name, origin]
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                origin:
                  type: string
                  enum: [auto, edited]
            - type: "null"
        job:
          oneOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        pipeline:
          description: |
            As sete etapas do processamento da revisão atual, em ordem; a que ainda não rodou sai
            `pending`. Enquanto o worker GPU reporta progresso, o pré-processamento ou a transcrição
            sai `active`. A etapa `speakers` entrou na 2.22.0 (eram seis).
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: "#/components/schemas/PipelineStep"
        awaiting:
          description: |
            Desde a 2.22.0. O que a gravação espera do dono para seguir: `speakers` quando a etapa
            `speakers` está `waiting` (a conta exige nomear os locutores e falta alguém); `null`
            nas outras.
          type: [string, "null"]
          enum: [speakers, null]
        transcript_id:
          description: Transcrição, depois do primeiro job concluído.
          type: [string, "null"]
          format: uuid
        marker_count:
          description: Marcadores da gravação.
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PipelineStep:
      type: object
      required: [step, state, started_at, finished_at, duration_ms, error, reason]
      properties:
        step:
          type: string
          description: >-
            Na ordem da cadeia; o tipo de agenda vem antes dos campos. `speakers` (desde a 2.22.0)
            fica entre a transcrição e o tipo de agenda.
          enum: [received, preprocessing, transcription, speakers, agenda_type, fields, summary]
        state:
          type: string
          description: >-
            `waiting` (desde a 2.22.0) é só da etapa `speakers`: parada à espera de o dono nomear
            os locutores, com `reason` `unnamed_speakers`.
          enum: [pending, active, done, failed, skipped, waiting]
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: [integer, "null"]
          minimum: 0
        error:
          description: Com `state` `failed`.
          oneOf:
            - type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
            - type: "null"
        reason:
          description: |
            Por que a etapa foi pulada: `no_provider`, `no_auto_fields`, `no_types`, `set_by_user`,
            `no_agenda_type`, `before_pipeline` (gravação anterior ao pipeline), `cancelled` (a
            transcrição foi cancelada nesta etapa, desde a 2.10.0), entre outros. Desde a 2.22.0,
            na etapa `speakers`: `unnamed_speakers` (em `waiting`), `continued_by_user` e
            `naming_not_required` (soltas sem os nomes).
          type: [string, "null"]

    RecordingPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        recorded_at:
          description: Corrigir a data passa `recorded_at_source` a `user`.
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/RecordingKind"
        language:
          description: Idioma (BCP 47) ou, desde a 2.20.0, `auto` (a engine detecta).
          type: string
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"
        tags:
          description: Substitui a lista inteira.
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          description: Substitui a lista inteira.
          type: array
          items:
            type: string
            format: uuid
        metadata:
          description: Substitui o objeto inteiro.
          $ref: "#/components/schemas/RecordingMetadata"
        agenda_type_id:
          description: |
            Tipo de agenda escolhido pelo usuário (origem `edited`, que a detecção não troca);
            `null` tira o tipo e devolve a escolha à detecção.
          type: [string, "null"]
          format: uuid

    RecordingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recording"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    RetranscribeRequest:
      type: object
      properties:
        language:
          description: Idioma (BCP 47) ou, desde a 2.20.0, `auto` (a engine detecta).
          type: string
          pattern: "^(auto|[a-z]{2,3}(-[A-Z]{2})?)$"

    TranscriptSummary:
      description: Resumo de listagem de uma transcrição (sem segmentos).
      type: object
      required: [id, recording_id, title, language, recorded_at, duration_ms, source, content_hash, revision, created_at, updated_at, owner, speakers]
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        title:
          type: string
        language:
          type: string
        recorded_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/Source"
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        owner:
          description: "Obsoleto desde a 2.11.0: sempre o próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          $ref: "./transcript.schema.json#/$defs/UserRef"
        speakers:
          type: array
          items:
            $ref: "./transcript.schema.json#/$defs/Speaker"
        tags:
          type: array
          items:
            type: string
        kind:
          $ref: "#/components/schemas/RecordingKind"
        recorded_at_source:
          $ref: "#/components/schemas/RecordedAtSource"

    TranscriptPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    SpeakerPatch:
      type: object
      minProperties: 1
      properties:
        label:
          type: string
          minLength: 1
        person_id:
          description: Pessoa a ligar, ou `null` para desfazer.
          type: [string, "null"]
          format: uuid

    SpeakerMerge:
      type: object
      required: [source_speaker_ids, target_speaker_id]
      properties:
        source_speaker_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^S[0-9]+$"
        target_speaker_id:
          type: string
          pattern: "^S[0-9]+$"

    SegmentPatch:
      type: object
      minProperties: 1
      properties:
        text:
          type: string
        speaker_id:
          type: string
          pattern: "^S[0-9]+$"

    VoiceSample:
      description: Uma amostra da impressão de voz — um locutor confirmado como a pessoa.
      type: object
      required: [transcript_id, recording_id, recording_title, speaker_id, model, talk_ms, excerpt, created_by, created_at]
      properties:
        transcript_id:
          type: string
          format: uuid
        recording_id:
          description: Gravação da amostra, ou `null` se ela não existe mais.
          type: [string, "null"]
          format: uuid
        recording_title:
          description: Título da gravação, ou `null` se ela não existe mais.
          type: [string, "null"]
        speaker_id:
          type: string
          pattern: "^S[0-9]+$"
        model:
          description: Modelo de embedding da amostra.
          type: string
        talk_ms:
          type: integer
          minimum: 0
        excerpt:
          description: |
            A fala mais longa do locutor, para ouvir a amostra no áudio da gravação
            (`GET /api/v1/recordings/{recording_id}/audio`); `null` sem gravação ou sem fala.
          oneOf:
            - type: object
              required: [start_ms, end_ms]
              properties:
                start_ms:
                  type: integer
                  minimum: 0
                end_ms:
                  type: integer
                  minimum: 0
            - type: "null"
        created_by:
          description: "Obsoleto desde a 2.11.0: sempre o próprio usuário (cada conta é isolada); sai na `/api/v2`."
          deprecated: true
          oneOf:
            - $ref: "./transcript.schema.json#/$defs/UserRef"
            - type: "null"
        created_at:
          type: string
          format: date-time

    Voiceprint:
      type: object
      required: [person_id, enabled, sample_count, samples]
      properties:
        person_id:
          type: string
          format: uuid
        enabled:
          description: Identificação por voz ligada na plataforma. Desligada, nada é comparado nem vira amostra.
          type: boolean
        sample_count:
          type: integer
          minimum: 0
        samples:
          type: array
          items:
            $ref: "#/components/schemas/VoiceSample"

    Person:
      type: object
      required: [id, name, email, notes, company, department, job_title, phone, tags, transcript_count, last_seen_at, voice_sample_count, speaking_time_ms, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
        notes:
          type: [string, "null"]
        company:
          description: Empresa (empresa, cooperativa, órgão) da pessoa.
          type: [string, "null"]
        department:
          description: Área ou departamento da pessoa na empresa.
          type: [string, "null"]
        job_title:
          description: Cargo ou função.
          type: [string, "null"]
        phone:
          type: [string, "null"]
        tags:
          description: Tags de pessoa, rótulos livres da pessoa (separados das tags das gravações).
          type: array
          items:
            type: string
        transcript_count:
          description: Transcrições do usuário em que a pessoa fala.
          type: integer
          minimum: 0
        last_seen_at:
          description: "`recorded_at` da transcrição mais recente em que a pessoa fala."
          type: [string, "null"]
          format: date-time
        voice_sample_count:
          description: Amostras da impressão de voz da pessoa.
          type: integer
          minimum: 0
        speaking_time_ms:
          description: Soma das falas dos locutores ligados à pessoa, em todas as transcrições.
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PersonCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: [string, "null"]
          format: email
        notes:
          type: [string, "null"]
        company:
          type: [string, "null"]
          maxLength: 120
        department:
          type: [string, "null"]
          maxLength: 120
        job_title:
          type: [string, "null"]
          maxLength: 120
        phone:
          type: [string, "null"]
          maxLength: 40
        tags:
