    post:
      tags:
      - agent
      operationId: attachAgentFile
      summary: Attach a file to the conversation
      description: 'Accepts .txt, .md, .csv, .pdf and .docx up to 10 MB; the type comes from the extension
        and is checked against the

        content (415 `unsupported_media_type` otherwise). The server keeps the original and extracts the

        text (up to 200 thousand characters), which the agent reads. The attachment goes with the next
        question that

        cites it in `attachments`; the conversation has up to 20 attachments (409 `too_many_files`).

        '
      security:
      - sessionCookie: []
      - pat:
        - summaries:read
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '201':
          description: The attachment, not yet tied to a question (`message_id` null).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFile'
              examples:
                anexo:
                  $ref: '#/components/examples/AgentFileInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
