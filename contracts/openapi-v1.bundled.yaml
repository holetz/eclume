            - etag
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string
    RecordingStatus:
      description: '`uploading` → `queued` → `processing` → `transcribed` | `failed`.'
      type: string
      enum:
      - uploading
      - queued
      - processing
      - transcribed
      - failed
    Job:
      description: Job de transcrição mais recente da gravação.
      type: object
      required:
      - id
      - state
      - stage
      - progress
      - attempts
      - error
      - queued_at
      - started_at
      - finished_at
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        stage:
          description: 'Etapa em curso, ou `null` fora de execução. `preprocessing` é o tratamento do
            áudio

            antes do ASR (holetz/eclume#33).

            '
          type:
          - string
          - 'null'
          enum:
          - preprocessing
          - asr
          - alignment
          - diarization
          - embeddings
          - finalizing
          - null
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        error:
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                description: '`hash_mismatch`, `unsupported_media`, `gpu_oom`, `engine_error`... e, desde
                  a 1.4.0, `worker_lost` (o worker GPU parou no meio do job), `job_lost` (o job sumiu
                  da fila sem resposta) e `job_stalled` (progresso parado além do teto), detectados pelo
                  server.'
                type: string
              message:
                type: string
              retryable:
                description: 'A falha é passageira (worker perdido, job sumido ou parado, falta de VRAM):
                  retranscrever ou `POST /api/v1/admin/jobs/{job_id}/retry` tende a resolver. Ausente
                  em servidores anteriores à 1.4.0.'
                type: boolean
          - type: 'null'
        queued_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    RecordingKind:
      description: '`meeting` (reunião, o padrão) ou `note` (nota por voz).'
      type: string
      enum:
      - meeting
      - note
    RecordedAtSource:
