  /api/v1/agent/actions/{action_id}/confirm:
    parameters:
    - $ref: '#/components/parameters/AgentActionId'
    post:
      tags:
      - agent
      operationId: confirmAgentAction
      summary: Confirm the proposal
      description: 'Since 2.24.0. Moves the proposal to `queued` and enqueues the execution, target by
        target,

        through the same operations as the MCP server. Idempotent: confirming again returns the

        current state without executing again. Expired or dismissed: 409 (`action_expired`,

        `action_cancelled`). Requires the tool''s write scope: `summaries:write` for

        `regenerate_summaries`, `recordings:write` for the others (a PAT without it: 403).

        '
      security:
      - sessionCookie: []
      - pat:
        - summaries:read
        - summaries:write
      - pat:
        - summaries:read
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: The queued action (or the current state, if already confirmed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
