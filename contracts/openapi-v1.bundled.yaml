  /api/v1/recordings/{recording_id}/summary:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      tags:
      - summaries
      operationId: getRecordingSummary
      summary: Estado do resumo da gravação
      description: 'A versão atual (a de maior `version` concluída), a gerada de referência (a gerada
        mais

        recente concluída, para comparar e voltar) e a geração em andamento. Sem transcrição, 409

