- name: search
  description: Full-text search over segments.
- name: organize
  description: Collections and tags.
- name: agenda-types
  description: 'The user''s agenda types: how to recognize the recording, the title and tags it gets and
    the summary instructions.'
- name: fields
  description: The user's fields (built-in title and tags, plus their own) and the rules the agent fills
    them with.
- name: previews
  description: Result of testing the rule of a field or an agenda type in draft.
- name: summaries
  description: Summaries generated by an agent with the instructions of an agenda type.
- name: base-chat
  description: 'Natural-language questions about the whole set of the user''s recordings. Deprecated since
