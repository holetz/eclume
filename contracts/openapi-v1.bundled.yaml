      - title
      - result
      properties:
        recording_id:
          type: string
          format: uuid
        title:
          type: string
        result:
          description: O resultado neste alvo; nulo enquanto não executado.
          oneOf:
          - type: object
            required:
            - status
            properties:
              status:
                type: string
                enum:
                - done
                - skipped
                - failed
              detail:
                type: string
              code:
                type: string
              summary_id:
                type:
                - string
                - 'null'
                format: uuid
          - type: 'null'
    AgentAction:
      description: 'Desde a 2.24.0. Uma ação que o Agente propôs: o texto do cartão, os alvos congelados
        na proposta e, depois da confirmação, o resultado por alvo. É também o registro de auditoria.'
      type: object
      required:
      - id
      - session_id
      - message_id
      - tool
      - params
      - summary
      - targets
      - status
      - counts
      - error
      - confirmed_via
      - created_at
      - decided_at
      - finished_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          description: Nulo depois que a conversa é excluída.
          type:
          - string
          - 'null'
          format: uuid
        message_id:
          type:
          - string
          - 'null'
          format: uuid
        tool:
          type: string
          enum:
          - regenerate_summaries
          - tag_recordings
          - collect_recordings
          - set_agenda_type
        params:
          description: Os parâmetros normalizados (alvos, tags, coleções ou o tipo resolvidos).
          type: object
        summary:
          description: O que será feito, em uma frase.
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AgentActionTarget'
        status:
          type: string
          enum:
          - proposed
          - queued
          - running
          - done
          - failed
          - cancelled
          - expired
        counts:
          type: object
          required:
          - done
          - skipped
          - failed
          - pending
          properties:
            done:
              type: integer
              minimum: 0
            skipped:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            pending:
              type: integer
              minimum: 0
        error:
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
          - type: 'null'
        confirmed_via:
          type:
          - string
          - 'null'
          enum:
          - session
          - pat
          - null
        created_at:
          type: string
          format: date-time
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    AgentTurn:
      type: object
      required:
      - question
      - answer
      properties:
        question:
          $ref: '#/components/schemas/AgentMessage'
        answer:
          $ref: '#/components/schemas/AgentMessage'
    AgentProviderKind:
      type: string
      enum:
      - ollama
      - openai-compatible
      - anthropic
      - claude-cli
    AgentPurpose:
      description: 'Para que o provider serve: `summaries` (resumos), `fields` (preenchimento de campos),

        `chat` (ajuste do resumo) e `agenda_detection` (detecção do tipo de agenda). Cada

        finalidade tem no máximo um provider: declará-la num provider a tira dos outros.

        '
      type: string
      enum:
      - summaries
      - fields
      - chat
      - agenda_detection
    AgentProviderRef:
      type: object
      required:
      - id
      - name
      - kind
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/AgentProviderKind'
    SummaryOrigin:
      description: 'Como a versão nasceu: `generated` (o agente pelas instruções do tipo de agenda), `manual`

        (edição à mão, ou voltar à gerada) ou `chat` (ajuste pelo agente no chat).

        '
      type: string
      enum:
      - generated
      - manual
      - chat
    Summary:
      description: 'Uma versão do resumo da transcrição. A atual é a de maior `version` com `status: done`.

        Uma geração que termina depois de uma edição ou de um ajuste toma o próximo número e vira a

        atual; por isso os números podem pular.

        '
      type: object
      required:
      - id
      - transcript_id
      - transcript_revision
      - agenda_type
      - version
      - origin
      - status
      - trigger
      - provider
      - model
      - content_md
      - error
      - restored_from_id
      - chat_message_id
      - created_by
      - created_at
      - completed_at
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
        transcript_revision:
          description: Revisão da transcrição que o resumo leu.
          type: integer
          minimum: 1
        agenda_type:
          description: 'Instantâneo do tipo de agenda cujas instruções o resumo seguiu (numa versão `manual`
            ou

            `chat`, o da versão de que ela partiu): o resumo continua quando o tipo é renomeado ou

            excluído. `null` numa edição sem versão anterior.

            '
          oneOf:
          - type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
          - type: 'null'
        version:
          description: 'Versão do resumo da transcrição, a partir de 1; toda geração, edição, volta à
            gerada

            ou ajuste por chat sobe a versão.

            '
          type: integer
          minimum: 1
        origin:
          $ref: '#/components/schemas/SummaryOrigin'
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        trigger:
          type: string
          enum:
          - manual
          - automatic
        provider:
          description: O agente que escreveu a versão; `null` numa versão `manual`.
          oneOf:
          - $ref: '#/components/schemas/AgentProviderRef'
          - type: 'null'
        model:
          type:
          - string
          - 'null'
        content_md:
          description: 'Resumo em Markdown, com `status: done`.'
          type:
          - string
          - 'null'
        error:
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
          - type: 'null'
        restored_from_id:
          description: Na volta à gerada, a versão gerada cujo conteúdo foi restaurado.
          type:
          - string
          - 'null'
          format: uuid
        chat_message_id:
          description: Numa versão `chat`, a resposta do agente que a produziu.
          type:
          - string
          - 'null'
          format: uuid
        created_by:
          description: 'Obsoleto desde a 2.11.0: sempre o id do próprio usuário (cada conta é isolada);
            sai na `/api/v2`.'
          deprecated: true
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    SummaryCreate:
      type: object
      properties:
        agenda_type_id:
          description: Sem valor, o tipo de agenda da gravação.
          type: string
          format: uuid
        provider_id:
          description: Sem valor, o provider padrão da plataforma.
          type: string
          format: uuid
    SummaryPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Summary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    SummaryState:
      description: O resumo da gravação como a tela o mostra.
      type: object
      required:
