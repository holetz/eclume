            - loaded_at
            - vram_mb
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - asr
                - alignment
                - diarization
                - embeddings
                - summarization
              loaded_at:
                type: string
                format: date-time
              vram_mb:
                type:
                - integer
                - 'null'
                minimum: 0
        recent_failures:
          type: array
          items:
            type: object
            required:
            - job_id
            - recording_id
            - stage
            - code
            - message
            - failed_at
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              stage:
                type:
