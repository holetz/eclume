      summary: Renomear ou descrever uma coleção
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionPatch'
      responses:
        '200':
          description: Coleção atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - organize
      operationId: deleteCollection
      summary: Excluir uma coleção
      description: As gravações ficam; só saem da coleção.
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Excluída.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tags:
    get:
      tags:
      - organize
      operationId: listTags
      summary: Tags em uso nas gravações do usuário
      security:
      - sessionCookie: []
      - pat:
        - recordings:read
      responses:
        '200':
          description: Tags com contagem.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
              examples:
                tags:
                  $ref: '#/components/examples/TagList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/auth/login:
    post:
      tags:
      - admin
      operationId: adminLogin
      summary: Abrir a sessão de admin
      description: 'Conta de admin, separada das contas de usuário (o mesmo e-mail pode existir nas duas).

        Define os cookies `eclume_admin_session` (HttpOnly, Secure, SameSite=Strict,

        `Path=/api/v1/admin`) e `eclume_admin_csrf` (legível pelo JavaScript). Toda requisição

        mutável em `/api/v1/admin/*` ecoa `eclume_admin_csrf` no header `X-CSRF-Token`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credenciais:
                $ref: '#/components/examples/LoginRequest'
      responses:
        '204':
          description: Sessão de admin aberta.
          headers:
            Set-Cookie:
              description: '`eclume_admin_session` e `eclume_admin_csrf`.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/auth/logout:
    post:
      tags:
      - admin
      operationId: adminLogout
      security:
      - adminSessionCookie: []
      summary: Encerrar a sessão de admin
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Sessão encerrada e cookies removidos.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/me:
    get:
      tags:
      - admin
      operationId: getAdminMe
      security:
      - adminSessionCookie: []
      summary: Conta de admin corrente
      responses:
        '200':
          description: Conta de admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
              examples:
                admin:
                  $ref: '#/components/examples/AdminMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/admin/settings:
    get:
      tags:
      - admin
      operationId: getAdminSettings
      security:
      - adminSessionCookie: []
      summary: Configuração em runtime da plataforma
      responses:
        '200':
          description: Configuração.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
              examples:
                padrao:
                  $ref: '#/components/examples/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - admin
      operationId: updateAdminSettings
      security:
      - adminSessionCookie: []
      summary: Alterar a configuração
      description: Merge por bloco; só os campos enviados mudam. Vale para os próximos jobs. Desligar
        `voice_identification.enabled` apaga as impressões de voz e as sugestões pendentes de toda a plataforma.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSettingsPatch'
            examples:
              trocarModelo:
                $ref: '#/components/examples/AdminSettingsPatchRequest'
      responses:
        '200':
          description: Configuração resultante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/agent-providers:
    get:
      tags:
      - admin
      operationId: listAgentProviders
      security:
      - adminSessionCookie: []
      summary: Providers de agente de sumarização
      responses:
        '200':
          description: Providers. A chave de API nunca volta; só `api_key_set`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProviderPage'
              examples:
                providers:
                  $ref: '#/components/examples/AgentProviderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - admin
      operationId: createAgentProvider
      security:
      - adminSessionCookie: []
      summary: Cadastrar um provider
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProviderCreate'
            examples:
              deepseek:
                $ref: '#/components/examples/AgentProviderCreateRequest'
      responses:
        '201':
          description: Provider cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/agent-providers/{provider_id}:
    parameters:
    - $ref: '#/components/parameters/ProviderId'
    patch:
      tags:
      - admin
      operationId: updateAgentProvider
      security:
      - adminSessionCookie: []
      summary: Editar um provider
      description: '`api_key: null` apaga a chave guardada; ausente, mantém.'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProviderPatch'
      responses:
        '200':
          description: Provider atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - admin
      operationId: deleteAgentProvider
      security:
      - adminSessionCookie: []
      summary: Remover um provider
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Removido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/secrets:
    get:
      tags:
      - admin
      operationId: listSecrets
      security:
      - adminSessionCookie: []
      summary: Segredos da plataforma (sem valor)
      responses:
        '200':
          description: Nomes e estado; o valor nunca volta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretList'
              examples:
                segredos:
                  $ref: '#/components/examples/SecretList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/secrets/{secret_name}:
    parameters:
    - name: secret_name
      in: path
      required: true
      description: 'Nome do segredo: `hf_token` (diarização no worker GPU) ou `anthropic_api_key` (provider
        `anthropic` sem chave própria). Outro nome → 422.'
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_]{1,63}$
    put:
      tags:
      - admin
      operationId: putSecret
      security:
      - adminSessionCookie: []
      summary: Gravar um segredo (cifrado)
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretPut'
      responses:
        '204':
          description: Gravado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - admin
      operationId: deleteSecret
      security:
      - adminSessionCookie: []
      summary: Apagar um segredo
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Apagado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/users:
    get:
      tags:
      - admin
      operationId: listUsers
      security:
      - adminSessionCookie: []
      summary: Contas de usuário
      description: Dados da conta e a contagem de gravações; nunca o conteúdo do usuário.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
              examples:
                usuarios:
                  $ref: '#/components/examples/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users/{user_id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - admin
      operationId: updateUser
      security:
      - adminSessionCookie: []
      summary: Desativar ou reativar um usuário
      description: Desativar encerra as sessões e revoga os PATs do usuário.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/jobs/{job_id}/retry:
    post:
      tags:
      - admin
      operationId: retryTranscriptionJob
      security:
      - adminSessionCookie: []
      summary: Retentar um job de transcrição que falhou
      description: Cria o job da revisão seguinte da gravação, com a configuração atual da plataforma,
        e o enfileira. Vale para a gravação de qualquer usuário, mas só para o job mais recente da gravação
        e em estado `failed`.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Novo job na fila.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobRetried'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/health:
    get:
      tags:
      - admin
      operationId: getAdminHealth
      security:
      - adminSessionCookie: []
      summary: Saúde da fila, da GPU e dos modelos
      responses:
        '200':
          description: Estado atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
              examples:
                gpu:
                  $ref: '#/components/examples/AdminHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: 'Sessão do navegador, aberta por `POST /api/v1/auth/login` ou pelo cadastro. Tem todas
        as

        permissões do usuário sobre a própria conta. Métodos mutáveis exigem `X-CSRF-Token` igual

        ao cookie `eclume_csrf` (double-submit). Gestão de PATs, o aceite do aviso e as rotas de

        voz aceitam **só** sessão. Não alcança `/api/v1/admin/*`.

        '
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: eclume_admin_session
      description: 'Sessão da conta de admin, aberta por `POST /api/v1/admin/auth/login` (HttpOnly, Secure,

        SameSite=Strict, `Path=/api/v1/admin`, 12 h). É a única credencial aceita em

        `/api/v1/admin/*`, e é ignorada em qualquer outra rota. Métodos mutáveis exigem

        `X-CSRF-Token` igual ao cookie `eclume_admin_csrf` (double-submit).

        '
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<segredo>
      description: 'PAT pessoal: `Authorization: Bearer eclp_<segredo>`. Age como o usuário dono, limitado

        aos escopos concedidos. Os escopos exigidos por operação estão no requisito de segurança

        (`pat: [escopo, ...]`, todos obrigatórios). Nenhum escopo implica outro. Faltando

        escopo, a resposta é 403 com `code: insufficient_scope` e `required_scopes`.

        '
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: 'Obrigatório com sessão: o valor do cookie `eclume_csrf`, ou de `eclume_admin_csrf`
        em `/api/v1/admin/*`. Ignorado com PAT.'
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: Só itens com `updated_at >= since` (inclusivo).
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Id de pessoa; só transcrições (ou trechos) em que um locutor está ligado a ela.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Só gravações com esta tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Só gravações desta coleção.
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgendaTypeId:
      name: agenda_type_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Sem credencial, ou credencial inválida, expirada ou revogada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples:
            - Bearer realm="eclume"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semCredencial:
              $ref: '#/components/examples/ProblemUnauthorized'
    Forbidden:
      description: 'Credencial válida sem permissão (escopo ou dono), PAT numa operação que aceita só
        sessão (`code: session_required`), ou cadastro fechado (`code: signup_closed`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semEscopo:
              $ref: '#/components/examples/ProblemInsufficientScope'
    NotFound:
      description: Não existe ou não é do usuário (o eclume não distingue os dois).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              $ref: '#/components/examples/ProblemNotFound'
    ValidationFailed:
      description: Corpo ou parâmetros inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              $ref: '#/components/examples/ProblemValidation'
    Conflict:
      description: O estado atual impede a operação (upload já concluído, nome duplicado, job em andamento).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: Erro RFC 9457. O cliente decide por `code`, nunca por `title`.
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: 'Código estável. Valores v1: `unauthorized`, `insufficient_scope`, `forbidden`,

            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,

            `rate_limited`; desde a 1.4.0, `session_required` (PAT numa operação só de sessão);

            desde a 2.0.0, `email_taken` (cadastro com e-mail existente) e `signup_closed`.

            Códigos novos entram de forma aditiva.

            '
          type: string
        required_scopes:
          description: Com `insufficient_scope`, os escopos que faltaram.
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        errors:
          description: Com `validation_failed`, um item por campo inválido.
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                description: Caminho do campo (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string
    Scope:
      description: Escopo de PAT.
      type: string
      enum:
      - recordings:read
      - recordings:write
      - transcripts:read
      - transcripts:write
      - people:read
      - people:write
      - summaries:read
      - summaries:write
    Health:
      type: object
      required:
      - status
      - version
      - contract_version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa (`info.version`).
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    Notice:
      description: Aviso que a conta aceita ao nascer ("Sou responsável por pedir o consentimento das
        pessoas que gravo").
      type: object
      required:
      - version
      - text
      properties:
        version:
          type: string
        text:
          type: string
    SignupInfo:
      type: object
      required:
      - open
      - notice
      properties:
        open:
          description: '`false` com `ECLUME_SIGNUP_OPEN=false`: o cadastro responde 403 `signup_closed`.'
          type: boolean
        notice:
          $ref: '#/components/schemas/Notice'
    SignupRequest:
      type: object
      required:
      - name
      - email
      - password
      - notice_version
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        notice_version:
          description: Versão do aviso aceito; tem de ser a em vigor.
          type: string
          minLength: 1
    NoticeAccept:
      type: object
      required:
      - notice_version
      properties:
        notice_version:
          type: string
          minLength: 1
    User:
      type: object
      required:
      - id
      - email
      - name
      - active
      - created_at
      - last_login_at
      - notice_version
      - notice_accepted_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        notice_version:
          description: Versão do aviso aceito, ou `null` numa conta que ainda não aceitou.
          type:
          - string
          - 'null'
        notice_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminUser:
      description: Conta de usuário vista pelo admin (o `User` mais a contagem de gravações).
      type: object
      required:
      - id
      - email
      - name
      - active
      - created_at
      - last_login_at
      - notice_version
      - notice_accepted_at
      - recording_count
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
