        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags:
      - summaries
      operationId: editRecordingSummary
      summary: Edit the summary by hand
      description: 'Stores the Markdown as a `manual` version, which becomes the current one. `base_version`
        is

        the version the person opened (0 with no completed summary); if another version came in

