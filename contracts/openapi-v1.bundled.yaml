  /api/v1/recordings/{recording_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    post:
      tags:
      - recordings
      operationId: cancelRecordingTranscription
      summary: Cancel the running or queued transcription
      description: 'Since 2.10.0. The recording''s `queued`/`running` job ends `cancelled`, the recording
        becomes

        `failed` with `Job.error.code` `cancelled` (recoverable) and the running step becomes `skipped`

        with `reason` `cancelled`. The GPU worker stops at the next checkpoint and frees the GPU;

        "Transcrever de novo" (`/retranscribe`) is the way back. With no open job, 409.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: Transcription cancelled; the recording with the job `cancelled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
              examples:
                cancelled:
                  $ref: '#/components/examples/RecordingCancelled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/recordings/{recording_id}/continue:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    post:
      tags:
      - recordings
      operationId: continueRecordingWithoutNames
      summary: Continue without naming the speakers
      description: 'Since 2.22.0. Releases the recording stopped waiting for the names: the `speakers`
        step

        becomes `skipped` with `reason` `continued_by_user` and the chain goes on through the agenda

        type. Outside the wait, 409.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
