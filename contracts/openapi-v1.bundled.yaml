- name: devices
  description: 'Linking the desktop and the phone: login by e-mail and password or by pairing code, which
    issue a device credential (a `kind: device` token).'
- name: uploads
  description: Resumable multipart upload (S3 multipart) with hash deduplication.
- name: recordings
  description: Recordings and job state.
- name: transcripts
  description: Transcripts, export and editing of speakers and segments.
- name: people
  description: The user's people directory.
- name: voice
  description: 'Voice identification (LGPD): voiceprint, suggestion refusal and automatic speaker assignment.
