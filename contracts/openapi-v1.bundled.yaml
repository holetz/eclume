        - id: seg-0003
          speaker_id: S1
          start_ms: 24600
          end_ms: 38900
          text: Faz sentido. Por isso a proposta é trabalhar em encontros de quatro horas, com uma tarefa
            prática entre um encontro e outro, aplicada no dia a dia da equipe.
          confidence: 0.94
        - id: seg-0004
          speaker_id: S3
          start_ms: 39500
          end_ms: 52300
          text: Eu só queria entender como a gente mede se funcionou. No ano passado fizemos um treinamento
            e ninguém soube dizer o que mudou.
          confidence: 0.89
        - id: seg-0005
          speaker_id: S1
          start_ms: 52900
          end_ms: 71400
          text: Essa é a pergunta certa. Antes do primeiro encontro, a gente aplica o assessment com cada
            gestor e com uma amostra da equipe dele. No fim do semestre, repetimos e comparamos.
          confidence: 0.9
        - id: seg-0006
          speaker_id: S3
          start_ms: 72000
          end_ms: 80350
          text: E esse resultado chega para a diretoria de que forma?
          confidence: 0.95
        - id: seg-0007
          speaker_id: S1
          start_ms: 80900
          end_ms: 97600
          text: Num relatório consolidado, sem expor ninguém individualmente. Cada gestor recebe a própria
            devolutiva numa conversa um a um.
          confidence: 0.92
        - id: seg-0008
          speaker_id: S2
          start_ms: 98200
          end_ms: 112750
          text: Isso resolve a preocupação que o pessoal da fábrica levantou. Eles tinham receio de que
            a avaliação virasse instrumento de cobrança.
          confidence: 0.88
        - id: seg-0009
          speaker_id: S3
          start_ms: 113300
          end_ms: 121900
          text: Certo. Quantas turmas vocês estão pensando?
          confidence: 0.96
        - id: seg-0010
          speaker_id: S1
          start_ms: 122500
          end_ms: 139800
          text: Três turmas de 12 gestores. A primeira começa em outubro, com as lideranças da produção,
            que é onde o turnover está mais alto.
