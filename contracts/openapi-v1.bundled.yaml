openapi: 3.1.0
info:
  title: eclume API
  version: 2.29.0
  summary: Contract v1 of the eclume API, the institutional transcription service.
  description: "Source of truth between the eclume server and its clients: the web frontend, the desktop\n\
    app and PAT integrations, such as the lumea importer.\n\n**Conventions** (detail in `docs/standards/api/contrato-v1.md`):\n\
    \n- Everything under `/api/v1`. Dates in RFC 3339 (UTC), durations in milliseconds, ids in UUID.\n\
    - Listings paginate by opaque cursor: `?cursor=&limit=`, response `{items, next_cursor}`;\n  `next_cursor:\
    \ null` is the last page.\n- Errors in `application/problem+json` (RFC 9457) with the stable `code`\
    \ field. Since 2.14.0,\n  any operation may answer 500 `internal_error` (unexpected failure; the detail\
    \ stays in the\n  server log) and any operation with a body, 413 `payload_too_large` (body above the\
    \ route's\n  ceiling: 64 KiB on the public credential routes `/auth/*`, `/admin/auth/*` and `/devices/*`,\n\
    \  the part's bytes on the part `PUT`, 1 MiB everywhere else and on `/mcp`), also without\n  `Content-Length`.\n\
    - **Per-account quotas** (since 2.15.0): storage, size per file, open uploads, audio\n  minutes and\
    \ agent requests in 24 h (`GET /me/usage`). Once a quota is exceeded, 403\n  `quota_exceeded` with\
    \ `quota`, `limit` and `used`; audio minutes never refuse: the\n  recording waits in the queue until\
    \ the window opens.\n- **Required speaker naming** (since 2.22.0): with `GET`/`PATCH /me/speaker-naming`\
    \ on,\n  the `speakers` step stays `waiting` while some speaker has no person, and the chain (type,\n\
    \  fields, collections, summary) waits; `Recording.awaiting` and the `awaiting=speakers`\n  filter\
    \ show those recordings.\n- **Agent** (since 2.23.0): conversations stored in `/agent/sessions`, with\
    \ input\n  attachments and generated files to download; the chat over the base (`/base-chat`) is\n\
    \  deprecated.\n- **Queue wait** (since 2.16.0): while the job is `queued`, `Job.queue` says why it\
    \ waits\n  (processor queue, the account's own turn or minutes window), the position, a forecast\n\
    \  labelled as an estimate and whether the processor is up.\n- Each user has their own isolated account;\
    \ there is no organization. The admin panel uses\n  its own account and session (`adminSessionCookie`),\
    \ which only reach `/api/v1/admin/*`.\n- **Additive-only evolution.** The client ignores properties\
    \ it does not know and tolerates\n  new enum values in responses. 2.0.0 is the only break under `/api/v1`\
    \ (end of the\n  organization); the next incompatible change becomes `/api/v2`.\n- **MCP server at\
    \ `/mcp`** (outside `/api/v1`, outside this document): stateless streamable\n  HTTP Model Context\
    \ Protocol, with JSON responses. It accepts only\n  `Authorization: Bearer eclp_…` (personal or device\
    \ PAT); each tool requires the scopes of\n  the equivalent operation of this API, and a scope refusal\
    \ comes back as a tool error that\n  names the scope. Without a valid credential, 401 `unauthorized`.\
    \ Detail in\n  `docs/standards/code/server-mcp-e-dispositivos.md`.\n"
  license:
    name: MIT
    identifier: MIT
