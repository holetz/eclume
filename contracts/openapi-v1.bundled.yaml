                editado:
                  $ref: '#/components/examples/SummaryState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags:
      - summaries
      operationId: editRecordingSummary
      summary: Editar o resumo à mão
      description: 'Grava o Markdown como uma versão `manual`, que vira a atual. `base_version` é a versão
        que

        a pessoa abriu (0 sem resumo concluído); se outra versão entrou nesse meio-tempo, 409

        `summary_changed` e nada é sobrescrito.

        '
      security:
      - sessionCookie: []
      - pat:
        - summaries:write
