# GERADO por contracts/tools/bundle.py a partir de contracts/openapi-v1.yaml,
# contracts/transcript.schema.json e contracts/fixtures/. Não edite à mão.
openapi: 3.1.0
info:
  title: eclume API
  version: 2.3.0
  summary: Contrato v1 da API do eclume, o serviço de transcrição institucional.
  description: "Fonte da verdade entre o servidor do eclume e os seus clientes: o frontend web, o app\n\
    desktop e integrações por PAT, como o importador do lumea.\n\n**Convenções** (detalhe em `docs/standards/api/contrato-v1.md`):\n\
    \n- Tudo sob `/api/v1`. Datas em RFC 3339 (UTC), durações em milissegundos, ids em UUID.\n- Listagens\
    \ paginam por cursor opaco: `?cursor=&limit=`, resposta `{items, next_cursor}`;\n  `next_cursor: null`\
    \ é a última página.\n- Erros em `application/problem+json` (RFC 9457) com o campo estável `code`.\n\
    - Cada usuário tem a própria conta, isolada; não há organização. O painel admin usa uma\n  conta e\
    \ uma sessão próprias (`adminSessionCookie`), que só alcançam `/api/v1/admin/*`.\n- **Evolução só\
    \ aditiva.** O cliente ignora propriedades que não conhece e tolera valores\n  de enum novos em respostas.\
    \ A 2.0.0 é a única quebra sob `/api/v1` (fim da organização);\n  a próxima mudança incompatível vira\
    \ `/api/v2`.\n- **Servidor MCP em `/mcp`** (fora de `/api/v1`, fora deste documento): Model Context\n\
    \  Protocol em HTTP streamable sem estado, com respostas JSON. Aceita só\n  `Authorization: Bearer\
    \ eclp_…` (PAT pessoal ou de dispositivo); cada ferramenta exige os\n  escopos da operação equivalente\
    \ desta API, e a recusa por escopo volta como erro de\n  ferramenta que nomeia o escopo. Sem credencial\
    \ válida, 401 `unauthorized`. Detalhe em\n  `docs/standards/code/server-mcp-e-dispositivos.md`.\n"
  license:
    name: MIT
    identifier: MIT
servers:
- url: https://192.168.15.199:8443
  description: Produção no host GPU (Caddy com `tls internal`).
- url: http://127.0.0.1:4010
  description: Mock server (Prism) de `deploy/docker-compose.mock.yml`.
security:
- sessionCookie: []
tags:
- name: meta
  description: Saúde e versão do contrato.
- name: auth
  description: Sessão do navegador, cadastro com o aviso de consentimento e usuário corrente.
- name: tokens
  description: PATs pessoais e credenciais de dispositivo. Só com sessão.
- name: devices
  description: 'Ligação do desktop e do celular: login por e-mail e senha ou por código de pareamento,
    que emitem uma credencial de dispositivo (um token `kind: device`).'
- name: uploads
  description: Upload resumível em partes (multipart S3) com deduplicação por hash.
- name: recordings
  description: Gravações e estado do job.
- name: transcripts
  description: Transcrições, export e edição de locutores e segmentos.
- name: people
  description: Diretório de pessoas do usuário.
- name: voice
  description: 'Identificação por voz (LGPD): impressão de voz e recusa de sugestão. Só sessão: um PAT
    nunca lê nem apaga dado biométrico.'
- name: search
  description: Busca full-text sobre segmentos.
- name: organize
  description: Coleções e tags.
- name: agenda-types
  description: 'Tipos de agenda do usuário: como reconhecer a gravação, o título e as tags que ela ganha
    e as instruções do resumo.'
- name: fields
  description: Campos do usuário (título e tags embutidos, mais os próprios) e as regras com que o agente
    os preenche.
- name: previews
  description: Resultado de testar a regra de um campo ou um tipo de agenda em rascunho.
- name: summaries
  description: Resumos gerados por agente com as instruções de um tipo de agenda.
- name: admin
  description: Conta de admin, configuração e segredos da plataforma, usuários e saúde. Só a sessão de
    admin (`adminSessionCookie`); nenhuma credencial de usuário alcança estas rotas.
paths:
  /api/v1/health:
    get:
      tags:
      - meta
      operationId: getHealth
      summary: Saúde do serviço e versão do contrato
      security: []
      responses:
        '200':
          description: Serviço no ar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  $ref: '#/components/examples/Health'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: Abrir sessão com e-mail e senha
      description: 'Define os cookies `eclume_session` (HttpOnly, Secure, SameSite=Lax) e `eclume_csrf`

        (legível pelo JavaScript). Toda requisição mutável autenticada por sessão ecoa o valor

        de `eclume_csrf` no header `X-CSRF-Token`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credenciais:
                $ref: '#/components/examples/LoginRequest'
      responses:
        '204':
          description: Sessão aberta.
          headers:
            Set-Cookie:
              description: '`eclume_session` e `eclume_csrf`.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: Encerrar a sessão
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Sessão encerrada e cookies removidos.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/signup:
    get:
      tags:
      - auth
      operationId: getSignupInfo
      summary: Estado do cadastro e o aviso em vigor
      description: Diz se o cadastro está aberto e devolve o texto e a versão do aviso que a conta nova
        aceita.
      security: []
      responses:
        '200':
          description: Cadastro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupInfo'
              examples:
                aberto:
                  $ref: '#/components/examples/SignupInfo'
    post:
      tags:
      - auth
      operationId: signup
      summary: Criar uma conta e abrir a sessão
      description: 'Cadastro aberto, sem convite e sem confirmação de e-mail. Exige o aceite do aviso
        em vigor

        (`notice_version` igual à versão de `GET /api/v1/auth/signup`). A conta nasce com os

        tipos de agenda padrão, e a resposta define os cookies de sessão, como o login.

        Com o cadastro fechado (`ECLUME_SIGNUP_OPEN=false`), 403 `signup_closed`; e-mail já

        cadastrado, 409 `email_taken`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              conta:
                $ref: '#/components/examples/SignupRequest'
      responses:
        '204':
          description: Conta criada e sessão aberta.
          headers:
            Set-Cookie:
              description: '`eclume_session` e `eclume_csrf`.'
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/me:
    get:
      tags:
      - auth
      operationId: getMe
      summary: Usuário e credencial correntes
      description: Aceita qualquer credencial válida, sem escopo. O lumea usa para mostrar a conta conectada
        e os escopos do PAT.
      security:
      - sessionCookie: []
      - pat: []
      responses:
        '200':
          description: Usuário corrente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                viaPat:
                  $ref: '#/components/examples/MeViaPat'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/notice:
    post:
      tags:
      - auth
      operationId: acceptNotice
      summary: Aceitar o aviso de consentimento em vigor
      description: Registra o aceite do aviso pela conta corrente, o que zera `notice_required` em `GET
        /api/v1/me`. Uma versão diferente da em vigor é 422. Só sessão.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeAccept'
            examples:
              aceite:
                $ref: '#/components/examples/NoticeAcceptRequest'
      responses:
        '204':
          description: Aceite registrado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/tokens:
    get:
      tags:
      - tokens
      operationId: listTokens
      summary: Listar os tokens do usuário
      description: PATs pessoais e credenciais de dispositivo. `?kind=device` é a lista de "App móvel"
        e "App desktop"; `?kind=personal`, a de "Tokens de acesso".
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: kind
        in: query
        description: Só os tokens deste tipo.
        schema:
          $ref: '#/components/schemas/TokenKind'
      responses:
        '200':
          description: Tokens, inclusive revogados, do mais novo para o mais antigo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPage'
              examples:
                tokens:
                  $ref: '#/components/examples/TokenPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - tokens
      operationId: createToken
      summary: Criar um PAT
      description: 'O segredo (`eclp_...`) volta só nesta resposta; o servidor guarda apenas o hash. Cria
        sempre `kind: personal`: a credencial de dispositivo só nasce de `POST /devices/login` ou `POST
        /devices/pair`.'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
            examples:
              lumea:
                $ref: '#/components/examples/TokenCreateRequest'
      responses:
        '201':
          description: PAT criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
              examples:
                lumea:
                  $ref: '#/components/examples/TokenCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/tokens/{token_id}:
    parameters:
    - $ref: '#/components/parameters/TokenId'
    delete:
      tags:
      - tokens
      operationId: revokeToken
      summary: Revogar um token
      description: Vale para PAT e credencial de dispositivo ("Desvincular" desliga o aparelho).
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revogado. Usos seguintes recebem 401.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/server:
    get:
      tags:
      - meta
      operationId: getServerInfo
      summary: Descritor público do servidor
      description: 'Nome, endereço, endereço MCP, impressão digital da CA raiz e versões. É a fonte do
        anúncio

        mDNS, do link do QR, do pareamento e do endereço embutido no instalador: o app confirma

        aqui o que recebeu e fixa a CA pela impressão digital (`ca_sha256`).

        '
      security: []
      responses:
        '200':
          description: Descritor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              examples:
                producao:
                  $ref: '#/components/examples/ServerInfo'
  /api/v1/devices/login:
    post:
      tags:
      - devices
      operationId: deviceLogin
      summary: Entrar num aparelho com e-mail e senha
      description: 'Confere a senha como o login do navegador e emite uma credencial de dispositivo: um
        token

        `kind: device` com `recordings:read` e `recordings:write`, sem validade e revogável em

        `DELETE /api/v1/tokens/{token_id}`. O segredo volta só nesta resposta. Senha errada ou

        conta inativa, 401 com a mesma mensagem do login; conta que ainda não aceitou o aviso em

        vigor, 403 `notice_required` (aceite na web e entre de novo); tentativas demais do mesmo

        IP ou para a mesma conta (a janela da conta é comum com `POST /auth/login`), 429

        `rate_limited` com `Retry-After`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLogin'
            examples:
              notebook:
                $ref: '#/components/examples/DeviceLoginRequest'
      responses:
        '201':
          description: Credencial de dispositivo emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredential'
              examples:
                notebook:
                  $ref: '#/components/examples/DeviceCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/devices/pairing-codes:
    post:
      tags:
      - devices
      operationId: createPairingCode
      summary: Gerar um código de pareamento
      description: 'Código de 6 caracteres (`K7Q-4MX`), válido por 10 minutos e de uso único, que o app
        troca

        por uma credencial de dispositivo em `POST /api/v1/devices/pair`. `pair_url` é o conteúdo

        do QR que o celular lê. Um código novo vence os anteriores ainda não usados. Só sessão.

        '
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Código gerado; `code`, `display` e `pair_url` só voltam aqui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
              examples:
                novo:
                  $ref: '#/components/examples/PairingCodeCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/devices/pairing-codes/{pairing_code_id}:
    parameters:
    - $ref: '#/components/parameters/PairingCodeId'
    get:
      tags:
      - devices
      operationId: getPairingCode
      summary: Estado de um código de pareamento
      description: A web consulta para trocar o QR por "Pareado" e mostrar o aparelho (`token_id`). Só
        sessão.
      responses:
        '200':
          description: Estado do código, sem o código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
              examples:
                usado:
                  $ref: '#/components/examples/PairingCodeUsed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/pair:
    post:
      tags:
      - devices
      operationId: pairDevice
      summary: Trocar um código de pareamento por uma credencial de dispositivo
      description: 'O código aceita maiúsculas ou minúsculas, com ou sem hífen. Emite a credencial de

        dispositivo do dono do código, como `POST /api/v1/devices/login`. Código inexistente,

        vencido ou já usado, 401 `invalid_pairing_code`; tentativas demais do mesmo IP (ou,

        somando todos os IPs, seis vezes esse limite), 429 `rate_limited` com `Retry-After`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePair'
            examples:
              celular:
                $ref: '#/components/examples/DevicePairRequest'
      responses:
        '201':
          description: Credencial de dispositivo emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/uploads:
    post:
      tags:
      - uploads
      operationId: createUpload
      summary: Iniciar um upload (ou deduplicar)
      description: 'O cliente calcula o `sha256` do arquivo antes de subir. Se o usuário já tem uma gravação

        com o mesmo hash, a resposta é **200** com `status: deduplicated` e o `recording_id`

        existente, e nada é transferido. Caso contrário, **201** com o upload, o `part_size`

        fixado pelo servidor e as URLs das primeiras partes.


        Partes: todas com `part_size` bytes, exceto a última; no máximo 10 000. Cada parte vai

        por `PUT` na `url` da parte, com os `headers` indicados; o `ETag` da resposta é guardado

        para o `complete`. A URL é opaca (MinIO pré-assinado ou o próprio

        `PUT /api/v1/uploads/{upload_id}/parts/{part_number}`) e expira em `expires_at`.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
            examples:
              desktop:
                $ref: '#/components/examples/UploadCreateRequest'
      responses:
        '200':
          description: Deduplicado. Já existe gravação com este hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                deduplicado:
                  $ref: '#/components/examples/UploadDeduplicated'
        '201':
          description: Upload criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                criado:
                  $ref: '#/components/examples/UploadCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/uploads/{upload_id}:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    get:
      tags:
      - uploads
      operationId: getUpload
      summary: Estado do upload, para retomar
      description: '`parts_received` lista as partes que o armazenamento já confirmou; o cliente sobe
        só as que faltam.'
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      responses:
        '200':
          description: Upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                emAndamento:
                  $ref: '#/components/examples/UploadInProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - uploads
      operationId: abortUpload
      summary: Abortar o upload e descartar as partes
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Abortado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/uploads/{upload_id}/part-urls:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    post:
      tags:
      - uploads
      operationId: createPartUrls
      summary: Pedir URLs para partes
      description: URLs novas para as partes indicadas, inclusive para substituir URLs expiradas numa
        retomada.
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUrlsRequest'
            examples:
              faltantes:
                $ref: '#/components/examples/PartUrlsRequest'
      responses:
        '200':
          description: URLs das partes pedidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUrls'
              examples:
                faltantes:
                  $ref: '#/components/examples/PartUrls'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/uploads/{upload_id}/parts/{part_number}:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    - name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    put:
      tags:
      - uploads
      operationId: putUploadPart
      summary: Enviar uma parte pela API
      description: 'Variante da URL de parte servida pela própria API, com a mesma semântica do `PUT`
        num

        URL pré-assinado do S3. O cliente não monta este caminho: usa a `url` que recebeu.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: Parte gravada.
          headers:
            ETag:
              description: Identificador da parte, a devolver no `complete`.
              required: true
              schema:
                type: string
                examples:
                - '"5d41402abc4b2a76b9719d911017c592"'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/uploads/{upload_id}/complete:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    post:
      tags:
      - uploads
      operationId: completeUpload
      summary: Concluir o upload e enfileirar a transcrição
      description: 'Monta o objeto a partir das partes, cria a gravação e enfileira o job. O servidor
        confere

        o `sha256` declarado; divergência vira falha do job com `error.code: hash_mismatch`.

        Repetir o `complete` de um upload já concluído devolve a mesma gravação.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadComplete'
            examples:
              partes:
                $ref: '#/components/examples/UploadCompleteRequest'
      responses:
        '201':
          description: Gravação criada, job na fila.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
              examples:
                naFila:
                  $ref: '#/components/examples/RecordingQueued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/recordings:
    get:
      tags:
      - recordings
      operationId: listRecordings
      summary: Listar as gravações do usuário
      description: 'A biblioteca: por intervalo de `recorded_at` (semana, mês) e com filtros. Os filtros
        são

        repetíveis: valores repetidos do mesmo filtro combinam por OU, e filtros diferentes, por E

        (`?tag=a&tag=b&kind=note` = nota com a tag `a` ou `b`).

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Since'
      - name: from
        in: query
        description: '`recorded_at >= from`.'
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: '`recorded_at < to`.'
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        description: '`created_desc` (padrão, a mais recente enviada primeiro), `recorded_asc` ou `recorded_desc`
          (pelo início da gravação). O cursor vale só para a mesma ordenação.'
        schema:
          type: string
          enum:
          - created_desc
          - recorded_asc
          - recorded_desc
          default: created_desc
      - name: kind
        in: query
        description: Natureza da gravação; repetível.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RecordingKind'
      - name: status
        in: query
        description: Estado da gravação; repetível.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RecordingStatus'
      - name: tag
        in: query
        description: Tag; repetível.
        schema:
          type: array
          items:
            type: string
      - name: collection
        in: query
        description: Coleção; repetível.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: person
        in: query
        description: Pessoa ligada a um locutor da transcrição; repetível.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: field
        in: query
        description: 'Valor de um campo do usuário, `<field_id>:<valor>`; repetível. Cada campo é um filtro:
          valores do mesmo campo combinam por OU, campos diferentes por E. Num campo de lista, basta o
          valor ser um dos itens; título e tags valem como os embutidos.'
        schema:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F-]{36}:.+$
      responses:
        '200':
          description: Gravações, na ordem de `sort`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
              examples:
                semana:
                  $ref: '#/components/examples/RecordingWeekPage'
                biblioteca:
                  $ref: '#/components/examples/RecordingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/recordings/{recording_id}:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      tags:
      - recordings
      operationId: getRecording
