          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MarkerInput'
        device_name:
          description: Quem marcou ("Field phone").
          type:
          - string
          - 'null'
          maxLength: 200
    MarkerPatch:
      type: object
      required:
      - note
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    Marker:
