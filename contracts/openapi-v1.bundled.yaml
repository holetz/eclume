      - reply_to
      - base_summary_id
      - summary_id
      - reads
      - provider
      - model
      - error
      - created_by
      - created_at
      - completed_at
      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          description: O pedido, ou a resposta do agente (`null` até `done`).
          type:
          - string
          - 'null'
        status:
          description: A mensagem do usuário nasce `done`; a do agente vai de `queued` a `done` ou `failed`.
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        reply_to:
          description: Na resposta do agente, o pedido que ela responde.
          type:
          - string
          - 'null'
          format: uuid
        base_summary_id:
          description: A versão atual quando o pedido chegou.
          type:
          - string
          - 'null'
          format: uuid
        summary_id:
          description: A versão `chat` que a resposta criou, se mudou o resumo.
          type:
          - string
          - 'null'
          format: uuid
        reads:
          description: As consultas do agente à transcrição, em ordem.
          type: array
          items:
            $ref: '#/components/schemas/ChatRead'
        provider:
          oneOf:
          - $ref: '#/components/schemas/AgentProviderRef'
          - type: 'null'
        model:
          type:
          - string
          - 'null'
        error:
          description: 'Com `failed` (`provider_bad_output`, `chat_tool_limit`, `provider_timeout`...),
            ou com

            `done` e `summary_changed` quando o resumo mudou durante o ajuste: a resposta fica, sem

            versão nova.

            '
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
          - type: 'null'
        created_by:
          description: 'Obsoleto desde a 2.11.0: sempre o id do próprio usuário (cada conta é isolada);
            sai na `/api/v2`.'
          deprecated: true
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    SummaryChatExchange:
      type: object
      required:
