          content_md: '# Ata — Alinhamento do programa de lideranças


            **Data:** 18/09/2026 · **Participantes:** Mariana Couto (Example Org), Locutor 2, Locutor
            3


            ## Decisões


            - Encontros de quatro horas, com tarefa prática entre um encontro e outro.

            - Assessment com cada gestor e amostra da equipe antes do primeiro encontro, repetido no fim
            do semestre.

            - Relatório consolidado para a diretoria, sem exposição individual; devolutiva um a um para
            cada gestor.

            - Três turmas de 12 gestores; a primeira, em outubro, com as lideranças da produção.


            ## Encaminhamentos


            - [ ] Locutor 2 envia a lista da primeira turma até sexta.

            - [ ] Mariana Couto agenda as entrevistas iniciais e envia o cronograma na semana seguinte.

            '
