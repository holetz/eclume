          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/AgentProviderKind'
    SummaryOrigin:
      description: 'Como a versão nasceu: `generated` (o agente pelas instruções do tipo de agenda), `manual`

        (edição à mão, ou voltar à gerada) ou `chat` (ajuste pelo agente no chat).

        '
      type: string
      enum:
      - generated
      - manual
      - chat
    Summary:
      description: 'Uma versão do resumo da transcrição. A atual é a de maior `version` com `status: done`.

        Uma geração que termina depois de uma edição ou de um ajuste toma o próximo número e vira a

        atual; por isso os números podem pular.

        '
      type: object
      required:
      - id
      - transcript_id
      - transcript_revision
      - agenda_type
      - version
      - origin
      - status
      - trigger
      - provider
      - model
      - content_md
      - error
      - restored_from_id
      - chat_message_id
      - created_by
      - created_at
      - completed_at
      properties:
        id:
          type: string
          format: uuid
        transcript_id:
          type: string
          format: uuid
        transcript_revision:
          description: Revisão da transcrição que o resumo leu.
          type: integer
          minimum: 1
        agenda_type:
          description: 'Instantâneo do tipo de agenda cujas instruções o resumo seguiu (numa versão `manual`
            ou

            `chat`, o da versão de que ela partiu): o resumo continua quando o tipo é renomeado ou

            excluído. `null` numa edição sem versão anterior.

            '
          oneOf:
          - type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
          - type: 'null'
        version:
          description: 'Versão do resumo da transcrição, a partir de 1; toda geração, edição, volta à
            gerada

            ou ajuste por chat sobe a versão.

            '
          type: integer
          minimum: 1
        origin:
          $ref: '#/components/schemas/SummaryOrigin'
        status:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        trigger:
          type: string
          enum:
          - manual
          - automatic
        provider:
          description: O agente que escreveu a versão; `null` numa versão `manual`.
          oneOf:
          - $ref: '#/components/schemas/AgentProviderRef'
          - type: 'null'
        model:
          type:
          - string
          - 'null'
        content_md:
          description: 'Resumo em Markdown, com `status: done`.'
          type:
          - string
          - 'null'
        error:
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
          - type: 'null'
