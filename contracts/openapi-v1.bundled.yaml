          description: '`null` = adaptativo à VRAM livre.'
          type:
          - integer
          - 'null'
          minimum: 1
        default_language:
          description: 'Idioma das gravações sem idioma próprio (`pt`, `en`…), ou `auto`: a engine detecta
            o

            idioma de cada gravação e o alinhador segue o detectado.

            '
          type:
          - string
          - 'null'
        fallback_model:
          description: Modelo usado depois de um OOM.
          type:
          - string
          - 'null'
