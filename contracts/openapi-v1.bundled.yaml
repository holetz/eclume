              schema:
                $ref: '#/components/schemas/Recording'
              examples:
                transcrita:
                  $ref: '#/components/examples/RecordingTranscribed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - recordings
      operationId: updateRecording
      summary: Editar metadados da gravação
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
