      properties:
        id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        at_ms:
          description: Instante desde o início; pode passar da duração, que só se conhece depois.
          type: integer
          minimum: 0
        note:
          type:
          - string
          - 'null'
        device_name:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MarkerPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AsrSettings:
      type: object
      required:
      - engine
      - model
      - compute_type
      - batch_size
      - default_language
      - fallback_model
      - endpoint_url
      properties:
        engine:
          type: string
          enum:
          - whisperx-local
          - openai-compatible
          - cpu
        model:
          type: string
        compute_type:
          type: string
        batch_size:
          description: '`null` = adaptativo à VRAM livre.'
          type:
          - integer
          - 'null'
          minimum: 1
        default_language:
          description: 'Idioma das gravações sem idioma próprio (`pt`, `en`…), ou `auto`: a engine detecta
            o

            idioma de cada gravação e o alinhador segue o detectado.

            '
          type:
          - string
          - 'null'
        fallback_model:
          description: Modelo usado depois de um OOM.
          type:
          - string
          - 'null'
        endpoint_url:
          description: 'Base do servidor remoto, com `engine: openai-compatible`.'
          type:
          - string
          - 'null'
          format: uri
    DiarizationSettings:
      type: object
      required:
      - enabled
      - model
      - min_speakers
      - max_speakers
      properties:
        enabled:
          type: boolean
        model:
          type: string
        min_speakers:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 30
        max_speakers:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 30
    PreprocessingSettings:
      description: 'Tratamento do áudio antes da transcrição, pelo worker GPU, em ordem fixa: separar
        canais,

        reduzir ruído, normalizar o loudness e cortar o silêncio do início e do fim. A conversão

        para 16 kHz mono é sempre feita e não tem chave. As marcas de tempo continuam as do áudio

        original.

        '
      type: object
      required:
      - denoise
      - loudnorm
      - trim_silence
      - split_channels
      properties:
        denoise:
          type: object
          required:
          - enabled
          - method
          - strength
          properties:
            enabled:
              type: boolean
            method:
              description: '`rnnoise` (rede neural, 48 kHz) ou `afftdn` (FFT do ffmpeg).'
              type: string
              enum:
              - rnnoise
              - afftdn
            strength:
              description: Quanto do sinal tratado entra na mistura.
              type: number
              minimum: 0
              maximum: 1
        loudnorm:
          type: object
          required:
          - enabled
          - target_lufs
          - true_peak_db
          - lra
          properties:
            enabled:
              type: boolean
            target_lufs:
              description: Loudness integrado alvo (EBU R128).
              type: number
              minimum: -30
              maximum: -10
            true_peak_db:
              type: number
              minimum: -9
              maximum: 0
            lra:
              description: Faixa de loudness.
              type: number
              minimum: 1
              maximum: 20
        trim_silence:
          type: object
          required:
          - enabled
          - min_silence_s
          - threshold_db
          properties:
            enabled:
              type: boolean
            min_silence_s:
              description: Silêncio mínimo, no início ou no fim, para cortar.
              type: number
              minimum: 1
              maximum: 30
            threshold_db:
              description: Abaixo deste nível, é silêncio.
              type: number
              minimum: -80
              maximum: -20
        split_channels:
          description: Um canal por pessoa (gravação estéreo de duas fontes); mono duplicado é pulado.
          type: object
          required:
          - enabled
          properties:
            enabled:
              type: boolean
    VoiceIdentificationSettings:
      type: object
      required:
      - enabled
      - suggestion_threshold
      properties:
        enabled:
          description: Liga a identificação por voz na plataforma; exige a separação de locutores ligada
            (422 em `voice_identification.enabled`). Desligado, nenhuma impressão é comparada nem criada;
            desligar apaga as existentes. O aceite do aviso no cadastro cobre o consentimento.
          type: boolean
        suggestion_threshold:
          description: Similaridade mínima (cosseno) para sugerir uma pessoa; o padrão sai da calibração.
          type: number
          minimum: 0
          maximum: 1
    AdminSettings:
      type: object
      required:
      - asr
      - diarization
      - voice_identification
      - preprocessing
      - quotas
      - retention
      - updated_at
      - updated_by
      properties:
        asr:
          $ref: '#/components/schemas/AsrSettings'
        diarization:
          $ref: '#/components/schemas/DiarizationSettings'
        voice_identification:
          $ref: '#/components/schemas/VoiceIdentificationSettings'
        preprocessing:
          $ref: '#/components/schemas/PreprocessingSettings'
        quotas:
          description: Cotas padrão de toda conta (desde a 2.15.0); o admin as sobrepõe por conta.
          $ref: '#/components/schemas/Quotas'
        retention:
          description: Since 2.29.0. Platform-wide audio retention settings.
          $ref: '#/components/schemas/RetentionSettings'
        updated_at:
          type: string
          format: date-time
        updated_by:
          description: Conta de admin que mudou por último.
          oneOf:
          - $ref: '#/components/schemas/AdminRef'
          - type: 'null'
    RetentionSettings:
      type: object
      required:
      - audio_max_days
      properties:
        audio_max_days:
          description: Ceiling, in days, on the audio retention an account may choose; `null` is none.
            It only caps the accounts' values and deletes nothing for an account that left retention off.
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3650
    AdminSettingsPatch:
      description: Cada bloco é mesclado campo a campo; campos ausentes ficam como estão.
      type: object
      minProperties: 1
      properties:
        asr:
          type: object
          properties:
            engine:
              type: string
              enum:
              - whisperx-local
              - openai-compatible
              - cpu
            model:
              type: string
            compute_type:
              type: string
            batch_size:
              type:
              - integer
              - 'null'
              minimum: 1
            default_language:
              description: Código do idioma ou `auto`.
              type:
              - string
              - 'null'
              pattern: ^(auto|[a-z]{2,3}(-[A-Za-z0-9]{2,8})*)$
            fallback_model:
              type:
              - string
              - 'null'
            endpoint_url:
              type:
              - string
              - 'null'
              format: uri
        diarization:
          type: object
          properties:
            enabled:
              type: boolean
            model:
              type: string
            min_speakers:
              type:
              - integer
              - 'null'
              minimum: 1
              maximum: 30
            max_speakers:
              type:
              - integer
              - 'null'
              minimum: 1
              maximum: 30
        voice_identification:
          type: object
          properties:
            enabled:
              type: boolean
            suggestion_threshold:
              type: number
              minimum: 0
              maximum: 1
        preprocessing:
          description: Cada etapa é mesclada campo a campo.
          type: object
          additionalProperties: false
          properties:
            denoise:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                method:
                  description: '`rnnoise` (rede neural, 48 kHz) ou `afftdn` (FFT do ffmpeg).'
                  type: string
                  enum:
                  - rnnoise
                  - afftdn
                strength:
                  description: Quanto do sinal tratado entra na mistura.
                  type: number
                  minimum: 0
                  maximum: 1
            loudnorm:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                target_lufs:
                  description: Loudness integrado alvo (EBU R128).
                  type: number
                  minimum: -30
                  maximum: -10
                true_peak_db:
                  type: number
                  minimum: -9
                  maximum: 0
                lra:
                  description: Faixa de loudness.
                  type: number
                  minimum: 1
                  maximum: 20
            trim_silence:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                min_silence_s:
                  description: Silêncio mínimo, no início ou no fim, para cortar.
                  type: number
                  minimum: 1
                  maximum: 30
                threshold_db:
                  description: Abaixo deste nível, é silêncio.
                  type: number
                  minimum: -80
                  maximum: -20
            split_channels:
              description: Um canal por pessoa (gravação estéreo de duas fontes); mono duplicado é pulado.
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
        quotas:
          description: Cotas padrão (desde a 2.15.0), mescladas campo a campo; `null` é sem limite.
          $ref: '#/components/schemas/QuotasOverride'
        retention:
          description: Since 2.29.0. Audio retention ceiling; a null `audio_max_days` removes it.
          type: object
          additionalProperties: false
          properties:
            audio_max_days:
              type:
              - integer
              - 'null'
              minimum: 1
              maximum: 3650
    AgentProvider:
      type: object
      required:
      - id
      - name
      - kind
      - base_url
      - model
      - api_key_set
      - enabled
      - options
      - used_for
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/AgentProviderKind'
        base_url:
          description: Base da API (Ollama, OpenAI-compatível). `null` para `anthropic` e `claude-cli`.
          type:
          - string
          - 'null'
          format: uri
        model:
          type: string
        api_key_set:
          type: boolean
        enabled:
          type: boolean
        options:
          description: Parâmetros do provider (`max_tokens`, `temperature`, `context_window`).
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
        used_for:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AgentPurpose'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentProviderCreate:
      type: object
      required:
      - name
      - kind
      - model
      properties:
        name:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/AgentProviderKind'
        base_url:
          type:
          - string
          - 'null'
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type: string
          minLength: 1
          writeOnly: true
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
        used_for:
          description: Sem valor, um provider habilitado assume as finalidades que nenhum outro declara.
          type: array
          items:
            $ref: '#/components/schemas/AgentPurpose'
    AgentProviderPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        base_url:
          type:
          - string
          - 'null'
          format: uri
        model:
          type: string
          minLength: 1
        api_key:
          type:
          - string
          - 'null'
          writeOnly: true
        enabled:
          type: boolean
        options:
          type: object
          additionalProperties:
            type:
            - string
            - number
            - boolean
        used_for:
          description: Substitui a lista; as finalidades declaradas saem dos outros providers.
          type: array
          items:
            $ref: '#/components/schemas/AgentPurpose'
    AgentProviderPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentProvider'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    SecretList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            type: object
            required:
            - name
            - is_set
            - updated_at
            properties:
              name:
                type: string
              is_set:
                type: boolean
              updated_at:
                type:
                - string
                - 'null'
                format: date-time
    SecretPut:
      type: object
      required:
      - value
      properties:
        value:
          type: string
          minLength: 1
          writeOnly: true
    AdminJobRetried:
      description: O job criado por `POST /api/v1/admin/jobs/{job_id}/retry`.
      type: object
      required:
      - job_id
      - recording_id
      - revision
      - state
      - queued_at
      properties:
        job_id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - queued
        queued_at:
          type: string
          format: date-time
    AdminHealth:
      type: object
      required:
      - queue
      - gpu
      - models_loaded
      - recent_failures
      - checked_at
      - steps
      - services
      properties:
        queue:
          type: object
          required:
          - queued
          - running
          - failed_last_24h
          properties:
            queued:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            failed_last_24h:
              type: integer
              minimum: 0
        gpu:
          description: '`null` quando o worker não reporta GPU (engine CPU ou remota).'
          oneOf:
          - type: object
            required:
            - name
            - vram_total_mb
            - vram_used_mb
            - utilization_pct
            properties:
              name:
                type: string
              vram_total_mb:
                type: integer
                minimum: 0
              vram_used_mb:
                type: integer
                minimum: 0
              utilization_pct:
                type: number
                minimum: 0
                maximum: 100
          - type: 'null'
        models_loaded:
          type: array
          items:
            type: object
            required:
            - name
            - kind
            - loaded_at
            - vram_mb
            properties:
              name:
                type: string
              kind:
                type: string
                enum:
                - asr
                - alignment
                - diarization
                - embeddings
                - summarization
              loaded_at:
                type: string
                format: date-time
              vram_mb:
                type:
                - integer
                - 'null'
                minimum: 0
        recent_failures:
          description: 'As etapas do pipeline que falharam nas últimas 24 h, da mais recente para a mais
            antiga,

            sem o conteúdo das gravações.

            '
          type: array
          items:
            type: object
            required:
            - job_id
            - recording_id
            - stage
            - code
            - message
            - failed_at
            properties:
              job_id:
                description: O job de transcrição (que o admin retenta); `null` nas etapas por agente.
                type:
                - string
                - 'null'
                format: uuid
              step:
                description: A etapa do pipeline que falhou (holetz/eclume#33).
                type: string
                enum:
                - received
                - preprocessing
                - transcription
                - agenda_type
                - fields
                - summary
              recording_id:
                type: string
                format: uuid
              stage:
                type:
                - string
                - 'null'
              code:
                type: string
              message:
                type: string
              failed_at:
                type: string
                format: date-time
              retryable:
                description: Falha passageira que `POST /api/v1/admin/jobs/{job_id}/retry` pode resolver
                  (1.4.0).
                type: boolean
        checked_at:
          type: string
          format: date-time
        steps:
          description: 'Cada etapa do pipeline (fora o recebido) nas últimas 24 h: execuções concluídas
            (feitas ou

            falhas), a mediana da duração das feitas e as falhas. Zeradas quando não rodaram.

            '
          type: array
          items:
            type: object
            required:
            - step
            - runs
            - median_ms
            - failures
            properties:
              step:
                type: string
                enum:
                - preprocessing
                - transcription
                - fields
                - agenda_type
                - summary
              runs:
                type: integer
                minimum: 0
              median_ms:
                type:
                - integer
                - 'null'
                minimum: 0
              failures:
                type: integer
                minimum: 0
        services:
          description: 'Uma sonda por serviço, em paralelo, com teto de 2 s cada: `healthy`, `degraded`
            (lento),

            `down` ou `absent` (ainda não existe na plataforma).

            '
          type: array
          items:
            type: object
            required:
            - name
            - status
            - detail
            - latency_ms
            properties:
              name:
                type: string
                enum:
                - api
                - postgres
                - redis
                - storage
                - gpu_worker
                - cpu_worker
                - mcp
              status:
                type: string
                enum:
                - healthy
                - degraded
                - down
                - absent
              detail:
                type:
                - string
                - 'null'
              latency_ms:
                type:
                - integer
                - 'null'
                minimum: 0
        worker:
          description: Heartbeat do worker GPU (`eclume:gpu:health`, a cada 15 s, TTL 45 s); `null` quando
            nenhum worker publicou nos últimos 45 s.
          oneOf:
          - type: object
            required:
            - online
            - last_seen_at
            - version
            - engine
            - busy
            properties:
              online:
                type: boolean
              last_seen_at:
                type: string
                format: date-time
              version:
                type:
                - string
                - 'null'
              engine:
                type:
                - string
                - 'null'
              device:
                type:
                - string
                - 'null'
              busy:
                description: Há um job de transcrição rodando no worker.
                type: boolean
          - type: 'null'
        queues:
          description: Profundidade de cada fila arq da instância (só números, sem ids).
          type: array
          items:
            type: object
            required:
            - name
            - queued
            - running
            properties:
              name:
                type: string
              queued:
                type: integer
                minimum: 0
              running:
                type: integer
                minimum: 0
        held_jobs:
          description: 'Desde a 2.15.0: jobs de transcrição retidos no banco, fora da fila da GPU — os
            que aguardam a vez da conta (ela já tem um na GPU) e os que aguardam a janela de minutos de
            24 h. Só números.'
          type: object
          required:
          - account_turn
          - gpu_minutes
          properties:
            account_turn:
              type: integer
              minimum: 0
            gpu_minutes:
              type: integer
              minimum: 0
        running_jobs:
          description: Jobs de transcrição da plataforma já despachados à GPU e ainda não concluídos,
            com o progresso (desde a 2.15.0, sem os retidos, contados em `held_jobs`).
          type: array
          items:
            type: object
            required:
            - job_id
            - recording_id
            - recording_title
            - state
            - stage
            - progress
            - queued_at
            - started_at
            - updated_at
            properties:
              job_id:
                type: string
                format: uuid
              recording_id:
                type: string
                format: uuid
              recording_title:
                type: string
              state:
                type: string
                enum:
                - queued
                - running
              stage:
                type:
                - string
                - 'null'
              progress:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 1
              queued_at:
                type: string
                format: date-time
              started_at:
                type:
                - string
                - 'null'
                format: date-time
              updated_at:
                description: Última escrita do worker no progresso; parado há muito tempo indica worker
                  morto.
                type:
                - string
                - 'null'
                format: date-time
    Transcript:
      title: Transcript
      description: 'Transcrição do eclume, contrato v1. É o corpo de `GET /api/v1/transcripts/{transcript_id}`
        e a saída do worker GPU. Evolui só de forma aditiva: o consumidor ignora propriedades que não
        conhece e tolera valores de enum novos (regras em contracts/README.md).'
      type: object
      required:
      - schema_version
      - id
      - recording_id
      - title
      - language
      - recorded_at
      - duration_ms
      - source
      - content_hash
      - revision
      - created_at
      - updated_at
      - owner
      - speakers
      - segments
      properties:
        schema_version:
          description: Versão deste schema, `1.<minor>`. O minor sobe a cada mudança aditiva; a 1.2 marca
            `owner` como obsoleto.
          type: string
          pattern: ^1\.[0-9]+$
          examples:
          - '1.1'
        id:
          description: Id da transcrição. Estável entre revisões e retranscrições.
          type: string
          format: uuid
        recording_id:
          description: Gravação de onde a transcrição saiu.
          type: string
          format: uuid
        title:
          description: Título da gravação.
          type: string
          minLength: 1
        language:
          description: Idioma do conteúdo, BCP 47 (`pt-BR`, `pt`, `en`).
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
        recorded_at:
          description: Início da gravação (RFC 3339). Sem data informada pelo cliente, é o instante do
            upload.
          type: string
          format: date-time
        duration_ms:
          description: Duração do áudio em milissegundos.
          type: integer
          minimum: 0
        source:
          description: 'Como o áudio chegou ao eclume: `desktop` (app de captura), `upload` (navegador)
            ou `api` (integração por PAT).'
          type: string
          enum:
          - desktop
          - upload
          - api
        content_hash:
          description: Hash do arquivo de áudio enviado, `sha256:<hex>`. É a chave de deduplicação do
            upload e da importação no lumea.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        revision:
          description: Revisão do conteúdo. Sobe a cada edição (locutor renomeado, pessoa ligada, segmento
            corrigido) e a cada retranscrição.
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          description: Última mudança de qualquer campo; é o que `GET /api/v1/transcripts?since=` compara.
          type: string
          format: date-time
        owner:
          description: 'Obsoleto desde o schema 1.2: sempre o próprio usuário (cada conta é isolada);
            sai na versão 2 do schema.'
          deprecated: true
          $ref: '#/components/schemas/UserRef'
        engine:
          $ref: '#/components/schemas/TranscriptEngine'
        speakers:
          description: Locutores da transcrição. Sem diarização, há um locutor só.
          type: array
          items:
            $ref: '#/components/schemas/Speaker'
        segments:
          description: Falas em ordem de `start_ms`. Todo `speaker_id` aponta para um locutor de `speakers`.
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        tags:
          description: Tags da gravação.
          type: array
          items:
            type: string
            minLength: 1
        kind:
          description: 'Natureza da gravação: `meeting` (reunião) ou `note` (nota por voz). Desde o schema
            1.1.'
          type: string
          enum:
          - meeting
          - note
        recorded_at_source:
          description: 'De onde veio `recorded_at`: `capture` (relógio do app que gravou), `file_metadata`
            (metadados do arquivo, confirmados na importação), `user` (informada ou corrigida) ou `upload`
            (hora do envio). Desde o schema 1.1.'
          type: string
          enum:
          - capture
          - file_metadata
          - user
          - upload
    UserRef:
      description: Referência curta a um usuário do eclume.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    PersonRef:
      description: Referência curta a uma pessoa do diretório da organização.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    SpeakerSuggestion:
      description: Pessoa sugerida para um locutor pela impressão de voz. Só a atribuição automática da
        conta (`Speaker.auto_score`) liga sem confirmação, e só acima do limiar dela.
      type: object
      required:
      - person
      - score
      properties:
        person:
          $ref: '#/components/schemas/PersonRef'
        score:
          description: Similaridade de cosseno normalizada, de 0 a 1.
          type: number
          minimum: 0
          maximum: 1
    Speaker:
      description: Locutor de uma transcrição.
      type: object
      required:
      - id
      - label
      - person
      properties:
        id:
          description: Id do locutor, único dentro da transcrição (`S1`, `S2`...). Estável entre edições;
            some só numa mesclagem.
          type: string
          pattern: ^S[0-9]+$
        label:
          description: Nome exibido. Começa como `Locutor N` e muda quando o usuário renomeia o locutor.
          type: string
          minLength: 1
        person:
          description: Pessoa ligada ao locutor, ou `null` enquanto ninguém a identificou. Vem de uma
            confirmação humana ou, com `auto_score`, da atribuição automática pela voz.
          oneOf:
          - $ref: '#/components/schemas/PersonRef'
          - type: 'null'
        auto_score:
          description: Pontuação (cosseno normalizado, 0 a 1) com que a voz ligou o locutor à `person`
            na ingestão, quando a atribuição automática da conta estava ligada; `null` se alguém ligou
            ou confirmou o vínculo, e sempre `null` sem `person`. Confirmar (`PATCH` com o mesmo `person_id`)
            o zera e só então reforça a impressão de voz.
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        suggestions:
          description: Sugestões por voz ainda não confirmadas, da maior para a menor `score`.
          type: array
          items:
            $ref: '#/components/schemas/SpeakerSuggestion'
        talk_ms:
