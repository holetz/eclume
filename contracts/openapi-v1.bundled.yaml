      - headers
      - expires_at
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum:
          - PUT
        url:
          description: URL opaca da parte.
          type: string
          format: uri
        headers:
          description: Headers que o `PUT` deve levar.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ReceivedPart:
      type: object
      required:
      - part_number
      - etag
      - size_bytes
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
        size_bytes:
          type: integer
          minimum: 1
    Upload:
      type: object
      required:
      - id
      - status
      - filename
      - content_type
      - size_bytes
      - sha256
      - part_size
      - part_count
      - parts_received
      - parts
      - recording_id
      - expires_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UploadStatus'
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        part_size:
          description: Tamanho de toda parte menos a última, em bytes (mínimo 5 MiB).
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        parts_received:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedPart'
        parts:
          description: URLs já emitidas para partes pendentes; pode vir parcial ou vazio.
          type: array
          items:
            $ref: '#/components/schemas/PartUrl'
        recording_id:
          description: Gravação criada pelo `complete`, ou a existente num `deduplicated`.
          type:
          - string
          - 'null'
          format: uuid
        expires_at:
          description: Depois disso o upload inacabado é descartado (`upload_expired`).
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PartUrlsRequest:
      type: object
