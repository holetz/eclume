                  $ref: '#/components/examples/TokenPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - tokens
      operationId: createToken
      summary: Create a PAT
      description: 'The secret (`eclp_...`) comes back only in this response; the server keeps only the
        hash. It always creates `kind: personal`: a device credential is only born from `POST /devices/login`
        or `POST /devices/pair`.'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCreate'
            examples:
              lumea:
                $ref: '#/components/examples/TokenCreateRequest'
      responses:
        '201':
          description: PAT created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenCreated'
              examples:
                lumea:
                  $ref: '#/components/examples/TokenCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/tokens/{token_id}:
    parameters:
    - $ref: '#/components/parameters/TokenId'
    delete:
      tags:
      - tokens
      operationId: revokeToken
      summary: Revoke a token
      description: Applies to a PAT and to a device credential ("Desvincular" turns the device off).
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Revoked. Later uses get 401.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/server:
    get:
      tags:
      - meta
      operationId: getServerInfo
      summary: Public server descriptor
      description: 'Name, address, MCP address, root CA fingerprint and versions. It is the source of
        the mDNS

        announcement, the QR link, pairing and the address embedded in the installer: the app

        confirms here what it received and pins the CA by its fingerprint (`ca_sha256`).

        '
      security: []
      responses:
        '200':
          description: Descriptor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
              examples:
                producao:
                  $ref: '#/components/examples/ServerInfo'
  /api/v1/privacy:
    get:
      tags:
      - meta
      operationId: getPrivacyInfo
      summary: Where each piece of data goes, per the settings in force
      description: 'Since 2.19.0. Says, for transcription and for each agent purpose, whether the data
        is

        processed on this server, on the local network or outside it, with the name of who

        processes it when it leaves. Public like `GET /server`, because whoever signs up needs to

        know before accepting the notice; it never returns the address, model, key nor the name

        the admin gave the provider. The settings change at runtime: the client does not keep the

        response indefinitely. The audio and the transcript are always stored on this server.

        '
      security: []
      responses:
        '200':
          description: Destinations in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyInfo'
              examples:
                agente_externo:
                  $ref: '#/components/examples/PrivacyInfo'
  /api/v1/auth/password-reset/check:
    post:
      tags:
      - auth
      operationId: checkPasswordReset
      summary: Check a password reset link
      description: 'Since 2.18.0. The `/redefinir-senha` page reads the secret from the URL fragment and
        sends

        it in the body; the response gives the account''s e-mail and until when the link is valid,

        without consuming the link. A link that does not exist, expired, was already used, was

        superseded by a newer one or belongs to a deactivated account, 401 `invalid_reset_link`;

        too many attempts from the same IP, 429 `rate_limited` with `Retry-After`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCheck'
      responses:
        '200':
          description: Valid link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetInfo'
              examples:
                valido:
                  $ref: '#/components/examples/PasswordResetInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/auth/password-reset:
    post:
      tags:
      - auth
      operationId: resetPassword
      summary: Reset the password through a link generated by the admin
      description: 'Since 2.18.0. Changes the password of the link''s account (at least 12 characters,
        as at

        sign-up), marks the link as used and closes every session of the account, without opening

        another: the person logs in again with the new password. Device credentials and PATs stay

        valid. Invalid link, 401 `invalid_reset_link`, as in `POST /auth/password-reset/check`;

        short password, 422 `validation_failed` without consuming the link.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Password reset and the account's sessions closed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/devices/login:
    post:
      tags:
      - devices
      operationId: deviceLogin
      summary: Log in on a device with e-mail and password
      description: 'Checks the password like the browser login and issues a device credential: a

        `kind: device` token with `recordings:read`, `recordings:write`, since 2.6.0

        `summaries:read` (the app''s summary-ready notice, with "Copiar") and, since 2.8.0,

        `transcripts:read` (the desktop synced folder reads transcripts), with no expiry and

        revocable at `DELETE /api/v1/tokens/{token_id}`. The secret comes back only in this

        response. Wrong password or inactive account, 401 with the same message as login; an

        account that has not yet accepted the notice in force, 403 `notice_required` (accept it on

        the web and log in again); too many attempts from the same IP or for the same account (the

        account window is shared with `POST /auth/login`), 429 `rate_limited` with `Retry-After`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceLogin'
            examples:
              notebook:
                $ref: '#/components/examples/DeviceLoginRequest'
      responses:
        '201':
          description: Device credential issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredential'
              examples:
                notebook:
                  $ref: '#/components/examples/DeviceCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/devices/pairing-codes:
    post:
      tags:
      - devices
      operationId: createPairingCode
      summary: Generate a pairing code
      description: 'A 6-character code (`K7Q-4MX`), valid for 10 minutes and single use, that the app
        exchanges

        for a device credential at `POST /api/v1/devices/pair`. `pair_url` is the content of the

        QR the phone reads. A new code expires the earlier ones not yet used. Session only.

        '
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Code generated; `code`, `display` and `pair_url` only come back here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
              examples:
                novo:
                  $ref: '#/components/examples/PairingCodeCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/devices/pairing-codes/{pairing_code_id}:
    parameters:
    - $ref: '#/components/parameters/PairingCodeId'
    get:
      tags:
      - devices
      operationId: getPairingCode
      summary: State of a pairing code
      description: The web polls it to replace the QR with "Pareado" and show the device (`token_id`).
        Session only.
      responses:
        '200':
          description: State of the code, without the code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
              examples:
                usado:
                  $ref: '#/components/examples/PairingCodeUsed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/devices/pair:
    post:
      tags:
      - devices
      operationId: pairDevice
      summary: Exchange a pairing code for a device credential
      description: 'The code accepts upper or lower case, with or without the hyphen. Issues the device

        credential of the code''s owner, like `POST /api/v1/devices/login`. A code that does not

        exist, expired or was already used, 401 `invalid_pairing_code`; too many attempts from the

        same IP (or, adding up all IPs, six times that limit), 429 `rate_limited` with

        `Retry-After`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePair'
            examples:
              celular:
                $ref: '#/components/examples/DevicePairRequest'
      responses:
        '201':
          description: Device credential issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/uploads:
    post:
      tags:
      - uploads
      operationId: createUpload
      summary: Start an upload (or deduplicate)
      description: 'The client computes the file''s `sha256` before uploading. If the user already has
        a

        recording with the same hash, the response is **200** with `status: deduplicated` and the

        existing `recording_id`, and nothing is transferred. Otherwise, **201** with the upload,

        the `part_size` fixed by the server and the URLs of the first parts.


        Since 2.15.0, a new upload that exceeds the account''s quotas (size per file, total storage

        or open uploads) answers **403** `quota_exceeded`, with `quota`, `limit` and `used`,

        before any byte is uploaded. Deduplicating and resuming do not go through the quota.


        Parts: all of `part_size` bytes, except the last; at most 10,000. Each part goes by `PUT`

        to the part''s `url`, with the given `headers`; the response''s `ETag` is kept for the

        `complete`. The URL is opaque (MinIO presigned or the API''s own

        `PUT /api/v1/uploads/{upload_id}/parts/{part_number}`) and expires at `expires_at`.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadCreate'
            examples:
              desktop:
                $ref: '#/components/examples/UploadCreateRequest'
              celular:
                $ref: '#/components/examples/UploadCreateMobile'
      responses:
        '200':
          description: Deduplicated. A recording with this hash already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                deduplicado:
                  $ref: '#/components/examples/UploadDeduplicated'
        '201':
          description: Upload created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                criado:
                  $ref: '#/components/examples/UploadCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/uploads/{upload_id}:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    get:
      tags:
      - uploads
      operationId: getUpload
      summary: Upload state, to resume
      description: '`parts_received` lists the parts the storage has already confirmed; the client uploads
        only the missing ones.'
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      responses:
        '200':
          description: Upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                emAndamento:
                  $ref: '#/components/examples/UploadInProgress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - uploads
      operationId: abortUpload
      summary: Abort the upload and discard the parts
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Aborted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/uploads/{upload_id}/part-urls:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    post:
      tags:
      - uploads
      operationId: createPartUrls
      summary: Request URLs for parts
      description: New URLs for the given parts, including to replace expired URLs on a resume.
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUrlsRequest'
            examples:
              faltantes:
                $ref: '#/components/examples/PartUrlsRequest'
      responses:
        '200':
          description: URLs of the requested parts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUrls'
              examples:
                faltantes:
                  $ref: '#/components/examples/PartUrls'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/uploads/{upload_id}/parts/{part_number}:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    - name: part_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 10000
    put:
      tags:
      - uploads
      operationId: putUploadPart
      summary: Upload a part through the API
      description: 'Variant of the part URL served by the API itself, with the same semantics as the `PUT`
        to

        an S3 presigned URL. The client does not build this path: it uses the `url` it received.

        A `Content-Length` other than the part size is 409; without the header, the body is read

        in chunks and going past the part size is 413 `payload_too_large` (since 2.14.0).

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
      responses:
        '200':
          description: Part stored.
          headers:
            ETag:
              description: Identifier of the part, to return in the `complete`.
              required: true
              schema:
                type: string
                examples:
                - '"5d41402abc4b2a76b9719d911017c592"'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /api/v1/uploads/{upload_id}/complete:
    parameters:
    - $ref: '#/components/parameters/UploadId'
    post:
      tags:
      - uploads
      operationId: completeUpload
      summary: Complete the upload and queue the transcription
      description: 'Assembles the object from the parts, creates the recording and queues the job. The
        server

        checks the declared `sha256`; a mismatch becomes a job failure with

        `error.code: hash_mismatch`. Repeating the `complete` of an already completed upload

        returns the same recording. Since 2.14.0, another `complete` of the same upload while one

        is in progress (the server assembling the object and checking the hash) answers 409

        `upload_completing` with `Retry-After`: it is transient, try again.

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadComplete'
            examples:
              partes:
                $ref: '#/components/examples/UploadCompleteRequest'
      responses:
        '201':
          description: Recording created, job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
              examples:
                naFila:
                  $ref: '#/components/examples/RecordingQueued'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'The upload expired (`code: upload_expired`), is no longer open (`code: conflict`)
            or another `complete` of it is in progress (`code: upload_completing`, since 2.14.0, with
            `Retry-After`).'
          headers:
            Retry-After:
              description: With `upload_completing`, seconds until trying again.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/recordings:
    get:
      tags:
      - recordings
      operationId: listRecordings
      summary: List the user's recordings
      description: 'The library: by `recorded_at` range (week, month) and with filters. Filters are

        repeatable: repeated values of the same filter combine with OR, and different filters with AND

        (`?tag=a&tag=b&kind=note` = a note with the tag `a` or `b`).

        '
      security:
      - sessionCookie: []
      - pat:
        - recordings:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Since'
      - name: from
        in: query
        description: '`recorded_at >= from`.'
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: '`recorded_at < to`.'
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        description: '`created_desc` (default, the most recently uploaded first), `recorded_asc` or `recorded_desc`
          (by the recording start). The cursor is valid only for the same order.'
        schema:
          type: string
          enum:
          - created_desc
          - recorded_asc
          - recorded_desc
          default: created_desc
      - name: kind
        in: query
        description: Nature of the recording; repeatable.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RecordingKind'
      - name: status
        in: query
        description: State of the recording; repeatable.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/RecordingStatus'
      - name: tag
        in: query
        description: Tag; repeatable.
        schema:
          type: array
          items:
            type: string
      - name: collection
        in: query
        description: Collection; repeatable.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: person
        in: query
        description: Person linked to a speaker of the transcript; repeatable.
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: field
        in: query
        description: 'Value of a user field, `<field_id>:<value>`; repeatable. Each field is a filter:
          values of the same field combine with OR, different fields with AND. In a list field, it is
          enough for the value to be one of the items; title and tags count as the built-in ones.'
        schema:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F-]{36}:.+$
      - name: person_company
        in: query
        description: 'Company of a participant (a person linked to a speaker), ignoring accents and case;
          repeatable. The `person_*` attributes apply to one and the same person: with `person_company`
          and `person_tag`, someone from the company and with the tag spoke in the recording.'
        schema:
          type: array
          items:
            type: string
      - name: person_department
        in: query
        description: Department of a participant, ignoring accents and case; repeatable (see `person_company`).
        schema:
          type: array
          items:
            type: string
      - name: person_tag
        in: query
        description: Person tag of a participant, ignoring case; repeatable (see `person_company`).
        schema:
          type: array
          items:
            type: string
      - name: awaiting
        in: query
        description: 'Since 2.22.0. `speakers`: only the recordings whose current revision is stopped
          waiting for the speakers to be named (`Recording.awaiting`).'
        schema:
          type: array
          items:
            type: string
            enum:
            - speakers
      responses:
        '200':
          description: Recordings, in the `sort` order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
              examples:
                semana:
                  $ref: '#/components/examples/RecordingWeekPage'
                biblioteca:
                  $ref: '#/components/examples/RecordingPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/recordings/{recording_id}:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      tags:
      - recordings
      operationId: getRecording
      summary: Recording and job state
      security:
      - sessionCookie: []
      - pat:
        - recordings:read
      responses:
        '200':
          description: Recording.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
              examples:
                transcrita:
                  $ref: '#/components/examples/RecordingTranscribed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - recordings
      operationId: updateRecording
      summary: Edit the recording metadata
      security:
      - sessionCookie: []
      - pat:
        - recordings:write
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingPatch'
            examples:
              organizar:
                $ref: '#/components/examples/RecordingPatchRequest'
      responses:
        '200':
          description: Recording updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - recordings
      operationId: deleteRecording
      summary: Delete the recording, the audio and the transcript
      description: With a PAT, it requires `recordings:delete` since 2.3.0 (before, `recordings:write`);
        the migration granted `recordings:delete` to every token that had `recordings:write`.
      security:
      - sessionCookie: []
      - pat:
        - recordings:delete
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
