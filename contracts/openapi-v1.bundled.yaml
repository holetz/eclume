        diarization:
          $ref: '#/components/schemas/DiarizationSettings'
        voice_identification:
          $ref: '#/components/schemas/VoiceIdentificationSettings'
        preprocessing:
          $ref: '#/components/schemas/PreprocessingSettings'
        updated_at:
          type: string
          format: date-time
        updated_by:
          description: Conta de admin que mudou por último.
          oneOf:
          - $ref: '#/components/schemas/AdminRef'
          - type: 'null'
    AdminSettingsPatch:
      description: Cada bloco é mesclado campo a campo; campos ausentes ficam como estão.
      type: object
      minProperties: 1
      properties:
        asr:
          type: object
          properties:
            engine:
              type: string
              enum:
              - whisperx-local
              - openai-compatible
              - cpu
            model:
              type: string
            compute_type:
              type: string
            batch_size:
              type:
              - integer
              - 'null'
              minimum: 1
            default_language:
              description: Código do idioma ou `auto`.
              type:
              - string
              - 'null'
              pattern: ^(auto|[a-z]{2,3}(-[A-Za-z0-9]{2,8})*)$
            fallback_model:
              type:
              - string
              - 'null'
            endpoint_url:
              type:
              - string
              - 'null'
              format: uri
        diarization:
          type: object
          properties:
            enabled:
              type: boolean
            model:
              type: string
            min_speakers:
              type:
              - integer
              - 'null'
              minimum: 1
            max_speakers:
              type:
              - integer
              - 'null'
              minimum: 1
        voice_identification:
          type: object
          properties:
            enabled:
              type: boolean
            suggestion_threshold:
              type: number
              minimum: 0
              maximum: 1
        preprocessing:
          description: Cada etapa é mesclada campo a campo.
          type: object
          additionalProperties: false
          properties:
            denoise:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                method:
                  description: '`rnnoise` (rede neural, 48 kHz) ou `afftdn` (FFT do ffmpeg).'
                  type: string
                  enum:
                  - rnnoise
                  - afftdn
                strength:
                  description: Quanto do sinal tratado entra na mistura.
                  type: number
                  minimum: 0
                  maximum: 1
            loudnorm:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                target_lufs:
                  description: Loudness integrado alvo (EBU R128).
                  type: number
                  minimum: -30
                  maximum: -10
                true_peak_db:
                  type: number
                  minimum: -9
                  maximum: 0
                lra:
                  description: Faixa de loudness.
                  type: number
                  minimum: 1
                  maximum: 20
            trim_silence:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                min_silence_s:
                  description: Silêncio mínimo, no início ou no fim, para cortar.
                  type: number
                  minimum: 1
                  maximum: 30
                threshold_db:
                  description: Abaixo deste nível, é silêncio.
                  type: number
                  minimum: -80
                  maximum: -20
            split_channels:
              description: Um canal por pessoa (gravação estéreo de duas fontes); mono duplicado é pulado.
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
