                  $ref: '#/components/examples/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users/{user_id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - admin
      operationId: updateUser
      security:
      - adminSessionCookie: []
      summary: Deactivate or reactivate a user, or override their quotas
      description: Deactivating closes the user's sessions and revokes their PATs (since 2.18.0, it also
        expires the pending password reset link). Since 2.15.0, `quotas` replaces the override of the
        account's quotas.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - admin
      operationId: deleteUser
      security:
      - adminSessionCookie: []
      summary: Delete a user and all their data
      description: 'Since 2.15.0. Deletes the account like the deletion by the person themselves (`POST
        /me/delete`), without the password: recordings, transcripts, summaries and everything else leave
        the database, the objects leave storage through the deletion queue, the transcription in progress
        is cancelled and the e-mail becomes free for a new sign-up.'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Account deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/users/{user_id}/password-reset:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - admin
      operationId: createPasswordReset
      security:
      - adminSessionCookie: []
      summary: Generate a password reset link for a user
      description: 'Since 2.18.0. Single-use link, valid for 24 hours, that the admin hands over out of
        band to whoever asked: `<public url>/redefinir-senha#<secret>`, with the secret in the fragment
        (it reaches neither logs nor the `Referer`). The server stores only the hash, and `url` comes
        back only here. A new link expires the account''s earlier unused ones; deactivating the account
        voids the pending link. Deactivated account, 409 `conflict`. The admin never sees nor sets the
        password.'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Link generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLink'
              examples:
                novo:
                  $ref: '#/components/examples/PasswordResetLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/jobs/{job_id}/retry:
    post:
      tags:
      - admin
      operationId: retryTranscriptionJob
      security:
      - adminSessionCookie: []
      summary: Retry a transcription job that failed
      description: Creates the job of the recording's next revision, with the platform's current configuration,
        and enqueues it. Applies to any user's recording, but only to the recording's most recent job
        and in state `failed`.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: New job in the queue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobRetried'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/health:
    get:
      tags:
      - admin
      operationId: getAdminHealth
      security:
      - adminSessionCookie: []
      summary: Health of the queue, the GPU and the models
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
              examples:
                gpu:
                  $ref: '#/components/examples/AdminHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: 'Browser session, opened by `POST /api/v1/auth/login` or by signup. It has all of the

        user''s permissions over their own account. Mutating methods require an `X-CSRF-Token` equal

        to the `eclume_csrf` cookie (double-submit). PAT management, the notice acceptance and the

        voice routes accept **only** a session. It does not reach `/api/v1/admin/*`.

        '
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: eclume_admin_session
      description: 'Session of the admin account, opened by `POST /api/v1/admin/auth/login` (HttpOnly,
        Secure,

        SameSite=Strict, `Path=/api/v1/admin`, 12 h). It is the only credential accepted on

        `/api/v1/admin/*`, and it is ignored on any other route. Mutating methods require an

        `X-CSRF-Token` equal to the `eclume_admin_csrf` cookie (double-submit).

        '
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<secret>
      description: 'Personal PAT: `Authorization: Bearer eclp_<secret>`. It acts as the owning user, limited

        to the granted scopes. The scopes each operation requires are in its security requirement

        (`pat: [scope, ...]`, all mandatory; several `pat` requirements are alternatives, and

        one is enough). No scope implies another. With a scope missing, the response is 403 with

        `code: insufficient_scope` and `required_scopes`.

        '
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: 'Required with a session: the value of the `eclume_csrf` cookie, or of `eclume_admin_csrf`
        on `/api/v1/admin/*`. Ignored with a PAT.'
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned in `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: 'Only items with `updated_at >= since` (inclusive). Since 2.8.0, a summary that finishes
        or is

        edited also moves the `updated_at` of the recording and of the transcript it belongs to. Since

        2.17.0, a `summary` stage that ends `failed` or `skipped` moves the `updated_at` of the

        recording only, so that clients report the end of processing (holetz/eclume#118).

        '
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Person id; only transcripts (or excerpts) in which a speaker is linked to that person.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Only recordings with this tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Only recordings in this collection.
      schema:
        type: string
        format: uuid
    PairingCodeId:
      name: pairing_code_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgendaTypeId:
      name: agenda_type_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldId:
      name: field_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentMessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentFileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentSkillId:
      name: skill_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgentActionId:
      name: action_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BaseChatId:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tag_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: No credential, or an invalid, expired or revoked credential.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples:
            - Bearer realm="eclume"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semCredencial:
              $ref: '#/components/examples/ProblemUnauthorized'
    Forbidden:
      description: 'Valid credential without permission (scope or owner), a PAT on an operation that accepts
        only a session (`code: session_required`), signup closed (`code: signup_closed`) or a session
        of an account that has not yet accepted the notice in force (`code: notice_required`; before acceptance,
        only `GET /me`, `POST /me/notice` and `/auth/*` respond, and `POST /devices/login` issues no credential).
        Since 2.15.0, the account''s quota exceeded (`code: quota_exceeded`, with `quota`, `limit` and
        `used`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semEscopo:
              $ref: '#/components/examples/ProblemInsufficientScope'
    NotFound:
      description: Does not exist or does not belong to the user (eclume does not tell the two apart).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              $ref: '#/components/examples/ProblemNotFound'
    ValidationFailed:
      description: Invalid body or parameters.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              $ref: '#/components/examples/ProblemValidation'
    Conflict:
      description: The current state prevents the operation (upload already completed, duplicate name,
        job in progress, summary changed since the opened version, chat with a request open).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 'Since 2.29.0. The audio of the recording was deleted by the retention policy (`code:
        audio_deleted`); the transcript and the summary stay.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 'The file is not of a type the route accepts (`code: unsupported_media_type`, since
        2.23.0), or the content does not match the extension.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 'Body above the route''s ceiling (`code: payload_too_large`, since 2.14.0); `limit`
        gives the ceiling in bytes.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            corpoGrande:
              $ref: '#/components/examples/ProblemPayloadTooLarge'
    InternalError:
      description: 'Unexpected server failure (`code: internal_error`, since 2.14.0); the detail stays
        in the server log, with the response''s `X-Request-ID`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 'Limit reached (`code: rate_limited`): open requests, such as the 3 previews in progress
        per account (try again when one finishes), or attempts per minute on the credential routes (login,
        signup, admin login and `/devices/*`, per IP), with `Retry-After`. On password logins, since 2.14.0,
        only failures count: per (account, IP) pair, plus an account ceiling that does not block an IP
        that has already signed in to it successfully; success resets the pair.'
      headers:
        Retry-After:
          description: Seconds until the attempts window reopens.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: RFC 9457 error. The client decides by `code`, never by `title`.
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: 'Stable code. v1 values: `unauthorized`, `insufficient_scope`, `forbidden`,

            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,

            `rate_limited`; since 1.4.0, `session_required` (a PAT on a session-only operation);

            since 2.0.0, `email_taken` (signup with an existing e-mail) and `signup_closed`;

            since 2.2.0, `summary_changed` (the summary changed since the opened version),

            `summary_missing`, `transcript_missing` and `chat_busy` (an adjustment request is already

            open); since 2.3.0, `invalid_pairing_code` (pairing code nonexistent,

            expired or used) and `notice_required` (session of an account that has not yet accepted the
            notice in

            force); since 2.14.0, `payload_too_large`, `upload_completing` and `internal_error`;

            since 2.15.0, `quota_exceeded` (the account''s quota exceeded); since 2.18.0,

            `invalid_reset_link` (password reset link nonexistent, expired or used).

            New codes are added additively.

            '
          type: string
        limit:
          description: With `payload_too_large`, the route's body ceiling in bytes (since 2.14.0); with
            `quota_exceeded`, the quota's limit (since 2.15.0).
          type: integer
        quota:
          description: With `quota_exceeded`, the exceeded quota (since 2.15.0).
          type: string
          enum:
          - storage_bytes
          - file_bytes
          - open_uploads
          - agent_requests_24h
        used:
          description: With `quota_exceeded`, the usage the request would lead to (bytes, open uploads
            or requests in 24 h; for `file_bytes`, the file size) (since 2.15.0).
          type: integer
        required_scopes:
          description: 'With `insufficient_scope`, the missing scopes; on an operation with alternative
            `pat`

            requirements, the alternatives (one of them is enough).

            '
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        errors:
          description: With `validation_failed`, one item per invalid field.
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                description: Field path (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string
    Scope:
      description: PAT scope. `recordings:delete` (2.3.0) deletes recordings. The "Conexão MCP" screen
        groups the scopes into "Buscar e ler gravações" (`recordings:read`, `transcripts:read`), "Ler
        e editar resumos" (`summaries:read`, `summaries:write`), "Editar campos e tags" (`recordings:write`)
        and "Excluir gravações" (`recordings:delete`).
      type: string
      enum:
      - recordings:read
      - recordings:write
      - recordings:delete
      - transcripts:read
      - transcripts:write
      - people:read
      - people:write
      - summaries:read
      - summaries:write
    Health:
      type: object
      required:
      - status
      - version
      - contract_version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          description: Server version.
          type: string
        contract_version:
          description: Version of this contract that the server implements (`info.version`).
          type: string
        commit:
          description: 'Since 2.12.0: the git SHA the server image was built from (the deploy writes it).
            Absent outside a production image.'
          type: string
          pattern: ^[0-9a-f]{7,40}$
    HealthReady:
      type: object
      required:
      - status
      - checks
      properties:
        status:
          type: string
          enum:
          - ok
          - down
        checks:
          type: array
          items:
            type: object
            required:
            - name
            - status
            additionalProperties: false
            properties:
              name:
                type: string
                enum:
                - postgres
                - redis
                - storage
              status:
                type: string
                enum:
                - ok
                - down
    PasswordResetCheck:
      type: object
      required:
      - token
      properties:
        token:
          description: The link's secret, read from the fragment of `/redefinir-senha#<token>`.
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    PasswordReset:
      type: object
      required:
      - token
      - new_password
      properties:
        token:
          description: The link's secret, as in `PasswordResetCheck`.
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        new_password:
          description: At least 12 characters, as at signup.
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
    PasswordResetInfo:
      description: Since 2.18.0. What the reset page shows of a valid link.
      type: object
      required:
      - email
      - expires_at
      properties:
        email:
          type: string
          format: email
        expires_at:
          type: string
          format: date-time
    PasswordResetLink:
      description: Since 2.18.0. The freshly generated reset link; `url` is returned only on creation.
      type: object
      required:
      - url
      - expires_at
      properties:
        url:
          description: '`<public url>/redefinir-senha#<secret>`.'
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    Notice:
      description: Notice the account accepts at creation ("Sou responsável por pedir o consentimento
        das pessoas que gravo").
      type: object
      required:
      - version
      - text
      properties:
        version:
          type: string
        text:
          type: string
    SignupInfo:
      type: object
      required:
      - open
      - notice
      properties:
        open:
          description: '`false` with `ECLUME_SIGNUP_OPEN=false`: signup responds 403 `signup_closed`.'
          type: boolean
        notice:
          $ref: '#/components/schemas/Notice'
    SignupRequest:
      type: object
      required:
      - name
      - email
      - password
      - notice_version
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        notice_version:
          description: Version of the accepted notice; it must be the one in force.
          type: string
          minLength: 1
    NoticeAccept:
      type: object
      required:
      - notice_version
      properties:
        notice_version:
          type: string
          minLength: 1
    User:
      type: object
      required:
      - id
      - email
      - name
      - active
      - created_at
      - last_login_at
      - notice_version
      - notice_accepted_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        notice_version:
          description: Version of the accepted notice, or `null` on an account that has not yet accepted
            it.
          type:
          - string
          - 'null'
        notice_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminUser:
      description: User account as seen by the admin (the `User` plus the recording count and, since 2.15.0,
        the usage and the quota override).
      type: object
      required:
      - id
      - email
      - name
      - active
      - created_at
      - last_login_at
      - notice_version
      - notice_accepted_at
      - recording_count
      - quotas
      - usage
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        notice_version:
          type:
          - string
          - 'null'
        notice_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        recording_count:
          type: integer
          minimum: 0
        quotas:
          description: Only the fields this account overrides from the platform default (`null` in a field
            means no limit); `null` when the account follows the whole default.
          oneOf:
          - $ref: '#/components/schemas/QuotasOverride'
          - type: 'null'
        usage:
          $ref: '#/components/schemas/UsageNow'
    QuotasOverride:
      description: 'Partial quotas (since 2.15.0): only the fields present apply; `null` in a field means
        no limit.'
      type: object
      additionalProperties: false
      properties:
        storage_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        file_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
        open_uploads:
          type:
          - integer
          - 'null'
          minimum: 0
        gpu_minutes_24h:
          type:
          - integer
          - 'null'
          minimum: 0
        agent_requests_24h:
          type:
          - integer
          - 'null'
          minimum: 0
    UserPatch:
      description: At least one field; since 2.15.0, `active` is optional and `quotas` is added.
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        active:
          description: '`false` deactivates the account, ends its sessions and revokes its PATs.'
          type: boolean
        quotas:
          description: 'Replaces the account''s whole quota override with the fields sent (`null` in a
            field means no limit); `quotas: null` returns the account to the platform default.'
          oneOf:
          - $ref: '#/components/schemas/QuotasOverride'
          - type: 'null'
    AdminUserPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AdminAccount:
      description: Admin account, separate from the user accounts.
      type: object
      required:
      - id
      - email
      - name
      - created_at
      - last_login_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Quotas:
      description: Quotas of an account (since 2.15.0); `null` means no limit. Transcribed audio minutes
        and agent requests count over a rolling 24 h window.
      type: object
      required:
      - storage_bytes
      - file_bytes
      - open_uploads
      - gpu_minutes_24h
      - agent_requests_24h
      properties:
        storage_bytes:
          description: Total storage (recording audio plus open uploads), in bytes.
          type:
          - integer
          - 'null'
          minimum: 0
        file_bytes:
          description: Maximum size of one file, in bytes.
          type:
          - integer
          - 'null'
          minimum: 0
        open_uploads:
          description: Uploads open at the same time.
          type:
          - integer
          - 'null'
          minimum: 0
        gpu_minutes_24h:
          description: 'Audio minutes sent to transcription in 24 h. Past the limit nothing is refused:
            the recording waits in the queue until the window opens.'
          type:
          - integer
          - 'null'
          minimum: 0
        agent_requests_24h:
          description: The person's requests to the agent (summaries, chats, previews) in 24 h.
          type:
          - integer
          - 'null'
          minimum: 0
    UsageNow:
      description: Current usage of an account (since 2.15.0).
      type: object
      required:
      - storage_bytes
      - open_uploads
      - gpu_minutes_24h
      - agent_requests_24h
      properties:
        storage_bytes:
          type: integer
          minimum: 0
        open_uploads:
          type: integer
          minimum: 0
        gpu_minutes_24h:
          type: integer
          minimum: 0
        agent_requests_24h:
          type: integer
          minimum: 0
    Usage:
      description: Usage and effective quota of the account (since 2.15.0).
      type: object
      required:
      - usage
      - quotas
      properties:
        usage:
          $ref: '#/components/schemas/UsageNow'
        quotas:
          $ref: '#/components/schemas/Quotas'
    Me:
      type: object
      required:
      - user
      - auth
      - notice_required
      properties:
        user:
          $ref: '#/components/schemas/User'
        notice_required:
          description: The account has not yet accepted the notice in force (`POST /api/v1/me/notice`).
          type: boolean
        auth:
          type: object
          required:
          - method
          - scopes
          - token_id
          properties:
            method:
              type: string
              enum:
              - session
              - pat
            scopes:
              description: With a session, every scope.
              type: array
              items:
                $ref: '#/components/schemas/Scope'
            token_id:
              description: Id of the PAT in use, or `null` with a session.
              type:
              - string
              - 'null'
              format: uuid
    VoiceAssignment:
      description: 'The account''s automatic speaker assignment: with it on and voice identification on
        on the platform, the speaker whose voice passes the threshold is linked to the person at ingestion,
        before the summary, and comes out with `auto_score` on the `Speaker`.'
      type: object
      required:
      - enabled
      - threshold
      - platform_enabled
      - keep_samples
      - sample_count
      - voiceprint_people
      properties:
        enabled:
          type: boolean
        threshold:
          description: Minimum score (normalized cosine) to link on its own, from 0.50 to 0.99.
          type: number
          minimum: 0.5
          maximum: 0.99
        platform_enabled:
          description: Voice identification is on on the platform; when off, nothing is assigned.
          type: boolean
        keep_samples:
          description: Since 2.19.0. The account keeps voice samples and voiceprints (default `true`).
            When off, nothing of the account's voice is computed, compared or stored; turning it off immediately
            deletes the account's samples, per-recording vectors and pending suggestions.
          type: boolean
        sample_count:
          description: Since 2.19.0. How many voice samples the account keeps.
          type: integer
          minimum: 0
        voiceprint_people:
          description: Since 2.19.0. How many people of the account have a voiceprint (at least one sample).
          type: integer
          minimum: 0
    SpeakerNamingPreference:
      description: Since 2.22.0. Whether the account requires naming the speakers before the agent chain,
        and how many recordings are waiting for it.
      type: object
      required:
      - required
      - waiting_count
      properties:
        required:
          type: boolean
        waiting_count:
          description: Recordings whose current revision has the `speakers` stage in `waiting`.
          type: integer
          minimum: 0
    SpeakerNamingPatch:
      type: object
      additionalProperties: false
      required:
      - required
      properties:
        required:
          type: boolean
    TranscriptionPreference:
      description: Since 2.20.0. The account's preferred transcription language and the server default
        that applies when the account does not choose one.
      type: object
      required:
      - language
      - platform_default
      properties:
        language:
          description: Language (BCP 47), `auto` (detect) or `null` (server default).
          type:
          - string
          - 'null'
          pattern: ^(auto|[a-z]{2,3}(-[A-Z]{2})?)$
        platform_default:
          description: The platform's `asr.default_language` (`pt` when unconfigured); it may be `auto`.
          type: string
    TranscriptionPreferencePatch:
      type: object
      additionalProperties: false
      required:
      - language
      properties:
        language:
          description: Language (BCP 47), `auto` or `null` to return to the server default.
          type:
          - string
          - 'null'
          pattern: ^(auto|[a-z]{2,3}(-[A-Z]{2})?)$
    AudioRetention:
      description: Since 2.29.0. How long the audio of the account's recordings stays on the server, the
        platform ceiling and the window in force.
      type: object
      required:
      - days
      - max_days
      - effective_days
      properties:
        days:
          description: The account's choice in days; `null` is off (the default).
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3650
        max_days:
          description: The admin's ceiling (`retention.audio_max_days`); `null` is none.
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3650
        effective_days:
          description: '`days` capped by `max_days`; `null` when `days` is off, whatever the ceiling.'
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3650
    AudioRetentionPatch:
      type: object
      additionalProperties: false
      required:
      - days
      properties:
        days:
          description: Days from 1 to 3650, or `null` to turn retention off.
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 3650
    VoiceAssignmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        threshold:
          type: number
          minimum: 0.5
          maximum: 0.99
        keep_samples:
          description: Since 2.19.0. `false` immediately deletes the account's samples, per-recording
            vectors and pending suggestions; the voice files in storage go shortly after. `true` resumes
            keeping from the next transcriptions on, without recovering what was removed.
          type: boolean
    NextCursor:
      description: Cursor of the next page, or `null` on the last one.
      type:
      - string
      - 'null'
    Token:
      type: object
      required:
      - id
      - name
      - kind
      - platform
      - scopes
      - prefix
      - created_at
      - last_used_at
      - expires_at
      - revoked_at
      properties:
        id:
          type: string
          format: uuid
        name:
          description: 'With `kind: device`, the device name.'
          type: string
        kind:
          $ref: '#/components/schemas/TokenKind'
        platform:
          description: 'With `kind: device`, the device platform; `null` on a personal PAT.'
          oneOf:
          - $ref: '#/components/schemas/DevicePlatform'
          - type: 'null'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        prefix:
          description: Start of the secret, to recognize the token (`eclp_7Hq2`).
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    TokenKind:
      description: '`personal`, the PAT created in "Tokens de acesso" or "Conexão MCP"; `device`, the
        credential of a device, issued by login or by pairing.'
      type: string
      enum:
      - personal
      - device
    DevicePlatform:
      type: string
      enum:
      - windows
      - macos
      - linux
      - ios
      - android
    ServerInfo:
      type: object
      required:
      - name
      - url
      - mcp_url
      - ca_sha256
      - version
      - contract_version
      properties:
        name:
          description: Server name (`ECLUME_SERVER_NAME`), also the instance on mDNS.
          type: string
        url:
          description: Public address (`ECLUME_PUBLIC_URL`).
          type: string
          format: uri
        mcp_url:
          description: Address of the MCP server, which the assistant receives.
          type: string
          format: uri
        ca_sha256:
          description: SHA-256, in lowercase hex, of the DER of the root certificate served at `/downloads/eclume-root.crt`;
            `null` while the root has not been published.
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        ca_next_sha256:
          description: Since 2.21.0. SHA-256, in lowercase hex, of the DER of the next root during rotation,
            served at `/downloads/eclume-root-proxima.crt`; absent or `null` outside it. The app with
            the current root pinned downloads the next one over that same connection, checks its fingerprint
            and keeps it, to switch on its own when the server starts serving it.
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        version:
          description: Server version.
          type: string
        contract_version:
          description: Version of this contract that the server implements.
          type: string
    PrivacyInfo:
      description: Since 2.19.0. Where each piece of data goes, under the configuration in force.
      type: object
      required:
      - destinations
      properties:
        destinations:
          description: One item per purpose, in the order of `DataPurpose`.
          type: array
          items:
            $ref: '#/components/schemas/DataDestination'
    DataPurpose:
      description: '`transcription` is audio becoming text; the others are the agent purposes (summaries,
        fields, chat and agenda type detection).'
      type: string
      enum:
      - transcription
      - summaries
      - fields
      - chat
      - agenda_detection
    DataDestination:
      type: object
      required:
      - purpose
      - location
      - processor
      properties:
        purpose:
          $ref: '#/components/schemas/DataPurpose'
        location:
          description: '`server`: on this server; `local_network`: on another machine of the local network;
            `external`: outside the server and the network; `disabled`: no provider enabled for the purpose,
            and nothing is sent. When in doubt, the server answers `external`.'
          type: string
          enum:
          - server
          - local_network
          - external
          - disabled
        processor:
          description: 'With `external`, who processes it: the vendor (for example `Anthropic`) or only
            the host of the address (for example `api.deepseek.com`); `null` in the others.'
          type:
          - string
          - 'null'
    DeviceLogin:
      type: object
      required:
      - email
      - password
      - device_name
      - platform
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        device_name:
          description: Device name, which becomes the token name ("iPhone da Mariana").
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DevicePair:
      type: object
      required:
      - code
      - device_name
      - platform
      properties:
        code:
          description: The pairing code (`K7Q-4MX` or `k7q4mx`).
          type: string
          minLength: 1
          maxLength: 32
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DeviceCredential:
      type: object
      required:
      - token
      - secret
      - server
      properties:
        token:
          $ref: '#/components/schemas/Token'
        secret:
          description: The full token, which the app stores. It is not shown again.
          type: string
          pattern: ^eclp_[A-Za-z0-9]{32,}$
        server:
          $ref: '#/components/schemas/ServerInfo'
    PairingCode:
      type: object
      required:
      - id
      - status
      - expires_at
      - token_id
      properties:
        id:
          type: string
          format: uuid
        status:
          description: '`expired` also applies to a code superseded by a newer code.'
          type: string
          enum:
          - pending
          - used
          - expired
        expires_at:
          type: string
          format: date-time
        token_id:
          description: With `used`, the device credential the code issued.
          type:
          - string
          - 'null'
          format: uuid
        code:
          description: Only at creation. 6 characters of `23456789ABCDEFGHJKMNPQRSTVWXYZ`.
          type: string
          pattern: ^[2-9A-HJKMNP-TV-Z]{6}$
        display:
          description: Only at creation. The code as the screen shows it (`K7Q-4MX`).
          type: string
        pair_url:
          description: 'Only at creation. QR content: `<url>/parear?codigo=<code>&ca=<ca_sha256>` (without
            `ca` while the root has not been published).'
          type: string
          format: uri
    TokenCreate:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
        expires_at:
          description: With no value, the PAT does not expire.
          type:
          - string
          - 'null'
          format: date-time
    TokenCreated:
      type: object
      required:
      - token
      - secret
      properties:
        token:
          $ref: '#/components/schemas/Token'
        secret:
          description: The full PAT. It is not shown again.
          type: string
          pattern: ^eclp_[A-Za-z0-9]{32,}$
    TokenPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Source:
      description: Audio origin. `desktop` and `mobile` are the apps that record.
      type: string
      enum:
      - desktop
      - mobile
      - upload
      - api
    Capture:
      description: Capture context, filled in by the app that recorded (desktop or phone).
      type: object
      properties:
        meeting_app:
          description: Detected meeting app.
          type:
          - string
          - 'null'
          enum:
          - teams
          - meet
          - zoom
          - other
          - null
        device_name:
          type:
          - string
          - 'null'
        client_version:
          description: Version of the app that recorded (`eclume-desktop/0.3.0`, `eclume-android/0.1.0`).
          type:
          - string
          - 'null'
    RecordingMetadata:
      description: Free organization metadata (meeting type, client, project).
      type: object
      additionalProperties:
        type: string
    UploadCreate:
      type: object
      required:
      - filename
      - content_type
      - size_bytes
      - sha256
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: File type, with optional parameters (`audio/ogg; codecs=opus`, the browser output;
            `audio/webm`; `video/mp4`).
          type: string
          pattern: ^(audio|video)/[A-Za-z0-9.+-]+(\s*;.*)?$
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          description: SHA-256 of the whole file, in lowercase hex.
          type: string
          pattern: ^[0-9a-f]{64}$
        title:
          description: With no value, derived from the file name.
          type: string
          minLength: 1
        recorded_at:
          description: Start of the recording. With no value, the upload time applies (`recorded_at_source`
            `upload`).
          type: string
          format: date-time
        recorded_at_source:
          description: 'Where `recorded_at` came from. With no value, the server decides: with `recorded_at`
            and

            `source` `desktop` or `mobile`, `capture`; with `recorded_at` and another origin, `user`;

            without `recorded_at`, `upload`.

            '
          $ref: '#/components/schemas/RecordedAtSource'
        kind:
          $ref: '#/components/schemas/RecordingKind'
        agenda_type_id:
          description: 'Agenda type chosen when stopping the recording on the phone: it becomes the type
            chosen by the

            user (origin `edited`) and skips the detection.

            '
          type: string
          format: uuid
        markers:
          description: 'Markers made during the recording, with the capture''s `device_name`. Idempotent
            by

            `client_id`: in a deduplicated upload, they go into the existing recording.

            '
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MarkerInput'
        duration_ms:
          type: integer
          minimum: 0
        language:
          description: Expected language (BCP 47) or, since 2.20.0, `auto` (the engine detects it and
            the recording stores the detected one). With no value, the account's preferred language applies,
            then the server default.
          type: string
          pattern: ^(auto|[a-z]{2,3}(-[A-Z]{2})?)$
        source:
          $ref: '#/components/schemas/Source'
        capture:
          $ref: '#/components/schemas/Capture'
        tags:
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: '#/components/schemas/RecordingMetadata'
    UploadStatus:
      type: string
      enum:
      - in_progress
      - completed
      - aborted
      - expired
      - deduplicated
    PartUrl:
      type: object
      required:
      - part_number
      - method
      - url
      - headers
      - expires_at
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        method:
          type: string
          enum:
          - PUT
        url:
          description: Opaque URL of the part.
          type: string
          format: uri
        headers:
          description: Headers the `PUT` must carry.
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
    ReceivedPart:
      type: object
      required:
      - part_number
      - etag
      - size_bytes
      properties:
        part_number:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
        size_bytes:
          type: integer
          minimum: 1
    Upload:
      type: object
      required:
      - id
      - status
      - filename
      - content_type
      - size_bytes
      - sha256
      - part_size
      - part_count
      - parts_received
      - parts
      - recording_id
      - expires_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UploadStatus'
        filename:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        part_size:
          description: Size of every part but the last, in bytes (minimum 5 MiB).
          type: integer
          minimum: 5242880
        part_count:
          type: integer
          minimum: 0
          maximum: 10000
        parts_received:
          type: array
          items:
            $ref: '#/components/schemas/ReceivedPart'
        parts:
          description: URLs already issued for pending parts; may come partial or empty.
          type: array
          items:
            $ref: '#/components/schemas/PartUrl'
        recording_id:
          description: Recording created by `complete`, or the existing one in a `deduplicated`.
          type:
          - string
          - 'null'
          format: uuid
        expires_at:
          description: After this the unfinished upload is discarded (`upload_expired`).
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    PartUrlsRequest:
      type: object
      required:
      - part_numbers
      properties:
        part_numbers:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 10000
    PartUrls:
      type: object
      required:
      - parts
      properties:
        parts:
          type: array
          items:
            $ref: '#/components/schemas/PartUrl'
    UploadComplete:
      type: object
      required:
      - parts
      properties:
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - part_number
            - etag
            properties:
              part_number:
                type: integer
                minimum: 1
                maximum: 10000
              etag:
                type: string
    RecordingStatus:
      description: '`uploading` → `queued` → `processing` → `transcribed` | `failed`.'
      type: string
      enum:
      - uploading
      - queued
      - processing
      - transcribed
      - failed
    Job:
      description: Most recent transcription job of the recording.
      type: object
      required:
      - id
      - state
      - stage
      - progress
      - attempts
      - error
      - queued_at
      - started_at
      - finished_at
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        stage:
          description: 'Current stage, or `null` outside execution. `preprocessing` is the audio treatment

            before the ASR (holetz/eclume#33).

            '
          type:
          - string
          - 'null'
          enum:
          - preprocessing
          - asr
          - alignment
          - diarization
          - embeddings
          - finalizing
          - null
        progress:
          type: number
          minimum: 0
          maximum: 1
        attempts:
          type: integer
          minimum: 0
        error:
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                description: '`hash_mismatch`, `unsupported_media`, `gpu_oom`, `engine_error`... and,
                  since 1.4.0, `worker_lost` (the GPU worker stopped in the middle of the job), `job_lost`
                  (the job vanished from the queue without an answer) and `job_stalled` (progress stalled
                  beyond the ceiling), detected by the server. Since 2.5.0, `ingest_failed`: the transcription
                  finished in the GPU worker, but the server could not store it (the ingestion failed
                  or never arrived); recoverable. Since 2.10.0, `cancelled`: the owner cancelled the transcription
                  (or deleted the recording); recoverable, with `state` `cancelled`.'
                type: string
              message:
                type: string
              retryable:
                description: 'The failure is transient (lost worker, vanished or stalled job, failed ingestion,
                  lack of VRAM): retranscribing or `POST /api/v1/admin/jobs/{job_id}/retry` tends to solve
                  it. Absent on servers older than 1.4.0.'
                type: boolean
          - type: 'null'
        queued_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        queue:
          description: 'Why the job waits, while `state` is `queued`; `null` in any other state.

            Absent on servers older than 2.16.0 (holetz/eclume#117).

            '
          oneOf:
          - $ref: '#/components/schemas/JobQueue'
          - type: 'null'
    JobQueue:
      description: 'The wait of a `queued` job, computed at read time. Only counts and times: nothing
        about another

        account. Waiting never becomes a failure; the job stays `queued`.

        '
      type: object
      required:
      - reason
      - ahead
      - account_ahead
      - estimated_start_at
      - resumes_at
      - processor
      properties:
        reason:
          description: '`processor_queue` (in the transcription processor''s queue), `account_turn` (behind

            other recordings of the account itself, through the fair queue) or `quota_window` (the account
            went

            over its 24 h transcription minutes). Open enum: clients tolerate a new value.

            '
          type: string
          enum:
          - processor_queue
          - account_turn
          - quota_window
        ahead:
          description: 'In `processor_queue`, how many jobs start before this one, counting the running
            one;

            `null` for the other reasons or if the job is not in the processor''s queue.

            '
          type:
          - integer
          - 'null'
          minimum: 0
        account_ahead:
          description: In `account_turn`, how many recordings of the account itself come before; `null`
            in the others.
          type:
          - integer
          - 'null'
          minimum: 0
        estimated_start_at:
          description: 'Start forecast, from the real duration of the latest transcriptions; it is an
            estimate, and

            clients label it as such. `null` without enough history, with the processor

            down or outside `processor_queue`.

            '
          type:
          - string
          - 'null'
          format: date-time
        resumes_at:
          description: In `quota_window`, when the 24 h window has minutes again; `null` in the others.
          type:
          - string
          - 'null'
          format: date-time
        processor:
          $ref: '#/components/schemas/ProcessorStatus'
    ProcessorStatus:
      description: Whether the transcription processor is up, by the GPU worker's heartbeat.
      type: object
      required:
      - online
      - offline_since
      properties:
        online:
          type: boolean
        offline_since:
          description: 'When down, the last heartbeat seen (1 min precision); `null` when up or if there
            was

            never a heartbeat.

            '
          type:
          - string
          - 'null'
          format: date-time
    RecordingKind:
      description: '`meeting` (meeting, the default) or `note` (voice note).'
      type: string
      enum:
      - meeting
      - note
    RecordedAtSource:
      description: 'Origin of `recorded_at`: `capture` (clock of the app that recorded), `file_metadata`
        (read from the

        file and confirmed at import), `user` (typed or corrected) or `upload` (no date;

        the upload time applies).

        '
      type: string
      enum:
      - capture
      - file_metadata
      - user
      - upload
    Recording:
      type: object
      required:
      - id
      - title
      - status
      - kind
      - source
      - recorded_at
      - recorded_at_source
      - duration_ms
      - language
      - size_bytes
      - content_type
      - content_hash
      - owner
      - tags
      - collection_ids
      - collections_origin
      - metadata
      - capture
      - agenda_type
      - job
      - pipeline
      - awaiting
      - transcript_id
      - marker_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/RecordingStatus'
        kind:
          $ref: '#/components/schemas/RecordingKind'
        source:
          $ref: '#/components/schemas/Source'
        recorded_at:
          description: Start of the recording; the end is `recorded_at + duration_ms`.
          type: string
          format: date-time
        recorded_at_source:
          $ref: '#/components/schemas/RecordedAtSource'
        duration_ms:
          description: '`null` until the audio is read.'
          type:
          - integer
          - 'null'
          minimum: 0
        language:
          description: Requested or detected language; `auto` only while the detection has not run.
          type:
          - string
          - 'null'
        size_bytes:
          type: integer
          minimum: 1
        content_type:
          type: string
        content_hash:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        owner:
          description: 'Deprecated since 2.11.0: always the user themself (each account is isolated);
            removed in `/api/v2`.'
          deprecated: true
          $ref: '#/components/schemas/UserRef'
        tags:
          type: array
          items:
            type: string
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        collections_origin:
          description: 'Who owns the collection list: `auto` (the agent, through the auto collections),
            `edited` (the

            user changed it; the agent no longer touches it) or `null` (from the upload, or not yet chosen:
            the

            agent only adds).

            '
          type:
          - string
          - 'null'
          enum:
          - auto
          - edited
          - null
        metadata:
          $ref: '#/components/schemas/RecordingMetadata'
        capture:
          oneOf:
          - $ref: '#/components/schemas/Capture'
          - type: 'null'
        agenda_type:
          description: 'Agenda type of the recording: detected by the agent (`auto`) or chosen by the
            user

            (`edited`), which the detection never replaces.

            '
          oneOf:
          - type: object
            required:
            - id
            - name
            - origin
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              origin:
                type: string
                enum:
                - auto
                - edited
          - type: 'null'
        job:
          oneOf:
          - $ref: '#/components/schemas/Job'
          - type: 'null'
        pipeline:
          description: 'The seven processing steps of the current revision, in order; one that has not
            run yet comes out

            `pending`. While the GPU worker reports progress, preprocessing or transcription

            comes out `active`. The `speakers` step arrived in 2.22.0 (there were six).

            '
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/PipelineStep'
        awaiting:
          description: 'Since 2.22.0. What the recording expects from the owner to proceed: `speakers`
            when the

            `speakers` step is `waiting` (the account requires naming the speakers and someone is missing);
            `null`

            in the others.

            '
          type:
          - string
          - 'null'
          enum:
          - speakers
          - null
        transcript_id:
          description: Transcript, after the first completed job.
          type:
          - string
          - 'null'
          format: uuid
        marker_count:
          description: Markers of the recording.
          type: integer
          minimum: 0
        audio_deleted_at:
          description: 'Since 2.29.0. When the retention policy deleted the audio; `null` while it exists.
            The server always sends it. A recording without audio refuses playback (410) and retranscription
            (409), both with `code: audio_deleted`.'
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PipelineStep:
      type: object
      required:
      - step
      - state
      - started_at
      - finished_at
      - duration_ms
      - error
      - reason
      properties:
        step:
          type: string
          description: In chain order; the agenda type comes before the fields. `speakers` (since 2.22.0)
            sits between the transcription and the agenda type.
          enum:
          - received
          - preprocessing
          - transcription
          - speakers
          - agenda_type
          - fields
          - summary
        state:
          type: string
          description: '`waiting` (since 2.22.0) belongs only to the `speakers` step: stopped waiting
            for the owner to name the speakers, with `reason` `unnamed_speakers`.'
          enum:
          - pending
          - active
          - done
          - failed
          - skipped
          - waiting
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        error:
          description: With `state` `failed`.
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
          - type: 'null'
        reason:
          description: 'Why the step was skipped: `no_provider`, `no_auto_fields`, `no_types`, `set_by_user`,

            `no_agenda_type`, `before_pipeline` (recording older than the pipeline), `cancelled` (the

            transcription was cancelled at this step, since 2.10.0), among others. Since 2.22.0,

            at the `speakers` step: `unnamed_speakers` (in `waiting`), `continued_by_user` and

            `naming_not_required` (released without the names).

            '
          type:
          - string
          - 'null'
    RecordingPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        recorded_at:
          description: Correcting the date sets `recorded_at_source` to `user`.
          type: string
          format: date-time
        kind:
          $ref: '#/components/schemas/RecordingKind'
        language:
          description: Language (BCP 47) or, since 2.20.0, `auto` (the engine detects it).
          type: string
          pattern: ^(auto|[a-z]{2,3}(-[A-Z]{2})?)$
        tags:
          description: Replaces the whole list.
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 64
        collection_ids:
          description: Replaces the whole list.
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        metadata:
          description: Replaces the whole object (up to 50 entries).
          type: object
          maxProperties: 50
          propertyNames:
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 1000
        agenda_type_id:
          description: 'Agenda type chosen by the user (origin `edited`, which the detection does not
            replace);

            `null` removes the type and hands the choice back to the detection.

            '
          type:
          - string
          - 'null'
          format: uuid
    RecordingPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recording'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    RetranscribeRequest:
      type: object
      properties:
        language:
          description: Language (BCP 47) or, since 2.20.0, `auto` (the engine detects it).
          type: string
          pattern: ^(auto|[a-z]{2,3}(-[A-Z]{2})?)$
        min_speakers:
          description: 'Since 2.25.0. Minimum number of speakers to expect in this revision; overrides
            the admin limits

            and the voice note rule (one speaker). Not persisted: it applies only to the requested revision.

            '
          type: integer
          minimum: 1
          maximum: 30
        max_speakers:
          description: 'Since 2.25.0. Maximum number of speakers to expect in this revision (422 if lower
            than

            `min_speakers`). A voice note (`kind: note`) without this field uses 1 speaker.

            '
          type: integer
          minimum: 1
          maximum: 30
    TranscriptSummary:
