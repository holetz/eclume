    get:
      tags:
      - summaries
      operationId: listSummaryChat
      summary: Messages of the adjustment chat
      security:
      - sessionCookie: []
      - pat:
        - summaries:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages, in chronological order.
          content:
