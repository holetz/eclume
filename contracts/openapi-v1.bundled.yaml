          type: string
          pattern: ^eclp_[A-Za-z0-9]{32,}$
    TokenPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Token'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Source:
      description: Origem do áudio.
      type: string
      enum:
      - desktop
      - upload
      - api
    Capture:
      description: Contexto da captura, preenchido pelo app desktop.
      type: object
      properties:
        meeting_app:
          description: App de reunião detectado.
          type:
          - string
          - 'null'
          enum:
          - teams
          - meet
          - zoom
          - other
          - null
        device_name:
          type:
          - string
          - 'null'
        client_version:
          description: Versão do app que gravou (`eclume-desktop/0.3.0`).
          type:
          - string
          - 'null'
    RecordingMetadata:
      description: Metadados livres de organização (tipo de reunião, cliente, projeto).
      type: object
      additionalProperties:
        type: string
    UploadCreate:
      type: object
      required:
      - filename
      - content_type
      - size_bytes
      - sha256
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          description: Tipo do arquivo, com parâmetros opcionais (`audio/ogg; codecs=opus`, a saída do
            navegador; `audio/webm`; `video/mp4`).
          type: string
          pattern: ^(audio|video)/[A-Za-z0-9.+-]+(\s*;.*)?$
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          description: SHA-256 do arquivo inteiro, em hex minúsculo.
          type: string
          pattern: ^[0-9a-f]{64}$
        title:
          description: Sem valor, deriva do nome do arquivo.
          type: string
          minLength: 1
        recorded_at:
          description: Início da gravação. Sem valor, vale a hora do envio (`recorded_at_source` `upload`).
          type: string
          format: date-time
        recorded_at_source:
          description: 'De onde veio `recorded_at`. Sem valor, o servidor decide: com `recorded_at` e

            `source: desktop`, `capture`; com `recorded_at` e outra origem, `user`; sem

            `recorded_at`, `upload`.

            '
          $ref: '#/components/schemas/RecordedAtSource'
        kind:
          $ref: '#/components/schemas/RecordingKind'
        agenda_type_id:
          description: 'Tipo de agenda escolhido ao parar a gravação no celular: vira o tipo escolhido
            pelo

            usuário (origem `edited`) e dispensa a detecção.

            '
          type: string
          format: uuid
        markers:
          description: 'Marcadores feitos durante a gravação, com o `device_name` da captura. Idempotentes
            por

            `client_id`: num upload deduplicado, entram na gravação existente.

            '
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/MarkerInput'
        duration_ms:
          type: integer
          minimum: 0
        language:
          description: Idioma esperado (BCP 47). Sem valor, vale o padrão da plataforma ou a detecção.
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
        source:
          $ref: '#/components/schemas/Source'
        capture:
          $ref: '#/components/schemas/Capture'
        tags:
          type: array
          items:
            type: string
            minLength: 1
        collection_ids:
          type: array
          items:
            type: string
            format: uuid
        metadata:
          $ref: '#/components/schemas/RecordingMetadata'
    UploadStatus:
      type: string
      enum:
      - in_progress
      - completed
      - aborted
      - expired
      - deduplicated
    PartUrl:
