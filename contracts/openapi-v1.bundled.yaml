          type:
          - string
          - 'null'
          format: uuid
        chat_message_id:
          description: Numa versão `chat`, a resposta do agente que a produziu.
          type:
          - string
          - 'null'
          format: uuid
        created_by:
          description: Id do usuário que pediu a geração, editou ou pediu o ajuste.
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
