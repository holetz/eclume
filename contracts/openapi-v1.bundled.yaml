            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - recordings
      operationId: deleteRecording
      summary: Excluir a gravação, o áudio e a transcrição
      description: Com PAT, exige `recordings:delete` desde a 2.3.0 (antes, `recordings:write`); a migração
        concedeu `recordings:delete` a todo token que tinha `recordings:write`.
      security:
      - sessionCookie: []
