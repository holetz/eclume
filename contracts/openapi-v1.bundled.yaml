        message:
          type: string
          minLength: 1
          maxLength: 4000
    ChatRead:
      description: 'Uma consulta do agente à transcrição: `read_transcript` (o trecho `from_ms`–`to_ms`,

        `clipped` se passou do teto e foi cortado) ou `search_transcript` (`query` e os `hits`).

        '
      type: object
      required:
      - tool
      properties:
        tool:
          type: string
          enum:
          - read_transcript
          - search_transcript
        from_ms:
          type: integer
          minimum: 0
        to_ms:
          type: integer
          minimum: 0
        clipped:
          type: boolean
        query:
          type: string
        hits:
          type: integer
          minimum: 0
    SummaryChatMessage:
      type: object
      required:
      - id
