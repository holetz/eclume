    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      tags:
      - recordings
      operationId: exportRecording
      summary: Export the recording
      description: "- `txt`: title, date (America/Sao_Paulo time), duration, participants and one\n  `[HH:MM:SS]\
        \ Name: text` line per segment.\n- `srt`: one subtitle per segment, `HH:MM:SS,mmm --> HH:MM:SS,mmm`\
        \ and `Name: text`.\n- `md`: `# Title`, one line with the date and the agenda type, and the current\
        \ summary. With\n  no summary, 409 `summary_missing`.\n- `docx`: title, date, duration and participants,\
        \ the summary (Markdown headings and lists\n  become Word styles) and the transcript; with no\
        \ summary, only the transcript.\n\nRequires `transcripts:read` on a PAT, and also `summaries:read`\
        \ for `md` and `docx`. With no\ntranscript, 409 `transcript_missing`.\n"
      security:
      - sessionCookie: []
      - pat:
        - transcripts:read
      parameters:
      - name: format
        in: query
        required: true
        description: Export format. New formats are added additively.
        schema:
          type: string
          enum:
          - txt
          - srt
          - md
          - docx
      responses:
        '200':
          description: Exported file, named with the slug of the title.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples:
                - attachment; filename="alinhamento-do-programa-de-liderancas.docx"
          content:
            text/plain:
              schema:
                type: string
            application/x-subrip:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
