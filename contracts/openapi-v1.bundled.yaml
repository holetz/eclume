      - role
      - content
      - status
      - sources
      - queries
      - model
      - error
      - files
      - skill
      - actions
      - created_at
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          description: A pergunta, ou a resposta em Markdown (vazia até `done`).
          type: string
        status:
          description: A pergunta é sempre `done`; a resposta vai de `queued` a `done` ou `failed`.
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        sources:
          description: As gravações consultadas em que a resposta se apoia.
          type: array
          items:
            $ref: '#/components/schemas/BaseChatSource'
        queries:
          description: Quantas ferramentas o agente chamou.
          type: integer
          minimum: 0
        model:
          type:
          - string
          - 'null'
        error:
          description: 'Com `status: failed`; `no_provider` sem provider para o `chat`, `agent_expired`
            quando a resposta passou de 15 minutos em aberto.'
          oneOf:
          - type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
              message:
                type: string
          - type: 'null'
        files:
          description: Os anexos da pergunta ou os arquivos gerados pela resposta.
          type: array
          items:
            $ref: '#/components/schemas/AgentFile'
        skill:
          description: Desde a 2.24.0. O nome da habilidade escolhida na pergunta (o nome na hora).
          type:
          - string
          - 'null'
        actions:
          description: Desde a 2.24.0. As propostas de ação da resposta, que a pessoa confirma ou descarta.
          type: array
          items:
            $ref: '#/components/schemas/AgentAction'
        created_at:
          type: string
          format: date-time
    AgentMessageCreate:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        attachments:
          description: Ids de anexos desta conversa ainda não enviados (até 5).
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
        skill:
          description: Desde a 2.24.0. O nome de uma habilidade ligada da conta; `/nome` no começo da
            mensagem vale o mesmo.
          type: string
          maxLength: 41
    AgentTool:
      type: object
      required:
      - name
      - kind
      - description
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - read
          - produce
          - action
        description:
          type: string
    AgentSkill:
      type: object
      required:
      - id
      - name
      - description
      - instructions
      - allowed_tools
      - enabled
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          description: O `/nome` da conversa.
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,39}$
        description:
          description: O que a habilidade faz; o agente a lê para escolher.
          type: string
          maxLength: 300
        instructions:
          description: As instruções em Markdown.
          type: string
          maxLength: 8000
        allowed_tools:
          description: As ferramentas que a habilidade permite (nomes do catálogo); nulo libera todas.
          type:
          - array
          - 'null'
          items:
            type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentSkillCreate:
      type: object
      required:
      - name
      - description
      - instructions
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 41
        description:
          type: string
          minLength: 1
          maxLength: 300
        instructions:
          type: string
          minLength: 1
          maxLength: 8000
        allowed_tools:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: string
            maxLength: 64
        enabled:
          type: boolean
    AgentSkillPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 41
        description:
          type: string
          minLength: 1
          maxLength: 300
        instructions:
          type: string
          minLength: 1
          maxLength: 8000
        allowed_tools:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            type: string
            maxLength: 64
        enabled:
          type: boolean
    AgentActionTarget:
