          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - admin
      operationId: deleteSecret
      security:
      - adminSessionCookie: []
      summary: Apagar um segredo
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Apagado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/users:
    get:
      tags:
      - admin
      operationId: listUsers
      security:
      - adminSessionCookie: []
      summary: Contas de usuário
      description: Dados da conta e a contagem de gravações; nunca o conteúdo do usuário.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Usuários.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
              examples:
                usuarios:
                  $ref: '#/components/examples/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/users/{user_id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - admin
      operationId: updateUser
      security:
      - adminSessionCookie: []
      summary: Desativar ou reativar um usuário
      description: Desativar encerra as sessões e revoga os PATs do usuário.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/jobs/{job_id}/retry:
    post:
      tags:
      - admin
      operationId: retryTranscriptionJob
      security:
      - adminSessionCookie: []
      summary: Retentar um job de transcrição que falhou
      description: Cria o job da revisão seguinte da gravação, com a configuração atual da plataforma,
        e o enfileira. Vale para a gravação de qualquer usuário, mas só para o job mais recente da gravação
        e em estado `failed`.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Novo job na fila.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobRetried'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/admin/health:
    get:
      tags:
      - admin
      operationId: getAdminHealth
      security:
      - adminSessionCookie: []
      summary: Saúde da fila, da GPU e dos modelos
      responses:
        '200':
          description: Estado atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
              examples:
                gpu:
                  $ref: '#/components/examples/AdminHealth'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: eclume_session
      description: 'Sessão do navegador, aberta por `POST /api/v1/auth/login` ou pelo cadastro. Tem todas
        as

        permissões do usuário sobre a própria conta. Métodos mutáveis exigem `X-CSRF-Token` igual

        ao cookie `eclume_csrf` (double-submit). Gestão de PATs, o aceite do aviso e as rotas de

        voz aceitam **só** sessão. Não alcança `/api/v1/admin/*`.

        '
    adminSessionCookie:
      type: apiKey
      in: cookie
      name: eclume_admin_session
      description: 'Sessão da conta de admin, aberta por `POST /api/v1/admin/auth/login` (HttpOnly, Secure,

        SameSite=Strict, `Path=/api/v1/admin`, 12 h). É a única credencial aceita em

        `/api/v1/admin/*`, e é ignorada em qualquer outra rota. Métodos mutáveis exigem

        `X-CSRF-Token` igual ao cookie `eclume_admin_csrf` (double-submit).

        '
    pat:
      type: http
      scheme: bearer
      bearerFormat: eclp_<segredo>
      description: 'PAT pessoal: `Authorization: Bearer eclp_<segredo>`. Age como o usuário dono, limitado

        aos escopos concedidos. Os escopos exigidos por operação estão no requisito de segurança

        (`pat: [escopo, ...]`, todos obrigatórios). Nenhum escopo implica outro. Faltando

        escopo, a resposta é 403 com `code: insufficient_scope` e `required_scopes`.

        '
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: 'Obrigatório com sessão: o valor do cookie `eclume_csrf`, ou de `eclume_admin_csrf`
        em `/api/v1/admin/*`. Ignorado com PAT.'
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Cursor opaco devolvido em `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Itens por página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Since:
      name: since
      in: query
      description: Só itens com `updated_at >= since` (inclusivo).
      schema:
        type: string
        format: date-time
    PersonFilter:
      name: person
      in: query
      description: Id de pessoa; só transcrições (ou trechos) em que um locutor está ligado a ela.
      schema:
        type: string
        format: uuid
    TagFilter:
      name: tag
      in: query
      description: Só gravações com esta tag.
      schema:
        type: string
    CollectionFilter:
      name: collection
      in: query
      description: Só gravações desta coleção.
      schema:
        type: string
        format: uuid
    PairingCodeId:
      name: pairing_code_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TokenId:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: upload_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordingId:
      name: recording_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TranscriptId:
      name: transcript_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SummaryId:
      name: summary_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AgendaTypeId:
      name: agenda_type_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FieldId:
      name: field_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreviewId:
      name: preview_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: person_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CollectionId:
      name: collection_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Sem credencial, ou credencial inválida, expirada ou revogada.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            examples:
            - Bearer realm="eclume"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semCredencial:
              $ref: '#/components/examples/ProblemUnauthorized'
    Forbidden:
      description: 'Credencial válida sem permissão (escopo ou dono), PAT numa operação que aceita só
        sessão (`code: session_required`), cadastro fechado (`code: signup_closed`) ou sessão de conta
        que ainda não aceitou o aviso em vigor (`code: notice_required`; antes do aceite, só `GET /me`,
        `POST /me/notice` e `/auth/*` respondem, e `POST /devices/login` não emite credencial).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            semEscopo:
              $ref: '#/components/examples/ProblemInsufficientScope'
    NotFound:
      description: Não existe ou não é do usuário (o eclume não distingue os dois).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naoEncontrado:
              $ref: '#/components/examples/ProblemNotFound'
    ValidationFailed:
      description: Corpo ou parâmetros inválidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalido:
              $ref: '#/components/examples/ProblemValidation'
    Conflict:
      description: O estado atual impede a operação (upload já concluído, nome duplicado, job em andamento,
        resumo mudado desde a versão aberta, chat com pedido em aberto).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 'Limite atingido (`code: rate_limited`): pedidos em aberto, como as 3 pré-visualizações
        em andamento por conta (tente de novo quando algum terminar), ou tentativas por minuto nas rotas
        de credencial (login, cadastro, login de admin e `/devices/*`; por IP e, nos logins, também por
        conta), com `Retry-After`.'
      headers:
        Retry-After:
          description: Segundos até a janela de tentativas reabrir.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      description: Erro RFC 9457. O cliente decide por `code`, nunca por `title`.
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          description: 'Código estável. Valores v1: `unauthorized`, `insufficient_scope`, `forbidden`,

            `not_found`, `validation_failed`, `conflict`, `hash_mismatch`, `upload_expired`,

            `rate_limited`; desde a 1.4.0, `session_required` (PAT numa operação só de sessão);

            desde a 2.0.0, `email_taken` (cadastro com e-mail existente) e `signup_closed`;

            desde a 2.2.0, `summary_changed` (o resumo mudou desde a versão aberta),

            `summary_missing`, `transcript_missing` e `chat_busy` (já há um pedido de ajuste em

            aberto); desde a 2.3.0, `invalid_pairing_code` (código de pareamento inexistente,

            vencido ou usado) e `notice_required` (sessão de conta que ainda não aceitou o aviso em

            vigor). Códigos novos entram de forma aditiva.

            '
          type: string
        required_scopes:
          description: Com `insufficient_scope`, os escopos que faltaram.
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        errors:
          description: Com `validation_failed`, um item por campo inválido.
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                description: Caminho do campo (`size_bytes`, `parts[3].etag`).
                type: string
              message:
                type: string
    Scope:
      description: Escopo de PAT. `recordings:delete` (2.3.0) exclui gravações. A tela "Conexão MCP" agrupa
        os escopos em "Buscar e ler gravações" (`recordings:read`, `transcripts:read`), "Ler e editar
        resumos" (`summaries:read`, `summaries:write`), "Editar campos e tags" (`recordings:write`) e
        "Excluir gravações" (`recordings:delete`).
      type: string
      enum:
      - recordings:read
      - recordings:write
      - recordings:delete
      - transcripts:read
      - transcripts:write
      - people:read
      - people:write
      - summaries:read
      - summaries:write
    Health:
      type: object
      required:
      - status
      - version
      - contract_version
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa (`info.version`).
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    Notice:
      description: Aviso que a conta aceita ao nascer ("Sou responsável por pedir o consentimento das
        pessoas que gravo").
      type: object
      required:
      - version
      - text
      properties:
        version:
          type: string
        text:
          type: string
    SignupInfo:
      type: object
      required:
      - open
      - notice
      properties:
        open:
          description: '`false` com `ECLUME_SIGNUP_OPEN=false`: o cadastro responde 403 `signup_closed`.'
          type: boolean
        notice:
          $ref: '#/components/schemas/Notice'
    SignupRequest:
      type: object
      required:
      - name
      - email
      - password
      - notice_version
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
        notice_version:
          description: Versão do aviso aceito; tem de ser a em vigor.
          type: string
          minLength: 1
    NoticeAccept:
      type: object
      required:
      - notice_version
      properties:
        notice_version:
          type: string
          minLength: 1
    User:
      type: object
      required:
      - id
      - email
      - name
      - active
      - created_at
      - last_login_at
      - notice_version
      - notice_accepted_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        notice_version:
          description: Versão do aviso aceito, ou `null` numa conta que ainda não aceitou.
          type:
          - string
          - 'null'
        notice_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminUser:
      description: Conta de usuário vista pelo admin (o `User` mais a contagem de gravações).
      type: object
      required:
      - id
      - email
      - name
      - active
      - created_at
      - last_login_at
      - notice_version
      - notice_accepted_at
      - recording_count
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        notice_version:
          type:
          - string
          - 'null'
        notice_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        recording_count:
          type: integer
          minimum: 0
    UserPatch:
      type: object
      required:
      - active
      properties:
        active:
          description: '`false` desativa a conta, encerra as sessões e revoga os PATs.'
          type: boolean
    AdminUserPage:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    AdminAccount:
      description: Conta de admin, separada das contas de usuário.
      type: object
      required:
      - id
      - email
      - name
      - created_at
      - last_login_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
    AdminRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Me:
      type: object
      required:
      - user
      - auth
      - notice_required
      properties:
        user:
          $ref: '#/components/schemas/User'
        notice_required:
          description: A conta ainda não aceitou o aviso em vigor (`POST /api/v1/me/notice`).
          type: boolean
        auth:
          type: object
          required:
          - method
          - scopes
          - token_id
          properties:
            method:
              type: string
              enum:
              - session
              - pat
            scopes:
              description: Com sessão, todos os escopos.
              type: array
              items:
                $ref: '#/components/schemas/Scope'
            token_id:
              description: Id do PAT em uso, ou `null` com sessão.
              type:
              - string
              - 'null'
              format: uuid
    NextCursor:
      description: Cursor da próxima página, ou `null` na última.
      type:
      - string
      - 'null'
    Token:
      type: object
      required:
      - id
      - name
      - kind
      - platform
      - scopes
      - prefix
      - created_at
      - last_used_at
      - expires_at
      - revoked_at
      properties:
        id:
          type: string
          format: uuid
        name:
          description: 'Com `kind: device`, o nome do aparelho.'
          type: string
        kind:
          $ref: '#/components/schemas/TokenKind'
        platform:
          description: 'Com `kind: device`, a plataforma do aparelho; `null` num PAT pessoal.'
          oneOf:
          - $ref: '#/components/schemas/DevicePlatform'
          - type: 'null'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        prefix:
          description: Começo do segredo, para reconhecer o token (`eclp_7Hq2`).
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
    TokenKind:
      description: '`personal`, o PAT criado em "Tokens de acesso" ou "Conexão MCP"; `device`, a credencial
        de um aparelho, emitida pelo login ou pelo pareamento.'
      type: string
      enum:
      - personal
      - device
    DevicePlatform:
      type: string
      enum:
      - windows
      - macos
      - linux
      - ios
      - android
    ServerInfo:
      type: object
      required:
      - name
      - url
      - mcp_url
      - ca_sha256
      - version
      - contract_version
      properties:
        name:
          description: Nome do servidor (`ECLUME_SERVER_NAME`), também a instância no mDNS.
          type: string
        url:
          description: Endereço público (`ECLUME_PUBLIC_URL`).
          type: string
          format: uri
        mcp_url:
          description: Endereço do servidor MCP, que o assistente recebe.
          type: string
          format: uri
        ca_sha256:
          description: SHA-256, em hex minúsculo, do DER do certificado raiz servido em `/downloads/eclume-root.crt`;
            `null` enquanto a raiz não foi publicada.
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        version:
          description: Versão do servidor.
          type: string
        contract_version:
          description: Versão deste contrato que o servidor implementa.
          type: string
    DeviceLogin:
      type: object
      required:
      - email
      - password
      - device_name
      - platform
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        device_name:
          description: Nome do aparelho, que vira o nome do token ("iPhone da Mariana").
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DevicePair:
      type: object
      required:
      - code
      - device_name
      - platform
      properties:
        code:
          description: O código de pareamento (`K7Q-4MX` ou `k7q4mx`).
          type: string
          minLength: 1
          maxLength: 32
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        platform:
          $ref: '#/components/schemas/DevicePlatform'
    DeviceCredential:
      type: object
      required:
      - token
      - secret
      - server
      properties:
        token:
          $ref: '#/components/schemas/Token'
        secret:
          description: O token completo, que o app guarda. Não é mostrado de novo.
          type: string
          pattern: ^eclp_[A-Za-z0-9]{32,}$
        server:
          $ref: '#/components/schemas/ServerInfo'
    PairingCode:
      type: object
      required:
      - id
      - status
      - expires_at
      - token_id
      properties:
        id:
          type: string
          format: uuid
        status:
          description: '`expired` vale também para o código vencido por um código mais novo.'
          type: string
          enum:
          - pending
          - used
          - expired
        expires_at:
          type: string
          format: date-time
        token_id:
          description: Com `used`, a credencial de dispositivo que o código emitiu.
          type:
          - string
          - 'null'
          format: uuid
        code:
          description: Só na criação. 6 caracteres de `23456789ABCDEFGHJKMNPQRSTVWXYZ`.
          type: string
          pattern: ^[2-9A-HJKMNP-TV-Z]{6}$
        display:
          description: Só na criação. O código como a tela mostra (`K7Q-4MX`).
          type: string
        pair_url:
          description: 'Só na criação. Conteúdo do QR: `<url>/parear?codigo=<code>&ca=<ca_sha256>` (sem
            `ca` enquanto a raiz não foi publicada).'
          type: string
          format: uri
    TokenCreate:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
        expires_at:
          description: Sem valor, o PAT não expira.
          type:
          - string
