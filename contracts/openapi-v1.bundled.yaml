    TranscriptThreeSpeakersMarkdown:
      summary: Export `md` da reunião com 3 locutores
      value: "---\nid: \"01928f3a-1c00-7a00-8000-000000000501\"\ntitle: \"Alinhamento do programa de lideranças\"\
        \nrecorded_at: \"2026-09-18T14:00:05Z\"\nlanguage: \"pt-BR\"\nduration_ms: 166000\nsource: \"\
        desktop\"\nrevision: 3\nspeakers:\n  - id: \"S1\"\n    label: \"Mariana Couto\"\n    person: \"\
        Mariana Couto\"\n  - id: \"S2\"\n    label: \"Locutor 2\"\n    person: null\n  - id: \"S3\"\n\
        \    label: \"Locutor 3\"\n    person: null\n---\n\n**Mariana Couto** [00:00:03]: Bom dia, pessoal.\
        \ Obrigada por reservarem esse horário. A ideia hoje é fechar o desenho do programa de lideranças\
        \ para o primeiro semestre.\n\n**Locutor 2** [00:00:12]: Bom dia, Mariana. Do nosso lado, o ponto\
        \ principal é o tempo dos gestores. A gente não consegue tirar ninguém da operação por mais de\
        \ meio dia por mês.\n\n**Mariana Couto** [00:00:24]: Faz sentido. Por isso a proposta é trabalhar\
        \ em encontros de quatro horas, com uma tarefa prática entre um encontro e outro, aplicada no\
        \ dia a dia da equipe.\n\n**Locutor 3** [00:00:39]: Eu só queria entender como a gente mede se\
        \ funcionou. No ano passado fizemos um treinamento e ninguém soube dizer o que mudou.\n\n**Mariana\
        \ Couto** [00:00:52]: Essa é a pergunta certa. Antes do primeiro encontro, a gente aplica o assessment\
        \ com cada gestor e com uma amostra da equipe dele. No fim do semestre, repetimos e comparamos.\n\
        \n**Locutor 3** [00:01:12]: E esse resultado chega para a diretoria de que forma?\n\n**Mariana\
        \ Couto** [00:01:20]: Num relatório consolidado, sem expor ninguém individualmente. Cada gestor\
        \ recebe a própria devolutiva numa conversa um a um.\n\n**Locutor 2** [00:01:38]: Isso resolve\
        \ a preocupação que o pessoal da fábrica levantou. Eles tinham receio de que a avaliação virasse\
        \ instrumento de cobrança.\n\n**Locutor 3** [00:01:53]: Certo. Quantas turmas vocês estão pensando?\n\
        \n**Mariana Couto** [00:02:02]: Três turmas de 12 gestores. A primeira começa em outubro, com\
        \ as lideranças da produção, que é onde o turnover está mais alto.\n\n**Locutor 2** [00:02:20]:\
        \ Eu consigo fechar a lista da primeira turma até sexta e mando para você por e-mail.\n\n**Mariana\
        \ Couto** [00:02:31]: Perfeito. Com a lista em mãos, agendo as entrevistas iniciais e mando o\
        \ cronograma na semana que vem.\n"
