      - created_at
      - updated_at
      - owner
      - speakers
      - segments
      properties:
        schema_version:
          description: Versão deste schema, `1.<minor>`. O minor sobe a cada mudança aditiva.
          type: string
          pattern: ^1\.[0-9]+$
          examples:
          - '1.1'
        id:
          description: Id da transcrição. Estável entre revisões e retranscrições.
          type: string
          format: uuid
        recording_id:
          description: Gravação de onde a transcrição saiu.
          type: string
          format: uuid
        title:
          description: Título da gravação.
          type: string
          minLength: 1
        language:
          description: Idioma do conteúdo, BCP 47 (`pt-BR`, `pt`, `en`).
          type: string
          pattern: ^[a-z]{2,3}(-[A-Z]{2})?$
        recorded_at:
          description: Início da gravação (RFC 3339). Sem data informada pelo cliente, é o instante do
            upload.
          type: string
          format: date-time
        duration_ms:
          description: Duração do áudio em milissegundos.
          type: integer
          minimum: 0
        source:
          description: 'Como o áudio chegou ao eclume: `desktop` (app de captura), `upload` (navegador)
            ou `api` (integração por PAT).'
          type: string
          enum:
          - desktop
          - upload
          - api
        content_hash:
          description: Hash do arquivo de áudio enviado, `sha256:<hex>`. É a chave de deduplicação do
            upload e da importação no lumea.
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        revision:
          description: Revisão do conteúdo. Sobe a cada edição (locutor renomeado, pessoa ligada, segmento
            corrigido) e a cada retranscrição.
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          description: Última mudança de qualquer campo; é o que `GET /api/v1/transcripts?since=` compara.
          type: string
          format: date-time
        owner:
          $ref: '#/components/schemas/UserRef'
        engine:
          $ref: '#/components/schemas/TranscriptEngine'
        speakers:
          description: Locutores da transcrição. Sem diarização, há um locutor só.
          type: array
          items:
            $ref: '#/components/schemas/Speaker'
        segments:
          description: Falas em ordem de `start_ms`. Todo `speaker_id` aponta para um locutor de `speakers`.
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        tags:
          description: Tags da gravação.
          type: array
          items:
            type: string
            minLength: 1
        kind:
          description: 'Natureza da gravação: `meeting` (reunião) ou `note` (nota por voz). Desde o schema
            1.1.'
          type: string
          enum:
          - meeting
          - note
        recorded_at_source:
          description: 'De onde veio `recorded_at`: `capture` (relógio do app que gravou), `file_metadata`
            (metadados do arquivo, confirmados na importação), `user` (informada ou corrigida) ou `upload`
            (hora do envio). Desde o schema 1.1.'
          type: string
          enum:
          - capture
          - file_metadata
          - user
          - upload
    UserRef:
      description: Referência curta a um usuário do eclume.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    PersonRef:
      description: Referência curta a uma pessoa do diretório da organização.
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    SpeakerSuggestion:
      description: Pessoa sugerida para um locutor pela impressão de voz. Nunca é aplicada sem confirmação
        humana.
      type: object
      required:
      - person
      - score
      properties:
        person:
          $ref: '#/components/schemas/PersonRef'
        score:
          description: Similaridade de cosseno normalizada, de 0 a 1.
          type: number
          minimum: 0
          maximum: 1
    Speaker:
      description: Locutor de uma transcrição.
      type: object
      required:
      - id
      - label
      - person
      properties:
        id:
          description: Id do locutor, único dentro da transcrição (`S1`, `S2`...). Estável entre edições;
            some só numa mesclagem.
          type: string
          pattern: ^S[0-9]+$
        label:
          description: Nome exibido. Começa como `Locutor N` e muda quando o usuário renomeia o locutor.
          type: string
          minLength: 1
        person:
          description: Pessoa confirmada para o locutor, ou `null` enquanto ninguém a identificou.
          oneOf:
          - $ref: '#/components/schemas/PersonRef'
          - type: 'null'
        suggestions:
          description: Sugestões por voz ainda não confirmadas, da maior para a menor `score`.
          type: array
          items:
            $ref: '#/components/schemas/SpeakerSuggestion'
        talk_ms:
          description: Tempo total de fala do locutor, em milissegundos.
          type: integer
          minimum: 0
    Word:
      description: Palavra com tempo do alinhamento. `start_ms` e `end_ms` são `null` quando o alinhador
        não conseguiu posicioná-la (números, siglas).
      type: object
      required:
      - text
      - start_ms
      - end_ms
      properties:
        text:
          type: string
          minLength: 1
        start_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        end_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
    Segment:
      description: Uma fala contínua de um locutor. `end_ms >= start_ms`.
      type: object
      required:
      - id
      - speaker_id
      - start_ms
      - end_ms
      - text
      properties:
        id:
          description: Id do segmento, único dentro da transcrição.
          type: string
          minLength: 1
        speaker_id:
          description: Locutor da fala; aponta para `speakers[].id`.
          type: string
          pattern: ^S[0-9]+$
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 0
        text:
          type: string
        confidence:
          description: Confiança média do ASR no segmento, de 0 a 1.
          type: number
          minimum: 0
          maximum: 1
        words:
          description: Palavras com tempo. Presente só com `?include=words`.
          type: array
          items:
            $ref: '#/components/schemas/Word'
    TranscriptEngine:
      description: 'Proveniência: engine e modelos que produziram a transcrição.'
      type: object
      required:
      - name
      - model
      properties:
        name:
          description: Engine (`whisperx-local`, `openai-compatible`, `cpu`).
          type: string
        model:
          description: Modelo de ASR (`large-v3-turbo`).
          type: string
        diarization_model:
          type:
          - string
          - 'null'
