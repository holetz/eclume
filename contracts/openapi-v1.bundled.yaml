      - pending
      - version_count
      properties:
        current:
          description: A versão atual (maior `version` concluída).
          oneOf:
          - $ref: '#/components/schemas/Summary'
          - type: 'null'
        generated:
          description: A gerada de referência (a `generated` concluída mais recente), para comparar e
            voltar.
          oneOf:
          - $ref: '#/components/schemas/Summary'
          - type: 'null'
        pending:
          description: A geração em `queued` ou `running`, se houver.
          oneOf:
          - $ref: '#/components/schemas/Summary'
          - type: 'null'
        version_count:
          description: Versões guardadas, de todas as origens.
          type: integer
          minimum: 0
    SummaryEdit:
      type: object
