  /api/v1/recordings/{recording_id}/export:
    parameters:
    - $ref: '#/components/parameters/RecordingId'
    get:
      tags:
      - recordings
      operationId: exportRecording
      summary: Exportar a gravação
      description: "- `txt`: título, data (horário de Brasília), duração, participantes e uma linha\n\
        \  `[HH:MM:SS] Nome: texto` por segmento.\n- `srt`: uma legenda por segmento, `HH:MM:SS,mmm -->\
        \ HH:MM:SS,mmm` e `Nome: texto`.\n- `md`: `# Título`, uma linha com a data e o tipo de agenda,\
        \ e o resumo atual. Sem resumo,\n  409 `summary_missing`.\n- `docx`: título, data, duração e participantes,\
        \ o resumo (títulos e listas do Markdown\n  viram estilos do Word) e a transcrição; sem resumo,\
        \ só a transcrição.\n\nExige `transcripts:read` num PAT, e também `summaries:read` para `md` e\
        \ `docx`. Sem\ntranscrição, 409 `transcript_missing`.\n"
      security:
      - sessionCookie: []
      - pat:
        - transcripts:read
      parameters:
      - name: format
        in: query
        required: true
        description: Formato do export. Formatos novos entram de forma aditiva.
        schema:
          type: string
          enum:
          - txt
          - srt
          - md
          - docx
      responses:
        '200':
          description: Arquivo exportado, com o nome em slug do título.
          headers:
            Content-Disposition:
              schema:
                type: string
                examples:
                - attachment; filename="alinhamento-do-programa-de-liderancas.docx"
          content:
            text/plain:
              schema:
                type: string
            application/x-subrip:
              schema:
                type: string
            text/markdown:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                contentMediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
