<!-- @dsCard group="Components" name="Sign-in layout" subtitle="Brand field beside a flush-left form; ink variant for the admin panel" viewport="960x560" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eclume — Auth</title>
<link rel="stylesheet" href="../styles.css">
<style>.demo{max-width:960px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-8)}.demo-head{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-muted);margin:var(--space-8) 0 var(--space-3)}.demo-head:first-child{margin-top:0}.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}.stack{display:grid;gap:var(--space-3)}.note{font-size:12px;color:var(--color-text-muted);max-width:62ch;margin-top:var(--space-3)}.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--space-6);align-items:start}.demo{max-width:none;padding:0}.auth{min-height:560px}</style>
</head>
<body>
<main class="demo">
<div class="auth"><section class="auth-brand"><span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="0.5" y="8" width="3" height="8"></rect><rect x="5.5" y="3" width="3" height="18"></rect><rect x="10.5" y="0" width="3" height="24"></rect><rect x="15.5" y="5.5" width="3" height="13"></rect><rect x="20.5" y="9" width="3" height="6"></rect></svg>eclume</span><h1>Every word, kept in the house.</h1><span style="font-size:13px">Self-hosted transcription for your own recordings.</span></section>
<section class="auth-form"><form><h2 style="margin:0">Sign in</h2><div class="field"><label>Email</label><input class="input" type="email" value="jane.doe@example.com"></div><div class="field"><label>Password</label><input class="input" type="password" value="password"></div><button type="submit" class="btn btn-primary btn-block">Sign in</button><p class="text-muted" style="margin:0;font-size:13px">New here? <a href="#">Create an account</a></p></form></section></div>
</main>
</body>
</html>
