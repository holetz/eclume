[project]
name = "eclume-engines"
version = "0.2.0"
description = "ASR engine interface of eclume, shared by the server and the worker."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  # client of the `openai-compatible` engine (speaches); light, so it stays in the core
  "httpx>=0.27",
]

# The heavy engines live in extras: `uv sync --all-packages` does not install them, so CI and the
# dev machine (no GPU) stay without torch. The GPU worker image installs `whisperx`.
[project.optional-dependencies]
whisperx = [
  # pinned: the engine calls its API directly; it brings torch 2.8 and pyannote.audio 4
  "whisperx==3.8.6; python_version < '3.14'",
  "nvidia-ml-py>=12",
]
cpu = [
  "faster-whisper>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_engines"]
