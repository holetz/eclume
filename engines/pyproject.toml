[project]
name = "eclume-engines"
version = "0.1.0"
description = "Interface de engine de ASR do eclume, compartilhada pelo server e pelo worker."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  # cliente da engine `openai-compatible` (speaches); leve, por isso fica no núcleo
  "httpx>=0.27",
]

# As engines pesadas vivem em extras: `uv sync --all-packages` não os instala, então a CI e a
# máquina de dev (sem GPU) seguem sem torch. A imagem do worker GPU instala `whisperx`.
[project.optional-dependencies]
whisperx = [
  # fixado: a engine chama a API dele diretamente; traz torch 2.8 e pyannote.audio 4
  "whisperx==3.8.6; python_version < '3.14'",
  "nvidia-ml-py>=12",
]
cpu = [
  "faster-whisper>=1.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_engines"]
