# Worker GPU com Redis e MinIO efêmeros, para desenvolvimento e teste de integração no host GPU.
# Não é o compose de produção (spec holetz/eclume#14). Portas só em 127.0.0.1 do host: o Docker
# publica por fora do ufw.
#
#   docker --context gpu-host compose -p eclume-gpu-test -f deploy/docker-compose.gpu-test.yml up -d --build --wait
#   docker --context gpu-host compose -p eclume-gpu-test -f deploy/docker-compose.gpu-test.yml down -v
#
# Modelos em /srv/eclume/models (persistente, compartilhado com a produção) e o token do Hugging
# Face em /srv/eclume/secrets/hf_token (montado em /run/secrets). Sem token, o worker transcreve
# sem diarização.
name: eclume-gpu-test

x-s3: &s3
  ECLUME_S3_BUCKET: eclume
  ECLUME_S3_ENDPOINT_URL: http://minio:9000
  ECLUME_S3_ACCESS_KEY: ${ECLUME_MINIO_USER:-eclume}
  ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_PASSWORD:-eclume-dev-secret}

services:
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:${ECLUME_GPU_TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # A MinIO parou de publicar imagens (Docker Hub e quay); pgsty/minio é o build comunitário do mesmo servidor.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER:-eclume}
      # Multipart incompleto dura mais que os 7 dias de upload_ttl_days (duração Go: sem `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD:-eclume-dev-secret}
    ports:
      - "127.0.0.1:${ECLUME_GPU_TEST_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # O mc vem na mesma imagem do servidor.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER:-eclume}
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD:-eclume-dev-secret}
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/eclume

  worker-gpu:
    image: eclume-worker-gpu:dev
    build:
      context: ..
      dockerfile: worker-gpu/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3
      ECLUME_REDIS_URL: redis://redis:6379/0
      ECLUME_MODEL_IDLE_SECONDS: ${ECLUME_MODEL_IDLE_SECONDS:-120}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${ECLUME_MODELS_DIR:-/srv/eclume/models}:/models
      - ${ECLUME_SECRETS_DIR:-/srv/eclume/secrets}:/run/secrets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
