# GPU worker with ephemeral Redis and MinIO, for development and integration testing on the GPU host.
# Not the production compose (spec holetz/eclume#14). Ports only on the host's 127.0.0.1: Docker
# publishes around ufw.
#
#   docker --context gpu-host compose -p eclume-gpu-test -f deploy/docker-compose.gpu-test.yml up -d --build --wait
#   docker --context gpu-host compose -p eclume-gpu-test -f deploy/docker-compose.gpu-test.yml down -v
#
# Models in /srv/eclume/models (persistent, shared with production) and the Hugging Face token in
# /srv/eclume/secrets/hf_token (mounted at /run/secrets). Without a token, the worker transcribes
# without diarization.
name: eclume-gpu-test

x-s3: &s3
  ECLUME_S3_BUCKET: eclume
  ECLUME_S3_ENDPOINT_URL: http://minio:9000
  ECLUME_S3_ACCESS_KEY: ${ECLUME_MINIO_USER:-eclume}
  ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_PASSWORD:-eclume-dev-secret}

services:
  redis:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    ports:
      - "127.0.0.1:${ECLUME_GPU_TEST_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO stopped publishing images (Docker Hub and quay); pgsty/minio is the community build of the same server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER:-eclume}
      # An incomplete multipart lives longer than the 7 days of upload_ttl_days (Go duration: no `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD:-eclume-dev-secret}
    ports:
      - "127.0.0.1:${ECLUME_GPU_TEST_MINIO_PORT:-19000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    # mc ships in the same image as the server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER:-eclume}
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD:-eclume-dev-secret}
    entrypoint:
      - sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/eclume

  worker-gpu:
    image: eclume-worker-gpu:dev
    build:
      context: ..
      dockerfile: worker-gpu/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3
      ECLUME_REDIS_URL: redis://redis:6379/0
      ECLUME_MODEL_IDLE_SECONDS: ${ECLUME_MODEL_IDLE_SECONDS:-120}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${ECLUME_MODELS_DIR:-/srv/eclume/models}:/models
      - ${ECLUME_SECRETS_DIR:-/srv/eclume/secrets}:/run/secrets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
