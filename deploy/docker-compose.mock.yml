# Mock server of the v1 contract (Prism), so lumea, desktop and the frontend develop without the
# real backend. It serves the bundle generated by contracts/tools/bundle.py and answers with the
# examples in contracts/fixtures/. The port is published only on 127.0.0.1 by default: Docker
# publishes around ufw. For a container on the bridge to reach the mock, use ECLUME_MOCK_BIND=172.17.0.1.
name: eclume-mock

services:
  mock:
    image: stoplight/prism:5.15.10@sha256:586d1f0f94f8d0eaf20b26b8b41f985f2a2d494bea297bd3988c3de3eb87094e
    # --multiprocess=false: Prism 5.15 cluster mode breaks on the image's Node (isPrimary).
    command: mock --host 0.0.0.0 --port 4010 --multiprocess=false /contracts/openapi-v1.bundled.yaml
    volumes:
      - ../contracts:/contracts:ro
    ports:
      - "${ECLUME_MOCK_BIND:-127.0.0.1}:${ECLUME_MOCK_PORT:-4010}:4010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4010/api/v1/health"]
      interval: 3s
      timeout: 3s
      retries: 20
