# Stack de produção do eclume no host GPU (192.168.15.199), projeto `eclume`.
#
#   bash deploy/deploy.sh --plan --context gpu-host
#   bash deploy/deploy.sh --context gpu-host
#
# O daemon é o do host (contexto Docker): todo bind mount resolve NO HOST, nunca na estação. Por
# isso o Caddyfile é um config `content:` (o compose o copia para o container), nunca `file:`.
#
# Só o Caddy publica porta na LAN (8443). Postgres, Redis, MinIO, server e web não têm `ports:`: o
# Docker publica por fora do ufw. Depuração por `compose exec`. Os one-shots (`minio-init`,
# `migrate`, `publish-ca`) ficam no perfil `tools` e rodam por `compose run --rm`, fora do
# `up --wait`, que trata a saída 0 de um one-shot como falha. Runbook: docs/project/deploy-producao.md.
name: eclume

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

# Credencial por serviço (docs/standards/code/server-nucleo.md §Credenciais de Redis e MinIO): o
# root do MinIO fica só no MinIO, no `minio-init` e nos scripts de backup do host; o Redis recusa
# conexão sem usuário. Server e workers CPU usam `eclume-server`; o worker GPU, `eclume-gpu`.
x-s3-server: &s3-server
  ECLUME_S3_ENDPOINT: http://minio:9000
  ECLUME_S3_ACCESS_KEY: eclume-server
  ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_SERVER_PASSWORD:?defina em deploy/.env.prod}
  ECLUME_S3_BUCKET: eclume

# Server e worker CPU conectam como `eclume_server`: sem superusuário, sem DDL, só DML; as
# requisições baixam para `eclume_app` (RLS). Só o one-shot `migrate` usa o superusuário, dono do
# schema (docs/standards/code/server-nucleo.md §Papéis do banco).
x-server-env: &server-env
  <<: *s3-server
  ECLUME_DATABASE_URL: postgresql+asyncpg://eclume_server:${ECLUME_RUNTIME_PG_PASSWORD:?defina em deploy/.env.prod}@postgres:5432/eclume
  ECLUME_REDIS_URL: redis://eclume-server:${ECLUME_REDIS_SERVER_PASSWORD:?defina em deploy/.env.prod}@redis:6379/0
  ECLUME_SECRET_KEY: ${ECLUME_SECRET_KEY:?defina em deploy/.env.prod}
  ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?defina em deploy/.env.prod}
  ECLUME_PUBLIC_URL: ${ECLUME_PUBLIC_URL:?defina em deploy/.env.prod}
  ECLUME_COOKIE_SECURE: "true"
  # Cadastro aberto na LAN; `false` fecha o POST /auth/signup sem deploy de código.
  ECLUME_SIGNUP_OPEN: ${ECLUME_SIGNUP_OPEN:-true}
  # Job de transcrição morto: graça antes de confirmar e teto de progresso parado (segundos).
  ECLUME_JOB_GRACE_SECONDS: ${ECLUME_JOB_GRACE_SECONDS:-120}
  ECLUME_JOB_STALL_SECONDS: ${ECLUME_JOB_STALL_SECONDS:-1800}
  # Descritor /api/v1/server e anúncio mDNS: o nome da instância e a CA raiz que os apps fixam.
  ECLUME_SERVER_NAME: ${ECLUME_SERVER_NAME:-eclume}
  ECLUME_CA_FILE: /srv/downloads/eclume-root.crt

# `:prod` é o ponteiro de execução; `:<sha>` (ECLUME_COMMIT, que o deploy define a partir do SHA
# construído) fica retido para o `--voltar`. Fora do deploy, a tag é `:sem-commit`.
x-server-image: &server-image
  image: eclume-server:prod
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
    args: {ECLUME_COMMIT: "${ECLUME_COMMIT:-}"}
    tags: ["eclume-server:${ECLUME_COMMIT:-sem-commit}"]
    labels: {org.eclume.image: "server", org.opencontainers.image.revision: "${ECLUME_COMMIT:-}"}

services:
  caddy:
    <<: *restart
    image: caddy:2.11@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    depends_on:
      server: {condition: service_healthy}
      web: {condition: service_started}
    ports:
      - "8443:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data  # CA interna: perder isto troca a CA de todos os clientes
      - caddy-config:/config
      - ${ECLUME_DATA_DIR:?defina em deploy/.env.prod}/downloads:/srv/downloads:ro

  web:
    <<: *restart
    image: eclume-web:prod
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      tags: ["eclume-web:${ECLUME_COMMIT:-sem-commit}"]
      labels: {org.eclume.image: "web", org.opencontainers.image.revision: "${ECLUME_COMMIT:-}"}

  server:
    <<: [*restart, *server-image]
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      # A CA raiz publicada pelo `publish-ca`: a impressão digital do descritor (cache pelo mtime).
      - ${ECLUME_DATA_DIR}/downloads:/srv/downloads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Fila eclume:default: ingestão das transcrições, resumos (claude -p) e expiração de uploads.
  # Fila eclume:default: ingestão, falhas do worker GPU, purgas e crons (reaper e retomada).
  worker-cpu:
    <<: [*restart, *server-image]
    command: ["arq", "eclume_server.worker.WorkerSettings"]
    environment:
      <<: *server-env
      # Transição (holetz/eclume#96): os jobs por agente que ainda estavam em eclume:default rodam
      # aqui com o claude -p. Sai junto com as funções de agente do WorkerSettings.
      CLAUDE_CODE_OAUTH_TOKEN: ${ECLUME_CLAUDE_OAUTH_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  # Fila eclume:agents: tipo de agenda, campos, resumos, chats e pré-visualizações, com
  # ECLUME_AGENT_MAX_JOBS vagas; a ingestão não espera atrás deles.
  worker-agents:
    <<: [*restart, *server-image]
    command: ["arq", "eclume_server.worker.AgentWorkerSettings"]
    environment:
      <<: *server-env
      ECLUME_AGENT_MAX_JOBS: ${ECLUME_AGENT_MAX_JOBS:-4}
      # Token de longa duração do `claude setup-token` (provider claude-cli). Não se renova, então
      # nada disputa a sessão OAuth do host. Vazio = claude-cli falha com provider_not_configured.
      CLAUDE_CODE_OAUTH_TOKEN: ${ECLUME_CLAUDE_OAUTH_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  # Fila eclume:gpu (imagem da holetz/eclume#8, ~8 GB). max_jobs=1 vem do WorkerSettings.
  worker-gpu:
    <<: *restart
    image: eclume-worker-gpu:prod
    # Só a tag: label ou ENV com o SHA mudariam o ID da imagem a cada deploy e recriariam o
    # container (com dreno) mesmo sem mudança no worker.
    build:
      context: ..
      dockerfile: worker-gpu/Dockerfile
      tags: ["eclume-worker-gpu:${ECLUME_COMMIT:-sem-commit}"]
      labels: {org.eclume.image: "worker-gpu"}
    # O SIGTERM drena (o arq termina o job em curso, `job_completion_wait`); o deploy espera a GPU
    # ficar livre até --espera-gpu (30 min) antes de parar, e este prazo o cobre.
    stop_grace_period: 40m
    environment:
      ECLUME_REDIS_URL: redis://eclume-gpu:${ECLUME_REDIS_GPU_PASSWORD:?defina em deploy/.env.prod}@redis:6379/0
      ECLUME_S3_ENDPOINT_URL: http://minio:9000
      ECLUME_S3_ACCESS_KEY: eclume-gpu
      ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_GPU_PASSWORD:?defina em deploy/.env.prod}
      ECLUME_S3_BUCKET: eclume
      # A mesma do server: abre o token do HF que Administração → Segredos manda cifrado no job.
      ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?defina em deploy/.env.prod}
      # ASR residente entre jobs enquanto sobrar essa VRAM livre (o Jellyfin divide a GPU);
      # 0 volta a um modelo por vez. A descarga por ociosidade devolve tudo depois de 300 s.
      ECLUME_KEEP_ASR_RESIDENT: ${ECLUME_KEEP_ASR_RESIDENT:-1}
      ECLUME_RESIDENT_MIN_FREE_MB: ${ECLUME_RESIDENT_MIN_FREE_MB:-2500}
      ECLUME_MODEL_IDLE_SECONDS: ${ECLUME_MODEL_IDLE_SECONDS:-300}
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      - ${ECLUME_DATA_DIR}/models:/models
      # Só o token: a pasta secrets também guarda o env de produção e a senha do admin.
      - ${ECLUME_DATA_DIR}/secrets/hf_token:/run/secrets/hf_token:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Anúncio mDNS `_eclume._tcp` (endereço de ECLUME_PUBLIC_URL, TXT com a impressão digital da CA).
  # Rede do host: o multicast não sai da bridge. Sem porta publicada; o 5353/udp passa pelo ufw
  # (docs/project/host-setup.md). O deploy o recria depois do `publish-ca`.
  mdns:
    <<: [*restart, *server-image]
    command: ["eclume-server", "announce"]
    network_mode: host
    environment:
      ECLUME_PUBLIC_URL: ${ECLUME_PUBLIC_URL:?defina em deploy/.env.prod}
      ECLUME_SERVER_NAME: ${ECLUME_SERVER_NAME:-eclume}
      ECLUME_CA_FILE: /srv/downloads/eclume-root.crt
    volumes:
      - ${ECLUME_DATA_DIR}/downloads:/srv/downloads:ro

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      # Superusuário: dono do schema, usado só pelo one-shot `migrate` (e pelo backup). A aplicação
      # conecta como eclume_server (docs/standards/code/server-nucleo.md §Papéis do banco).
      POSTGRES_USER: eclume
      POSTGRES_PASSWORD: ${ECLUME_PG_PASSWORD}
      POSTGRES_DB: eclume
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclume -d eclume"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    configs:
      - source: redis-conf
        target: /usr/local/etc/redis/redis.conf
    environment:
      # Só para o healthcheck e o `deploy.sh` (que lê o `busy` do worker GPU por `docker exec`).
      ECLUME_REDIS_SERVER_PASSWORD: ${ECLUME_REDIS_SERVER_PASSWORD:?defina em deploy/.env.prod}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user eclume-server --pass \"$$ECLUME_REDIS_SERVER_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *restart
    # A MinIO parou de publicar imagens (Docker Hub e quay); pgsty/minio é o build comunitário do
    # mesmo servidor, fixado.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER}
      # Multipart incompleto dura mais que os 7 dias de upload_ttl_days (duração Go: sem `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- one-shots (perfil tools; `compose run --rm <serviço>`) ---

  minio-init:
    profiles: [tools]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD}
      MINIO_SERVER_PASSWORD: ${ECLUME_MINIO_SERVER_PASSWORD:?defina em deploy/.env.prod}
      MINIO_GPU_PASSWORD: ${ECLUME_MINIO_GPU_PASSWORD:?defina em deploy/.env.prod}
    configs:
      - source: minio-init-sh
        target: /minio-init.sh
      - source: minio-policy-app
        target: /policies/eclume-app.json
      - source: minio-policy-gpu
        target: /policies/eclume-fila-gpu.json
    entrypoint: ["sh", "/minio-init.sh"]

  # O migrador: o superusuário aplica as migrations e liga o LOGIN de eclume_server com a senha dele.
  migrate:
    <<: *server-image
    profiles: [tools]
    command: ["eclume-server", "migrate"]
    environment:
      <<: *server-env
      ECLUME_DATABASE_URL: postgresql+asyncpg://eclume:${ECLUME_PG_PASSWORD:?defina em deploy/.env.prod}@postgres:5432/eclume
      ECLUME_RUNTIME_DB_PASSWORD: ${ECLUME_RUNTIME_PG_PASSWORD:?defina em deploy/.env.prod}
    depends_on:
      postgres: {condition: service_healthy}

  # Copia a CA raiz do Caddy para /downloads/eclume-root.crt (clientes e LUMEA_ECLUME_CA_BUNDLE).
  publish-ca:
    profiles: [tools]
    image: caddy:2.11@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    volumes:
      - caddy-data:/data:ro
      - ${ECLUME_DATA_DIR}/downloads:/downloads
    entrypoint:
      - sh
      - -c
      - install -m 644 -o 1000 -g 1000 /data/caddy/pki/authorities/local/root.crt /downloads/eclume-root.crt && echo publicada /downloads/eclume-root.crt

configs:
  # ACL do Redis: `default` desligado; `eclume-server` com tudo menos os comandos perigosos (o INFO
  # volta: o arq o lê ao subir); `eclume-gpu` só nas chaves da fila, da saúde e do progresso dele, e
  # só lê o pedido de cancelamento.
  redis-conf:
    content: |
      appendonly yes
      user default off
      user eclume-server on >${ECLUME_REDIS_SERVER_PASSWORD} ~* &* +@all -@dangerous +info
      user eclume-gpu on >${ECLUME_REDIS_GPU_PASSWORD} resetchannels ~arq:* ~eclume:gpu* ~eclume:default ~eclume:progress:* %R~eclume:cancel:* +@all -@dangerous -@admin -@pubsub +info
  # Bucket, usuários e políticas a cada deploy (idempotente): `user add` em usuário existente só
  # troca a senha pela do env; a política é recriada por cima, sem apagar o usuário. A imagem do
  # MinIO não tem grep nem sed: só sh e mc.
  minio-init-sh:
    content: |
      set -eu
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
      mc mb --ignore-existing local/eclume
      for pair in "eclume-server:eclume-app:$$MINIO_SERVER_PASSWORD" "eclume-gpu:eclume-fila-gpu:$$MINIO_GPU_PASSWORD"; do
        user="$${pair%%:*}"; rest="$${pair#*:}"; policy="$${rest%%:*}"; password="$${rest#*:}"
        mc admin policy create local "$$policy" "/policies/$$policy.json" >/dev/null
        mc admin user add local "$$user" "$$password" >/dev/null
        case "$$(mc admin user info local "$$user")" in
          *"$$policy"*) ;;
          *) mc admin policy attach local "$$policy" --user "$$user" >/dev/null ;;
        esac
        echo "minio-init: $$user com $$policy"
      done
  minio-policy-app:
    content: |
      {"Version": "2012-10-17", "Statement": [
        {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::eclume", "arn:aws:s3:::eclume/*"]}
      ]}
  # O worker GPU lê o áudio original e escreve os artefatos; não lista nem apaga.
  minio-policy-gpu:
    content: |
      {"Version": "2012-10-17", "Statement": [
        {"Effect": "Allow", "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::eclume/users/*/recordings/*/audio"]},
        {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": ["arn:aws:s3:::eclume/recordings/*"]}
      ]}
  # `tls internal`: certificado da CA local do Caddy. `default_sni`: quem acessa por IP não envia
  # SNI. /api e /media vão ao server sem cortar o prefixo, e /mcp (o servidor MCP, rota exata) também;
  # /downloads/ serve a pasta dos instaladores do desktop (deploy/publicar-desktop.sh); o resto é o
  # SPA. Nenhuma rota do SPA pode começar com /api, /media, /mcp ou /downloads (a tela é
  # /config/mcp).
  caddyfile:
    content: |
      {
        default_sni ${ECLUME_PUBLIC_HOST:?defina em deploy/.env.prod}
        auto_https disable_redirects
        skip_install_trust
      }
      https://${ECLUME_PUBLIC_HOST}:8443 {
        tls internal
        handle /api/* {
          reverse_proxy server:8000
        }
        handle /media/* {
          reverse_proxy server:8000
        }
        handle /mcp {
          reverse_proxy server:8000
        }
        redir /downloads /downloads/ 308
        handle_path /downloads/* {
          root * /srv/downloads
          @manifestos path *.json *.md *.crt
          header @manifestos Cache-Control "no-cache"
          @ca path *.crt
          header @ca Content-Type application/x-x509-ca-cert
          file_server {
            hide .*
          }
        }
        handle {
          reverse_proxy web:80
        }
      }

# Dados no disco do host, sob ${ECLUME_DATA_DIR} (/srv/eclume). As pastas precisam existir antes do
# primeiro deploy (o deploy.sh as cria). Nomes próprios, fora do padrão eclume_*, para nunca
# colidir com volumes de dev ou de teste.
x-host-dir: &host-dir
  driver: local

volumes:
  pg:
    name: eclume-prod-pg
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/pg"}
  redis:
    name: eclume-prod-redis
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/redis"}
  minio:
    name: eclume-prod-minio
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/minio"}
  caddy-data:
    name: eclume-prod-caddy-data
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/caddy/data"}
  caddy-config:
    name: eclume-prod-caddy-config
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/caddy/config"}
