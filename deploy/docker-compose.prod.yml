# eclume's production stack on the GPU host (192.168.15.199), project `eclume`.
#
#   bash deploy/deploy.sh --plan --context gpu-host
#   bash deploy/deploy.sh --context gpu-host
#
# The daemon is the host's (Docker context): every bind mount resolves ON THE HOST, never on the
# workstation. That is why the Caddyfile is a `content:` config (compose copies it into the container), never `file:`.
#
# Only Caddy publishes a port on the LAN (8443). Postgres, Redis, MinIO and server have no `ports:`:
# Docker publishes around ufw. Debugging through `compose exec`. The one-shots (`minio-init`,
# `migrate`, `publish-ca`) live in the `tools` profile and run through `compose run --rm`, outside
# `up --wait`, which treats a one-shot's exit 0 as a failure. Runbook: docs/project/deploy-producao.md.
name: eclume

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

# Per-service credential (docs/standards/code/server-nucleo.md §Credenciais de Redis e MinIO): the
# MinIO root stays only in MinIO, `minio-init` and the host backup scripts; Redis refuses a
# connection without a user. Server and CPU worker use `eclume-server`; the GPU worker, `eclume-gpu`.
# Python containers (uid 1000): no capabilities and no privilege gain through setuid. Caddy stays
# out because it listens on a low port.
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-s3-server: &s3-server
  ECLUME_S3_ENDPOINT: http://minio:9000
  ECLUME_S3_ACCESS_KEY: eclume-server
  ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_SERVER_PASSWORD:?set in deploy/.env.prod}
  ECLUME_S3_BUCKET: eclume

# Server and CPU worker connect as `eclume_server`: no superuser, no DDL, only DML; requests drop
# to `eclume_app` (RLS). Only the `migrate` one-shot uses the superuser, the schema owner
# (docs/standards/code/server-nucleo.md §Papéis do banco).
x-server-env: &server-env
  <<: *s3-server
  ECLUME_DATABASE_URL: postgresql+asyncpg://eclume_server:${ECLUME_RUNTIME_PG_PASSWORD:?set in deploy/.env.prod}@postgres:5432/eclume
  ECLUME_REDIS_URL: redis://eclume-server:${ECLUME_REDIS_SERVER_PASSWORD:?set in deploy/.env.prod}@redis:6379/0
  ECLUME_SECRET_KEY: ${ECLUME_SECRET_KEY:?set in deploy/.env.prod}
  ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?set in deploy/.env.prod}
  ECLUME_PUBLIC_URL: ${ECLUME_PUBLIC_URL:?set in deploy/.env.prod}
  ECLUME_COOKIE_SECURE: "true"
  # Signup open on the LAN; `false` closes POST /auth/signup without a code deploy.
  ECLUME_SIGNUP_OPEN: ${ECLUME_SIGNUP_OPEN:-true}
  # Signups created per IP in 24 h; the next one gets 429.
  ECLUME_SIGNUPS_PER_IP_PER_DAY: ${ECLUME_SIGNUPS_PER_IP_PER_DAY:-5}
  # Dead transcription job: grace before confirming and ceiling of stalled progress (seconds).
  ECLUME_JOB_GRACE_SECONDS: ${ECLUME_JOB_GRACE_SECONDS:-120}
  ECLUME_JOB_STALL_SECONDS: ${ECLUME_JOB_STALL_SECONDS:-1800}
  # /api/v1/server descriptor and mDNS announcement: the instance name and the root CA the apps pin.
  ECLUME_SERVER_NAME: ${ECLUME_SERVER_NAME:-eclume}
  ECLUME_CA_FILE: /srv/downloads/eclume-root.crt
  # Next root during the rotation (`ca_next_sha256`); `publish-ca` deletes it at the switch.
  ECLUME_CA_NEXT_FILE: /srv/downloads/eclume-root-proxima.crt

# `:prod` is the running pointer; `:<sha>` (ECLUME_COMMIT, which the deploy sets from the built
# SHA) is kept for `--rollback`. Outside the deploy, the tag is `:no-commit`.
x-server-image: &server-image
  image: eclume-server:prod
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
    args: {ECLUME_COMMIT: "${ECLUME_COMMIT:-}", ECLUME_CLAUDE_CLI: "${ECLUME_CLAUDE_CLI:-0}"}
    tags: ["eclume-server:${ECLUME_COMMIT:-no-commit}"]
    labels: {org.eclume.image: "server", org.opencontainers.image.revision: "${ECLUME_COMMIT:-}"}

services:
  # The edge: Caddy with the embedded SPA (`eclume-edge`, deploy/web.Dockerfile). TLS, /api, /media,
  # /mcp and /downloads come from the Caddyfile below; the rest, from the image's SPA rules.
  caddy:
    <<: *restart
    networks: [borda]
    cpu_shares: 2048
    mem_limit: ${ECLUME_MEM_CADDY:-256m}
    memswap_limit: ${ECLUME_MEMSWAP_CADDY:-384m}
    image: eclume-edge:prod
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      tags: ["eclume-edge:${ECLUME_COMMIT:-no-commit}"]
      labels: {org.eclume.image: "edge", org.opencontainers.image.revision: "${ECLUME_COMMIT:-}"}
    depends_on:
      server: {condition: service_healthy}
    ports:
      - "8443:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data  # CA interna: perder isto troca a CA de todos os clientes
      - caddy-config:/config
      - ${ECLUME_DATA_DIR:?set in deploy/.env.prod}/downloads:/srv/downloads:ro
      # Only the own root (`eclume-server ca gerar`): the secrets folder also holds the production
      # env and the admin password.
      - ${ECLUME_DATA_DIR}/secrets/ca:/etc/caddy/ca:ro

  server:
    <<: [*restart, *server-image, *hardened]
    networks: [borda, dados]
    cpu_shares: 2048
    mem_limit: ${ECLUME_MEM_SERVER:-768m}
    memswap_limit: ${ECLUME_MEMSWAP_SERVER:-1152m}
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      # The root CA published by `publish-ca`: the descriptor fingerprint (cached by mtime).
      - ${ECLUME_DATA_DIR}/downloads:/srv/downloads:ro
    # Readiness: Postgres, Redis or MinIO down leaves the server unhealthy (and watchdog.sh warns).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # The single CPU worker (`eclume-server worker`): the eclume:default queue (ingestion, GPU worker
  # failures, purges and crons) and eclume:agents (meeting type, fields, summaries, chats and
  # previews, with ECLUME_AGENT_MAX_JOBS slots) in the same process; ingestion does not wait
  # behind the agents.
  worker:
    <<: [*restart, *server-image, *hardened]
    networks: [dados, saida]
    cpu_shares: 1024
    # ECLUME_MEM_WORKER_AGENTS is the name from before the single worker (holetz/eclume#151), accepted
    # while the host's env.prod does not rename it.
    mem_limit: ${ECLUME_MEM_WORKER:-${ECLUME_MEM_WORKER_AGENTS:-2g}}
    memswap_limit: ${ECLUME_MEMSWAP_WORKER:-3g}
    command: ["eclume-server", "worker"]
    environment:
      <<: *server-env
      ECLUME_AGENT_MAX_JOBS: ${ECLUME_AGENT_MAX_JOBS:-2}
      # Long-lived token from `claude setup-token` (claude-cli provider). It does not renew, so
      # nothing competes for the host's OAuth session. Empty = claude-cli fails with provider_not_configured.
      CLAUDE_CODE_OAUTH_TOKEN: ${ECLUME_CLAUDE_OAUTH_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      # The eclume:{queue}:health-check key that arq renews every 15 s (TTL 16 s), for both queues,
      # through the light probe (only the stdlib and the Redis client).
      test: ["CMD", "python", "-m", "eclume_server.sonda", "fila", "default", "agents"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s

  # Queue eclume:gpu (image from holetz/eclume#8, ~8 GB). max_jobs=1 comes from WorkerSettings. It
  # exits on its own (code 0) after the idle unload (holetz/eclume#149) and `restart` brings it back.
  worker-gpu:
    <<: [*restart, *hardened]
    networks: [fila-gpu, saida]
    cpu_shares: 512
    mem_limit: ${ECLUME_MEM_WORKER_GPU:-8g}
    memswap_limit: ${ECLUME_MEMSWAP_WORKER_GPU:-12g}
    image: eclume-worker-gpu:prod
    # Only the tag: a label or ENV with the SHA would change the image ID on every deploy and
    # recreate the container (with a drain) even with no change in the worker.
    build:
      context: ..
      dockerfile: worker-gpu/Dockerfile
      tags: ["eclume-worker-gpu:${ECLUME_COMMIT:-no-commit}"]
      labels: {org.eclume.image: "worker-gpu"}
    # SIGTERM drains (arq finishes the running job, `job_completion_wait`); the deploy waits for the
    # GPU to be free up to --gpu-wait (30 min) before stopping, and this deadline covers it.
    stop_grace_period: 40m
    environment:
      ECLUME_REDIS_URL: redis://eclume-gpu:${ECLUME_REDIS_GPU_PASSWORD:?set in deploy/.env.prod}@redis:6379/0
      ECLUME_S3_ENDPOINT_URL: http://minio:9000
      ECLUME_S3_ACCESS_KEY: eclume-gpu
      ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_GPU_PASSWORD:?set in deploy/.env.prod}
      ECLUME_S3_BUCKET: eclume
      # The same as the server's: opens the HF token that Administration → Secrets sends encrypted in the job.
      ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?set in deploy/.env.prod}
      # ASR stays resident between jobs while this much VRAM is free (Jellyfin shares the GPU);
      # 0 goes back to one model at a time. The idle unload returns everything after 300 s.
      ECLUME_KEEP_ASR_RESIDENT: ${ECLUME_KEEP_ASR_RESIDENT:-1}
      ECLUME_RESIDENT_MIN_FREE_MB: ${ECLUME_RESIDENT_MIN_FREE_MB:-2500}
      ECLUME_MODEL_IDLE_SECONDS: ${ECLUME_MODEL_IDLE_SECONDS:-300}
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      - ${ECLUME_DATA_DIR}/models:/models
      # Only the token: the secrets folder also holds the production env and the admin password.
      - ${ECLUME_DATA_DIR}/secrets/hf_token:/run/secrets/hf_token:ro
    # The eclume:gpu:health heartbeat (every 15 s, TTL 45 s); it starts before the model loads.
    healthcheck:
      test: ["CMD", "python", "-m", "eclume_worker.health", "--sonda"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 2s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # mDNS announcement `_eclume._tcp` (address of ECLUME_PUBLIC_URL, TXT with the CA fingerprint).
  # Host network: multicast does not leave the bridge. No published port; 5353/udp goes through ufw
  # (docs/project/host-setup.md). The deploy recreates it after `publish-ca`.
  mdns:
    <<: [*restart, *server-image, *hardened]
    cpu_shares: 512
    command: ["eclume-server", "announce"]
    network_mode: host
    environment:
      ECLUME_PUBLIC_URL: ${ECLUME_PUBLIC_URL:?set in deploy/.env.prod}
      ECLUME_SERVER_NAME: ${ECLUME_SERVER_NAME:-eclume}
      ECLUME_CA_FILE: /srv/downloads/eclume-root.crt
      ECLUME_CA_NEXT_FILE: /srv/downloads/eclume-root-proxima.crt
    volumes:
      - ${ECLUME_DATA_DIR}/downloads:/srv/downloads:ro

  postgres:
    <<: *restart
    networks: [dados]
    cpu_shares: 2048
    # The host OOM killer picks another one before the database; the default shm (64 MB) is not enough for parallelism.
    oom_score_adj: -800
    shm_size: 256m
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      # Superuser: the schema owner, used only by the `migrate` one-shot (and by the backup). The
      # application connects as eclume_server (docs/standards/code/server-nucleo.md §Papéis do banco).
      POSTGRES_USER: eclume
      POSTGRES_PASSWORD: ${ECLUME_PG_PASSWORD}
      POSTGRES_DB: eclume
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclume -d eclume"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  redis:
    <<: *restart
    networks: [dados, fila-gpu]
    cpu_shares: 1024
    mem_limit: ${ECLUME_MEM_REDIS:-256m}
    memswap_limit: ${ECLUME_MEMSWAP_REDIS:-384m}
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    # Valkey (BSD-3-Clause) speaks the Redis protocol; the service keeps the `redis` name and URLs.
    # The command must be `valkey-server` (not its Redis-named symlink): only then the entrypoint drops root.
    command: ["valkey-server", "/usr/local/etc/redis/redis.conf"]
    configs:
      - source: redis-conf
        target: /usr/local/etc/redis/redis.conf
    environment:
      # Only for the healthcheck and `deploy.sh` (which reads the GPU worker's `busy` through `docker exec`).
      ECLUME_REDIS_SERVER_PASSWORD: ${ECLUME_REDIS_SERVER_PASSWORD:?set in deploy/.env.prod}
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning --user eclume-server --pass \"$$ECLUME_REDIS_SERVER_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  minio:
    <<: *restart
    networks: [dados, fila-gpu]
    cpu_shares: 1024
    mem_limit: ${ECLUME_MEM_MINIO:-512m}
    memswap_limit: ${ECLUME_MEMSWAP_MINIO:-768m}
    # MinIO stopped publishing images (Docker Hub and quay); pgsty/minio is the community build of
    # the same server, pinned.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER}
      # An incomplete multipart lives longer than the 7 days of upload_ttl_days (Go duration: no `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # --- one-shots (tools profile; `compose run --rm <service>`) ---

  minio-init:
    networks: [dados]
    profiles: [tools]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD}
      MINIO_SERVER_PASSWORD: ${ECLUME_MINIO_SERVER_PASSWORD:?set in deploy/.env.prod}
      MINIO_GPU_PASSWORD: ${ECLUME_MINIO_GPU_PASSWORD:?set in deploy/.env.prod}
    configs:
      - source: minio-init-sh
        target: /minio-init.sh
      - source: minio-policy-app
        target: /policies/eclume-app.json
      - source: minio-policy-gpu
        target: /policies/eclume-fila-gpu.json
    entrypoint: ["sh", "/minio-init.sh"]

  # The migrator: the superuser applies the migrations and enables eclume_server's LOGIN with its password.
  migrate:
    <<: [*server-image, *hardened]
    networks: [dados]
    profiles: [tools]
    command: ["eclume-server", "migrate"]
    environment:
      <<: *server-env
      ECLUME_DATABASE_URL: postgresql+asyncpg://eclume:${ECLUME_PG_PASSWORD:?set in deploy/.env.prod}@postgres:5432/eclume
      ECLUME_RUNTIME_DB_PASSWORD: ${ECLUME_RUNTIME_PG_PASSWORD:?set in deploy/.env.prod}
    depends_on:
      postgres: {condition: service_healthy}

  # Publishes the active CA's root (`ECLUME_TLS_CA`) at /downloads/eclume-root.crt, a single
  # certificate (clients and LUMEA_ECLUME_CA_BUNDLE). With `local` active and the own root generated,
  # the own one goes to /downloads/eclume-root-proxima.crt (announced rotation); with `eclume` active, the next one goes away.
  publish-ca:
    network_mode: none
    profiles: [tools]
    image: caddy:2.11@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    volumes:
      - caddy-data:/data:ro
      - ${ECLUME_DATA_DIR}/secrets/ca:/ca:ro
      - ${ECLUME_DATA_DIR}/downloads:/downloads
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        if [ "${ECLUME_TLS_CA:-local}" = eclume ]; then
          install -m 644 -o 1000 -g 1000 /ca/raiz.crt /downloads/eclume-root.crt
          rm -f /downloads/eclume-root-proxima.crt
        else
          install -m 644 -o 1000 -g 1000 /data/caddy/pki/authorities/local/root.crt /downloads/eclume-root.crt
          if [ -f /ca/raiz.crt ]; then
            install -m 644 -o 1000 -g 1000 /ca/raiz.crt /downloads/eclume-root-proxima.crt
            echo published /downloads/eclume-root-proxima.crt
          fi
        fi
        echo "published /downloads/eclume-root.crt (CA ${ECLUME_TLS_CA:-local})"

configs:
  # Redis ACL: `default` disabled; `eclume-server` with everything but the dangerous commands (INFO
  # comes back: arq reads it on start); `eclume-gpu` only on its queue, health and progress keys, and
  # it only reads the cancellation request. `maxmemory` below `mem_limit` with `noeviction`: at the
  # ceiling, Redis refuses the write (the job fails with an error) instead of evicting queue keys or
  # being killed by the cgroup OOM; the slack covers the fork of the AOF rewrite.
  redis-conf:
    content: |
      appendonly yes
      maxmemory ${ECLUME_REDIS_MAXMEMORY:-160mb}
      maxmemory-policy noeviction
      user default off
      user eclume-server on >${ECLUME_REDIS_SERVER_PASSWORD} ~* &* +@all -@dangerous +info
      user eclume-gpu on >${ECLUME_REDIS_GPU_PASSWORD} resetchannels ~arq:* ~eclume:gpu* ~eclume:default ~eclume:progress:* %R~eclume:cancel:* +@all -@dangerous -@admin -@pubsub +info
  # Bucket, users and policies on every deploy (idempotent): `user add` on an existing user only
  # swaps the password for the env one; the policy is recreated on top, without deleting the user.
  # The MinIO image has neither grep nor sed: only sh and mc.
  minio-init-sh:
    content: |
      set -eu
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
      mc mb --ignore-existing local/eclume
      for pair in "eclume-server:eclume-app:$$MINIO_SERVER_PASSWORD" "eclume-gpu:eclume-fila-gpu:$$MINIO_GPU_PASSWORD"; do
        user="$${pair%%:*}"; rest="$${pair#*:}"; policy="$${rest%%:*}"; password="$${rest#*:}"
        mc admin policy create local "$$policy" "/policies/$$policy.json" >/dev/null
        mc admin user add local "$$user" "$$password" >/dev/null
        case "$$(mc admin user info local "$$user")" in
          *"$$policy"*) ;;
          *) mc admin policy attach local "$$policy" --user "$$user" >/dev/null ;;
        esac
        echo "minio-init: $$user with $$policy"
      done
  minio-policy-app:
    content: |
      {"Version": "2012-10-17", "Statement": [
        {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["arn:aws:s3:::eclume", "arn:aws:s3:::eclume/*"]}
      ]}
  # The GPU worker reads the original audio and writes the artifacts; it neither lists nor deletes.
  minio-policy-gpu:
    content: |
      {"Version": "2012-10-17", "Statement": [
        {"Effect": "Allow", "Action": ["s3:GetObject"], "Resource": ["arn:aws:s3:::eclume/users/*/recordings/*/audio"]},
        {"Effect": "Allow", "Action": ["s3:PutObject"], "Resource": ["arn:aws:s3:::eclume/recordings/*"]}
      ]}
  # `pki`: the `eclume` CA loads the own name-constrained root (secrets/ca) and issues the
  # intermediate and leaves on its own; `local` is the root generated by Caddy. `ECLUME_TLS_CA` picks
  # the issuer (default `local`: production only switches when .env.prod says `eclume`; the rotation is
  # in docs/project/deploy-producao.md, "CA raiz nos clientes"). `default_sni`: whoever reaches it by IP
  # sends no SNI. /api and /media go to the server without stripping the prefix, and so does /mcp (the
  # MCP server, exact route); /downloads/ serves the desktop installers folder (deploy/publish-desktop.sh);
  # the rest is the SPA, served from the image itself. No SPA route may start with /api, /media, /mcp
  # or /downloads (the screen is /config/mcp).
  caddyfile:
    content: |
      {
        default_sni ${ECLUME_PUBLIC_HOST:?set in deploy/.env.prod}
        auto_https disable_redirects
        skip_install_trust
        pki {
          ca eclume {
            name "eclume"
            root {
              cert /etc/caddy/ca/raiz.crt
              key /etc/caddy/ca/raiz.key
            }
          }
        }
      }
      https://${ECLUME_PUBLIC_HOST}:8443 {
        tls {
          issuer internal {
            ca ${ECLUME_TLS_CA:-local}
          }
        }
        # Generic headers for what is not the SPA's (/api, /media, /mcp, /downloads); `?` does not
        # overwrite what the upstream or the SPA rules already set (the SPA's whole CSP).
        header {
          ?X-Content-Type-Options nosniff
          ?Referrer-Policy no-referrer
          ?Content-Security-Policy "frame-ancestors 'none'"
        }
        handle /api/* {
          # Coarse net: the server refuses earlier, with problem+json, above each route's ceiling.
          request_body {
            max_size 9MiB
          }
          reverse_proxy server:8000
        }
        handle /media/* {
          reverse_proxy server:8000
        }
        handle /mcp {
          request_body {
            max_size 9MiB
          }
          reverse_proxy server:8000
        }
        redir /downloads /downloads/ 308
        handle_path /downloads/* {
          root * /srv/downloads
          @manifestos path *.json *.md *.crt
          header @manifestos Cache-Control "no-cache"
          @ca path *.crt
          header @ca Content-Type application/x-x509-ca-cert
          file_server {
            hide .*
          }
        }
        # The SPA (deploy/web.Caddyfile in the image): the `handle` without a matcher, after the routes above.
        import /etc/caddy/spa.caddy
      }

# Memory limits by env: `mem_limit` in `ECLUME_MEM_<SERVICE>` and `memswap_limit` (memory plus
# swap) in `ECLUME_MEMSWAP_<SERVICE>`, defaulting to 1.5 × the ceiling; without it, the container would
# use as much again in swap and `docker stats` would underestimate the usage. Whoever raises a ceiling
# raises the pair (the deploy refuses `memswap_limit` below `mem_limit`). Defaults revised by measurement
# (docs/project/deploy-producao.md). The workers get no `oom_score_adj`: with their own ceiling, the OOM
# stays inside their cgroup. Postgres has no ceiling (protected by `oom_score_adj`) and neither does mdns (only the announcement).
#
# CPU weight (`cpu_shares`, only matters under contention): 2048 for whoever serves the request (caddy,
# server, postgres), 1024 for support (redis, minio, worker) and 512 for what can wait (worker-gpu, whose
# heavy work is on the GPU, and mdns). The host gate, staging and backup run with 256.
#
# Light, spaced healthchecks (`interval` of 30 to 60 s), with a short `start_interval` during the
# `start_period`, so the deploy's `up --wait` does not wait a whole interval (Docker Engine 25+).

# Networks by role (the names are kept: renaming them recreates every container): `borda`, the edge
# (Caddy and server); `dados`, internal data (Postgres, Redis, MinIO, server, CPU worker and the
# one-shots); `fila-gpu`, the internal GPU queue (Redis, MinIO and GPU worker); `saida`, egress (workers
# that talk to providers, Claude and Hugging Face). The GPU worker reaches neither Postgres nor the server.
networks:
  borda: {}
  dados: {internal: true}
  fila-gpu: {internal: true}
  saida: {}

# Data on the host disk, under ${ECLUME_DATA_DIR} (/srv/eclume). The folders must exist before the
# first deploy (deploy.sh creates them). Own names, outside the eclume_* pattern, so they never
# collide with dev or test volumes.
x-host-dir: &host-dir
  driver: local

volumes:
  pg:
    name: eclume-prod-pg
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/pg"}
  redis:
    name: eclume-prod-redis
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/redis"}
  minio:
    name: eclume-prod-minio
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/minio"}
  caddy-data:
    name: eclume-prod-caddy-data
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/caddy/data"}
  caddy-config:
    name: eclume-prod-caddy-config
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/caddy/config"}
