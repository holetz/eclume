# Stack de produção do eclume no host GPU (192.168.15.199), projeto `eclume`.
#
#   bash deploy/deploy.sh --plan --context gpu-host
#   bash deploy/deploy.sh --context gpu-host
#
# O daemon é o do host (contexto Docker): todo bind mount resolve NO HOST, nunca na estação. Por
# isso o Caddyfile é um config `content:` (o compose o copia para o container), nunca `file:`.
#
# Só o Caddy publica porta na LAN (8443). Postgres, Redis, MinIO, server e web não têm `ports:`: o
# Docker publica por fora do ufw. Depuração por `compose exec`. Os one-shots (`minio-init`,
# `migrate`, `publish-ca`) ficam no perfil `tools` e rodam por `compose run --rm`, fora do
# `up --wait`, que trata a saída 0 de um one-shot como falha. Runbook: docs/project/deploy-producao.md.
name: eclume

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-s3-server: &s3-server
  ECLUME_S3_ENDPOINT: http://minio:9000
  ECLUME_S3_ACCESS_KEY: ${ECLUME_MINIO_USER:?defina em deploy/.env.prod}
  ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_PASSWORD:?defina em deploy/.env.prod}
  ECLUME_S3_BUCKET: eclume

# Server e worker CPU conectam como `eclume_server`: sem superusuário, sem DDL, só DML; as
# requisições baixam para `eclume_app` (RLS). Só o one-shot `migrate` usa o superusuário, dono do
# schema (docs/standards/code/server-nucleo.md §Papéis do banco).
x-server-env: &server-env
  <<: *s3-server
  ECLUME_DATABASE_URL: postgresql+asyncpg://eclume_server:${ECLUME_RUNTIME_PG_PASSWORD:?defina em deploy/.env.prod}@postgres:5432/eclume
  ECLUME_REDIS_URL: redis://redis:6379/0
  ECLUME_SECRET_KEY: ${ECLUME_SECRET_KEY:?defina em deploy/.env.prod}
  ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?defina em deploy/.env.prod}
  ECLUME_PUBLIC_URL: ${ECLUME_PUBLIC_URL:?defina em deploy/.env.prod}
  ECLUME_COOKIE_SECURE: "true"

x-server-image: &server-image
  image: eclume-server:prod
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
    labels: {org.eclume.image: "server"}

services:
  caddy:
    <<: *restart
    image: caddy:2.11
    depends_on:
      server: {condition: service_healthy}
      web: {condition: service_started}
    ports:
      - "8443:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data  # CA interna: perder isto troca a CA de todos os clientes
      - caddy-config:/config
      - ${ECLUME_DATA_DIR:?defina em deploy/.env.prod}/downloads:/srv/downloads:ro

  web:
    <<: *restart
    image: eclume-web:prod
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      labels: {org.eclume.image: "web"}

  server:
    <<: [*restart, *server-image]
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Fila eclume:default: ingestão das transcrições, resumos (claude -p) e expiração de uploads.
  worker-cpu:
    <<: [*restart, *server-image]
    command: ["arq", "eclume_server.worker.WorkerSettings"]
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      # Login do Claude Code do host, GRAVÁVEL: o OAuth renova o token no próprio arquivo.
      # Sem login, aponte para /dev/null e o provider claude-cli falha com provider_not_configured.
      - ${ECLUME_CLAUDE_CREDENTIALS:-/dev/null}:/home/app/.claude/.credentials.json

  # Fila eclume:gpu (imagem da holetz/eclume#8, ~8 GB). max_jobs=1 vem do WorkerSettings.
  worker-gpu:
    <<: *restart
    image: eclume-worker-gpu:prod
    build:
      context: ..
      dockerfile: worker-gpu/Dockerfile
      labels: {org.eclume.image: "worker-gpu"}
    environment:
      ECLUME_REDIS_URL: redis://redis:6379/0
      ECLUME_S3_ENDPOINT_URL: http://minio:9000
      ECLUME_S3_ACCESS_KEY: ${ECLUME_MINIO_USER}
      ECLUME_S3_SECRET_KEY: ${ECLUME_MINIO_PASSWORD}
      ECLUME_S3_BUCKET: eclume
      # A mesma do server: abre o token do HF que Administração → Segredos manda cifrado no job.
      ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?defina em deploy/.env.prod}
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      - ${ECLUME_DATA_DIR}/models:/models
      # Só o token: a pasta secrets também guarda o env de produção e a senha do admin.
      - ${ECLUME_DATA_DIR}/secrets/hf_token:/run/secrets/hf_token:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      # Superusuário: dono do schema, usado só pelo one-shot `migrate` (e pelo backup). A aplicação
      # conecta como eclume_server (docs/standards/code/server-nucleo.md §Papéis do banco).
      POSTGRES_USER: eclume
      POSTGRES_PASSWORD: ${ECLUME_PG_PASSWORD}
      POSTGRES_DB: eclume
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclume -d eclume"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    <<: *restart
    # A MinIO parou de publicar imagens (Docker Hub e quay); pgsty/minio é o build comunitário do
    # mesmo servidor, fixado.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- one-shots (perfil tools; `compose run --rm <serviço>`) ---

  minio-init:
    profiles: [tools]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${ECLUME_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${ECLUME_MINIO_PASSWORD}
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && mc mb --ignore-existing local/eclume"]

  # O migrador: o superusuário aplica as migrations e liga o LOGIN de eclume_server com a senha dele.
  migrate:
    <<: *server-image
    profiles: [tools]
    command: ["eclume-server", "migrate"]
    environment:
      <<: *server-env
      ECLUME_DATABASE_URL: postgresql+asyncpg://eclume:${ECLUME_PG_PASSWORD:?defina em deploy/.env.prod}@postgres:5432/eclume
      ECLUME_RUNTIME_DB_PASSWORD: ${ECLUME_RUNTIME_PG_PASSWORD:?defina em deploy/.env.prod}
    depends_on:
      postgres: {condition: service_healthy}

  # Copia a CA raiz do Caddy para /downloads/eclume-root.crt (clientes e LUMEA_ECLUME_CA_BUNDLE).
  publish-ca:
    profiles: [tools]
    image: caddy:2.11
    volumes:
      - caddy-data:/data:ro
      - ${ECLUME_DATA_DIR}/downloads:/downloads
    entrypoint:
      - sh
      - -c
      - install -m 644 -o 1000 -g 1000 /data/caddy/pki/authorities/local/root.crt /downloads/eclume-root.crt && echo publicada /downloads/eclume-root.crt

configs:
  # `tls internal`: certificado da CA local do Caddy. `default_sni`: quem acessa por IP não envia
  # SNI. /api e /media vão ao server sem cortar o prefixo; /downloads/ serve a pasta dos
  # instaladores do desktop (deploy/publicar-desktop.sh); o resto é o SPA. Nenhuma rota do SPA pode
  # começar com /api, /media ou /downloads.
  caddyfile:
    content: |
      {
        default_sni ${ECLUME_PUBLIC_HOST:?defina em deploy/.env.prod}
        auto_https disable_redirects
        skip_install_trust
      }
      https://${ECLUME_PUBLIC_HOST}:8443 {
        tls internal
        handle /api/* {
          reverse_proxy server:8000
        }
        handle /media/* {
          reverse_proxy server:8000
        }
        redir /downloads /downloads/ 308
        handle_path /downloads/* {
          root * /srv/downloads
          @manifestos path *.json *.md *.crt
          header @manifestos Cache-Control "no-cache"
          @ca path *.crt
          header @ca Content-Type application/x-x509-ca-cert
          file_server {
            hide .*
          }
        }
        handle {
          reverse_proxy web:80
        }
      }

# Dados no disco do host, sob ${ECLUME_DATA_DIR} (/srv/eclume). As pastas precisam existir antes do
# primeiro deploy (o deploy.sh as cria). Nomes próprios, fora do padrão eclume_*, para nunca
# colidir com volumes de dev ou de teste.
x-host-dir: &host-dir
  driver: local

volumes:
  pg:
    name: eclume-prod-pg
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/pg"}
  redis:
    name: eclume-prod-redis
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/redis"}
  minio:
    name: eclume-prod-minio
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/minio"}
  caddy-data:
    name: eclume-prod-caddy-data
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/caddy/data"}
  caddy-config:
    name: eclume-prod-caddy-config
    <<: *host-dir
    driver_opts: {type: none, o: bind, device: "${ECLUME_DATA_DIR}/caddy/config"}
