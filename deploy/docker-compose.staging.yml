# Ephemeral staging for the restore rehearsal and the proofs (project `eclume-staging`), on the GPU host:
#
#   <ECLUME_DATA_DIR>/bin/staging.sh rehearse|up|down
#
# The same design as `docker-compose.e2e.yml`, on the `main` code (staging.sh downloads the tarball
# and runs its compose): Caddy only on 127.0.0.1:18444, transcription worker with `ECLUME_ENGINE=cpu`
# on the `eclume-worker-gpu:prod` image and limited `cpus` (it competes for neither production's GPU
# nor CPU), no `mdns` (it would announce a second server on the LAN) and data that `down -v` deletes.
# Own passwords; only `ECLUME_ENCRYPTION_KEY` comes from the restored `env.prod`, so the secrets
# encrypted in the backup database (Claude token, HF token) only open with the backup's key.
name: eclume-staging

x-server-env: &server-env
  ECLUME_DATABASE_URL: postgresql+asyncpg://eclume_server:staging-runtime@postgres:5432/eclume
  ECLUME_REDIS_URL: redis://redis:6379/0
  ECLUME_S3_ENDPOINT: http://minio:9000
  ECLUME_S3_ACCESS_KEY: eclume
  ECLUME_S3_SECRET_KEY: eclume-staging-secret
  ECLUME_S3_BUCKET: eclume
  ECLUME_SECRET_KEY: eclume-staging-secret-key
  ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?comes from the restored env.prod}
  ECLUME_PUBLIC_URL: https://127.0.0.1:18444
  ECLUME_COOKIE_SECURE: "true"
  # The proofs log in and create accounts many times a minute from the same IP.
  ECLUME_CREDENTIAL_ATTEMPTS_PER_MINUTE: "10000"

x-server-image: &server-image
  image: eclume-server:staging
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
    # The staging summary runs through `claude -p`, which only goes into the image with ECLUME_CLAUDE_CLI=1 (#129).
    args: {ECLUME_CLAUDE_CLI: "1"}
    labels: {org.eclume.image: "server-staging"}

services:
  # The edge with the embedded SPA, as in production (deploy/web.Dockerfile); staging.sh reuses the
  # `eclume-edge:<sha>` the deploy kept.
  caddy:
    image: eclume-edge:staging
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      labels: {org.eclume.image: "edge-staging"}
    depends_on:
      server: {condition: service_healthy}
    ports:
      - "127.0.0.1:18444:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Production's published manifests, read-only (the smoke asks for /downloads/latest.json).
      - ${ECLUME_DATA_DIR:-/srv/eclume}/downloads:/srv/downloads:ro

  server:
    <<: *server-image
    environment:
      <<: *server-env
      # This Caddy's CA (staging.sh copies it after starting): the /server fingerprint.
      ECLUME_CA_FILE: /srv/staging-ca/ca.crt
    volumes:
      - ${ECLUME_STAGING_CA_DIR:-./staging-ca}:/srv/staging-ca:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The single CPU worker, as in production: the eclume:default and eclume:agents queues.
  worker-cpu:
    <<: *server-image
    command: ["eclume-server", "worker"]
    environment:
      <<: *server-env
      # Without a provider in the restored database, the summary comes from `claude -p` with the env.prod token.
      CLAUDE_CODE_OAUTH_TOKEN: ${ECLUME_CLAUDE_OAUTH_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    image: eclume-worker-gpu:prod
    environment:
      ECLUME_ENGINE: cpu
      ECLUME_DEVICE: cpu
      ECLUME_REDIS_URL: redis://redis:6379/0
      ECLUME_S3_ENDPOINT_URL: http://minio:9000
      ECLUME_S3_ACCESS_KEY: eclume
      ECLUME_S3_SECRET_KEY: eclume-staging-secret
      ECLUME_S3_BUCKET: eclume
      ECLUME_SECRET_KEY: eclume-staging-secret-key
      ECLUME_ENCRYPTION_KEY: ${ECLUME_ENCRYPTION_KEY:?comes from the restored env.prod}
      PYTHONPATH: /src/engines:/src/worker
    cpus: ${ECLUME_STAGING_CPUS:-1.5}
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      # Production's models (as in gpu-test): the CPU engine's `small` is not downloaded every night.
      - ${ECLUME_DATA_DIR:-/srv/eclume}/models:/models
      - ../engines/src:/src/engines:ro
      - ../worker-gpu/src:/src/worker:ro

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: eclume
      POSTGRES_PASSWORD: eclume-staging
      POSTGRES_DB: eclume
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclume -d eclume"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: eclume
      # An incomplete multipart lives longer than the 7 days of upload_ttl_days (Go duration: no `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: eclume-staging-secret
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- one-shots (tools profile) ---

  minio-init:
    profiles: [tools]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 eclume eclume-staging-secret >/dev/null && mc mb --ignore-existing local/eclume"]

  # The migrator (superuser) applies the schema and enables eclume_server's LOGIN, as in production.
  migrate:
    <<: *server-image
    profiles: [tools]
    command: ["eclume-server", "migrate"]
    environment:
      <<: *server-env
      ECLUME_DATABASE_URL: postgresql+asyncpg://eclume:eclume-staging@postgres:5432/eclume
      ECLUME_RUNTIME_DB_PASSWORD: staging-runtime
    depends_on:
      postgres: {condition: service_healthy}

configs:
  caddyfile:
    content: |
      {
        default_sni 127.0.0.1
        auto_https disable_redirects
        skip_install_trust
      }
      https://127.0.0.1:8443 {
        tls internal
        handle /api/* {
          reverse_proxy server:8000
        }
        handle /media/* {
          reverse_proxy server:8000
        }
        handle /mcp {
          reverse_proxy server:8000
        }
        handle_path /downloads/* {
          root * /srv/downloads
          file_server {
            hide .*
          }
        }
        # The SPA (deploy/web.Caddyfile in the image), after the routes above.
        import /etc/caddy/spa.caddy
      }


volumes:
  # Restored database and bucket: on disk (the bucket does not fit in tmpfs), deleted on `down -v`.
  pg:
  minio:
