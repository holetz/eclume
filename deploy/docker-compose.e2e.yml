# Ephemeral stack for the web E2E against the real backend (project `eclume-e2e`), on the GPU host:
#
#   bash deploy/e2e-real.sh
#
# The same pieces as production (the Caddy edge with the SPA and the `eclume` CA, server, CPU worker
# with the Claude CLI, transcription worker, Postgres, Redis, MinIO), sharing nothing with it: data
# in tmpfs or in volumes that `down -v` deletes, Caddy only on 127.0.0.1:18443 and the transcription
# worker with `ECLUME_ENGINE=cpu`, without GPU — it competes for VRAM with neither production nor
# Jellyfin. Server and edge come from the checkout (`:e2e`); the worker reuses the
# `eclume-worker-gpu:prod` image, which has the CPU engine (faster-whisper) and is not worth
# rebuilding (~8 GB), with the checkout's `engines/` and `worker-gpu/` code mounted in front
# (PYTHONPATH). The compose runs on the host (relative bind mounts). Fixed passwords: nothing here
# leaves the host. Caddy's root is a disposable own root, restricted to 127.0.0.1, that e2e-real.sh
# generates in ECLUME_E2E_CA_DIR before starting.
name: eclume-e2e

x-server-env: &server-env
  ECLUME_DATABASE_URL: postgresql+asyncpg://eclume_server:e2e-runtime@postgres:5432/eclume
  ECLUME_REDIS_URL: redis://redis:6379/0
  ECLUME_S3_ENDPOINT: http://minio:9000
  ECLUME_S3_ACCESS_KEY: eclume
  ECLUME_S3_SECRET_KEY: eclume-e2e-secret
  ECLUME_S3_BUCKET: eclume
  ECLUME_SECRET_KEY: eclume-e2e-secret-key
  ECLUME_PUBLIC_URL: https://127.0.0.1:18443
  ECLUME_COOKIE_SECURE: "true"
  # The suite logs in and creates accounts many times a minute from the same IP.
  ECLUME_CREDENTIAL_ATTEMPTS_PER_MINUTE: "10000"

x-server-image: &server-image
  image: eclume-server:e2e
  build:
    context: ..
    dockerfile: deploy/server.Dockerfile
    # The e2e summary runs through `claude -p`, which only goes into the image with ECLUME_CLAUDE_CLI=1 (#129).
    args: {ECLUME_CLAUDE_CLI: "1"}
    labels: {org.eclume.image: "server-e2e"}

services:
  # The edge with the embedded SPA, as in production (deploy/web.Dockerfile).
  caddy:
    image: eclume-edge:e2e
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      labels: {org.eclume.image: "edge-e2e"}
    depends_on:
      server: {condition: service_healthy}
    ports:
      - "127.0.0.1:18443:8443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ${ECLUME_E2E_CA_DIR:?e2e-real.sh sets the folder of the disposable root}:/etc/caddy/ca:ro

  server:
    <<: *server-image
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The single CPU worker, as in production: the eclume:default and eclume:agents queues.
  worker-cpu:
    <<: *server-image
    command: ["eclume-server", "worker"]
    environment:
      <<: *server-env
      # The real E2E summary comes from `claude -p`, with production's long-lived token.
      CLAUDE_CODE_OAUTH_TOKEN: ${ECLUME_CLAUDE_OAUTH_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  worker:
    image: eclume-worker-gpu:prod
    environment:
      ECLUME_ENGINE: cpu
      ECLUME_DEVICE: cpu
      ECLUME_REDIS_URL: redis://redis:6379/0
      ECLUME_S3_ENDPOINT_URL: http://minio:9000
      ECLUME_S3_ACCESS_KEY: eclume
      ECLUME_S3_SECRET_KEY: eclume-e2e-secret
      ECLUME_S3_BUCKET: eclume
      ECLUME_SECRET_KEY: eclume-e2e-secret-key
      PYTHONPATH: /src/engines:/src/worker
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    volumes:
      - models:/models
      - ../engines/src:/src/engines:ro
      - ../worker-gpu/src:/src/worker:ro

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: eclume
      POSTGRES_PASSWORD: eclume-e2e
      POSTGRES_DB: eclume
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclume -d eclume"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: eclume
      # An incomplete multipart lives longer than the 7 days of upload_ttl_days (Go duration: no `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: eclume-e2e-secret
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # --- one-shots (tools profile) ---

  minio-init:
    profiles: [tools]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 eclume eclume-e2e-secret >/dev/null && mc mb --ignore-existing local/eclume"]

  # The migrator (superuser) applies the schema and enables eclume_server's LOGIN, as in production.
  migrate:
    <<: *server-image
    profiles: [tools]
    command: ["eclume-server", "migrate"]
    environment:
      <<: *server-env
      ECLUME_DATABASE_URL: postgresql+asyncpg://eclume:eclume-e2e@postgres:5432/eclume
      ECLUME_RUNTIME_DB_PASSWORD: e2e-runtime
    depends_on:
      postgres: {condition: service_healthy}

configs:
  caddyfile:
    content: |
      {
        default_sni 127.0.0.1
        auto_https disable_redirects
        skip_install_trust
        pki {
          ca eclume {
            name "eclume e2e"
            root {
              cert /etc/caddy/ca/raiz.crt
              key /etc/caddy/ca/raiz.key
            }
          }
        }
      }
      https://127.0.0.1:8443 {
        tls {
          issuer internal {
            ca eclume
          }
        }
        # Generic headers for what is not the SPA's (/api, /media); `?` does not overwrite what the
        # upstream or the SPA rules already set (the SPA's whole CSP).
        header {
          ?X-Content-Type-Options nosniff
          ?Referrer-Policy no-referrer
          ?Content-Security-Policy "frame-ancestors 'none'"
        }
        handle /api/* {
          # Coarse net: the server refuses earlier, with problem+json, above each route's ceiling.
          request_body {
            max_size 9MiB
          }
          reverse_proxy server:8000
        }
        handle /media/* {
          reverse_proxy server:8000
        }
        # The SPA (deploy/web.Caddyfile in the image), after the routes above.
        import /etc/caddy/spa.caddy
      }

volumes:
  # The CPU engine model (faster-whisper `small`, ~0.5 GB): downloaded on every run, deleted on `down -v`.
  models:
