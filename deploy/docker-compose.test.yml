# Ephemeral services for the server suite (server/tests): Postgres with pgvector, Redis and MinIO.
# Always run it with its own project, so it collides neither with dev nor with lumea on the host:
#   docker compose -p eclume-test -f deploy/docker-compose.test.yml up -d --wait
# Data in tmpfs (gone on `down`) and ports only on 127.0.0.1, away from the dev ports.
name: eclume-test

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: eclume
      POSTGRES_PASSWORD: eclume
      POSTGRES_DB: eclume
    ports:
      - "127.0.0.1:${ECLUME_TEST_PG_PORT:-55532}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclume -d eclume"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports:
      - "127.0.0.1:${ECLUME_TEST_REDIS_PORT:-56479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # MinIO stopped publishing images (Docker Hub and quay); pgsty/minio is the community build of the same server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: eclume
      # An incomplete multipart lives longer than the 7 days of upload_ttl_days (Go duration: no `d`).
      MINIO_API_STALE_UPLOADS_EXPIRY: 192h
      MINIO_ROOT_PASSWORD: eclume-test-secret
    ports:
      - "127.0.0.1:${ECLUME_TEST_MINIO_PORT:-59100}:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30
