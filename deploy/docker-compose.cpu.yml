# Override for a host without an NVIDIA GPU: `bash deploy/deploy.sh --context <ctx> --no-gpu`.
#
# The transcription worker uses the same image (`eclume-worker-gpu`, which already ships
# faster-whisper) with the `cpu` engine, like `docker-compose.e2e.yml`, and loses the GPU
# reservation. Limit: the `cpu` engine does not diarize (no speakers) and is several times slower
# than the GPU. `!reset` needs Docker Compose 2.24 or newer.
services:
  worker-gpu:
    environment:
      ECLUME_ENGINE: cpu
      ECLUME_DEVICE: cpu
    deploy: !reset {}
