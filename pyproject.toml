# Raiz do workspace uv do eclume. Os pacotes Python vivem nos pilares da raiz:
# `engines` (interface de engine), `server` (API) e `worker-gpu` (worker de ASR).
# Esta raiz não é um pacote — só declara o workspace, a config compartilhada de
# ferramentas (ruff/pytest) e o grupo de dev.

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engines", "server", "worker-gpu"]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  # testes de contrato (contracts/tests)
  "jsonschema[format-nongpl]>=4.23",
  "openapi-spec-validator>=0.7",
  "pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Projeção gerada pelo `cq design build` (conferida pelo `--check`), não código do eclume.
extend-exclude = [".design/build"]
src = [
  "engines/src",
  "engines/tests",
  "server/src",
  "server/tests",
  "worker-gpu/src",
  "worker-gpu/tests",
  "contracts/tools",
  "contracts/tests",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "E501",     # line too long — o formatter cuida
  "COM812",   # trailing comma — conflita com `ruff format`
  "D203",     # conflita com D211 (sem linha em branco antes da docstring de classe)
  "D213",     # conflita com D212 (resumo na primeira linha da docstring)
  "D401",     # imperative mood — o projeto escreve em português
  "CPY001",   # aviso de copyright por arquivo — a licença MIT vive em LICENSE
  "EM101",    # mensagem em literal no raise — os erros da API (problem+json) levam o texto do ponto do erro
  "EM102",    # idem, com f-string
  "TRY003",   # idem: a mensagem longa é o `detail` do problem, não da classe
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D100", "D103", "ANN201"]
"server/tests/**" = ["PLR2004", "S105", "S106"]  # asserts de status HTTP e senhas de teste
"contracts/**" = ["INP001"]  # script e testes soltos: contracts/ não é pacote Python
# FastAPI e pydantic resolvem as anotações em runtime: os tipos precisam existir fora do TYPE_CHECKING.
"server/src/eclume_server/{auth,context,routes/*}.py" = ["TC001", "TC002", "TC003"]
# Handlers FastAPI recebem um parâmetro por campo da requisição (filtros, path, query).
"server/src/eclume_server/routes/*.py" = ["PLR0913", "PLR0917"]
# fakes do WhisperX, do Redis e do S3 nos testes das engines e do worker: assinaturas espelham
# as reais (argumentos não usados, `Any`), sem docstring por método, com valores de teste literais
"{engines,worker-gpu}/tests/**" = ["ANN401", "ARG001", "ARG002", "D101", "D102", "D105", "D107", "PLR2004", "S105", "S106", "S107", "SLF001"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["engines/tests", "server/tests", "worker-gpu/tests", "contracts/tests", "mobile/scripts", "deploy"]
addopts = "--import-mode=importlib"
# Helpers da suíte do server (pacote `eclume_server_testing`), importáveis pelos testes.
pythonpath = ["server/tests"]
markers = [
  "slow: chama serviços reais (LLM); fora da CI, roda no host sob demanda",
]
