[project]
name = "eclume-server"
version = "0.2.0"
description = "The eclume API: accounts, PATs, recordings, summaries, people and search."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "eclume-engines",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "argon2-cffi>=23.1",
  "boto3>=1.34",
  "arq>=0.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # agentes de sumarização (holetz/eclume#9)
  "anthropic>=1.8",
  "httpx>=0.27",
  "cryptography>=44",
  # exportação em DOCX (holetz/eclume#34)
  "python-docx>=1.1",
  # servidor MCP em /mcp (holetz/eclume#35)
  "mcp>=2.2,<3",
  # anúncio e descoberta na rede local (mDNS, holetz/eclume#35)
  "zeroconf>=0.151,<1",
  # anexos e arquivos do Agente: texto de PDF e upload multipart (holetz/eclume#142)
  "pypdf>=6.21.4",
  "python-multipart>=0.0.18",
]

[project.scripts]
eclume-server = "eclume_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_server"]

# Resolve the engine interface from the workspace (not from PyPI).
[tool.uv.sources]
eclume-engines = { workspace = true }
