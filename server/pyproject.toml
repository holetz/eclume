[project]
name = "eclume-server"
version = "0.1.0"
description = "API do eclume: organizações, usuários, PATs, gravações, resumos, pessoas e busca."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "eclume-engines",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "argon2-cffi>=23.1",
  "boto3>=1.34",
  "arq>=0.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  # agentes de sumarização (holetz/eclume#9)
  "anthropic>=1.8",
  "httpx>=0.27",
  "cryptography>=44",
  # exportação em DOCX (holetz/eclume#34)
  "python-docx>=1.1",
]

[project.scripts]
eclume-server = "eclume_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_server"]

# Resolve a interface de engine a partir do workspace (não do PyPI).
[tool.uv.sources]
eclume-engines = { workspace = true }
