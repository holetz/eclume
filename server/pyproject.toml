[project]
name = "eclume-server"
version = "0.1.0"
description = "API do eclume: organizações, usuários, PATs, gravações, pessoas e busca."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "eclume-engines",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_server"]

# Resolve a interface de engine a partir do workspace (não do PyPI).
[tool.uv.sources]
eclume-engines = { workspace = true }
