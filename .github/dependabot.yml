# eclume dependency updates: weekly PRs, grouped by ecosystem, with a 7-day wait after publication
# (cooldown). A Dependabot PR only lands with the eclume/gate status = success on its SHA
# (bash deploy/gate.sh <ref>). deploy/test_pins.py fails if a directory with a manifest has no entry
# here. Contract: docs/standards/code/monorepo.md.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {uv: {patterns: ["*"]}}
  - package-ecosystem: npm
    directories:
      - "/web"
      - "/mobile"
      - "/desktop"
      - "/desktop/ui-tests"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {npm: {patterns: ["*"]}}
  - package-ecosystem: cargo
    directories:
      - "/desktop"
      - "/mobile"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {cargo: {patterns: ["*"]}}
  - package-ecosystem: gradle
    directory: "/mobile/src-tauri/gen/android"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {gradle: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {github-actions: {patterns: ["*"]}}
  - package-ecosystem: docker
    directories:
      - "/deploy"
      - "/desktop"
      - "/mobile"
      - "/worker-gpu"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {docker: {patterns: ["*"]}}
  - package-ecosystem: docker-compose
    directory: "/deploy"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {docker-compose: {patterns: ["*"]}}
  - package-ecosystem: rust-toolchain
    directories:
      - "/desktop"
      - "/mobile"
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups: {rust-toolchain: {patterns: ["*"]}}
