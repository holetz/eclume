name: Spec proposal
description: Propose a larger change so the approach can be agreed before the work
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What needs to change and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would build, and what is out of scope.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How it would be validated
