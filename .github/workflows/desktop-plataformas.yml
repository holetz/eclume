# Verificação sob demanda do app desktop no Windows: `cargo check` do workspace e os testes dos
# crates de lógica pura (`eclume-mirror`, `eclume-sync`: nomes de arquivo, caminhos e o cliente),
# disparado à mão
# (`gh workflow run desktop-plataformas.yml`). Não roda em PR nem em push: com o repositório
# privado, o minuto de Windows custa 2×, e o macOS (10×) fica fora até o repositório ficar
# público. O job Linux do `ci.yml` segue sendo a prova de cada PR, e o código só-Windows já
# compila (clippy -D warnings, compilação cruzada) a cada gate do host (pilar `windows` de
# deploy/pilares.sh); aqui fica só a prova de execução num Windows de verdade. Os instaladores saem
# do `deploy/release-desktop.sh` ou do `desktop-release.yml`.
name: desktop-plataformas

on:
  workflow_dispatch:

concurrency:
  group: desktop-plataformas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo check --manifest-path desktop/Cargo.toml --workspace --all-targets --locked
      - run: cargo test --manifest-path desktop/Cargo.toml -p eclume-mirror -p eclume-sync --locked
