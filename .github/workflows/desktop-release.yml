# Release do app desktop do eclume: gera os instaladores de Windows, Linux e macOS, assina os
# pacotes do updater com a chave minisign (secrets TAURI_SIGNING_*), monta latest.json,
# instaladores.json e SHA256SUMS e publica um GitHub Release (privado, como o repo). Os clientes
# baixam do servidor eclume, não do GitHub: deploy/publicar-desktop.sh copia o release para
# /srv/eclume/downloads no host. Contrato: docs/standards/code/desktop-distribuicao.md.
#
# Só roda por tag `desktop-v<versão>` ou à mão, nunca em PR/push: com o repo privado, o minuto de
# macOS custa 10× e o de Windows 2×. No dispatch, `publicar: false` é ensaio (os artefatos ficam
# no run) e `macos: false` pula o job mais caro.
name: desktop-release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Criar a tag desktop-v<versão do tauri.conf.json> e publicar o release"
        type: boolean
        default: false
      macos:
        description: "Incluir o macOS (10× o custo do Linux)"
        type: boolean
        default: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plano:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.plano.outputs.versao }}
      tag: ${{ steps.plano.outputs.tag }}
      publicar: ${{ steps.plano.outputs.publicar }}
      matriz: ${{ steps.plano.outputs.matriz }}
    steps:
      - uses: actions/checkout@v7
      - id: plano
        env:
          EVENTO: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLICAR: ${{ inputs.publicar }}
          MACOS: ${{ inputs.macos }}
        run: |
          versao=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          tag="desktop-v$versao"
          if [ "$EVENTO" = push ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::a tag $REF_NAME não bate com a versão $versao do tauri.conf.json"
              exit 1
            fi
            PUBLICAR=true
            MACOS=true
          fi
          matriz=$(MACOS="$MACOS" python3 - <<'EOF'
          import json, os
          alvos = [
              {"plataforma": "linux", "os": "ubuntu-22.04", "bundles": "appimage,deb", "alvo": ""},
              {"plataforma": "windows", "os": "windows-latest", "bundles": "nsis,msi", "alvo": ""},
          ]
          if os.environ["MACOS"] == "true":
              alvos.append({"plataforma": "macos", "os": "macos-latest", "bundles": "app,dmg", "alvo": "universal-apple-darwin"})
          print(json.dumps({"include": alvos}))
          EOF
          )
          {
            echo "versao=$versao"
            echo "tag=$tag"
            echo "publicar=$PUBLICAR"
            echo "matriz=$matriz"
          } >> "$GITHUB_OUTPUT"
          echo "versão $versao, tag $tag, publicar=$PUBLICAR, matriz: $matriz"

  build:
    needs: plano
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plano.outputs.matriz) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri 2 e da captura de áudio
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          key: release
      - name: Build e bundle
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy sem FUSE e sem o strip que falha em binários com .relr.dyn.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          args=(build --ci --bundles "${{ matrix.bundles }}")
          if [ -n "${{ matrix.alvo }}" ]; then args+=(--target "${{ matrix.alvo }}"); fi
          npx --yes @tauri-apps/cli@2 "${args[@]}"
      - name: Juntar os artefatos
        env:
          VERSAO: ${{ needs.plano.outputs.versao }}
        run: |
          if [ -n "${{ matrix.alvo }}" ]; then bundle="desktop/target/${{ matrix.alvo }}/release/bundle"; else bundle=desktop/target/release/bundle; fi
          mkdir -p saida
          shopt -s nullglob
          for f in "$bundle"/appimage/*.AppImage* "$bundle"/deb/*.deb* "$bundle"/nsis/*-setup.exe* \
                   "$bundle"/msi/*.msi* "$bundle"/dmg/*.dmg; do
            cp "$f" saida/
          done
          # O pacote do updater do macOS sai sem versão no nome (eclume.app.tar.gz).
          for f in "$bundle"/macos/*.app.tar.gz*; do
            nome=$(basename "$f")
            cp "$f" "saida/${nome/.app.tar.gz/_${VERSAO}_universal.app.tar.gz}"
          done
          ls -la saida
          test -n "$(ls saida)"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.plataforma }}
          path: saida/
          if-no-files-found: error

  release:
    needs: [plano, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Montar latest.json, instaladores.json e SHA256SUMS
        env:
          VERSAO: ${{ needs.plano.outputs.versao }}
          BASE_URL: ${{ vars.ECLUME_DOWNLOADS_URL || 'https://192.168.15.199:8443/downloads' }}
        run: |
          cp desktop/INSTALACAO.md dist/
          python3 desktop/scripts/manifestos_release.py --artefatos dist --versao "$VERSAO" \
            --base-url "$BASE_URL" --notas "eclume desktop $VERSAO"
          cat dist/latest.json
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.plano.outputs.versao }}
          path: dist/
      - name: Publicar o GitHub Release
        if: needs.plano.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plano.outputs.tag }}
          VERSAO: ${{ needs.plano.outputs.versao }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "eclume desktop $VERSAO" \
            --notes "Instaladores do app desktop do eclume $VERSAO. Os clientes baixam de /downloads/ no servidor eclume (deploy/publicar-desktop.sh)."
