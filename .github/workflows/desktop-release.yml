# Release of the eclume desktop app through GitHub Actions: builds the Linux installers and, when
# asked, the Windows ones, signs the updater packages with the minisign key (TAURI_SIGNING_* secrets),
# assembles latest.json, instaladores.json and SHA256SUMS and publishes a GitHub Release (private,
# like the repo). Clients download from the eclume server, not from GitHub: deploy/publish-desktop.sh
# copies the release to /srv/eclume/downloads on the host. Contract: docs/standards/code/desktop-distribuicao.md.
#
# The main path is the release on the host (deploy/release-desktop.sh), which spends no Actions
# minutes. This workflow is the alternative and only runs by hand: the desktop-v* tag that the host
# release creates does not fire it. With the repo private, a Windows minute costs 2x (the `windows`
# input) and macOS stays out until the repository is public. On dispatch, `publish: false` is a
# dry run (the artifacts stay on the run).
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the desktop-v<tauri.conf.json version> tag and publish the release"
        type: boolean
        default: false
      windows:
        description: "Include Windows (2x the cost of Linux; untick for Linux only)"
        type: boolean
        default: true
      notes:
        description: "Release notes, which the app shows in the \"Updated to X\" notice (empty: the version's section in desktop/CHANGELOG.md)"
        type: string
        default: ""

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - id: plan
        env:
          PUBLISH: ${{ inputs.publish }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          tag="desktop-v$version"
          matrix=$(WINDOWS="$WINDOWS" python3 - <<'EOF'
          import json, os
          targets = [{"platform": "linux", "os": "ubuntu-24.04", "bundles": "appimage,deb"}]
          if os.environ["WINDOWS"] == "true":
              targets.append({"platform": "windows", "os": "windows-2025", "bundles": "nsis,msi"})
          print(json.dumps({"include": targets}))
          EOF
          )
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$PUBLISH"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, tag $tag, publish=$PUBLISH, matrix: $matrix"
      # Publishing needs the host gate green on this commit (status eclume/gate); no waiver here:
      # whoever needs a waiver publishes from the host (--skip-gate). Contract: docs/standards/code/monorepo.md.
      - name: Commit gate
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" | python3 deploy/gate.py decide

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies of Tauri 2 and audio capture
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The Rust of desktop/rust-toolchain.toml (version, components and targets), through the runner's rustup.
      - name: Rust from desktop/rust-toolchain.toml
        working-directory: desktop
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          key: release
      # The Tauri CLI from desktop/package-lock.json, installed without scripts and without the secrets in the step.
      - name: Tauri CLI
        run: npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
      - name: Build and bundle
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The server embedded in the installer (config::embedded_server): address and root CA
          # fingerprint, stored by holetz/eclume#35 as repository variables.
          ECLUME_SERVER_URL: ${{ vars.ECLUME_SERVER_URL }}
          ECLUME_SERVER_CA_SHA256: ${{ vars.ECLUME_SERVER_CA_SHA256 }}
          # linuxdeploy without FUSE and without the strip that fails on binaries with .relr.dyn.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npx --no-install tauri build --ci --bundles "${{ matrix.bundles }}"
      - name: Gather the artifacts
        run: |
          bundle=desktop/target/release/bundle
          mkdir -p out
          shopt -s nullglob
          for f in "$bundle"/appimage/*.AppImage* "$bundle"/deb/*.deb* "$bundle"/nsis/*-setup.exe* \
                   "$bundle"/msi/*.msi*; do
            cp "$f" out/
          done
          ls -la out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Assemble latest.json, instaladores.json and SHA256SUMS
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BASE_URL: ${{ vars.ECLUME_DOWNLOADS_URL }}
          NOTES: ${{ inputs.notes }}
        run: |
          [ -n "$BASE_URL" ] || { echo "Set the ECLUME_DOWNLOADS_URL repository variable." >&2; exit 1; }
          [ -n "$NOTES" ] || NOTES="$(python3 deploy/version.py notes desktop "$VERSION")"
          cp desktop/INSTALACAO.md dist/
          python3 desktop/scripts/manifestos_release.py --artefatos dist --versao "$VERSION" \
            --base-url "$BASE_URL" --notas "$NOTES"
          cat dist/latest.json
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/
      - name: Publish the GitHub Release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "eclume desktop $VERSION" \
            --notes "Installers of the eclume desktop app $VERSION. Clients download from /downloads/ on the eclume server (deploy/publish-desktop.sh)."
