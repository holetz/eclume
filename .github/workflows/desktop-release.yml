# Release do app desktop do eclume pelo GitHub Actions: gera os instaladores de Linux e, se
# pedido, Windows, assina os pacotes do updater com a chave minisign (secrets TAURI_SIGNING_*),
# monta latest.json, instaladores.json e SHA256SUMS e publica um GitHub Release (privado, como o
# repo). Os clientes baixam do servidor eclume, não do GitHub: deploy/publicar-desktop.sh copia o
# release para /srv/eclume/downloads no host. Contrato: docs/standards/code/desktop-distribuicao.md.
#
# O caminho principal é o release no host (deploy/release-desktop.sh), que não gasta minutos de
# Actions. Este workflow é a alternativa e só roda à mão: a tag desktop-v* que o release no host
# cria não o dispara. Com o repo privado, o minuto de Windows custa 2× (entrada `windows`,
# desligada por padrão) e o macOS fica fora até o repositório ficar público. No dispatch,
# `publicar: false` é ensaio (os artefatos ficam no run).
name: desktop-release

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Criar a tag desktop-v<versão do tauri.conf.json> e publicar o release"
        type: boolean
        default: false
      windows:
        description: "Incluir o Windows (2× o custo do Linux; desmarque para só Linux)"
        type: boolean
        default: true
      notas:
        description: "Notas do release, que o app mostra no aviso \"Atualizado para X\""
        type: string
        default: ""

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plano:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
    outputs:
      versao: ${{ steps.plano.outputs.versao }}
      tag: ${{ steps.plano.outputs.tag }}
      publicar: ${{ steps.plano.outputs.publicar }}
      matriz: ${{ steps.plano.outputs.matriz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - id: plano
        env:
          PUBLICAR: ${{ inputs.publicar }}
          WINDOWS: ${{ inputs.windows }}
        run: |
          versao=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          tag="desktop-v$versao"
          matriz=$(WINDOWS="$WINDOWS" python3 - <<'EOF'
          import json, os
          alvos = [{"plataforma": "linux", "os": "ubuntu-24.04", "bundles": "appimage,deb"}]
          if os.environ["WINDOWS"] == "true":
              alvos.append({"plataforma": "windows", "os": "windows-2025", "bundles": "nsis,msi"})
          print(json.dumps({"include": alvos}))
          EOF
          )
          {
            echo "versao=$versao"
            echo "tag=$tag"
            echo "publicar=$PUBLICAR"
            echo "matriz=$matriz"
          } >> "$GITHUB_OUTPUT"
          echo "versão $versao, tag $tag, publicar=$PUBLICAR, matriz: $matriz"
      # Publicar exige o gate do host verde neste commit (status eclume/gate); sem dispensa aqui:
      # quem precisa dispensar publica pelo host (--sem-gate). Contrato: docs/standards/code/monorepo.md.
      - name: Gate do commit
        if: steps.plano.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" | python3 deploy/gate.py decidir

  build:
    needs: plano
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plano.outputs.matriz) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependências de sistema do Tauri 2 e da captura de áudio
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # O Rust de desktop/rust-toolchain.toml (versão, componentes e alvos), pelo rustup do runner.
      - name: Rust de desktop/rust-toolchain.toml
        working-directory: desktop
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop
          key: release
      # A CLI do Tauri de desktop/package-lock.json, instalada sem scripts e sem os secrets no passo.
      - name: CLI do Tauri
        run: npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
      - name: Build e bundle
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # O servidor embutido no instalador (config::embedded_server): endereço e impressão
          # digital da CA raiz, gravados pela holetz/eclume#35 como variáveis do repositório.
          ECLUME_SERVER_URL: ${{ vars.ECLUME_SERVER_URL }}
          ECLUME_SERVER_CA_SHA256: ${{ vars.ECLUME_SERVER_CA_SHA256 }}
          # linuxdeploy sem FUSE e sem o strip que falha em binários com .relr.dyn.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npx --no-install tauri build --ci --bundles "${{ matrix.bundles }}"
      - name: Juntar os artefatos
        run: |
          bundle=desktop/target/release/bundle
          mkdir -p saida
          shopt -s nullglob
          for f in "$bundle"/appimage/*.AppImage* "$bundle"/deb/*.deb* "$bundle"/nsis/*-setup.exe* \
                   "$bundle"/msi/*.msi*; do
            cp "$f" saida/
          done
          ls -la saida
          test -n "$(ls saida)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.plataforma }}
          path: saida/
          if-no-files-found: error

  release:
    needs: [plano, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Montar latest.json, instaladores.json e SHA256SUMS
        env:
          VERSAO: ${{ needs.plano.outputs.versao }}
          BASE_URL: ${{ vars.ECLUME_DOWNLOADS_URL || 'https://192.168.15.199:8443/downloads' }}
          NOTAS: ${{ inputs.notas }}
        run: |
          cp desktop/INSTALACAO.md dist/
          python3 desktop/scripts/manifestos_release.py --artefatos dist --versao "$VERSAO" \
            --base-url "$BASE_URL" --notas "${NOTAS:-eclume desktop $VERSAO}"
          cat dist/latest.json
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.plano.outputs.versao }}
          path: dist/
      - name: Publicar o GitHub Release
        if: needs.plano.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plano.outputs.tag }}
          VERSAO: ${{ needs.plano.outputs.versao }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "eclume desktop $VERSAO" \
            --notes "Instaladores do app desktop do eclume $VERSAO. Os clientes baixam de /downloads/ no servidor eclume (deploy/publicar-desktop.sh)."
