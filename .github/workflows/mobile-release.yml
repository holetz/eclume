# Release do app móvel do eclume (Android): compila o APK universal (arm64 e armv7) assinado com a
# keystore de release (secrets ANDROID_KEYSTORE_*), confere a assinatura, monta movel.json e
# SHA256SUMS e publica um GitHub Release (privado, como o repo). Os celulares baixam do servidor
# eclume, não do GitHub: deploy/publicar-movel.sh copia o release para /srv/eclume/downloads/movel
# no host. Contrato: docs/standards/code/mobile-distribuicao.md.
#
# Só roda por tag `mobile-v<versão>` ou à mão, nunca em PR/push. No dispatch, `publicar: false` é
# ensaio (o APK fica no run). O runner ubuntu-24.04 já traz o SDK do Android; o NDK é o fixado
# em mobile/scripts/android-sdk.sh e o Rust o de mobile/rust-toolchain.toml.
name: mobile-release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Criar a tag mobile-v<versão do tauri.conf.json> e publicar o release"
        type: boolean
        default: false
      notas:
        description: "Notas do release, que o app mostra em \"Nova versão disponível\""
        type: string
        default: ""

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plano
        env:
          EVENTO: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          versao=$(python3 -c "import json; print(json.load(open('mobile/src-tauri/tauri.conf.json'))['version'])")
          tag="mobile-v$versao"
          if [ "$EVENTO" = push ]; then
            if [ "$REF_NAME" != "$tag" ]; then
              echo "::error::a tag $REF_NAME não bate com a versão $versao do tauri.conf.json"
              exit 1
            fi
            PUBLICAR=true
          fi
          { echo "versao=$versao"; echo "tag=$tag"; echo "publicar=$PUBLICAR"; } >> "$GITHUB_OUTPUT"
          echo "versão $versao, tag $tag, publicar=$PUBLICAR"
      # Publicar exige o gate do host verde neste commit (status eclume/gate); sem dispensa aqui:
      # quem precisa dispensar publica pelo host (--sem-gate). Contrato: docs/standards/code/monorepo.md.
      - name: Gate do commit
        if: steps.plano.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" | python3 deploy/gate.py decidir
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # O Rust de mobile/rust-toolchain.toml (versão, componentes e alvos), pelo rustup do runner.
      - name: Rust de mobile/rust-toolchain.toml
        working-directory: mobile
        run: rustup toolchain install
      # O NDK que mobile/scripts/android-sdk.sh instala, não o mais novo do runner.
      - name: NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "ECLUME_ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: mobile
          key: release
      # As dependências entram antes de a keystore existir no runner.
      - run: npm --prefix mobile ci
      - name: Keystore de release
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "::error::faltam os secrets ANDROID_KEYSTORE_* (mobile/scripts/criar-keystore.sh)"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/eclume-android.jks"
          {
            echo "storeFile=$RUNNER_TEMP/eclume-android.jks"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
          } > mobile/src-tauri/gen/android/keystore.properties
      - name: APK universal assinado
        env:
          NDK_HOME: ${{ env.ECLUME_ANDROID_NDK }}
          ANDROID_NDK_HOME: ${{ env.ECLUME_ANDROID_NDK }}
          ANDROID_NDK_ROOT: ${{ env.ECLUME_ANDROID_NDK }}
        run: npm --prefix mobile run tauri -- android build --apk --target aarch64 --target armv7 --ci
      - name: Conferir a assinatura e montar movel.json e SHA256SUMS
        env:
          VERSAO: ${{ steps.plano.outputs.versao }}
          NOTAS: ${{ inputs.notas }}
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          mkdir -p dist
          cp mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "dist/eclume-$VERSAO.apk"
          "$apksigner" verify --print-certs "dist/eclume-$VERSAO.apk" | tee assinatura.txt
          certificado=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' assinatura.txt)
          cp mobile/INSTALACAO.md dist/
          python3 mobile/scripts/manifesto_movel.py --pasta dist --versao "$VERSAO" \
            --certificado "$certificado" --notas "${NOTAS:-eclume para Android $VERSAO}"
          ls -la dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-${{ steps.plano.outputs.versao }}
          path: dist/
          if-no-files-found: error
      - name: Publicar o GitHub Release
        if: steps.plano.outputs.publicar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plano.outputs.tag }}
          VERSAO: ${{ steps.plano.outputs.versao }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "eclume para Android $VERSAO" \
            --notes "APK do app móvel do eclume $VERSAO. Os celulares baixam de /downloads/movel/ no servidor eclume (deploy/publicar-movel.sh)."
