# eclume CI: lint and tests of the pillars and of the v1 contract on Linux for every PR and every push to main.
# macOS and Windows stay out (private repo: 10x and 2x minutes); the desktop installers come from
# the host, through `deploy/release-desktop.sh`; `desktop-release.yml` is only the manual alternative.
#
# Saving minutes: the `changes` job turns on only the jobs of the pillars touched (a docs-only change
# turns on only the `docs` job). Each job bills at least 1 minute; the filters follow the dependencies
# between pillars (the server and the web read the contract, the desktop reads the web CSS and help
# articles, the mobile compiles `desktop/crates`). Touching this file or `deploy/pillars.sh` runs everything;
# so does `workflow_dispatch`, and the nightly (`schedule`) runs everything only if `main` changed since
# the last green nightly.
#
# Each pillar's commands come from `deploy/pillars.sh`, the same source as the host gate
# (`deploy/gate.sh`, status `eclume/gate`); each job here only prepares the environment and calls its pillar.
# The gate-only pillars (`windows`, `audit`, `android`, `gpu-e2e`) stay out. `deploy/test_gate.py` fails if a
# job stops calling its pillar or if a pytest `testpaths` folder falls outside the `python` filter.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - ".design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - ".design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 03:00 in Brasília

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      python: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.python == 'true') }}
      contracts: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.contracts == 'true') }}
      web: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.web == 'true') }}
      web-browser: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.web-browser == 'true') }}
      desktop: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.desktop == 'true') }}
      mobile: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.mobile == 'true') }}
      docs: ${{ steps.nightly.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filter.outputs.docs == 'true') }}
    steps:
      # On a PR the file list comes from the API; on a push to main the filter compares with the
      # commit before the push and needs the checkout.
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The nightly only spends minutes when `main` changed since the last green nightly.
      - if: github.event_name == 'schedule'
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list -R "$GITHUB_REPOSITORY" -w ci -e schedule -s success -L 1 --json headSha --jq '.[0].headSha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
              - ".github/actions/**"
              - "deploy/pillars.sh"
            uv: &uv
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
            python:
              - *ci
              - *uv
              - "engines/**"
              - "server/**"
              - "worker-gpu/**"
              - "contracts/**"
              - "mobile/scripts/**"
              # The DS source and the three copies generated from it (design-system/test_sync.py).
              - "design-system/**"
              - "web/src/styles/eclume.css"
              - "desktop/ui/eclume.css"
              - "mobile/ui/src/styles/eclume.css"
              - "deploy/**"
              - ".github/workflows/desktop-release.yml"
              # The three version lines and the CHANGELOGs that deploy/test_version.py ties together.
              - "CHANGELOG.md"
              - "desktop/CHANGELOG.md"
              - "mobile/CHANGELOG.md"
              - "web/package.json"
              - "web/package-lock.json"
              - "desktop/**/Cargo.toml"
              - "desktop/Cargo.lock"
              - "desktop/src-tauri/tauri.conf.json"
              - "mobile/**/Cargo.toml"
              - "mobile/Cargo.lock"
              - "mobile/src-tauri/tauri.conf.json"
            contracts:
              - *ci
              - *uv
              - "contracts/**"
              - "deploy/docker-compose.mock.yml"
            web:
              - *ci
              - "web/**"
              - "contracts/**"
            web-browser:
              - *ci
              - "web/**"
              - "contracts/**"
              - "deploy/docker-compose.mock.yml"
            desktop:
              - *ci
              - "desktop/**"
              - "web/src/styles/eclume.css"
              - "web/src/lib/vocabulario.js"
              - "web/src/features/help/articles/en/**"
            mobile:
              - *ci
              - "mobile/**"
              - "desktop/crates/**"
              - "web/src/lib/vocabulario.js"
              - "web/src/lib/vocabulario.d.ts"
            docs:
              - *ci
              - "docs/**"
              - "**/*.md"
              - "deploy/docs_check.py"
              - "deploy/test_docs_check.py"

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: ./.github/actions/ffmpeg
      - name: Server test services (Postgres, Redis, MinIO)
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml up -d --wait
      - run: bash deploy/pillars.sh python
      - if: failure()
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml logs

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Mock server (Prism)
        run: docker compose -f deploy/docker-compose.mock.yml up -d --wait
      - run: bash deploy/pillars.sh contracts
      - if: failure()
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash deploy/pillars.sh web

  # Tests that need a browser: media conversion (vitest browser mode) and the app E2E against the
  # contract mock. Both use the Google Chrome that ships with the runner (`chrome` channel, with the
  # proprietary decoders), without downloading a browser.
  web-browser:
    needs: changes
    if: needs.changes.outputs.web-browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/ffmpeg
      - name: WebKit and Firefox system dependencies (Playwright from the lockfile)
        run: |
          npm --prefix web ci
          npx --prefix web --no-install playwright install-deps webkit firefox
      - name: Mock server (Prism)
        run: docker compose -f deploy/docker-compose.mock.yml up -d --wait
      - run: bash deploy/pillars.sh web-browser
      - if: failure()
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies of Tauri 2 and audio capture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      # The Rust of desktop/rust-toolchain.toml (version, components and targets), through the runner's rustup.
      - name: Rust from desktop/rust-toolchain.toml
        working-directory: desktop
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      # The window UI (desktop/ui) runs in a Chromium: its system dependencies come from here.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/ui-tests/package-lock.json
      - run: |
          npm --prefix desktop/ui-tests ci
          npm --prefix desktop/ui-tests exec -- playwright install --with-deps chromium
      # Diagnosing the `Bus error` at link time: disk and memory before cargo.
      - name: Disk and memory
        run: df -h && free -m
      - run: bash deploy/pillars.sh desktop

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System dependencies of Tauri 2 and the microphone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev clang cmake ninja-build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The Rust of mobile/rust-toolchain.toml (version, components and targets), through the runner's rustup.
      - name: Rust from mobile/rust-toolchain.toml
        working-directory: mobile
        run: rustup toolchain install
      # The NDK that mobile/scripts/android-sdk.sh installs, not the runner's newest.
      - name: NDK 28.2.13676358
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" >/dev/null
          echo "ECLUME_ANDROID_NDK=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mobile
      # The pillar compiles the core for Android with the NDK pinned above (ECLUME_ANDROID_NDK).
      - run: bash deploy/pillars.sh mobile

  # The documentation: the OKF bundle (`cq`, from the public holetz/quenching at the pinned ref, the
  # same as deploy/gate.Dockerfile) and links, anchors, backticked paths and glossary order.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: holetz/quenching
          ref: 200373a8a804aa9426351c5ed3271fabc493ba38 # 6.14.0
          path: .quenching
      # Outside the eclume tree, so the check does not sweep quenching.
      - run: |
          mv .quenching "$RUNNER_TEMP/quenching"
          echo "$RUNNER_TEMP/quenching/plugins/quenching/bin" >> "$GITHUB_PATH"
      - run: bash deploy/pillars.sh docs
