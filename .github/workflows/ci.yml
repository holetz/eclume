# CI do eclume: lint e teste dos pilares e do contrato v1 em Linux a cada PR e a cada push em main.
# macOS e Windows ficam fora (repo privado: minutos 10× e 2×); os instaladores do desktop saem
# do host, por `deploy/release-desktop.sh`; o `desktop-release.yml` é só a alternativa manual.
#
# Economia de minutos: mudança só de documentação não dispara a CI (`paths-ignore`), e o job
# `mudancas` liga só os jobs dos pilares tocados. Cada job cobra ao menos 1 minuto; os filtros
# seguem as dependências entre pilares (o server e o web leem o contrato, o desktop lê o CSS do
# web, o mobile compila `desktop/crates`). Mexer neste arquivo roda tudo; `workflow_dispatch` também.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.python == 'true' }}
      contracts: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.contracts == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.web == 'true' }}
      web-browser: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.web-browser == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.desktop == 'true' }}
      mobile: ${{ github.event_name == 'workflow_dispatch' || steps.filtro.outputs.mobile == 'true' }}
    steps:
      # No PR a lista de arquivos vem da API; no push em main o filtro compara com o commit
      # anterior ao push e precisa do checkout.
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
      - if: github.event_name != 'workflow_dispatch'
        id: filtro
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            uv: &uv
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
            python:
              - *ci
              - *uv
              - "engines/**"
              - "server/**"
              - "worker-gpu/**"
              - "contracts/**"
              - "mobile/scripts/**"
              - "deploy/docker-compose.test.yml"
            contracts:
              - *ci
              - *uv
              - "contracts/**"
              - "deploy/docker-compose.mock.yml"
            web:
              - *ci
              - "web/**"
              - "contracts/**"
            web-browser:
              - *ci
              - "web/**"
              - "contracts/**"
              - "deploy/docker-compose.mock.yml"
            desktop:
              - *ci
              - "desktop/**"
              - "web/src/styles/eclume.css"
            mobile:
              - *ci
              - "mobile/**"
              - "desktop/crates/**"

  python:
    needs: mudancas
    if: needs.mudancas.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Serviços de teste do server (Postgres, Redis, MinIO)
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml up -d --wait
      - run: uv run pytest
        env:
          # A suíte do server falha, em vez de pular, se os serviços não estiverem no ar.
          ECLUME_TEST_REQUIRE_SERVICES: "1"
      - if: failure()
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml logs

  contracts:
    needs: mudancas
    if: needs.mudancas.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run python contracts/tools/bundle.py --check
      - run: uv run pytest contracts/tests
      - name: Smoke do mock server (Prism)
        run: |
          docker compose -f deploy/docker-compose.mock.yml up -d --wait
          bash contracts/tests/smoke-mock.sh
      - if: failure()
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  web:
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api -- --check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Testes que precisam de navegador: a conversão de mídia (vitest browser mode) e o E2E do app
  # contra o mock do contrato. Os dois usam o Google Chrome que já vem no runner (canal `chrome`,
  # com os decoders proprietários), sem baixar navegador.
  web-browser:
    needs: mudancas
    if: needs.mudancas.outputs.web-browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ffmpeg para as fixtures de mídia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Testes de navegador da conversão
        run: npm run fixtures && npm run test:browser
      - name: Mock server (Prism)
        working-directory: .
        run: docker compose -f deploy/docker-compose.mock.yml up -d --wait
      - name: E2E contra o mock
        run: npm run test:e2e
      - if: failure()
        working-directory: .
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  desktop:
    needs: mudancas
    if: needs.mudancas.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri 2 e da captura de áudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - run: cargo check --manifest-path desktop/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --locked -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace --locked
      # A UI da janela (desktop/ui) num Chromium, com o Tauri simulado.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui-tests/package-lock.json
      - run: npm --prefix desktop/ui-tests ci
      - run: npm --prefix desktop/ui-tests exec -- playwright install --with-deps chromium
      - run: npm --prefix desktop/ui-tests test

  mobile:
    needs: mudancas
    if: needs.mudancas.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri 2 e do microfone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev clang cmake ninja-build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm --prefix mobile ci
      - run: npm --prefix mobile run lint
      - run: npm --prefix mobile test
      - run: npm --prefix mobile run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile
      - run: cargo fmt --manifest-path mobile/Cargo.toml --all --check
      - run: cargo check --manifest-path mobile/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path mobile/Cargo.toml --workspace --locked -- -D warnings
      - run: cargo test --manifest-path mobile/Cargo.toml --workspace --locked
      # O núcleo compila para o Android sem o gradle: prova a compilação cruzada do libopus (cmake)
      # e do SQLite com o NDK que o runner já traz.
      - name: Núcleo para aarch64-linux-android
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export ANDROID_NDK_HOME="$ndk" ANDROID_NDK_ROOT="$ndk"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          cargo check --manifest-path mobile/Cargo.toml -p eclume-mobile-core --target aarch64-linux-android --locked
