# CI do eclume: lint e teste dos pilares e do contrato v1 em Linux a cada PR e a cada push em main.
# macOS e Windows ficam fora (repo privado: minutos 10× e 2×); os instaladores do desktop saem
# do `desktop-release.yml`, só por tag `desktop-v*` ou à mão.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Serviços de teste do server (Postgres, Redis, MinIO)
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml up -d --wait
      - run: uv run pytest
        env:
          # A suíte do server falha, em vez de pular, se os serviços não estiverem no ar.
          ECLUME_TEST_REQUIRE_SERVICES: "1"
      - if: failure()
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml logs

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run python contracts/tools/bundle.py --check
      - run: uv run pytest contracts/tests
      - name: Smoke do mock server (Prism)
        run: |
          docker compose -f deploy/docker-compose.mock.yml up -d --wait
          bash contracts/tests/smoke-mock.sh
      - if: failure()
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api -- --check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Testes que precisam de navegador: a conversão de mídia (vitest browser mode) e o E2E do app
  # contra o mock do contrato. Os dois usam o Google Chrome que já vem no runner (canal `chrome`,
  # com os decoders proprietários), sem baixar navegador.
  web-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ffmpeg para as fixtures de mídia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - name: Testes de navegador da conversão
        run: npm run fixtures && npm run test:browser
      - name: Mock server (Prism)
        working-directory: .
        run: docker compose -f deploy/docker-compose.mock.yml up -d --wait
      - name: E2E contra o mock
        run: npm run test:e2e
      - if: failure()
        working-directory: .
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri 2 e da captura de áudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --manifest-path desktop/Cargo.toml --all --check
      - run: cargo check --manifest-path desktop/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path desktop/Cargo.toml --workspace --locked -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml --workspace --locked
      # A UI da janela (desktop/ui) num Chromium, com o Tauri simulado.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui-tests/package-lock.json
      - run: npm --prefix desktop/ui-tests ci
      - run: npm --prefix desktop/ui-tests exec -- playwright install --with-deps chromium
      - run: npm --prefix desktop/ui-tests test
