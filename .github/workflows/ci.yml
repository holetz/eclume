# CI do eclume: lint e teste dos pilares e do contrato v1 em Linux a cada PR e a cada push em main.
# macOS e Windows ficam fora (repo privado: minutos 10× e 2×); os instaladores do desktop saem
# do host, por `deploy/release-desktop.sh`; o `desktop-release.yml` é só a alternativa manual.
#
# Economia de minutos: mudança só de documentação não dispara a CI (`paths-ignore`), e o job
# `mudancas` liga só os jobs dos pilares tocados. Cada job cobra ao menos 1 minuto; os filtros
# seguem as dependências entre pilares (o server e o web leem o contrato, o desktop lê o CSS do
# web, o mobile compila `desktop/crates`). Mexer neste arquivo ou em `deploy/pilares.sh` roda tudo;
# `workflow_dispatch` também, e o noturno (`schedule`) roda tudo só se o `main` mudou desde o último
# noturno verde.
#
# Os comandos de cada pilar vêm de `deploy/pilares.sh`, a mesma fonte do gate do host
# (`deploy/gate.sh`, status `eclume/gate`); cada job aqui só prepara o ambiente e chama o seu pilar.
# O pilar `windows` é só do gate. `deploy/test_gate.py` falha se um job deixar de chamar o seu pilar.
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".design/**"
      - ".impeccable/**"
      - ".claude/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  mudancas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      python: ${{ steps.noturno.outputs.pular != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filtro.outputs.python == 'true') }}
      contracts: ${{ steps.noturno.outputs.pular != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filtro.outputs.contracts == 'true') }}
      web: ${{ steps.noturno.outputs.pular != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filtro.outputs.web == 'true') }}
      web-browser: ${{ steps.noturno.outputs.pular != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filtro.outputs.web-browser == 'true') }}
      desktop: ${{ steps.noturno.outputs.pular != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filtro.outputs.desktop == 'true') }}
      mobile: ${{ steps.noturno.outputs.pular != 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || steps.filtro.outputs.mobile == 'true') }}
    steps:
      # No PR a lista de arquivos vem da API; no push em main o filtro compara com o commit
      # anterior ao push e precisa do checkout.
      - if: github.event_name == 'push'
        uses: actions/checkout@v7
      # O noturno só gasta minutos quando o `main` mudou desde o último noturno verde.
      - if: github.event_name == 'schedule'
        id: noturno
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ultimo="$(gh run list -R "$GITHUB_REPOSITORY" -w ci -e schedule -s success -L 1 --json headSha --jq '.[0].headSha // ""')"
          if [ "$ultimo" = "$GITHUB_SHA" ]; then echo "pular=true" >> "$GITHUB_OUTPUT"; fi
      - if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
        id: filtro
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
              - "deploy/pilares.sh"
            uv: &uv
              - "pyproject.toml"
              - "uv.lock"
              - ".python-version"
            python:
              - *ci
              - *uv
              - "engines/**"
              - "server/**"
              - "worker-gpu/**"
              - "contracts/**"
              - "mobile/scripts/**"
              - "deploy/docker-compose.test.yml"
              - "deploy/gate.py"
              - "deploy/test_gate.py"
              - ".github/workflows/desktop-release.yml"
              - ".github/workflows/mobile-release.yml"
            contracts:
              - *ci
              - *uv
              - "contracts/**"
              - "deploy/docker-compose.mock.yml"
            web:
              - *ci
              - "web/**"
              - "contracts/**"
            web-browser:
              - *ci
              - "web/**"
              - "contracts/**"
              - "deploy/docker-compose.mock.yml"
            desktop:
              - *ci
              - "desktop/**"
              - "web/src/styles/eclume.css"
            mobile:
              - *ci
              - "mobile/**"
              - "desktop/crates/**"

  python:
    needs: mudancas
    if: needs.mudancas.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Serviços de teste do server (Postgres, Redis, MinIO)
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml up -d --wait
      - run: bash deploy/pilares.sh python
      - if: failure()
        run: docker compose -p eclume-test -f deploy/docker-compose.test.yml logs

  contracts:
    needs: mudancas
    if: needs.mudancas.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Mock server (Prism)
        run: docker compose -f deploy/docker-compose.mock.yml up -d --wait
      - run: bash deploy/pilares.sh contracts
      - if: failure()
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  web:
    needs: mudancas
    if: needs.mudancas.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash deploy/pilares.sh web

  # Testes que precisam de navegador: a conversão de mídia (vitest browser mode) e o E2E do app
  # contra o mock do contrato. Os dois usam o Google Chrome que já vem no runner (canal `chrome`,
  # com os decoders proprietários), sem baixar navegador.
  web-browser:
    needs: mudancas
    if: needs.mudancas.outputs.web-browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: ffmpeg para as fixtures de mídia
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Mock server (Prism)
        run: docker compose -f deploy/docker-compose.mock.yml up -d --wait
      - run: bash deploy/pilares.sh web-browser
      - if: failure()
        run: docker compose -f deploy/docker-compose.mock.yml logs mock

  desktop:
    needs: mudancas
    if: needs.mudancas.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri 2 e da captura de áudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev libpipewire-0.3-dev libpulse-dev clang cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # A UI da janela (desktop/ui) roda num Chromium: as dependências de sistema dele vêm daqui.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ui-tests/package-lock.json
      - run: |
          npm --prefix desktop/ui-tests ci
          npm --prefix desktop/ui-tests exec -- playwright install --with-deps chromium
      # Diagnóstico do `Bus error` no link: disco e memória antes do cargo.
      - name: Disco e memória
        run: df -h && free -m
      - run: bash deploy/pilares.sh desktop

  mobile:
    needs: mudancas
    if: needs.mudancas.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Dependências de sistema do Tauri 2 e do microfone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential \
            libasound2-dev clang cmake ninja-build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile
      # O pilar compila o núcleo para o Android com o NDK que o runner já traz
      # (ANDROID_NDK_LATEST_HOME).
      - run: bash deploy/pilares.sh mobile
