[project]
name = "eclume-worker"
version = "0.1.0"
description = "Worker GPU do eclume: ASR, alinhamento, diarização e embeddings de locutor com WhisperX."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "eclume-engines",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_worker"]

# Resolve a interface de engine a partir do workspace (não do PyPI).
[tool.uv.sources]
eclume-engines = { workspace = true }
