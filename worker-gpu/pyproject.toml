[project]
name = "eclume-worker"
version = "0.2.0"
description = "eclume GPU worker: ASR, alignment, diarization and speaker embeddings with WhisperX."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "eclume-engines",
  "arq>=0.26",
  "boto3>=1.34",
  # Opens the HF token the server sends encrypted in the job options.
  "cryptography>=44",
]

# The GPU image installs `gpu` (WhisperX, torch); dev without a GPU can use `cpu` (faster-whisper).
[project.optional-dependencies]
gpu = ["eclume-engines[whisperx]"]
cpu = ["eclume-engines[cpu]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eclume_worker"]

# Resolve the engine interface from the workspace (not from PyPI).
[tool.uv.sources]
eclume-engines = { workspace = true }
