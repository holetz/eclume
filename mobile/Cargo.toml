# The cargo workspace of eclume's mobile app. The recording and sync crates are the desktop's, by
# path (`../desktop/crates`); the native plugin lives in `plugins/`. The Cargo.lock belongs to this
# workspace.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "plugins/gravador"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"
