# Rust do app móvel: versão exata, a mesma de desktop/rust-toolchain.toml (deploy/test_fixacoes.py
# confere), com os alvos Android do APK universal. Atualização: PR do Dependabot (rust-toolchain).
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
profile = "minimal"
