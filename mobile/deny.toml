# cargo-deny of the `audit` pillar (deploy/pillars.sh): `cargo deny --locked check advisories` fails
# on a RustSec advisory that affects this workspace's Cargo.lock. An exception only with a reason and a deadline:
#   ignore = [{ id = "RUSTSEC-YYYY-NNNN", reason = "<reason> · deadline YYYY-MM-DD" }]
# Contract: docs/standards/code/monorepo.md.
[advisories]
# An unmaintained crate only fails when it is a direct dependency of a workspace crate; the
# transitive ones (proc-macro-error, through Tauri's GTK stack) show in the log without blocking.
unmaintained = "workspace"
ignore = [
  # Double free in Consumer::skip/clear only when an element's Drop panics: the ring of
  # eclume-audio-capture (src/ring.rs) holds f32, which has no Drop. Move to ringbuf 0.5.
  { id = "RUSTSEC-2026-0293", reason = "f32 elements without Drop; bump ringbuf to 0.5 · deadline 2026-12-31" },
]
