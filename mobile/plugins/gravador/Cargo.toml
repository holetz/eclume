[package]
name = "tauri-plugin-eclume-gravador"
description = "Native plugin of eclume's mobile app: foreground recording service, notification, discovery, network, device, background sync and update install."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
links = "tauri-plugin-eclume-gravador"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
