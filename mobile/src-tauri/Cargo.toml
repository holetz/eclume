[package]
name = "eclume-mobile"
description = "Eclume's mobile app: records with the screen locked, marks moments and syncs on the server's Wi-Fi."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "eclume_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eclume-mobile-core = { path = "../crates/core" }
eclume-recorder = { path = "../../desktop/crates/recorder" }
eclume-sync = { path = "../../desktop/crates/sync", default-features = false }
# Only the microphone (cpal; AAudio on Android): the phone lacks the system audio backends.
eclume-audio-capture = { path = "../../desktop/crates/audio-capture", default-features = false, features = ["mic"] }
tauri-plugin-eclume-gravador = { path = "../plugins/gravador" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# The same `jni` line Tauri uses on Android.
jni = "0.22"
