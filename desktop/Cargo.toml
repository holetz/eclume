# Workspace cargo do app desktop do eclume. Os crates vendorizados do Anarlog
# (detect, audio-*, meeting-capture, vad, resampler) entram em `crates/` com a
# spec `desktop-captura-e-bandeja`.
[workspace]
resolver = "2"
members = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
