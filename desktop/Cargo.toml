# Workspace cargo do app desktop do eclume. Os crates ficam em `crates/`; os
# vendorizados do Anarlog carregam `VENDOR.md` com o commit fixado e a licença MIT.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/resampler", "crates/audio-capture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
