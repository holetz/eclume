# Cargo workspace of the eclume desktop app. The crates live in `crates/`; the ones vendored
# from Anarlog carry `VENDOR.md` with the pinned commit and the MIT license.
[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/resampler",
    "crates/audio-capture",
    "crates/recorder",
    "crates/detect",
    "crates/sync",
    "crates/import",
    "crates/mirror",
]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"
