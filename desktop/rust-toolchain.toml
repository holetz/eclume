# Desktop Rust: an exact version, the same as mobile/rust-toolchain.toml (deploy/test_pins.py
# checks it). rustup reads this file in CI, in the release workflows, in the build image
# (desktop/build.Dockerfile) and on the workstation. Updates: a Dependabot PR (rust-toolchain).
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
