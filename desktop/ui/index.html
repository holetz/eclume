<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eclume</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="eclume.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <section class="tray tray-window" data-vista="principal" aria-label="eclume">
      <div class="tray-section">
        <div class="row row-between">
          <span class="brand brand-sm"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="0.5" y="8" width="3" height="8"></rect>
              <rect x="5.5" y="3" width="3" height="18"></rect>
              <rect x="10.5" y="0" width="3" height="24"></rect>
              <rect x="15.5" y="5.5" width="3" height="13"></rect>
              <rect x="20.5" y="9" width="3" height="6"></rect></svg
            >eclume</span
          >
          <div class="row">
            <button type="button" class="btn btn-ghost btn-icon btn-icon-sm" id="abrir-ajuda"
              data-icone="ajuda" aria-label="Ajuda" aria-haspopup="menu" aria-expanded="false"></button>
            <button type="button" class="btn btn-ghost btn-icon btn-icon-sm" id="abrir-configuracoes"
              data-icone="configuracoes" aria-label="Configurações"></button>
          </div>
        </div>
        <span class="status-line" id="linha-status" role="status">Carregando…</span>
      </div>
    </section>
  </body>
</html>
