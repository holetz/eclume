[package]
name = "eclume-sync"
description = "Sync do app desktop do eclume: upload resumível das gravações por PAT, pelo contrato v1."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
eclume-recorder = { path = "../recorder" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gethostname = "1"
keyring = "4"
log = "0.4"
mdns-sd = "0.21"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
url = "2"
