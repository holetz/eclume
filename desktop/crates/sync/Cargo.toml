[package]
name = "eclume-sync"
description = "Sync do app desktop do eclume: upload resumível das gravações por PAT, pelo contrato v1."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# O chaveiro do SO (Secret Service, Credential Manager, Keychain). Sem ele, o segredo fica só no
# arquivo privado: é o caso do celular, cujo cofre é o diretório do app.
default = ["os-keyring"]
os-keyring = ["dep:keyring"]

[dependencies]
eclume-recorder = { path = "../recorder" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gethostname = "1"
keyring = { version = "4", optional = true }
log = "0.4"
mdns-sd = "0.21"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
url = "2"
