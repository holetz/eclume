[package]
name = "eclume-sync"
description = "eclume desktop sync: resumable recording uploads with a PAT, through contract v1."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# The OS keyring (Secret Service, Credential Manager, Keychain). Without it, the secret stays only
# in the private file: used on mobile, where the vault is the app directory.
default = ["os-keyring"]
os-keyring = ["dep:keyring"]

[dependencies]
eclume-recorder = { path = "../recorder" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gethostname = "1"
keyring = { version = "4", optional = true }
log = "0.4"
mdns-sd = "0.21"
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
url = "2"
