# eclume audio capture: mic through cpal and system audio per platform. System backends are
# adapted from fastrepl/anarlog@bfb8d9e4ff7fcc8c9aeab2f52cc020d16b195e43
# (crates/audio-actual/src/speaker, MIT; see VENDOR.md).
[package]
name = "eclume-audio-capture"
description = "Mic and system audio capture for the eclume desktop app."
version.workspace = true
edition = "2024"
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Without `backends`, this crate only exposes the `AudioSource` trait and sample ring buffer,
# with no system dependencies — this is how `eclume-recorder` uses it in tests. `mic` only enables
# the microphone through `cpal` (AAudio on Android), without system audio backends, which mobile
# devices do not have.
default = ["backends"]
mic = ["dep:cpal"]
backends = ["mic", "dep:pipewire", "dep:libpulse-binding", "dep:wasapi", "dep:cidre"]

[dependencies]
anyhow = "1"
log = "0.4"
ringbuf = "0.4.8"
cpal = { version = "0.17", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2.30.1", optional = true }
pipewire = { version = "0.9.2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { version = "0.25.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.15", optional = true, default-features = false, features = ["app", "async", "av", "ax", "blocks", "cm", "core_audio", "dispatch", "io_kit", "io_pm", "macos_15_0"] }
