# Per-platform mic signals adapted from fastrepl/anarlog@bfb8d9e4ff7fcc8c9aeab2f52cc020d16b195e43
# (crates/detect, MIT; see VENDOR.md). Classification, debounce and automatic recording are our own.
[package]
name = "eclume-detect"
description = "Meeting detection for the eclume desktop app: mic and process signals, debounce and automatic recording."
version.workspace = true
edition.workspace = true
license = "MIT"  # adapted from Anarlog (MIT, see VENDOR.md), not the GPL workspace licence
rust-version.workspace = true
publish = false

[dependencies]
eclume-recorder = { path = "../recorder" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29", default-features = false, features = ["app", "async", "av", "ax", "blocks", "cm", "core_audio", "dispatch", "io_kit", "io_pm", "macos_15_0"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[dev-dependencies]
serde_json = "1"
