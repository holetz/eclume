[package]
name = "eclume-import"
description = "File import for the eclume desktop app: duration, recording date and conversion to Opus."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
eclume-recorder = { path = "../recorder" }
anyhow = "1"
log = "0.4"
# The Opus that symphonia only demuxes: the same libopus as the recorder.
opus = "0.4"
serde = { version = "1", features = ["derive"] }
# Pure Rust (MPL-2.0, unmodified). The default features bring FLAC, MKV/WebM, Ogg, PCM,
# Vorbis and WAV; AAC, ALAC, MP3 and the MP4/MOV/M4A container are added.
symphonia = { version = "0.5", features = ["aac", "alac", "mp3", "isomp4"] }

[dev-dependencies]
ogg = "0.9"
