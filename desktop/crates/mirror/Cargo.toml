[package]
name = "eclume-mirror"
description = "Local eclume mirror: Markdown summaries and JSONL transcripts in a folder serving as an Obsidian vault and agent workspace."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Pure logic only (names, rendering, manifest and disk reconciliation), no Tauri or network:
# `mobile/` also compiles `desktop/crates`.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
