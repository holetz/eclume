[package]
name = "eclume-desktop"
description = "App desktop do eclume: grava reuniões, sincroniza e fica na bandeja do sistema."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "eclume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eclume-audio-capture = { path = "../crates/audio-capture" }
eclume-detect = { path = "../crates/detect" }
eclume-import = { path = "../crates/import" }
eclume-recorder = { path = "../crates/recorder" }
eclume-sync = { path = "../crates/sync" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2.12 traz o tao 0.37: no Wayland o tao 0.35 cobria a HeaderBar com um EventBox acima dos
# botões, e minimizar/fechar não recebiam o clique (tauri-apps/tauri#13440).
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
# Uma instância só: `eclume-desktop --nova-nota` (o atalho do sistema no Wayland) chega à que já
# está aberta.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# Fixado no minor: `configure_client` expõe o `reqwest` do plugin, que pode mudar num minor.
tauri-plugin-updater = "2.12"
# O mesmo `reqwest` do updater (sem features próprias): a CA extra entra no cliente dele.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Portal `GlobalShortcuts` do Wayland (KDE, GNOME 48+): o `global-hotkey` só ouve janelas X11.
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "tokio"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
