[package]
name = "eclume-desktop"
description = "App desktop do eclume: grava reuniões, sincroniza e fica na bandeja do sistema."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "eclume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eclume-audio-capture = { path = "../crates/audio-capture" }
eclume-detect = { path = "../crates/detect" }
eclume-recorder = { path = "../crates/recorder" }
eclume-sync = { path = "../crates/sync" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
