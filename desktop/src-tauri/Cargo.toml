[package]
name = "eclume-desktop"
description = "App desktop do eclume: grava reuniões, sincroniza e fica na bandeja do sistema."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "eclume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eclume-audio-capture = { path = "../crates/audio-capture" }
eclume-detect = { path = "../crates/detect" }
eclume-import = { path = "../crates/import" }
eclume-recorder = { path = "../crates/recorder" }
eclume-sync = { path = "../crates/sync" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Fixado no minor: a 2.4 exige o tauri 2.12 e arrastaria o wry e o webview2 junto.
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-dialog = "2"
# Fixado no minor: `configure_client` expõe o `reqwest` do plugin, que pode mudar num minor.
tauri-plugin-updater = "2.12"
# O mesmo `reqwest` do updater (sem features próprias): a CA extra entra no cliente dele.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
