[package]
name = "eclume-desktop"
description = "eclume desktop app: records meetings, syncs and stays in the system tray."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "eclume_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eclume-audio-capture = { path = "../crates/audio-capture" }
eclume-detect = { path = "../crates/detect" }
eclume-import = { path = "../crates/import" }
eclume-recorder = { path = "../crates/recorder" }
eclume-mirror = { path = "../crates/mirror" }
eclume-sync = { path = "../crates/sync" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 2.12 brings tao 0.37: on Wayland, tao 0.35 covered the HeaderBar with an EventBox above the
# buttons, so minimize/close received no clicks (tauri-apps/tauri#13440).
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# Autostart: `Run` on Windows, `~/.config/autostart` on Linux, LaunchAgent on macOS.
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Single instance: `eclume-desktop --nova-nota` (the system shortcut on Wayland) reaches the
# instance already open.
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# "Copy" in the summary ready notice: summary Markdown on the clipboard.
tauri-plugin-clipboard-manager = "2"
# Minor pinned: `configure_client` exposes the plugin's `reqwest`, which may change in a minor.
tauri-plugin-updater = "2.12"
# The same `reqwest` as the updater (no features of its own): adds the extra CA to its client.
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland `GlobalShortcuts` portal (KDE, GNOME 48+): `global-hotkey` only listens to X11 windows.
# `async-io`, never `tokio`: with `tokio`, `zbus::block_on` (keyring, notifications) uses its own
# Tokio runtime and panics when called from a Tokio thread (`async` command).
ashpd = { version = "0.13", default-features = false, features = ["global_shortcuts", "async-io"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
